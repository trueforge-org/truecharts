name: Common Library Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
on:
  workflow_call:
  push:
    branches:
      - master
    paths:
      - "charts/library/common/**"
      - "charts/library/common-test/**"
      - ".github/workflows/common-tests.yaml"
      - ".github/scripts/install_dependencies.sh"
  #pull_request:
  #  branches:
  #    - main
  #  paths:
  #    - "charts/charts/library/common/**"
  #    - ".github/workflows/common-tests.yaml"
  workflow_dispatch:

jobs:
  check_changes:
    runs-on:
      group: default
    outputs:
      changes_detected: ${{ steps.filter.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          list-files: json
          filters: |
            changed:
            - 'charts/library/common/**'
            - 'charts/library/common-test/**'
            - '.github/workflows/common-tests.yaml'
            - '.github/scripts/install_dependencies.sh'

  lint:
    name: Lint Common
    runs-on: ubuntu-latest
    needs: check_changes
    if: needs.check_changes.outputs.changes_detected == 'true'
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.14.0
          - v3.20.0
          - v4.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ matrix.helm-version }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (lint)
        id: lint
        run: |
          ct lint --config .github/ct-lint.yaml \
                  --lint-conf .github/lint-conf.yaml \
                  --charts charts/library/common-test \
                  --debug

  unittest:
    needs:
      - lint
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      helmUnitVersion: 1.0.3
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.14.0
          - v3.20.0
          - v4.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Cache helm plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /home/runner/.local/share/helm/plugins/helm-unittest
            /tmp/_dist/
          key: helm-${{ matrix.helm-version }}-unittest-v${{ env.helmUnitVersion }}
          restore-keys: |
            helm-${{ matrix.helm-version }}-unittest-v${{ env.helmUnitVersion }}

      - name: Run Unittests
        shell: bash
        run: |
          set -x
          helm_ver=${{ matrix.helm-version}}
          helm_ver="${helm_ver#v}"

          VERIFY_FLAG=""
          if [ "$(printf '%s\n' "4.0.0" "$helm_ver" | sort -V | head -n1)" = "4.0.0" ]; then
            VERIFY_FLAG="--verify=false"
          fi

          (helm unittest -h > /dev/null) || \
            helm plugin install https://github.com/helm-unittest/helm-unittest --version=v${helmUnitVersion} $VERIFY_FLAG || \
            (sleep 10 && helm plugin install https://github.com/helm-unittest/helm-unittest --version=v${helmUnitVersion} $VERIFY_FLAG) || \
            echo "finished unittest reinstall tries"

          # Run tests
          cd charts/library/common-test/
          helm dependency update
          helm unittest -f "tests/**/*.yaml" . -v ./unit-values.yaml

  coverage-validation:
    needs:
      - lint
    name: Coverage Validation
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.3.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install PyYAML ruamel.yaml

      # Each check also writes its output to coverage-report/, for the PR comment on failure
      - name: Run schema validation
        id: schema
        shell: bash
        run: |
          mkdir -p coverage-report
          (
            set -e
            python3 charts/library/common/generate_bundled_schema.py --check
            python3 charts/library/common/generate_template_keys_structure.py --check
            # The values of charts change without a change in common, so an outdated file is not an error of this PR.
            # The coverage check below uses the rebuilt file.
            python3 charts/library/common/generate_complete_values_structure.py --check ||
              echo "::warning::complete-values-structure.yaml is not up to date, run generate_complete_values_structure.py"
            python3 charts/library/common/generate_complete_values_structure.py
            python3 charts/library/common/test_schema.py --max-failures 0 --output-file stable_schema_validation.log
            python3 charts/library/common/check_complete_values_schema_coverage.py
          ) 2>&1 | tee coverage-report/schema.log

      # The checks below also run when an earlier one failed, so each reports its own result
      - name: Run unittest schema coverage check
        id: unittest
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p coverage-report
          python3 charts/library/common/check_unittest_schema_coverage.py --summary-md coverage-report/unittest-summary.md 2>&1 |
            tee coverage-report/unittest.log

      - name: Check docs
        id: docs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p coverage-report
          python3 charts/library/common/generate_docs.py --check 2>&1 | tee coverage-report/docs.log

      # On a pull request, the "Pull Request: Coverage Comment" workflow posts this report as a comment.
      # It runs from workflow_run, because the token of a pull_request from a fork can't comment.
      - name: Build PR comment report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCHEMA_OUTCOME: ${{ steps.schema.outcome }}
          UNITTEST_OUTCOME: ${{ steps.unittest.outcome }}
          DOCS_OUTCOME: ${{ steps.docs.outcome }}
        run: |
          mkdir -p coverage-report
          cd coverage-report
          echo "$PR_NUMBER" > pr-number
          echo "$HEAD_SHA" > head-sha
          failed=0
          {
            for check in "schema|Schema validation|$SCHEMA_OUTCOME" \
                         "unittest|Unittest schema coverage|$UNITTEST_OUTCOME" \
                         "docs|Docs|$DOCS_OUTCOME"; do
              IFS='|' read -r id title outcome <<< "$check"
              # A skipped check did not pass either, for example when a step before it failed
              [ "$outcome" != "success" ] || continue
              failed=1
              echo "### ❌ $title"
              echo
              if [ ! -f "$id.log" ]; then
                echo "The check has no output (outcome: $outcome), see the workflow run."
                echo
                continue
              fi
              if [ -f "$id-summary.md" ]; then
                cat "$id-summary.md"
                echo
              fi
              echo "<details><summary>Output</summary>"
              echo
              echo '```text'
              # A PR comment holds at most 65536 characters, so long output is cut in the middle
              if [ "$(wc -c < "$id.log")" -gt 16000 ]; then
                head -c 12000 "$id.log"
                printf '\n\n... output cut, see the full log in the workflow run ...\n\n'
                tail -c 4000 "$id.log"
              else
                cat "$id.log"
              fi
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } > failures.md
          echo "$failed" > failed
          {
            if [ "$failed" = "1" ]; then
              echo "## ❌ Common coverage validation failed"
              echo
              echo "Commit \`$HEAD_SHA\`, [workflow run]($RUN_URL)."
              echo
              cat failures.md
            else
              echo "## ✅ Common coverage validation passed"
              echo
              echo "Commit \`$HEAD_SHA\`, [workflow run]($RUN_URL)."
            fi
          } > comment.md
          rm failures.md

      - name: Upload PR comment report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: common-coverage-report
          path: |
            coverage-report/comment.md
            coverage-report/failed
            coverage-report/pr-number
            coverage-report/head-sha
          retention-days: 7

      - name: Upload schema validation log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-schema-validation-log
          path: stable_schema_validation.log

  install:
    # Install jobs are the slowest, do not start them if a fast check already failed
    needs:
      - lint
      - unittest
      - coverage-validation
    name: Install Charts (${{ matrix.versions.k3s }}, ${{ matrix.versions.helm }}, ${{ matrix.values }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the lowest supported and the latest versions. Everything else tests all combinations
        versions: ${{ fromJSON(github.event_name == 'pull_request' && '[{"k3s":"v1.33","helm":"v3.14.0"},{"k3s":"v1.35","helm":"v4.1.0"}]' || '[{"k3s":"v1.33","helm":"v3.14.0"},{"k3s":"v1.33","helm":"v3.20.0"},{"k3s":"v1.33","helm":"v4.1.0"},{"k3s":"v1.34","helm":"v3.14.0"},{"k3s":"v1.34","helm":"v3.20.0"},{"k3s":"v1.34","helm":"v4.1.0"},{"k3s":"v1.35","helm":"v3.14.0"},{"k3s":"v1.35","helm":"v3.20.0"},{"k3s":"v1.35","helm":"v4.1.0"}]') }}
        values:
          - basic-values.yaml
          - configmap-values.yaml
          - secrets-values.yaml
          - imagePullSecret-values.yaml
          - daemonset-values.yaml
          - job-values.yaml
          - cron-values.yaml
          - statefulset-values.yaml
          - persistence-values.yaml
          - extra-containers-values.yaml
          - rbac-values.yaml
          # Only run ingress tests without as no valid certissuer -> helm v4 waits for cert to be ready
          - ingress-wo-tls-values.yaml
          - networkPolicy-values.yaml
          # TODO: broken
          # - codeserver-values.yaml
          - netshoot-values.yaml
          - metrics-values.yaml
          - cnpg-values.yaml
          - cnpg-multi-values.yaml
          - register-operator-values.yaml
          - autopermissions-values.yaml
          - credentials-values.yaml
          - credentialsList-values.yaml
          - init-values.yaml
          - priorityclass-values.yaml
          - schedule-values.yaml
          - storageclass-values.yaml
          ## TODO: reenable when we've some credentials ready to rock for testing
          # - volsync-dest-values.yaml
          # - volsync-src-values.yaml
          # - volsync-dest-direct-values.yaml
          # - volsync-src-direct-values.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ matrix.versions.helm }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Create k3d cluster - Attempt 1/3
        continue-on-error: true
        id: createc1
        uses: nolar/setup-k3d-k3s@62c9d1bd2bc843275c85d2e7dcd696edc1160eee # v1.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.versions.k3s }}
          # Flags found here https://github.com/k3d-io/k3d
          k3d-args: --k3s-arg --disable=metrics-server@server:*

      - name: Wait 10 second to retry
        if: steps.createc1.outcome=='failure'
        run: |
          sleep 10
      - name: Create k3d cluster - Attempt 2/3
        continue-on-error: true
        if: steps.createc1.outcome=='failure'
        id: createc2
        uses: nolar/setup-k3d-k3s@62c9d1bd2bc843275c85d2e7dcd696edc1160eee # v1.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.versions.k3s }}
          # Flags found here https://github.com/k3d-io/k3d
          k3d-args: --k3s-arg --disable=metrics-server@server:*

      - name: Wait 10 second to retry
        if: steps.createc2.outcome=='failure'
        run: |
          sleep 10
      - name: Create k3d cluster - Attempt 3/3
        id: createc3
        if: steps.createc2.outcome=='failure'
        uses: nolar/setup-k3d-k3s@62c9d1bd2bc843275c85d2e7dcd696edc1160eee # v1.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ matrix.versions.k3s }}
          # Flags found here https://github.com/k3d-io/k3d
          k3d-args: --k3s-arg --disable=metrics-server@server:*

        # Install Kail to grab logs from tests, as there are cases ct-install fail to output logs
      - name: Install Kail
        run: |
          export KAIL_VERSION=v0.16.1
          wget https://github.com/boz/kail/releases/download/${KAIL_VERSION}/kail_${KAIL_VERSION}_linux_amd64.tar.gz
          tar -xvzf kail_${KAIL_VERSION}_linux_amd64.tar.gz
          chmod +x kail

      - name: Add Dependencies
        shell: bash
        run: |
          ./.github/scripts/install_dependencies.sh charts/library/common-test "${{ matrix.values }}"

      - name: Run chart-testing (install)
        run: |
          # Move all ci values on a temp location (or skip if already moved from another matrix job)
          mv charts/library/common-test/ci charts/library/common-test/runtests || echo "Nothing to move"

          # Move one values.yaml to the correct location to run the test
          mv -f charts/library/common-test/runtests/${{ matrix.values }} charts/library/common-test/values.yaml

          # Stat kail on the background to grab logs from tests
          ./kail --ignore-ns kube-system --ignore-ns cert-manager --ignore-ns metallb-system --ignore-ns prometheus-operator >> /tmp/output.log &

          # Actually run the test
          ct install  --config .github/ct-install.yaml \
                      --charts charts/library/common-test \
                      --debug || (echo -e "\n\n--===PODLOGS===--\n\n" && \
                                  cat /tmp/output.log && \
                                  rm -f /tmp/output.log && exit 1)

          kill $!
          echo -e "\n\n--===PODLOGS===--\n\n"
          cat  /tmp/output.log
          rm -f /tmp/output.log

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  common-tests-complete:
    needs: [check_changes, lint, unittest, coverage-validation, install]
    if: ${{ always() }}
    name: Common Tests Completed
    runs-on:
      group: default
    steps:
      - name: Check Results
        run: |
          if [[ "${{ needs.check_changes.outputs.changes_detected }}" == 'true' && ( "${{ needs.lint.result }}" != "success" || \
                "${{ needs.unittest.result }}" != "success" || \
                "${{ needs.coverage-validation.result }}" != "success" || \
                "${{ needs.install.result }}" != "success") ]]; then
            echo "One or more jobs failed!"
            exit 1
          else
            echo "Common Lint, Tests, Coverage Validation and unittests Completed Successfully"
          fi
