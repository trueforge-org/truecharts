# -- (docs/externalSecret.md)
# Requires the External Secrets Operator CRDs to be installed in the cluster.
# Additional ExternalSecrets can be added by adding a dictionary key similar to the 'main' example.
# [[ref]](https://external-secrets.io/latest/api/externalsecret/)
externalSecret: {}
#   main:
#     # -- Enables or disables the ExternalSecret
#     enabled: false
#     # -- Prefix the object name with the chart fullname
#     expandObjectName: true
#     # -- Provide additional annotations which may be required.
#     annotations: {}
#     # -- Provide additional labels which may be required.
#     labels: {}
#     # -- How often the data is synced from the provider
#     refreshInterval: 1h
#     # -- When the data is synced from the provider
#     # Valid options are CreatedOnce, Periodic, OnChange
#     # refreshPolicy: Periodic
#     # -- The SecretStore or ClusterSecretStore to fetch the data from
#     secretStoreRef:
#       name: ""
#       # Valid options are SecretStore, ClusterSecretStore
#       kind: SecretStore
#     # -- The Kubernetes Secret created by the External Secrets Operator
#     target:
#       # Defaults to the name of the ExternalSecret
#       name: ""
#       # Valid options are Owner, Orphan, Merge, None
#       creationPolicy: Owner
#       # Valid options are Delete, Merge, Retain
#       # deletionPolicy: Retain
#       # immutable: false
#       # Passed to the ExternalSecret as is, External Secrets Operator evaluates its own Go templates in here
#       # template:
#       #   type: Opaque
#       #   data:
#       #     config: '{{ .username }}:{{ .password }}'
#     # -- Individual keys to fetch from the provider
#     data:
#       - secretKey: password
#         remoteRef:
#           key: my-app
#           property: password
#     # -- Fetch multiple keys from the provider at once, passed to the ExternalSecret as is
#     dataFrom: []
#     # dataFrom:
#     #   - extract:
#     #       key: my-app
#     #   - find:
#     #       name:
#     #         regexp: "^my-app-"

# -- (docs/serviceAccount.md)
serviceAccount: {}

# -- (docs/rbac.md)
rbac: {}

# NOTES.txt
notes:
  header: |
    # Thank you for installing {{ .Chart.Name }} by TrueCharts.
  # custom: "{{ toYaml $.Values }}"
  custom: |
    {{- include "tc.v1.common.lib.chart.externalUrls" $ }}

    {{ if .Chart.Dependencies }}
    ## Dependencies for {{ .Chart.Name }}

    {{- range .Chart.Dependencies }}
    - Chart: {{ .Repository }}/{{ .Name }}
      Version: {{ .Version }}
    {{- end }}
    {{- end }}
    {{- if .Values.chartContext.internalUrls }}
    ## Connecting Internally

    You can reach this chart inside your cluster, using the following service URLS:
    {{- range $url := .Values.chartContext.internalUrls }}
    - {{ $url }}
    {{- end }}
    {{- end }}

    ## Sources for {{ .Chart.Name }}

    {{- range .Chart.Sources }}
    - {{ . }}
    {{- end -}}

    {{- $link := .Chart.Annotations.docs -}}
    {{- if not $link -}}
      {{- $link = .Chart.Home -}}
    {{- end }}

    See more for **{{ $.Chart.Name }}** at ({{ $link }})
  footer: |
    ## Documentation
    Please check out the TrueCharts documentation on:
    https://truecharts.org

    OpenSource can only exist with your help, please consider supporting TrueCharts:
    https://trueforge.org/sponsor
  warnings: []
  # -- Show credentials (eg, passwords in connection URLs) in the notes.
  # When disabled, they are replaced by `HIDDEN`.
  showCredentials: false

