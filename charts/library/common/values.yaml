# -- The common chart supports several add-ons. These can be configured under this key.
# @default -- See below
addons:
  gluetun:
    enabled: false
    targetSelector:
      - main
    secret:
      # vpn-conf:
      #   basePath: /gluetun/wireguard
      #   data:
      #     # Effective path /gluetun/wireguard/wg0.conf
      #     wg0.conf: |
      #       some conf
      #     wg1.conf: |
      #       some conf
      # scripts:
      #   basePath: /gluetun/scripts
      #   defaultMode: "0777"
      #   data:
      #     # Effective path /gluetun/scripts/up.sh
      #     up.sh: |
      #       some conf
    container:
      enabled: true
      imageSelector: gluetunImage
      probes:
        liveness:
          enabled: false
        readiness:
          enabled: false
        startup:
          enabled: false
      resources:
        excludeExtra: true
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        runAsGroup: 568
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
            - MKNOD
      env:
        DOT: "off"
        DNS_KEEP_NAMESERVER: "on"
        FIREWALL: "off"
        FIREWALL_OUTBOUND_SUBNETS: ""
        FIREWALL_INPUT_PORTS: ""

  # -- Tailscale specific configuration
  # @default -- See below
  # See more info for the configuration
  # https://github.com/tailscale/tailscale/blob/main/docs/k8s/run.sh
  tailscale:
    enabled: false
    targetSelector:
      - main
    container:
      enabled: true
      imageSelector: "tailscaleImage"
      probes:
        liveness:
          enabled: false
        readiness:
          enabled: false
        startup:
          enabled: false
      command:
        - /usr/local/bin/containerboot
      resources:
        excludeExtra: true
      env:
        # Set KUBE_SECRET to empty string to force tailscale
        # to use the filesystem for state tracking.
        # With secret for state tracking you can't always
        # know if the app that uses this sidecard will
        # use a custom ServiceAccount and will lead to falure.
        TS_KUBE_SECRET: ""
        TS_SOCKET: /var/run/tailscale/tailscaled.sock
        TS_STATE_DIR: /var/lib/tailscale/state
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW

    # -- Tailscale settings
    settings:
      # -- you can directly specify the config file here
      config: ""
      # -- Auth key to connect to the VPN Service
      authkey: ""
      # As a sidecar, it should only need to run in userspace
      userspace: true
      auth_once: true
      accept_dns: false
      routes: ""
      dest_ip: ""
      sock5_server: ""
      extra_args: ""
      daemon_extra_args: ""
      outbound_http_proxy_listen: ""
    # -- Annotations for tailscale sidecar
    annotations: {}

  # -- The common library supports adding a code-server add-on to access files. It can be configured under this key.
  # @default -- See values.yaml
  codeserver:
    enabled: false
    # -- Enable running a code-server container in the pod
    container:
      enabled: true
      env:
        PORT: 12321
        DEFAULT_WORKSPACE: /
      probes:
        liveness:
          enabled: true
          port: 12321
          path: "/"
        readiness:
          enabled: true
          port: 12321
          path: "/"
        startup:
          enabled: true
          port: 12321
          path: "/"
      imageSelector: "codeserverImage"
      resources:
        excludeExtra: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
      # - --user-data-dir
      # - "/config/.vscode"
      # -- Select a workload to add the addon to
      targetSelector:
        - "main"

    service:
      # -- Enable a service for the code-server add-on.
      enabled: true
      type: ClusterIP
      # Specify the default port information
      ports:
        codeserver:
          enabled: true
          primary: true
          protocol: http
          port: 12321
          targetPort: 12321

    ingress:
      # -- Enable an ingress for the code-server add-on.
      enabled: false
      annotations: {}
      #   kubernetes.io/ingress.class: nginx
      labels: {}
      hosts:
        - host: code.chart-example.local
          paths:
            - path: /
              # Ignored if not kubeVersion >= 1.14-0
              pathType: Prefix
      tls: []

  netshoot:
    # -- Enable running a netshoot container in the pod
    enabled: false
    container:
      enabled: true
      command:
        - /bin/sh
        - -c
        - sleep infinity
      probes:
        liveness:
          enabled: false
        readiness:
          enabled: false
        startup:
          enabled: false
      imageSelector: "netshootImage"
      resources:
        excludeExtra: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW

##########################################################################
# This section contains some pre-config for frequently used dependencies #
##########################################################################

cnpg:
  main:
    enabled: false
    primary: true
    # -- Puts the cnpg cluster in hibernation mode
    hibernate: false
    # Additional Labels and annotations for all cnpg objects
    labels: {}
    annotations: {}

    # Type of the CNPG database. Available types:
    # * `postgres`
    # * `postgis`
    # * `timescaledb`
    # * `vectors`
    # * `vectorchord`
    type: postgres

    # Version of Postgresql to use, changes cluster naming scheme
    # * `15`
    # * `16`
    pgVersion: 16

    # Cluster mode of operation. Available modes:
    # * `standalone` - default mode. Creates new or updates an existing CNPG cluster.
    # * `replica` - Creates a replica cluster from an existing CNPG cluster. # TODO
    # * `recovery` - Same as standalone but creates a cluster from a backup or object store.
    mode: standalone

    # Database details
    database: "app"
    user: "app"
    password: "PLACEHOLDERPASSWORD"

    # Database cluster configuration
    cluster:
      # Additional Labels and annotations for cnpg cluster
      labels: {}
      annotations: {}
      # Additional environment variables to set on all pods created in the cluster
      env: {}
      envFrom: {}

      # Number of instances
      instances: 2

      # set to true on single-node clusters to allow PVCs to be kept on instance restart
      singleNode: false

      ## set to configure the skipEmptyWalArchiveCheck annotation
      # skipEmptyWalArchiveCheck: true
      # # -- storage size for the data pvc's
      # # Follows the same spec as .Values.Persistence type=PVC
      # storage:
      #   size: "256Gi"
      # # -- storage size for the wal pvc's
      # # Follows the same spec as .Values.Persistence type=PVC
      # walStorage:
      #   size: "256Gi"
      # -- Gets scaled to 0 if hibernation is true
      ## See .Values.resources for more info
      # resources:

      # Method to follow to upgrade the primary server during a rolling update procedure, after all replicas have been
      # successfully updated. It can be switchover (default) or in-place (restart).
      primaryUpdateMethod: switchover

      # Strategy to follow to upgrade the primary server during a rolling update procedure, after all replicas have been
      # successfully updated: it can be automated (unsupervised - default) or manual (supervised)
      # Example of rolling update strategy:
      # - unsupervised: automated update of the primary once all
      #                 replicas have been upgraded (default)
      # - supervised: requires manual supervision to perform
      #               the switchover of the primary
      # -- change to supervised to disable unsupervised updates
      primaryUpdateStrategy: unsupervised

      # The instances' log level, one of the following values: error, warning, info (default), debug, trace
      logLevel: info

      # The configuration for the CA and related certificates
      # See: https://cloudnative-pg.io/documentation/current/api_reference/#CertificatesConfiguration
      certificates:

      # When this option is enabled, the operator will use the SuperuserSecret to update the postgres user password.
      # If the secret is not present, the operator will automatically create one.
      # When this option is disabled, the operator will ignore the SuperuserSecret content, delete it when automatically created,
      # and then blank the password of the postgres user by setting it to NULL.

      # enableSuperuserAccess: true

      # Configuration of the PostgreSQL server
      # See: https://cloudnative-pg.io/documentation/current/api_reference/#PostgresConfiguration
      postgresql:

      # BootstrapInitDB is the configuration of the bootstrap process when initdb is used
      # See: https://cloudnative-pg.io/documentation/current/bootstrap/
      # See: https://cloudnative-pg.io/documentation/current/api_reference/#bootstrapinitdb
      initdb: {}
      #   postInitSQL:
      #     - CREATE EXTENSION IF NOT EXISTS vector;
      #   postInitApplicationSQL:
      #     - CREATE EXTENSION IF NOT EXISTS someextension;
    # -- set to enable prometheus metrics
    monitoring:
      enablePodMonitor: false
      disableDefaultQueries: false
      customQueries: []
      #   - name: "pg_cache_hit_ratio"
      #     expandObjectName: true
      #     key: "custom-key" (defaults to "custom-queries")
      #     query: "SELECT current_database() as datname, sum(heap_blks_hit) / (sum(heap_blks_hit) + sum(heap_blks_read)) as ratio FROM pg_statio_user_tables;"
      #     metrics:
      #       - datname:
      #           usage: "LABEL"
      #           description: "Name of the database database"
      #       - ratio:
      #           usage: GAUGE
      #           description: "Cache hit ratio"
    # Recovery settings if the chosen mode is `recovery`.
    recovery:
      ##
      # Backup Recovery Method
      # Available recovery methods:
      # * `object_store` - Recovers a CNPG cluster from a barman object store (PITR supported).
      method: object_store
      ## set a revision to append to the serverName, so restore and backup use a different archive. Must be a string.
      ## Required when cluster.skipEmptyWalArchiveCheck is false and both use the same archive.
      # revision: "1"

      # override serverName in recovery object
      serverName: ""

      ## Point in time recovery target. Specify one of the following:
      pitrTarget:
        # Time in RFC3339 format
        time: ""

      # Overrides the provider specific default path. Defaults to:
      # S3: s3://<bucket><path>
      # Azure: https://<storageAccount>.<serviceName>.core.windows.net/<clusterName><path>
      # Google: gs://<bucket><path>
      destinationPath: ""

      # Configures the sidecar of the recovery job.
      # See: https://cloudnative-pg.io/plugin-barman-cloud/docs/plugin-barman-cloud.v1/#instancesidecarconfiguration
      # instanceSidecarConfiguration: {}

    # Database cluster backup configuration
    backups:
      # You need to configure backups manually, so backups are disabled by default.
      enabled: false

      encryption:
        enabled: false
      ## set a revision to append to the serverName, so restore and backup use a different archive. Must be a string.
      ## Required when cluster.skipEmptyWalArchiveCheck is false and both use the same archive.
      # revision: "1"

      # override serverName in the object store
      serverName: ""

      # Overrides the provider specific default path. Defaults to:
      # S3: s3://<bucket><path>
      # Azure: https://<storageAccount>.<serviceName>.core.windows.net/<clusterName><path>
      # Google: gs://<bucket><path>
      destinationPath: ""

      # default: prefer-standby, other option primary
      target: ""

      # name of credentials in .Values.Credentials
      credentials: ""

      scheduledBackups:
        - name: daily-backup
          schedule: "0 0 0 * * *"
          backupOwnerReference: self
          immediate: true
          suspend: false

      retentionPolicy: "30d"

      # Configures the sidecar of the instance pods.
      # See: https://cloudnative-pg.io/plugin-barman-cloud/docs/plugin-barman-cloud.v1/#instancesidecarconfiguration
      # instanceSidecarConfiguration:
      #   resources:
      #     requests:
      #       cpu: 50m
      #       memory: 128Mi

      # - Manual list of backups
      manualBackups: []
      #   - name: today
      #     labels: {}
      #     annotations: {}
      #   - name: beforeUpgrade
      #     labels: {}
      #     annotations: {}

    # Database cluster PgBouncer configuration
    pooler:
      enabled: false
      # -- enable to create extra pgbouncer for readonly access
      createRO: false
      poolMode: session
      # -- Gets scaled to 0 if hibernation is true
      instances: 2
      # parameters:
      #   max_client_conn: "1000"
      #   default_pool_size: "25"
      labels: {}
      annotations: {}

    # -- contains credentials and urls output by generator
    creds: {}

# -- mongodb dependency configuration
# @default -- See below
mongodb:
  enabled: false
  includeCommon: false
  password: "PLACEHOLDERPASSWORD"
  rootPassword: "PLACEHOLDERROOTPASSWORD"
  # -- can be used to make an easy accessable note which URLS to use to access the DB.
  creds: {}

# -- clickhouse dependency configuration
# @default -- See below
clickhouse:
  enabled: false
  includeCommon: false
  password: "PLACEHOLDERPASSWORD"
  # -- can be used to make an easy accessable note which URLS to use to access the DB.
  creds: {}

# -- solr dependency configuration
# @default -- See below
solr:
  enabled: false
  includeCommon: false
  password: "PLACEHOLDERPASSWORD"
  solrCores: 1
  solrEnableAuthentication: "no"
  # -- can be used to make an easy accessable note which URLS to use to access the DB.
  creds: {}

# -- Dependency configuration - replaces helm-dependencies
# Each dependency contains a complete chart values structure (workload, service, persistence, ...)
# Its objects are merged into the chart under the name [<dependency>-<object>] (eg [workload.valkey-main])
# and references between them (targetSelector, objectName, ...) are rewritten accordingly.
# Objects inherit the defaults of the matching common object (eg [workload.main]) and default to [enabled: true].
# Currently [valkey] and [mariadb] are the only dependencies with additional handling (credentials secret, wait init container).
# Disabled dependencies are not merged into the chart, so their defaults only apply once a chart sets [enabled: true].
# Dependencies with [mode: operator] are not merged into the chart either, as an operator provides them. Their credentials secret, wait init container and notes still apply.
# Settings for the operator go under [dependencies.<name>.operator], like [depconfig] it is never merged into the chart.
# @default -- See below

dependencies:
  mariadb:
    enabled: false
    # -- How the dependency is provided: [standalone] merges it into the chart, [operator] leaves it to an operator (its objects are not merged)
    mode: standalone
    # -- Settings of the operator providing the dependency, never merged into the chart
    operator: {}
    # -- Settings of the dependency itself, never merged into the chart
    depconfig:
      password: "PLACEHOLDERPASSWORD"
      rootPassword: "PLACEHOLDERROOTPASSWORD"
      mariadbUsername: "test"
      mariadbDatabase: "test"
    image:
      repository: oci.trueforge.org/containerforge/mariadb
      pullPolicy: IfNotPresent
      tag: 11.8.6@sha256:24e779c583b4355d5b0972072de1240b685b78b0b8465acff5bea782b304e439
    workload:
      main:
        replicas: 1
        type: StatefulSet
        strategy: RollingUpdate
        podSpec:
          containers:
            main:
              env:
                MARIADB_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                    key: mariadb-password
                MARIADB_ROOT_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                    key: mariadb-root-password
                MARIADB_USER: "{{ .Values.dependencies.mariadb.depconfig.mariadbUsername }}"
                MARIADB_DATABASE: "{{ .Values.dependencies.mariadb.depconfig.mariadbDatabase }}"
              probes:
                liveness:
                  type: exec
                  command: &mariadbProbeCommand
                    - mariadb-admin
                    - --no-defaults
                    - -uroot
                    - -h127.0.0.1
                    - -P3306
                    - ping
                readiness:
                  type: exec
                  command: *mariadbProbeCommand
                startup:
                  type: exec
                  command: *mariadbProbeCommand
    service:
      main:
        ports:
          main:
            protocol: tcp
            port: 3306
            targetPort: 3306
    persistence:
      data:
        mountPath: /config
  valkey:
    enabled: false
    # -- How the dependency is provided: [standalone] merges it into the chart, [operator] leaves it to an operator (its objects are not merged)
    mode: standalone
    # -- Settings of the operator providing the dependency, never merged into the chart
    operator: {}
    # -- Settings of the dependency itself, never merged into the chart
    depconfig:
      password: "PLACEHOLDERPASSWORD"
    image:
      repository: oci.trueforge.org/containerforge/valkey
      pullPolicy: IfNotPresent
      tag: 9.0.4@sha256:387b5f54777a6451f73f1a49a45b5bb6d29e1e5838b7b5a9c84d80370995531e
    workload:
      main:
        replicas: 1
        type: StatefulSet
        strategy: RollingUpdate
        podSpec:
          containers:
            main:
              env:
                VALKEY_PORT: "{{ .Values.dependencies.valkey.service.main.ports.main.port }}"
                VALKEY_PASSWORD:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                    key: valkey-password
              probes:
                liveness:
                  type: exec
                  command:
                    - sh
                    - -c
                    - /health/ping_liveness_local.sh 2
                readiness:
                  type: exec
                  command:
                    - sh
                    - -c
                    - /health/ping_readiness_local.sh 2
                startup:
                  type: exec
                  command:
                    - sh
                    - -c
                    - /health/ping_readiness_local.sh 2
    service:
      main:
        ports:
          main:
            protocol: tcp
            port: 6379
    persistence:
      data:
        mountPath: /config


# -- List of extra objects to deploy with the release
extraTpl: []
