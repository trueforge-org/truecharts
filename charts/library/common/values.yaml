# # -- create networkpolicy on demand
# See docs/networkpolicy.md for full documentation
networkpolicy:
  main:
    enabled: false
    ### Policy Type
    ## kubernetes: creates a NetworkPolicy (default)
    ## cilium: creates a CiliumNetworkPolicy, requires the Cilium CRDs to be installed in the cluster
    # type: kubernetes
    ## (optional, cilium only) Create a CiliumClusterwideNetworkPolicy instead of a CiliumNetworkPolicy
    ## Chart based selectors are pinned to the namespace of the chart
    # clusterwide: false
    ## (optional, cilium only) Free form description of the policy
    # description: ""

    ### Pod Selection Options (choose one):
    ## Default: targets all pods in this chart
    ## (optional, kubernetes only) Custom podSelector with matchLabels and matchExpressions
    # podSelector:
    #   matchLabels:
    #     app: my-app
    #   matchExpressions:
    #     - key: environment
    #       operator: In
    #       values:
    #         - production
    ## (optional) Target a specific pod from this chart
    # targetSelector: main-pod
    ## (optional) Target multiple workloads by name or regular expression
    # targetSelector:
    #   - main
    #   - worker
    # targetSelectorRegex: "^worker-"
    ## (optional) Target all pods in the namespace
    # targetAllPods: false
    ## (optional, cilium only) Custom endpointSelector with matchLabels and matchExpressions
    # endpointSelector:
    #   matchLabels:
    #     app: my-app
    ## (optional, cilium only) Host policy, selects nodes instead of pods
    # nodeSelector:
    #   matchLabels:
    #     node-role.kubernetes.io/control-plane: ""

    ## (optional, kubernetes only) Explicitly define policyTypes
    ## Auto-detected based on ingress/egress rules if not specified
    # policyTypes:
    #   - Ingress
    #   - Egress

    ## (optional, cilium only) Control whether the policy puts the selected endpoints in default deny mode
    # enableDefaultDeny:
    #   ingress: true
    #   egress: false

    ## Ingress Rules (incoming traffic)
    ## Empty list allows no ingress traffic
    ingress: []
    # ingress:
    #   - from:
    #       # Allow from pods with specific labels
    #       - podSelector:
    #           matchLabels:
    #             role: frontend
    #       # Allow from specific namespace
    #       - namespaceSelector:
    #           matchLabels:
    #             environment: production
    #       # Allow from IP range
    #       - ipBlock:
    #           cidr: 10.0.0.0/8
    #           except:
    #             - 10.1.0.0/16
    #     ports:
    #       - protocol: TCP
    #         port: 8080
    #       - protocol: TCP
    #         port: 8443

    ## Egress Rules (outgoing traffic)
    ## Empty list allows no egress traffic
    egress: []
    # egress:
    #   - to:
    #       # Allow to pods with specific labels
    #       - podSelector:
    #           matchLabels:
    #             role: database
    #       # Allow to specific namespace
    #       - namespaceSelector:
    #           matchLabels:
    #             name: kube-system
    #       # Allow to external IPs
    #       - ipBlock:
    #           cidr: 0.0.0.0/0
    #           except:
    #             - 169.254.169.254/32
    #     ports:
    #       - protocol: TCP
    #         port: 5432
    #       - protocol: UDP
    #         port: 53
    #       # Port ranges (Kubernetes 1.25+)
    #       - protocol: TCP
    #         port: 8000
    #         endPort: 9000

    ## (optional, cilium only) Deny rules, these take precedence over allow rules
    ## Same format as the Cilium ingress and egress rules
    # ingressDeny: []
    # egressDeny: []
    # egressDeny:
    #   - toEntities:
    #       - world

