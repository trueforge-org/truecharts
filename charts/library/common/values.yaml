# -- BETA: Configure the gateway API gateway classes for the chart here.
# Additional gateway classes can be added by adding a dictionary key similar to the 'main' gateway class.
# Please be aware that this is an early beta of this feature, TrueCharts does not guarantee this actually works.
# Being BETA this can/will change in the future without notice, please do not use unless you want to take that risk
# [[ref]](https://gateway-api.sigs.k8s.io/reference/spec/#gatewayclass)
# @default -- See below
gatewayClass:
  main:
    # -- Enables or disables the gateway class
    enabled: false
    # -- Provide additional annotations which may be required.
    annotations: {}
    # -- Provide additional labels which may be required.
    labels: {}
    # -- The name of the controller that will manage Gateways of this class
    controllerName: ""
    # -- Description helps describe a GatewayClass with more details
    description: ""
    # -- ParametersRef is a reference to a resource that contains the configuration parameters corresponding to the GatewayClass
    # parametersRef:
    #   group: ""
    #   kind: ""
    #   name: ""
    #   namespace: ""

# -- BETA: Configure the gateway API gateways for the chart here.
# Additional gateways can be added by adding a dictionary key similar to the 'main' gateway.
# Please be aware that this is an early beta of this feature, TrueCharts does not guarantee this actually works.
# Being BETA this can/will change in the future without notice, please do not use unless you want to take that risk
# [[ref]](https://gateway-api.sigs.k8s.io/reference/spec/#gateway)
# @default -- See below
gateway:
  main:
    # -- Enables or disables the gateway
    enabled: false
    # -- Provide additional annotations which may be required.
    annotations: {}
    # -- Provide additional labels which may be required.
    labels: {}
    # -- The name of the GatewayClass resource that this Gateway references
    # Can be set directly or use targetSelector to automatically reference a gatewayClass
    gatewayClassName: ""
    # -- Optional: Name-based selector for automatic GatewayClass linking
    # When set, automatically references the specified gatewayClass.$name
    # targetSelector: main
    # -- Optional: addresses, infrastructure, allowedListeners and tls are passed to the Gateway as is
    # addresses:
    #   - type: IPAddress
    #     value: 192.168.1.10
    # infrastructure:
    #   annotations:
    #     example: example
    # -- Gateway listeners configuration
    listeners:
      - name: http
        hostname:
        port: 80
        protocol: HTTP
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
        # tls:
        #   mode: Terminate
        #   certificateRefs:
        #     - kind: Secret
        #       group: ""
        #       name: example-cert
        #       namespace:
    # -- Allow ListenerSets to attach to this Gateway
    # Required when a listenerSet uses targetSelector to attach to this gateway
    # allowedListeners:
    #   namespaces:
    #     # Valid options are Same, All, Selector, None
    #     from: Same
    #     # Required when from is Selector
    #     # selector:
    #     #   matchLabels:
    #     #     gateway-access: "true"

# -- BETA: Configure the gateway listener sets for the chart here.
# Additional listener sets can be added by adding a dictionary key similar to the 'main' listener set.
# Please be aware that this is an early beta of this feature, TrueCharts does not guarantee this actually works.
# Being BETA this can/will change in the future without notice, please do not use unless you want to take that risk
# [[ref]](https://gateway-api.sigs.k8s.io/reference/spec/#listenerset)
# @default -- See below
listenerSet:
  main:
    # -- Enables or disables the listener set
    enabled: false
    # -- Prefix the object name with the chart fullname
    expandObjectName: true
    # -- Provide additional annotations which may be required.
    annotations: {}
    # -- Provide additional labels which may be required.
    labels: {}
    # -- Optional: Name-based selector for automatic Gateway linking
    # When set, attaches to the specified gateway.$name of this chart,
    # the referenced gateway must set allowedListeners.namespaces.from
    # targetSelector: main
    # -- The Gateway to attach to, when targetSelector is not used
    parentRef:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: ""
      # Defaults to the namespace of the listener set
      namespace:
    # -- Listeners that are added to the Gateway, same format as gateway.$name.listeners
    listeners:
      - name: https
        hostname:
        port: 443
        protocol: HTTPS
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
        # tls:
        #   mode: Terminate
        #   certificateRefs:
        #     - kind: Secret
        #       group: ""
        #       name: example-cert
        #       namespace:

# -- BETA: Configure the gateway routes for the chart here.
# Additional routes can be added by adding a dictionary key similar to the 'main' route.
# Please be aware that this is an early beta of this feature, TrueCharts does not guarantee this actually works.
# Being BETA this can/will change in the future without notice, please do not use unless you want to take that risk
# [[ref]](https://gateway-api.sigs.k8s.io/reference/spec/#httproute)
# @default -- See below
route:
  main:
    # -- Enables or disables the route
    enabled: false
    # -- Make this the primary route (used in notes, chart context, etc...).
    # If there is more than 1 route, make sure that only 1 route is marked as primary.
    primary: true
    # -- Ensure this route is always enabled. An enabled ingress also satisfies this.
    required: false
    # expandObjectName: false
    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute
    # -- Provide additional annotations which may be required.
    annotations: {}
    # -- Provide additional labels which may be required.
    labels: {}
    # -- Select a gateway outside of this chart. Replaces parentRefs.
    gateway: ""
    # -- Name of a listenerSet.$name of this chart to attach to. Replaces parentRefs.
    # Cannot be used with gateway, a targetSelector string, tls or integrations.certManager
    listenerSet: ""
    # -- Namespace of the selected gateway. Defaults to the namespace of the route.
    gatewayNamespace: ""
    # -- A string selects a gateway defined in this chart, and replaces parentRefs:
    # targetSelector: main
    # -- A map selects the default service and port of the rules, same as an ingress:
    # targetSelector:
    #   # service: port
    #   main: main
    # -- Configure the resource the route attaches to.
    # This is optional if targetSelector is used (targetSelector will override this)
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        # Name of a gateway in this chart. Takes the place of `name` and `namespace`
        # targetSelector: main
        name:
        # Defaults to the namespace of the route
        namespace:
        # Attach to a single listener of the gateway
        sectionName:
        # port: 443
    # -- Host addresses. Required for TLSRoute, not supported by TCPRoute and UDPRoute
    hostnames: []
    # -- Configure TLS for this route. It creates a ListenerSet on the selected gateway, and attaches
    # the route to it. Needs [gateway] or a [targetSelector] string, and the gateway must allow
    # ListenerSets with [allowedListeners]. Only for HTTPRoute and GRPCRoute.
    # Both secretName and hosts can process a Helm template.
    # Gets ignored when integrations.certManager is enabled
    tls: []
    #  - hosts:
    #      - chart-example.local
    #    # Exactly one of these
    #    secretName: chart-example-tls
    #    certificateIssuer: ""
    #    clusterCertificate: ""
    # -- Port of the created listeners. Defaults to global.fallbackDefaults.routeListenerPort
    # listenerPort: 443
    integrations:
      # Same as an ingress. Needs cert-manager 1.20 or newer, with ListenerSet support enabled.
      certManager:
        enabled: false
        certificateIssuer: ""
      # For Traefik. Only for HTTPRoute and GRPCRoute. Needs the kubernetesCRD provider of Traefik enabled.
      traefik:
        enabled: false
        # -- Allowed source IPs. Everything else is rejected.
        ipWhitelist: []
        # ipStrategy:
        #   depth: 1
        auth:
          # empty to disable, options: "authentik" or "authelia"
          type: ""
          # Internal Domain name + port to reach the auth provider, excluding http(s)
          internalHost: ""
          # Optional: override default response headers
          responseHeaders: []
        # Only for HTTPRoute. Needs the theme park plugin installed in Traefik.
        themePark:
          enabled: false
          app: ""
          theme: ""
        # Only for HTTPRoute. The regex must match the whole path. Each one is its own rule.
        redirectRegex: []
        #   - regex: ^/old/(.*)
        #     replacement: https://example.com/new/${1}
        #     permanent: true
        # -- Anything else: any Middleware from ingressMiddlewares.traefik, same as an ingress
        middlewares: []
        #   - name: my-middleware
      # For Envoy Gateway. Only for HTTPRoute and GRPCRoute.
      envoy:
        enabled: false
        # -- Allowed source IPs. Everything else is rejected.
        ipWhitelist: []
        auth:
          # empty to disable, options: "authentik" or "authelia"
          type: ""
          # service:port or service.namespace.svc.cluster.local:port
          # A service in another namespace needs a ReferenceGrant in that namespace
          internalHost: ""
          # Optional: override default response headers
          responseHeaders: []
        # Only for HTTPRoute. Buffers HTML responses, see the Route docs.
        themePark:
          enabled: false
          css: ""
        # Only for HTTPRoute. The regex must match the whole path. Each one is its own rule.
        # The replacement must be a fixed target, capture groups are not available on Envoy Gateway.
        redirectRegex: []
        #   - regex: ^/old/.*
        #     replacement: https://example.com/new
        #     permanent: true
        # -- Anything else: the spec of the policy of that kind on this route, without a target.
        # Envoy Gateway only applies one policy of a kind per route, so these are merged with the above.
        securityPolicy: {}
        #   cors:
        #     allowOrigins:
        #       - https://example.com
        backendTrafficPolicy: {}
        extensionPolicy: {}
      # Same as an ingress. Only for HTTPRoute, and homepage needs [gateway: true] in its kubernetes.yaml
      homepage:
        enabled: false
        # Default: chart name
        name: ""
        # Default: chart description
        description: ""
        # Default: no group
        group: ""
        # Default: chart icon
        icon: ""
        widget:
          # Default: chartname
          type: ""
          # Default to the first backend of the route
          url: ""
          custom:
            # somesetting: some value
          customkv:
            # - key: some key
            #   value: some value
    # -- Configure rules for routing. Without rules everything goes to the primary service.
    # Fields a route kind does not support fail rendering, see the Route docs.
    rules: []
    #   - name: main
    #     # Only for HTTPRoute and GRPCRoute. HTTPRoute defaults to all paths.
    #     matches:
    #       - path:
    #           type: PathPrefix
    #           value: /
    #     # Only for HTTPRoute and GRPCRoute. A rule with only filters needs no backendRefs, eg a redirect.
    #     filters:
    #       - type: RequestHeaderModifier
    #         requestHeaderModifier:
    #           add:
    #             - name: X-Example
    #               value: example
    #     # Only for HTTPRoute
    #     timeouts:
    #       request: 10s
    #       backendRequest: 5s
    #     backendRefs:
    #       # Name of a service in this chart. Without this or `name`, the primary service is used.
    #       - targetSelector: main
    #         # Name of the object, without any expanding. Cannot be used with targetSelector.
    #         # name: external-service
    #         # Defaults to the primary port of the selected service
    #         port: 8080
    #         # Set to 0 to stop sending traffic to this backend
    #         weight: 1
    #         # Only for HTTPRoute and GRPCRoute
    #         filters: []

