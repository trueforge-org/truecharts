# =============================================================================
# TRUECHARTS COMMON LIBRARY - COMPLETE VALUES STRUCTURE
# =============================================================================
# This file showcases ALL possible configuration keys available in the
# TrueCharts Common Library Chart. Use this as a reference when creating
# chart values.yaml files.
#
# Notes:
# - "objectname" is used as a placeholder for variable-named objects
# - Values shown are placeholders (actual values don't matter)
# - Focus is on showing structure: objects, arrays, and all possible keys
# - ALL documented features are included, not just defaults
# =============================================================================

# -----------------------------------------------------------------------------
# GLOBAL CONFIGURATION
# -----------------------------------------------------------------------------
global:
  # Global labels applied to all resources
  labels: {}
  # Global annotations applied to all resources
  annotations: {}
  # Global namespace (overrides per-chart namespace)
  namespace: ""
  
  # Diagnostic mode settings
  diagnosticMode:
    enabled: false
  
  # Fallback defaults when values not explicitly defined
  fallbackDefaults:
    # Default storage class for all PVCs
    storageClass: ""
    # Default probe type: http, https, tcp, exec, grpc
    probeType: "http"
    # Default service protocol: http, https, tcp, udp
    serviceProtocol: "tcp"
    # Default service type: ClusterIP, LoadBalancer, NodePort, ExternalIP, ExternalName
    serviceType: "ClusterIP"
    # Default persistence type: pvc, vct, emptyDir, hostPath, nfs, iscsi, device, configmap, secret
    persistenceType: "pvc"
    # Default PVC retain policy
    pvcRetain: false
    # Default PVC size
    pvcSize: "100Gi"
    # Default VCT size
    vctSize: "100Gi"
    # Default PVC access modes
    accessModes:
      - ReadWriteOnce
    # Default VCT access modes
    vctAccessModes:
      - ReadWriteOnce
    # Default probe timeouts
    probeTimeouts:
      liveness:
        initialDelaySeconds: 12
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 5
        successThreshold: 1
      readiness:
        initialDelaySeconds: 10
        periodSeconds: 12
        timeoutSeconds: 5
        failureThreshold: 4
        successThreshold: 2
      startup:
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 60
        successThreshold: 1
    # Default topology key for pod spread
    topologyKey: "kubernetes.io/hostname"
    # CNPG defaults
    cnpg:
      pgVersion: 16
      skipEmptyWalArchiveCheck: true
  
  # Traefik global settings
  traefik:
    addServiceAnnotations: true
    commonMiddlewares:
      - name: "tc-basic-secure-headers"
  
  # MetalLB global settings
  metallb:
    addServiceAnnotations: true
  
  # Minimum nodePort value
  minNodePort: 9000
  
  # Stop all pods (for maintenance)
  stopAll: false


# Explicit namespace for this chart only
namespace: ""

# -----------------------------------------------------------------------------
# CHART CONTEXT
# -----------------------------------------------------------------------------
chartContext:
  appUrl: ""
  podCIDR: ""
  svcCIDR: ""
  internalUrls: []

# -----------------------------------------------------------------------------
# TIMEZONE
# -----------------------------------------------------------------------------
TZ: "UTC"

# -----------------------------------------------------------------------------
# DIAGNOSTIC MODE
# -----------------------------------------------------------------------------
diagnosticMode:
  enabled: false

# -----------------------------------------------------------------------------
# OPERATOR SETTINGS
# -----------------------------------------------------------------------------
operator:
  register: false
  verify:
    enabled: true
    additionalsystem: []

