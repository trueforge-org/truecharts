  health:
    enabled: true
    data:
      ping_readiness_local.sh: "#!/bin/bash\n[[ -n \"$REDIS_PASSWORD\" ]] && export REDISCLI_AUTH=\"$REDIS_PASSWORD\"\nresponse=$(\n\
        \  timeout -s 3 $1 \\\n  redis-cli \\\n    -h localhost \\\n    -p $REDIS_PORT \\\n    ping\n)\nif [ \"$response\"\
        \ != \"PONG\" ]; then\n  echo \"failed to connect using password: $REDIS_PASSWORD response: $response\"\n  exit 1\n\
        fi"
      ping_liveness_local.sh: "#!/bin/bash\n[[ -n \"$REDIS_PASSWORD\" ]] && export REDISCLI_AUTH=\"$REDIS_PASSWORD\"\nresponse=$(\n\
        \  timeout -s 3 $1 \\\n  redis-cli \\\n    -h localhost \\\n    -p $REDIS_PORT \\\n    ping\n)\nif [ \"$response\"\
        \ != \"PONG\" ] && [ \"$response\" != \"LOADING Redis is loading the dataset in memory\" ]; then\n  echo \"$response\"\
        \n  exit 1\nfi"
      ping_readiness_master.sh: "#!/bin/bash\n[[ -n \"$REDIS_MASTER_PASSWORD\" ]] && export REDISCLI_AUTH=\"$REDIS_MASTER_PASSWORD\"\
        \nresponse=$(\n  timeout -s 3 $1 \\\n  redis-cli \\\n    -h $REDIS_MASTER_HOST \\\n    -p $REDIS_MASTER_PORT_NUMBER\
        \ \\\n    ping\n)\nif [ \"$response\" != \"PONG\" ]; then\n  echo \"$response\"\n  exit 1\nfi"
      ping_liveness_master.sh: "#!/bin/bash\n[[ -n \"$REDIS_MASTER_PASSWORD\" ]] && export REDISCLI_AUTH=\"$REDIS_MASTER_PASSWORD\"\
        \nresponse=$(\n  timeout -s 3 $1 \\\n  redis-cli \\\n    -h $REDIS_MASTER_HOST \\\n    -p $REDIS_MASTER_PORT_NUMBER\
        \ \\\n    ping\n)\nif [ \"$response\" != \"PONG\" ] && [ \"$response\" != \"LOADING Redis is loading the dataset in\
        \ memory\" ]; then\n  echo \"$response\"\n  exit 1\nfi"
      ping_readiness_local_and_master.sh: 'script_dir="$(dirname "$0")"

        exit_status=0

        "$script_dir/ping_readiness_local.sh" $1 || exit_status=$?

        "$script_dir/ping_readiness_master.sh" $1 || exit_status=$?

        exit $exit_status'
      ping_liveness_local_and_master.sh: 'script_dir="$(dirname "$0")"

        exit_status=0

        "$script_dir/ping_liveness_local.sh" $1 || exit_status=$?

        "$script_dir/ping_liveness_master.sh" $1 || exit_status=$?

        exit $exit_status'
