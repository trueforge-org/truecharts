        \  match_type: \"regex\"\n  name: \"memory_${2}\"\n  labels:\n    job: \"truenas\"\n    instance: \"${1}\"\n    kind:\
        \ \"${3}\"\n\n- match: 'truenas\\.(.*)\\.system\\.swap\\.(.*)'\n  match_type: \"regex\"\n  name: \"swap\"\n  labels:\n\
