        \ network-test\n#   - 20.download.real-debrid.com\n#   - 21.download.real-debrid.com\n#   - 22.download.real-debrid.com\n\
        #   - 23.download.real-debrid.com\n#   - 30.download.real-debrid.com\n#   - 31.download.real-debrid.com\n#   - 32.download.real-debrid.com\n\
        #   - 34.download.real-debrid.com\n#   - 40.download.real-debrid.com\n\n# List of directory definitions and their\
        \ filtering rules\ndirectories:\n  # Configuration for anime shows\n  anime:\n    group: media # directories on different\
        \ groups have duplicates of the same torrent\n    group_order: 10 # group order = priority, it defines who eats first\
        \ on a group\n    filters:\n      - and: # you can use nested 'and' & 'or' conditions\n        - has_episodes: true\
        \ # intelligent detection of episode files inside a torrent\n        - any_file_inside_regex: /^\\[/ # usually anime\
        \ starts with [ e.g. [SubsPlease]\n        - any_file_inside_not_regex: /s\\d\\de\\d\\d/i # and usually anime doesn't\
        \ use SxxExx\n\n  shows:\n    group: media\n    group_order: 20\n    filters:\n      - has_episodes: true  # intelligent\
        \ detection of episode files inside a torrent\n\n  movies:\n    group: media  # because anime, shows and movies are\
        \ in the same group,\n    group_order: 30 # and anime and shows has a lower group_order number than movies, all torrents\
        \ that doesn't fall into the previous 2 will fall into movies\n    only_show_the_biggest_file: true # let's not show\
        \ the other files besides the movie itself\n    filters:\n      - regex: /.*/ # you cannot leave a directory without\
        \ filters because it will not have any torrents in it\n"
  plexupdate-file:
    enabled: true
    data:
      plex_update.sh: "#!/bin/bash\n\n# PLEX PARTIAL SCAN script or PLEX UPDATE script\n# When zurg detects changes, it can\
        \ trigger this script IF your config.yml contains\n# on_library_update: sh plex_update.sh \"$@\"\n# Modified from\
        \ https://github.com/debridmediamanager/zurg-testing/blob/main/plex_update.sh\n\nplex_url=\"http://plex:32400\" #\
        \ If you're using zurg inside a Docker container, by default it is 172.17.0.1:32400\ntoken=\"yourplextoken\" # open\
        \ Plex in a browser, open dev console and copy-paste this: window.localStorage.getItem(\"myPlexAccessToken\")\nzurg_mount=\"\
        /storage/realdebrid-zurg\" # replace with your zurg mount path, ensure this is what Plex sees\n\n# Get the list of\
        \ section IDs\nsection_ids=$(curl -sLX GET \"$plex_url/library/sections\" -H \"X-Plex-Token: $token\" | xmllint --xpath\
        \ \"//Directory/@key\" - | sed 's/key=\"//g' | tr '\"' '\\n')\n\nfor arg in \"$@\"\ndo\n    modified_arg=\"$zurg_mount/$arg\"\
        \n    echo \"Detected update on: $arg\"\n    echo \"Absolute path: $modified_arg\"\n\n    ##### START Added by ElfHosted\
        \ for auto DMM symlinking ###\n    echo \"Symlinking $modified_arg to /storage/symlinks/real-debrid-blackhole/$arg\"\
        \n\n    # Ensure blackhole exists\n    mkdir -p /storage/symlinks/real-debrid-blackhole/movies\n    mkdir -p /storage/symlinks/real-debrid-blackhole/shows\n\
        \n    # Copy to the RD blackhole, preserving the directory structure\n    cp -rs \"$modified_arg/\"* \"/storage/symlinks/real-debrid-blackhole/$(echo\
        \ $arg | cut -f1 -d/)/\"\n    ##### END Added by ElfHosted for auto DMM symlinking ###\n\n    encoded_arg=$(echo -n\
        \ \"$modified_arg\" | python3 -c \"import sys, urllib.parse as ul; print (ul.quote_plus(sys.stdin.read()))\")\n\n\
        \    if [ -z \"$encoded_arg\" ]; then\n        echo \"Error: Encoded argument is empty. Check the input or encoding\
        \ process.\"\n        continue\n    fi\n\n    for section_id in $section_ids\n    do\n        final_url=\"${plex_url}/library/sections/${section_id}/refresh?path=${encoded_arg}&X-Plex-Token=${token}\"\
        \n\n        echo \"Encoded argument: $encoded_arg\"\n        echo \"Section ID: $section_id\"\n        echo \"Final\
        \ URL: $final_url\"\n\n        curl -s \"$final_url\"\n    done\n\ndone\n\necho \"All updated sections refreshed\"\
        \n\n# credits to godver3\n"
