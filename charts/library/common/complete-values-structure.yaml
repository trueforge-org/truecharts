        \  url: {{ printf \"%s.%s:5432\" (.Values.cnpg.main.creds.host | trimAll \"\\\"\") .Release.Namespace }}\n  access:\
        \ proxy\n  user: {{ .Values.cnpg.main.user }}\n  secureJsonData:\n    password: {{ .Values.cnpg.main.creds.password\
        \ | default \"na\" }}\n  jsonData:\n    database: {{ .Values.cnpg.main.database }}\n    sslmode: 'disable' # disable/require/verify-ca/verify-full\n\
        \    maxOpenConns: 100 # Grafana v5.4+\n    maxIdleConns: 100 # Grafana v5.4+\n    maxIdleConnsAuto: true # Grafana\
        \ v9.5.1+\n    connMaxLifetime: 14400 # Grafana v5.4+\n    postgresVersion: 1500 # 903=9.3, 904=9.4, 905=9.5, 906=9.6,\
        \ 1000=10\n    timescaledb: false"
      bitmagnetpsql.yaml: "apiVersion: 1\ndatasources:\n- name: BitmagnetPostgres\n  type: postgres\n  uid: bitmagnetpostgres\n\
        \  url: {{ printf \"%s.%s:5432\" (.Values.cnpg.main.creds.host | trimAll \"\\\"\") .Release.Namespace }}\n  access:\
        \ proxy\n  user: {{ .Values.cnpg.main.user }}\n  secureJsonData:\n    password: {{ .Values.cnpg.main.creds.password\
        \ | default \"na\" }}\n  jsonData:\n    database: {{ .Values.cnpg.main.database }}\n    sslmode: 'disable' # disable/require/verify-ca/verify-full\n\
        \    maxOpenConns: 100 # Grafana v5.4+\n    maxIdleConns: 100 # Grafana v5.4+\n    maxIdleConnsAuto: true # Grafana\
        \ v9.5.1+\n    connMaxLifetime: 14400 # Grafana v5.4+\n    postgresVersion: 1500 # 903=9.3, 904=9.4, 905=9.5, 906=9.6,\
        \ 1000=10\n    timescaledb: false"
      datasourceteslamatepsql.yaml: "apiVersion: 1\ndatasources:\n- name: TeslaMate\n  type: postgres\n  uid: TeslaMate\n\
        \  url: {{ printf \"%s.%s:5432\" (.Values.cnpg.main.creds.host | trimAll \"\\\"\") .Release.Namespace }}\n  access:\
        \ proxy\n  user: {{ .Values.cnpg.main.user }}\n  secureJsonData:\n    password: {{ .Values.cnpg.main.creds.password\
        \ | default \"na\" }}\n  jsonData:\n    database: {{ .Values.cnpg.main.database }}\n    sslmode: 'disable' # disable/require/verify-ca/verify-full\n\
        \    maxOpenConns: 100 # Grafana v5.4+\n    maxIdleConns: 100 # Grafana v5.4+\n    maxIdleConnsAuto: true # Grafana\
        \ v9.5.1+\n    connMaxLifetime: 14400 # Grafana v5.4+\n    postgresVersion: 1500 # 903=9.3, 904=9.4, 905=9.5, 906=9.6,\
        \ 1000=10\n    timescaledb: false"
  jdownloader:
    enabled: true
    data:
      ENABLE_CJK_FONT: '{{ ternary "1" "0" .Values.jdownloader.ENABLE_CJK_FONT }}'
      KEEP_APP_RUNNING: '{{ ternary "1" "0" .Values.jdownloader.KEEP_APP_RUNNING }}'
      SECURE_CONNECTION: '{{ ternary "1" "0" .Values.jdownloader.SECURE_CONNECTION }}'
      DISPLAY_WIDTH: '{{ .Values.jdownloader.DISPLAY_WIDTH }}'
      DISPLAY_HEIGHT: '{{ .Values.jdownloader.DISPLAY_HEIGHT }}'
  init:
    enabled: true
    data:
      init.sh: "#!/bin/sh\n{{- $haDBURL := (printf \"%s?client_encoding=utf8\" ($.Values.cnpg.main.creds.std | trimAll \"\\\
        \"\")) }}\nconfig=\"/config/configuration.yaml\"\ndefault=\"/config/init\"\nif [ ! -f \"$config\" ]; then\n  echo\
        \ \"File [$config] does NOT exist. Creating...\"\n  cp \"$default/configuration.yaml.default\" \"$config\"\nfi\nif\
        \ ! grep -q \"recorder:\" \"$config\"; then\n  echo \"Section [recorder] does NOT exist in [$config]. Appending...\"\
        \n  echo \"\" >> \"$config\"\n  cat \"$default/recorder.default\" >> \"$config\"\nfi\nif ! grep -q \"http:\" \"$config\"\
        ; then\n  echo \"Section [http] does NOT exist in [$config]. Appending...\"\n  echo \"\" >> \"$config\"\n  cat \"\
        $default/http.default\" >> \"$config\"\nfi\n\necho \"Updating database URL\"\nyq -i '.recorder.db_url = \"{{ $haDBURL\
        \ }}\"' \"$config\"\necho \"Done\"\n\necho \"Creating include files...\"\nfor include_file in groups.yaml automations.yaml\
        \ scripts.yaml scenes.yaml; do\n  if [ ! -f \"/config/$include_file\" ]; then\n    echo \"File [$include_file] missing.\
        \ Creating\"\n    touch \"/config/$include_file\"\n  fi\ndone\n\ncd \"/config\" || echo \"Could not change path to\
        \ /config\"\necho \"Creating custom_components directory...\"\nmkdir -p \"/config/custom_components\" || echo \"custom_components\
        \ directory already exists\"\n\necho \"Changing to the custom_components directory...\"\ncd \"/config/custom_components\"\
        \ || echo \"Could not change path to /config/custom_components\"\n\necho \"Downloading HACS\"\nwget \"https://github.com/hacs/integration/releases/latest/download/hacs.zip\"\
        \ || exit 0\n\nif [ -d \"/config/custom_components/hacs\" ]; then\n  echo \"HACS directory already exist, cleaning\
        \ up...\"\n  rm -R \"/config/custom_components/hacs\"\nfi\n\necho \"Creating HACS directory...\"\nmkdir -p \"/config/custom_components/hacs\"\
        \n\necho \"Unpacking HACS...\"\nunzip \"/config/custom_components/hacs.zip\" -d \"/config/custom_components/hacs\"\
        \ >/dev/null 2>&1\n\necho \"Removing HACS zip file...\"\nrm \"/config/custom_components/hacs.zip\"\necho \"Installation\
        \ complete.\""
      configuration.yaml.default: "# Configure a default setup of Home Assistant (frontend, api, etc)\ndefault_config:\n\n\
        # Text to speech\ntts:\n  - platform: google_translate\n\ngroup: !include groups.yaml\nautomation: !include automations.yaml\n\
        script: !include scripts.yaml\nscene: !include scenes.yaml"
      recorder.default: "recorder:\n  purge_keep_days: 30\n  commit_interval: 3\n  db_url: {{ (printf \"%s?client_encoding=utf8\"\
        \ (.Values.cnpg.main.creds.std | trimAll \"\\\"\")) | quote }}"
