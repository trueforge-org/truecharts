suite: notes external urls test
templates:
  - common.yaml
  - NOTES.txt
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should show the app url without ingress or route
    template: NOTES.txt
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            my-port:
              enabled: true
              primary: true
              port: 12345
    asserts:
      - matchRegexRaw:
          pattern: "in your browser:\n- http://127.0.0.1:12345\n"
      - matchRegexRaw:
          pattern: "service URLS:\n- test-release-name-common-test.test-release-namespace.svc.cluster.local:12345\n"
      - notMatchRegexRaw:
          pattern: "Other routes"

  - it: should list every path and hostname of all routes
    template: NOTES.txt
    set:
      service: *service
      someHost: app.example.com
      somePath: /ui
      route:
        api:
          enabled: true
          gateway: external
          hostnames:
            - "{{ .Values.someHost }}"
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /api
        ui:
          enabled: true
          primary: true
          gateway: external
          hostnames:
            - "{{ .Values.someHost }}"
            - other.example.com
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: "{{ .Values.somePath }}"
    asserts:
      - matchRegexRaw:
          pattern: "in your browser:\n- https://app.example.com/api\n- https://app.example.com/ui\n- https://other.example.com/ui\n"

  - it: should list ingresses and routes together
    template: NOTES.txt
    set:
      service: *service
      ingress:
        my-ingress:
          enabled: true
          primary: true
          hosts:
            - host: ingress.example.com
              paths:
                - path: /
                  pathType: Prefix
                - path: /admin
                  pathType: Prefix
          integrations:
            traefik:
              enabled: false
      route:
        my-route:
          enabled: true
          primary: true
          gateway: external
          hostnames:
            - route.example.com
    asserts:
      - matchRegexRaw:
          pattern: "in your browser:\n- https://ingress.example.com\n- https://ingress.example.com/admin\n- https://route.example.com\n"

  - it: should skip redirect rules and regular expressions, and use http for an http listener
    template: NOTES.txt
    set:
      service: *service
      route:
        my-route:
          enabled: true
          primary: true
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: my-gateway
              namespace: my-namespace
              sectionName: http
          hostnames:
            - app.example.com
          rules:
            - filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
            - matches:
                - path:
                    type: RegularExpression
                    value: /regex.*
            - matches:
                - path:
                    type: PathPrefix
                    value: /kept
    asserts:
      - matchRegexRaw:
          pattern: "in your browser:\n- http://app.example.com/kept\n"

  - it: should not create links for routes that can't be opened
    template: NOTES.txt
    set:
      service: *service
      route:
        my-tcp:
          enabled: true
          primary: true
          kind: TCPRoute
          gateway: external
        my-tls:
          enabled: true
          kind: TLSRoute
          gateway: external
          hostnames:
            - tls.example.com
        my-wildcard:
          enabled: true
          gateway: external
          hostnames:
            - "*.example.com"
    asserts:
      - notMatchRegexRaw:
          pattern: "Connecting externally"
      - matchRegexRaw:
          pattern: "of their gateway:\n- TCPRoute `my-tcp`\n- TLSRoute `my-tls`: tls.example.com\n- HTTPRoute `my-wildcard`: \\*.example.com\n"

  - it: should list load balancer services instead of the app url
    template: NOTES.txt
    set:
      someIP: 1.2.3.4
      service:
        my-service:
          enabled: true
          primary: true
          type: LoadBalancer
          loadBalancerIP: "{{ .Values.someIP }}"
          ports:
            web:
              enabled: true
              primary: true
              protocol: http
              port: 8080
            game:
              enabled: true
              protocol: udp
              port: 27015
        my-pool:
          enabled: true
          type: LoadBalancer
          ports:
            secure:
              enabled: true
              primary: true
              protocol: https
              port: 443
        my-ipv6:
          enabled: true
          type: LoadBalancer
          loadBalancerIPs:
            - 2001:db8::1
          ports:
            tcp:
              enabled: true
              primary: true
              port: 9000
    asserts:
      - notMatchRegexRaw:
          pattern: "Connecting externally"
      - matchRegexRaw:
          pattern: "from outside the cluster:\n- `my-ipv6` port `tcp` \\(LoadBalancer\\): \\[2001:db8::1\\]:9000/TCP\n- `my-pool` port `secure` \\(LoadBalancer\\): https://<load-balancer-ip>\n- `my-service` port `game` \\(LoadBalancer\\): 1.2.3.4:27015/UDP\n- `my-service` port `web` \\(LoadBalancer\\): http://1.2.3.4:8080\n"

  - it: should list node ports, host ports and external ips next to routes
    template: NOTES.txt
    set:
      workload:
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec: {}
      route:
        my-route:
          enabled: true
          primary: true
          gateway: external
          hostnames:
            - route.example.com
      service:
        my-service:
          enabled: true
          primary: true
          ports:
            my-port:
              enabled: true
              primary: true
              port: 8080
        my-external:
          enabled: true
          externalIPs:
            - 5.6.7.8
          ports:
            my-port:
              enabled: true
              primary: true
              port: 8081
        my-host:
          enabled: true
          type: LoadBalancer
          loadBalancerIP: 1.2.3.4
          ports:
            my-port:
              enabled: true
              primary: true
              port: 8082
              hostPort: 20082
        my-node:
          enabled: true
          type: NodePort
          ports:
            my-port:
              enabled: true
              primary: true
              protocol: http
              port: 8083
              nodePort: 30083
    asserts:
      - matchRegexRaw:
          pattern: "in your browser:\n- https://route.example.com\n"
      - matchRegexRaw:
          pattern: "from outside the cluster:\n- `my-external` port `my-port` \\(ClusterIP\\): 5.6.7.8:8081/TCP\n- `my-host` port `my-port` \\(hostPort\\): <node-ip>:20082/TCP\n- `my-node` port `my-port` \\(NodePort\\): http://<node-ip>:30083\n"

  - it: should not list services forced to ClusterIP by hostNetwork
    template: NOTES.txt
    set:
      workload:
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            hostNetwork: true
      service:
        my-service:
          enabled: true
          primary: true
          type: LoadBalancer
          ports:
            my-port:
              enabled: true
              primary: true
              port: 8080
    asserts:
      - notMatchRegexRaw:
          pattern: "Exposed services"

  - it: should not list exposed services with stopAll
    template: NOTES.txt
    set:
      global:
        stopAll: true
      service:
        my-service:
          enabled: true
          primary: true
          type: LoadBalancer
          ports:
            my-port:
              enabled: true
              primary: true
              port: 8080
    asserts:
      - notMatchRegexRaw:
          pattern: "Exposed services"
