suite: notes credentials test
templates:
  - common.yaml
  - NOTES.txt
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should hide the cnpg credentials by default
    template: NOTES.txt
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: HIDDEN\n"
      - notMatchRegexRaw:
          pattern: "test-password"

  - it: should hide the cnpg credentials with showCredentials disabled
    template: NOTES.txt
    set:
      notes:
        showCredentials: false
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: HIDDEN\n"
      - notMatchRegexRaw:
          pattern: "test-password"

  - it: should show the cnpg credentials with showCredentials enabled
    template: NOTES.txt
    set:
      notes:
        showCredentials: true
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: \"postgresql://test-user:test-password@"
      - notMatchRegexRaw:
          pattern: "HIDDEN"

  - it: should hide the cnpg read-only credentials by default
    template: NOTES.txt
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
              createRO: true
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: HIDDEN\n"
      - matchRegexRaw:
          pattern: "- Read-Only URL: HIDDEN\n"
      - notMatchRegexRaw:
          pattern: "test-password"

  - it: should show the cnpg read-only credentials with showCredentials enabled
    template: NOTES.txt
    set:
      notes:
        showCredentials: true
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
              createRO: true
    asserts:
      - matchRegexRaw:
          pattern: "- Read-Only URL: \"postgresql://test-user:test-password@"
      - notMatchRegexRaw:
          pattern: "HIDDEN"

  - it: should hide the mariadb credentials by default
    template: NOTES.txt
    set:
      dependencies:
        mariadb:
          enabled: true
          depconfig:
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: HIDDEN\n"
      - notMatchRegexRaw:
          pattern: "test-password"

  - it: should show the mariadb credentials with showCredentials enabled
    template: NOTES.txt
    set:
      notes:
        showCredentials: true
      dependencies:
        mariadb:
          enabled: true
          depconfig:
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: .*test-password"
      - notMatchRegexRaw:
          pattern: "HIDDEN"

  - it: should hide the clickhouse credentials by default
    template: NOTES.txt
    set:
      dependencies:
        clickhouse:
          enabled: true
          depconfig:
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: HIDDEN\n"
      - notMatchRegexRaw:
          pattern: "test-password"

  - it: should show the clickhouse credentials with showCredentials enabled
    template: NOTES.txt
    set:
      notes:
        showCredentials: true
      dependencies:
        clickhouse:
          enabled: true
          depconfig:
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: .*test-password"
      - notMatchRegexRaw:
          pattern: "HIDDEN"

  - it: should hide the postgresql credentials by default
    template: NOTES.txt
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: HIDDEN\n"
      - notMatchRegexRaw:
          pattern: "test-password"

  - it: should show the postgresql credentials with showCredentials enabled
    template: NOTES.txt
    set:
      notes:
        showCredentials: true
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            password: test-password
    asserts:
      - matchRegexRaw:
          pattern: "- Connection URL: .*test-password"
      - notMatchRegexRaw:
          pattern: "HIDDEN"

  - it: should never show the tailscale authkey in the notes
    template: NOTES.txt
    set:
      notes:
        showCredentials: true
      addons:
        tailscale:
          enabled: true
          settings:
            authkey: test-authkey
    asserts:
      - matchRegexRaw:
          pattern: "## Tailscale VPN Addon"
      - notMatchRegexRaw:
          pattern: "test-authkey"
