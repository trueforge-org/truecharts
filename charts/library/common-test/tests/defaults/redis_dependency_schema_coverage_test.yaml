suite: redis dependency schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render the redis secret with all redis keys set
    set:
      redis:
        enabled: true
        includeCommon: true
        password: my-password
        redisUsername: my-user
        redisDatabase: "1"
        secret:
          credentials:
            enabled: true
        creds:
          redisPassword: my-password
          plain: my-redis
          plainhost: my-redis
          plainport: my-redis:6379
          plainporthost: my-redis:6379
          plainhostpass: my-user:my-password@my-redis
          url: redis://my-user:my-password@my-redis:6379/1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0

  - it: should render the redis secret with the string enabled key
    set:
      redis:
        enabled: "true"
        password: my-password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0

  - it: should fail with an empty redis password
    set:
      redis:
        enabled: true
        password: ""
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/redis/password'': minLength: got 0, want 1'

  - it: should fail with an unknown key in redis creds
    set:
      redis:
        enabled: true
        password: my-password
        creds:
          bogus: value
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/redis/creds'': additional properties ''bogus'' not allowed'

  - it: should fail with an unknown key in redis secret
    set:
      redis:
        enabled: true
        password: my-password
        secret:
          bogus: value
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/redis/secret'': additional properties ''bogus'' not allowed'

  - it: should fail with an unknown key in redis secret credentials
    set:
      redis:
        enabled: true
        password: my-password
        secret:
          credentials:
            bogus: value
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/redis/secret/credentials'': additional properties ''bogus'' not allowed'

  - it: should accept the values of a redis subchart next to the keys read by common
    set:
      redis:
        enabled: true
        password: my-password
        workload:
          main:
            enabled: true
        service:
          main:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
        documentIndex: 0

  - it: should fail with a wrong type in the redis subchart values
    set:
      redis:
        enabled: true
        password: my-password
        workload: str
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/redis/workload'''
