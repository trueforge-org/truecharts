suite: externalSecret dataFrom schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render dataFrom extract with all options
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          dataFrom:
            - extract:
                key: shared
                property: config
                version: v1
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
              sourceRef:
                storeRef:
                  name: other-vault
                  kind: SecretStore
    asserts:
      - documentIndex: 0
        equal:
          path: spec.dataFrom
          value:
            - extract:
                key: shared
                property: config
                version: v1
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
              sourceRef:
                storeRef:
                  name: other-vault
                  kind: SecretStore

  - it: should render dataFrom find with a regexp rewrite
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          dataFrom:
            - find:
                name:
                  regexp: "^app-"
              rewrite:
                - regexp:
                    source: "app-(.*)"
                    target: "$1"
                - transform:
                    template: "{{ .value | upper }}"
    asserts:
      - documentIndex: 0
        equal:
          path: spec.dataFrom[0].rewrite[0]
          value:
            regexp:
              source: "app-(.*)"
              target: "$1"

  - it: should fail on unknown keys in a dataFrom item
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          dataFrom:
            - unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/dataFrom/0': .*unknownKey"

  - it: should fail on unknown keys in dataFrom extract
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          dataFrom:
            - extract:
                key: shared
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/dataFrom/0/extract': .*unknownKey"

  - it: should fail on unknown keys in dataFrom rewrite items
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          dataFrom:
            - rewrite:
                - unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/dataFrom/0/rewrite/0': .*unknownKey"

  - it: should fail on unknown keys in dataFrom rewrite regexp and transform
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          dataFrom:
            - rewrite:
                - regexp:
                    unknownKey: value
                  transform:
                    unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/dataFrom/0/rewrite/0/regexp': .*unknownKey"

  - it: should fail on wrong value types in a dataFrom item
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          dataFrom:
            - extract:
                key: [a]
                property: [a]
                version: [a]
                conversionStrategy: [a]
                decodingStrategy: [a]
                metadataPolicy: [a]
              find: notamap
              sourceRef: notamap
              rewrite:
                - regexp:
                    source: [a]
                    target: [a]
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/dataFrom/0/extract/key'"

  - it: should fail on a regexp rewrite that is not an object
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          dataFrom:
            - rewrite:
                - regexp: notamap
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/dataFrom/0/rewrite/0/regexp'"
