suite: externalSecret target schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render a target template with all options
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          target:
            creationPolicy: Merge
            deletionPolicy: Delete
            template:
              type: Opaque
              engineVersion: v2
              mergePolicy: Replace
              templateFrom:
                - configMap:
                    name: some-config
                    items:
                      - key: template
              metadata:
                annotations:
                  some-annotation: some-value
                labels:
                  some-label: some-value
          data:
            - secretKey: password
              remoteRef:
                key: my-app
    asserts:
      - documentIndex: 0
        equal:
          path: spec.target.template
          value:
            type: Opaque
            engineVersion: v2
            mergePolicy: Replace
            templateFrom:
              - configMap:
                  name: some-config
                  items:
                    - key: template
            metadata:
              annotations:
                some-annotation: some-value
              labels:
                some-label: some-value
      - documentIndex: 0
        equal:
          path: spec.target.creationPolicy
          value: Merge

  - it: should render a target with null settings
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          target:
            name: null
            creationPolicy: None
            deletionPolicy: null
            immutable: null
          data:
            - secretKey: password
              remoteRef:
                key: my-app
    asserts:
      - documentIndex: 0
        equal:
          path: spec.target.creationPolicy
          value: None

  - it: should render a target with an empty deletionPolicy
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          target:
            creationPolicy: Owner
            deletionPolicy: ""
          data:
            - secretKey: password
              remoteRef:
                key: my-app
    asserts:
      - documentIndex: 0
        equal:
          path: spec.target.creationPolicy
          value: Owner

  - it: should render a target with the Merge deletionPolicy
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          target:
            deletionPolicy: Merge
          data:
            - secretKey: password
              remoteRef:
                key: my-app
    asserts:
      - documentIndex: 0
        equal:
          path: spec.target.deletionPolicy
          value: Merge

  - it: should fail on unknown keys in a target
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          target:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/target': .*unknownKey"

  - it: should fail on unknown keys in a target template
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          target:
            template:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/target/template': .*unknownKey"

  - it: should fail on unknown keys in the metadata of a target template
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          target:
            template:
              metadata:
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/target/template/metadata': .*unknownKey"

  - it: should fail on invalid enum values and wrong types in a target
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          target:
            creationPolicy: invalid
            deletionPolicy: invalid
            immutable: notabool
            name: [a]
            template:
              engineVersion: [a]
              mergePolicy: [a]
              templateFrom: notalist
              metadata: notamap
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/target/creationPolicy'"
