suite: externalSecret data schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render data with all remoteRef options
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          data:
            - secretKey: password
              remoteRef:
                key: my-app
                property: password
                version: v1
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
              sourceRef:
                storeRef:
                  name: other-vault
                  kind: SecretStore
    asserts:
      - documentIndex: 0
        equal:
          path: spec.data
          value:
            - secretKey: password
              remoteRef:
                key: my-app
                property: password
                version: v1
                conversionStrategy: Default
                decodingStrategy: None
                metadataPolicy: None
              sourceRef:
                storeRef:
                  name: other-vault
                  kind: SecretStore

  - it: should render data with null remoteRef options
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          data:
            - secretKey: password
              remoteRef:
                key: my-app
                property: null
                version: null
                conversionStrategy: null
                decodingStrategy: null
                metadataPolicy: null
    asserts:
      - documentIndex: 0
        isKind:
          of: ExternalSecret

  - it: should fail on unknown keys in a data item
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          data:
            - secretKey: password
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/data/0': .*unknownKey"

  - it: should fail on unknown keys in the remoteRef of a data item
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          data:
            - secretKey: password
              remoteRef:
                key: my-app
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/data/0/remoteRef': .*unknownKey"

  - it: should fail on wrong value types in a data item
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
          data:
            - secretKey: [a]
              remoteRef:
                key: [a]
                property: [a]
                version: [a]
                conversionStrategy: [a]
                decodingStrategy: [a]
                metadataPolicy: [a]
              sourceRef: notamap
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/data/0/secretKey'"
