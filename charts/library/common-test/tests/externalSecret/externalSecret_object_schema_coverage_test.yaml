suite: externalSecret object schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render an external secret with the object level options
    set:
      externalSecret:
        my-secret:
          enabled: "true"
          expandObjectName: "false"
          annotationsList:
            - name: some-annotation
              value: some-value
          labelsList:
            - name: some-label
              value: some-value
          refreshInterval: 1h
          refreshPolicy: CreatedOnce
          secretStoreRef:
            name: vault
            kind: SecretStore
          data:
            - secretKey: password
              remoteRef:
                key: my-app
    asserts:
      - documentIndex: 0
        isKind:
          of: ExternalSecret
      - documentIndex: 0
        equal:
          path: metadata.name
          value: my-secret
      - documentIndex: 0
        equal:
          path: metadata.annotations.some-annotation
          value: some-value
      - documentIndex: 0
        equal:
          path: metadata.labels.some-label
          value: some-value
      - documentIndex: 0
        equal:
          path: spec.refreshPolicy
          value: CreatedOnce

  - it: should render an external secret with null refresh settings
    set:
      externalSecret:
        my-secret:
          enabled: true
          refreshInterval: null
          refreshPolicy: null
          secretStoreRef:
            name: vault
          data:
            - secretKey: password
              remoteRef:
                key: my-app
    asserts:
      - documentIndex: 0
        isKind:
          of: ExternalSecret
      - documentIndex: 0
        notExists:
          path: spec.refreshPolicy

  - it: should render an external secret with an empty refreshPolicy
    set:
      externalSecret:
        my-secret:
          enabled: true
          refreshPolicy: ""
          secretStoreRef:
            name: vault
          data:
            - secretKey: password
              remoteRef:
                key: my-app
    asserts:
      - documentIndex: 0
        isKind:
          of: ExternalSecret

  - it: should render an external secret with the OnChange refreshPolicy
    set:
      externalSecret:
        my-secret:
          enabled: true
          refreshPolicy: OnChange
          secretStoreRef:
            name: vault
          data:
            - secretKey: password
              remoteRef:
                key: my-app
    asserts:
      - documentIndex: 0
        equal:
          path: spec.refreshPolicy
          value: OnChange

  - it: should fail on unknown keys in an external secret and its secretStoreRef
    set:
      externalSecret:
        my-secret:
          enabled: true
          unknownKey: value
          secretStoreRef:
            name: vault
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret': .*unknownKey"

  - it: should fail on unknown keys in the secretStoreRef of an external secret
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/secretStoreRef': .*unknownKey"

  - it: should fail on invalid enum values and wrong types in an external secret
    set:
      externalSecret:
        my-secret:
          enabled: true
          refreshPolicy: invalid
          refreshInterval: [a]
          secretStoreRef:
            name: vault
            kind: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/refreshPolicy'"

  - it: should fail on an invalid kind in the secretStoreRef of an external secret
    set:
      externalSecret:
        my-secret:
          enabled: true
          secretStoreRef:
            name: vault
            kind: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/secretStoreRef/kind'"

  - it: should fail on annotationsList and labelsList items without required keys
    set:
      externalSecret:
        my-secret:
          enabled: true
          annotationsList:
            - unknownKey: value
          labelsList:
            - unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/externalSecret/my-secret/annotationsList/0'"
