suite: webhook clientConfig schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render webhook clientConfig with a service in webhook clientConfig
    set:
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                caBundle: Y2FidWx0dXJl
                service:
                  name: svc
                  namespace: test-release-namespace
                  path: /validate
                  port: '8443'
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                caBundle: Y2FidWx0dXJl
                service:
                  name: svc
                  namespace: test-release-namespace
                  path: /validate
                  port: '8443'
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                caBundle: Y2FidWx0dXJl
                service:
                  name: svc
                  namespace: test-release-namespace
                  path: /validate
                  port: '8443'
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
    asserts:
      - documentIndex: 2
        isKind:
          of: ValidatingWebhookConfiguration
      - documentIndex: 2
        equal:
          path: metadata.name
          value: test-release-name-common-test-validating
      - documentIndex: 0
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 0
        equal:
          path: metadata.name
          value: test-release-name-common-test-mutating
      - documentIndex: 1
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 1
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-webhook
      - documentIndex: 0
        equal:
          path: webhooks[0].clientConfig.service.port
          value: 8443

  - it: should render webhook clientConfig with a templated service port in webhook clientConfig
    set:
      k1: '9443'
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
                  port: "{{ .Values.k1 }}"
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
                  port: "{{ .Values.k1 }}"
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
                  port: "{{ .Values.k1 }}"
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
    asserts:
      - documentIndex: 2
        isKind:
          of: ValidatingWebhookConfiguration
      - documentIndex: 2
        equal:
          path: metadata.name
          value: test-release-name-common-test-validating
      - documentIndex: 0
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 0
        equal:
          path: metadata.name
          value: test-release-name-common-test-mutating
      - documentIndex: 1
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 1
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-webhook

  - it: should render webhook clientConfig with a url in webhook clientConfig
    set:
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                url: https://example.com/hook
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                url: https://example.com/hook
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                url: https://example.com/hook
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
    asserts:
      - documentIndex: 2
        isKind:
          of: ValidatingWebhookConfiguration
      - documentIndex: 2
        equal:
          path: metadata.name
          value: test-release-name-common-test-validating
      - documentIndex: 0
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 0
        equal:
          path: metadata.name
          value: test-release-name-common-test-mutating
      - documentIndex: 1
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 1
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-webhook
      - documentIndex: 0
        equal:
          path: webhooks[0].clientConfig.url
          value: https://example.com/hook

  - it: should fail on unknown keys and missing required keys in webhook clientConfig service
    set:
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  unknown: x
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  unknown: x
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  unknown: x
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/webhook/my-webhook/webhooks/0/clientConfig/service'': '

  - it: should fail on unknown keys in webhook clientConfig
    set:
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                unknown: x
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                unknown: x
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                unknown: x
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/webhook/my-webhook/webhooks/0/clientConfig'': '

  - it: should fail on empty service name and empty clientConfig in webhook clientConfig
    set:
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: ''
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
            - name: other.example.com
              admissionReviewVersions: [v1]
              clientConfig: {}
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: ''
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
            - name: other.example.com
              admissionReviewVersions: [v1]
              clientConfig: {}
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: ''
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
            - name: other.example.com
              admissionReviewVersions: [v1]
              clientConfig: {}
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/webhook/validating/webhooks/1/clientConfig'': '
