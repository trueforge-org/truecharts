suite: webhook policies schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render webhook policies with the first enum values (Fail, Exact, None) in webhook policies
    set:
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Fail
              matchPolicy: Exact
              sideEffects: None
              timeoutSeconds: 10
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Fail
              matchPolicy: Exact
              sideEffects: None
              timeoutSeconds: 10
              reinvocationPolicy: Never
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Fail
              matchPolicy: Exact
              sideEffects: None
              timeoutSeconds: 10
              reinvocationPolicy: Never
    asserts:
      - documentIndex: 2
        isKind:
          of: ValidatingWebhookConfiguration
      - documentIndex: 2
        equal:
          path: metadata.name
          value: test-release-name-common-test-validating
      - documentIndex: 0
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 0
        equal:
          path: metadata.name
          value: test-release-name-common-test-mutating
      - documentIndex: 1
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 1
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-webhook
      - documentIndex: 0
        equal:
          path: webhooks[0].failurePolicy
          value: Fail
      - documentIndex: 0
        equal:
          path: webhooks[0].timeoutSeconds
          value: 10

  - it: should render webhook policies with the second enum values (Ignore, Equivalent, NoneOnDryRun) in webhook policies
    set:
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Ignore
              matchPolicy: Equivalent
              sideEffects: NoneOnDryRun
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Ignore
              matchPolicy: Equivalent
              sideEffects: NoneOnDryRun
              reinvocationPolicy: IfNeeded
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Ignore
              matchPolicy: Equivalent
              sideEffects: NoneOnDryRun
              reinvocationPolicy: IfNeeded
    asserts:
      - documentIndex: 2
        isKind:
          of: ValidatingWebhookConfiguration
      - documentIndex: 2
        equal:
          path: metadata.name
          value: test-release-name-common-test-validating
      - documentIndex: 0
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 0
        equal:
          path: metadata.name
          value: test-release-name-common-test-mutating
      - documentIndex: 1
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 1
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-webhook
      - documentIndex: 2
        equal:
          path: webhooks[0].sideEffects
          value: NoneOnDryRun

  - it: should render templated webhook policies in webhook policies
    set:
      k1: Fail
      k2: Exact
      k3: None
      k4: Never
      webhook:
        validating:
          enabled: "{{ true }}"
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: "{{ .Values.k1 }}"
              matchPolicy: "{{ .Values.k2 }}"
              sideEffects: "{{ .Values.k3 }}"
        mutating:
          enabled: "{{ true }}"
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: "{{ .Values.k1 }}"
              matchPolicy: "{{ .Values.k2 }}"
              sideEffects: "{{ .Values.k3 }}"
              reinvocationPolicy: "{{ .Values.k4 }}"
        my-webhook:
          enabled: "{{ true }}"
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: "{{ .Values.k1 }}"
              matchPolicy: "{{ .Values.k2 }}"
              sideEffects: "{{ .Values.k3 }}"
              reinvocationPolicy: "{{ .Values.k4 }}"
    asserts:
      - documentIndex: 2
        isKind:
          of: ValidatingWebhookConfiguration
      - documentIndex: 2
        equal:
          path: metadata.name
          value: test-release-name-common-test-validating
      - documentIndex: 0
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 0
        equal:
          path: metadata.name
          value: test-release-name-common-test-mutating
      - documentIndex: 1
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 1
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-webhook
      - documentIndex: 2
        equal:
          path: webhooks[0].matchPolicy
          value: Exact

  - it: should render a templated webhook type in webhook policies
    set:
      k1: validating
      k2: mutating
      webhook:
        validating:
          enabled: true
          type: "{{ .Values.k1 }}"
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        mutating:
          enabled: true
          type: "{{ .Values.k2 }}"
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
        my-webhook:
          enabled: true
          type: "{{ .Values.k2 }}"
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
    asserts:
      - documentIndex: 2
        isKind:
          of: ValidatingWebhookConfiguration
      - documentIndex: 2
        equal:
          path: metadata.name
          value: test-release-name-common-test-validating
      - documentIndex: 0
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 0
        equal:
          path: metadata.name
          value: test-release-name-common-test-mutating
      - documentIndex: 1
        isKind:
          of: MutatingWebhookConfiguration
      - documentIndex: 1
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-webhook

  - it: should fail on invalid enum values and patterns in webhook policies
    set:
      webhook:
        validating:
          enabled: true
          type: validating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Bogus
              matchPolicy: Bogus
              sideEffects: Bogus
        mutating:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Bogus
              matchPolicy: Bogus
              sideEffects: Bogus
              reinvocationPolicy: Bogus
        my-webhook:
          enabled: true
          type: mutating
          webhooks:
            - name: check.example.com
              admissionReviewVersions: [v1]
              clientConfig:
                service:
                  name: svc
                  namespace: test-release-namespace
              rules:
                - apiGroups: [""]
                  apiVersions: [v1]
                  operations: [CREATE]
                  resources: [pods]
              failurePolicy: Bogus
              matchPolicy: Bogus
              sideEffects: Bogus
              reinvocationPolicy: Bogus
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/webhook/validating/webhooks/0/failurePolicy'': ''oneOf'' failed'
