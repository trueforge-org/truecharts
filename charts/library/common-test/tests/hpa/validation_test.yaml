suite: hpa validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with name longer than 63 characters
    set:
      workload: &workload
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name:
                enabled: true
                primary: true
                probes:
                  readiness:
                    enabled: false
                  liveness:
                    enabled: false
                  startup:
                    enabled: false
      hpa:
        other-horizontal-pod-autoscale-name-super-long-name-that-is-longer-than-63-characters:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Name [other-horizontal-pod-autoscale-name-super-long-name-that-is-longer-than-63-characters] is not valid. Must start and end with an alphanumeric lowercase character. It can contain '-'. And must be at most 63 characters.

  - it: should fail with name starting with underscore
    set:
      workload: *workload
      hpa:
        _other-hpa-name:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Name [_other-hpa-name] is not valid. Must start and end with an alphanumeric lowercase character. It can contain '-'. And must be at most 63 characters.

  - it: should fail with labels not a dict
    set:
      workload: *workload
      hpa:
        hpa-name:
          enabled: true
          labels: "not a dict"
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/hpa/hpa-name/labels'': got string, want object'

  - it: should fail with annotations not a dict
    set:
      workload: *workload
      hpa:
        hpa-name:
          enabled: true
          annotations: "not a dict"
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/hpa/hpa-name/annotations'': got string, want object'
  - it: should fail with minReplicas not an integer
    set:
      workload: *workload
      hpa:
        hpa-name:
          enabled: true
          minReplicas: "not an integer"
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/hpa/hpa-name/minReplicas'': got string, want integer'
  - it: should fail with maxReplicas not an integer
    set:
      workload: *workload
      hpa:
        hpa-name:
          enabled: true
          maxReplicas: "not an integer"
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/hpa/hpa-name/maxReplicas'': got string, want integer'
  - it: should fail with minReplicas greater than maxReplicas
    set:
      workload: *workload
      hpa:
        hpa-name:
          enabled: true
          minReplicas: 5
          maxReplicas: 3
    asserts:
      - failedTemplate:
          errorMessage: Horizontal Pod Autoscaler - Expected [hpa.hpa-name.minReplicas] to be less than [hpa.hpa-name.maxReplicas], but got [5] and [3]

  - it: should fail with invalid selectPolicy (scaleUp)
    set:
      workload: *workload
      hpa:
        hpa-name:
          enabled: true
          behavior:
            scaleUp:
              selectPolicy: "not a valid policy"
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/hpa/hpa-name/behavior/scaleUp/selectPolicy'': value must be one of ''Max'', ''Min'', ''Disabled'''

  - it: should fail with invalid stabilityWindowSeconds (scaleUp)
