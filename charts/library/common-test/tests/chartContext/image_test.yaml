suite: image version test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should make sure that postgres 15 uses correct image
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pgVersion: 15
    asserts:
      - documentIndex: &clusterDoc 0
        isKind:
          of: Cluster
      - documentIndex: *clusterDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main
      - documentIndex: *clusterDoc
        matchRegex:
          path: spec.imageName
          pattern: ghcr.io/cloudnative-pg/postgresql:15.\d+

  - it: should make sure that postgis 15 uses correct image
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            type: postgis
            pgVersion: 15
    asserts:
      - documentIndex: *clusterDoc
        isKind:
          of: Cluster
      - documentIndex: *clusterDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main
      - documentIndex: *clusterDoc
        matchRegex:
          path: spec.imageName
          pattern: ghcr.io/cloudnative-pg/postgis:15.\d+

  - it: should make sure that vector 15 uses correct image
