      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            type: vectors
            pgVersion: 15
    asserts:
      - documentIndex: *clusterDoc
        isKind:
          of: Cluster
      - documentIndex: *clusterDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main
      - documentIndex: *clusterDoc
        matchRegex:
          path: spec.imageName
          pattern: ghcr.io/tensorchord/cloudnative-pgvecto.rs:15.\d+

  - it: should make sure that postgres 16 uses correct image
