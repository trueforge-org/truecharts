suite: imagePullSecret schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render image pull secret with string typed enabled
    set:
      imagePullSecret:
        my-secret:
          enabled: "true"
          data:
            registry: reg
            username: user
            password: pass
            email: mail
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0

  - it: should fail on unknown keys in image pull secret data
    set:
      imagePullSecret:
        my-secret:
          enabled: true
          data:
            registry: reg
            username: user
            password: pass
            email: mail
            unknown: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/imagePullSecret/my-secret/data': (additional properties|additionalProperties)"
