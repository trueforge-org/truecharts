suite: cnpg cluster certificates schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should accept certificates with every key
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            certificates:
              serverCASecret: my-server-ca
              serverTLSSecret: my-server-tls
              replicationTLSSecret: my-replication-tls
              clientCASecret: my-client-ca
              serverAltDNSNames:
                - pg.example.com
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should accept null certificates
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            certificates: null
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should fail with an unknown key in certificates
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            certificates:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/certificates': additional properties 'unknownKey' not allowed"
