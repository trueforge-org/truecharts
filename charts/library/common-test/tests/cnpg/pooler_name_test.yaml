suite: cnpg pooler name test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should generate correct name
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
              createRO: true
    asserts:
      - documentIndex: &poolerDoc 0
        isKind:
          of: Pooler
      - documentIndex: *poolerDoc
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentIndex: *poolerDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-pooler-rw
      - documentIndex: &otherpoolerDoc 1
        isKind:
          of: Pooler
      - documentIndex: *otherpoolerDoc
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentIndex: *otherpoolerDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-pooler-ro
