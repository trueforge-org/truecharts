suite: cnpg cluster storage schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render storage with every key
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            storage:
              size: 1Gi
              accessModes: ReadWriteOnce
              volumeName: my-pv
              storageClass: my-storage-class
              dataSource:
                kind: VolumeSnapshot
                name: my-snapshot
              dataSourceRef:
                kind: VolumeSnapshot
                name: my-snapshot-ref
                apiGroup: snapshot.storage.k8s.io
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.storage.pvcTemplate.accessModes
          value:
            - ReadWriteOnce
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.storage.pvcTemplate.volumeName
          value: my-pv
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.storage.pvcTemplate.storageClassName
          value: my-storage-class
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.storage.pvcTemplate.dataSource
          value:
            kind: VolumeSnapshot
            name: my-snapshot
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.storage.pvcTemplate.dataSourceRef
          value:
            kind: VolumeSnapshot
            name: my-snapshot-ref
            apiGroup: snapshot.storage.k8s.io

  - it: should fail with an unknown key in storage
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            storage:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/storage': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in storage dataSource
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            storage:
              dataSource:
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/storage/dataSource': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in storage dataSourceRef
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            storage:
              dataSourceRef:
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/storage/dataSourceRef': additional properties 'unknownKey' not allowed"
