suite: cnpg backup spec test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - barmancloud.cnpg.io/v1/ObjectStore
tests:
  - it: should generate correct spec
    set:
      credentials:
        test:
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          encrKey: some-encr-key
          url: http://some-url
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              target: primary
              retentionPolicy: 10d
              credentials: test
              destinationPath: some-path
              manualBackups:
                - name: today
                - name: before-upgrade
    asserts:
      - documentIndex: &cnpgDoc 0
        isKind:
          of: Backup
      - documentIndex: *cnpgDoc
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentIndex: *cnpgDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-today
      - documentIndex: *cnpgDoc
        equal:
          path: spec
          value:
            cluster:
              name: test-release-name-common-test-cnpg-main
            method: plugin
            pluginConfiguration:
              name: barman-cloud.cloudnative-pg.io
      - documentIndex: &otherCnpgDoc 1
        isKind:
          of: Backup
      - documentIndex: *otherCnpgDoc
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentIndex: *otherCnpgDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-before-upgrade
      - documentIndex: *otherCnpgDoc
        equal:
          path: spec
          value:
            cluster:
              name: test-release-name-common-test-cnpg-main
            method: plugin
            pluginConfiguration:
              name: barman-cloud.cloudnative-pg.io

  - it: should use the plugin method
    capabilities:
      apiVersions:
        - barmancloud.cnpg.io/v1/ObjectStore
    set:
      credentials:
        test:
          type: s3
          url: http://some-url
          bucket: some-bucket
          encrKey: some-encr-key
          accessKey: some-access-key
          secretKey: some-secret-key
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
              manualBackups:
                - name: today
    asserts:
      - documentSelector:
          path: kind
          value: Backup
        equal:
          path: spec
          value:
            cluster:
              name: test-release-name-common-test-cnpg-main
            method: plugin
            pluginConfiguration:
              name: barman-cloud.cloudnative-pg.io

