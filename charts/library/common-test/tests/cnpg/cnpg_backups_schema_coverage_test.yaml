suite: cnpg backups schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render backups with jobs and servername
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      credentials:
        test:
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          encrKey: some-encr-key
          url: http://some-url
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            retentionPolicy: 10d
            jobs: 2
            servername: my-server
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should render scheduledBackups with backupOwnerReference none
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      credentials:
        test:
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          encrKey: some-encr-key
          url: http://some-url
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            retentionPolicy: 10d
            scheduledBackups:
              - name: nightly
                schedule: "0 0 0 * * *"
                backupOwnerReference: none
                immediate: true
                suspend: false
                labels:
                  my-label: my-value
                annotations:
                  my-ann: my-value
    asserts:
      - documentSelector:
          path: kind
          value: ScheduledBackup
        equal:
          path: spec.backupOwnerReference
          value: none

  - it: should render backup target empty
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      credentials:
        test:
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          encrKey: some-encr-key
          url: http://some-url
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            retentionPolicy: 10d
            target: ""
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should render backup target prefer-standby
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      credentials:
        test:
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          encrKey: some-encr-key
          url: http://some-url
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            retentionPolicy: 10d
            target: prefer-standby
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should accept compression and encryption
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      credentials:
        test:
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          encrKey: some-encr-key
          url: http://some-url
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            retentionPolicy: 10d
            compression:
              enabled: false
            encryption:
              enabled: true
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should fail with an unknown key in backups compression
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            compression:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/backups/compression': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in backups encryption
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            encryption:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/backups/encryption': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in a manual backup
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            manualBackups:
              - name: today
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/backups/manualBackups/0': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in a scheduled backup
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            scheduledBackups:
              - name: nightly
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/backups/scheduledBackups/0': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in backups
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/backups': additional properties 'unknownKey' not allowed"
