suite: cnpg db-wait test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should generate correct db-wait script
    set:
      workload: &workload
        my-workload:
          type: Deployment
          enabled: true
          primary: true
          podSpec:
            containers:
              my-container:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
    asserts:
      - documentIndex: &deployDoc 3
        isKind:
          of: Deployment
      - documentIndex: *deployDoc
        isAPIVersion:
          of: apps/v1
      - documentIndex: *deployDoc
        equal:
          path: spec.template.spec.initContainers[0].name
          value: test-release-name-common-test-system-postgresql-wait
      - documentIndex: *deployDoc
        equal:
          path: spec.template.spec.initContainers[0].command
          value:
            - /bin/sh
            - -c
            - |-
              /bin/sh <<'EOF'
              echo "Executing DB waits..."
              echo "Testing Database availability on [CNPG RW]"
              until
                echo "Testing database on host: [${PGWAIT_HOST_0}]"
                pg_isready -U "$PGUSER" -d "$PGDATABASE" -h "$PGWAIT_HOST_0"
                do sleep 5
              done
              echo "Database available on host: [${PGWAIT_HOST_0}]"
              echo "Done executing DB waits..."
              EOF

  - it: should generate correct db-wait script with pooler, only rw
    set:
      workload: *workload
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
              createRO: false
    asserts:
      - documentIndex: &deployDoc 4
        isKind:
          of: Deployment
      - documentIndex: *deployDoc
        isAPIVersion:
          of: apps/v1
      - documentIndex: *deployDoc
        equal:
          path: spec.template.spec.initContainers[0].name
          value: test-release-name-common-test-system-postgresql-wait
      - documentIndex: *deployDoc
        equal:
          path: spec.template.spec.initContainers[0].command
          value:
            - /bin/sh
            - -c
            - |-
              /bin/sh <<'EOF'
              echo "Executing DB waits..."
              echo "Testing Database availability on [CNPG RW]"
              until
                echo "Testing database on host: [${PGWAIT_HOST_0}]"
                pg_isready -U "$PGUSER" -d "$PGDATABASE" -h "$PGWAIT_HOST_0"
                do sleep 5
              done
              echo "Database available on host: [${PGWAIT_HOST_0}]"
              echo "Testing Database availability on [CNPG Pooler RW]"
              until
                echo "Testing database on host: [${PGWAIT_HOST_1}]"
                pg_isready -U "$PGUSER" -d "$PGDATABASE" -h "$PGWAIT_HOST_1"
                do sleep 5
              done
              echo "Database available on host: [${PGWAIT_HOST_1}]"
              echo "Done executing DB waits..."
              EOF

  - it: should generate correct db-wait script with pooler rw and ro
    set:
      workload: *workload
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
              createRO: true
    asserts:
      - documentIndex: &deployDoc 5
        isKind:
          of: Deployment
      - documentIndex: *deployDoc
        isAPIVersion:
          of: apps/v1
      - documentIndex: *deployDoc
        equal:
          path: spec.template.spec.initContainers[0].name
          value: test-release-name-common-test-system-postgresql-wait
      - documentIndex: *deployDoc
        equal:
          path: spec.template.spec.initContainers[0].command
          value:
            - /bin/sh
            - -c
            - |-
              /bin/sh <<'EOF'
              echo "Executing DB waits..."
              echo "Testing Database availability on [CNPG RW]"
              until
                echo "Testing database on host: [${PGWAIT_HOST_0}]"
                pg_isready -U "$PGUSER" -d "$PGDATABASE" -h "$PGWAIT_HOST_0"
                do sleep 5
              done
              echo "Database available on host: [${PGWAIT_HOST_0}]"
              echo "Testing Database availability on [CNPG Pooler RW]"
              until
                echo "Testing database on host: [${PGWAIT_HOST_1}]"
                pg_isready -U "$PGUSER" -d "$PGDATABASE" -h "$PGWAIT_HOST_1"
                do sleep 5
              done
              echo "Database available on host: [${PGWAIT_HOST_1}]"
              echo "Testing Database availability on [CNPG Pooler RO]"
              until
                echo "Testing database on host: [${PGWAIT_HOST_2}]"
                pg_isready -U "$PGUSER" -d "$PGDATABASE" -h "$PGWAIT_HOST_2"
                do sleep 5
              done
              echo "Database available on host: [${PGWAIT_HOST_2}]"
              echo "Done executing DB waits..."
              EOF
