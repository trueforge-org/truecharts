suite: cnpg backup provider secret spec test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - barmancloud.cnpg.io/v1/ObjectStore
tests:
  - it: should create secret for s3 provider
    set:
      credentials:
        test:
          type: s3
          url: http://some-url
          encrKey: some-encr-key
          bucket: some-bucket
          secretKey: some-secret-key
          accessKey: some-access-key
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              target: primary
              retentionPolicy: 10d
              credentials: test
              destinationPath: some-path
              manualBackups:
                - name: today
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        isKind:
          of: Secret
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        isAPIVersion:
          of: v1
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        equal:
          path: stringData
          value:
            ACCESS_SECRET_KEY: some-secret-key
            ACCESS_KEY_ID: some-access-key

  - it: should create secret for s3 provider with overridden region
    set:
      credentials:
        test:
          type: s3
          url: http://some-url
          region: some-region
          encrKey: some-encr-key
          bucket: some-bucket
          secretKey: some-secret-key
          accessKey: some-access-key
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              target: primary
              retentionPolicy: 10d
              credentials: test
              destinationPath: some-path
              manualBackups:
                - name: today
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        isKind:
          of: Secret
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        isAPIVersion:
          of: v1
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        equal:
          path: stringData
          value:
            REGION: some-region
            ACCESS_SECRET_KEY: some-secret-key
            ACCESS_KEY_ID: some-access-key

  - it: should create secrets for s3 provider with customCA
    set:
      credentials:
        test:
          type: s3
          url: http://some-url
          encrKey: some-encr-key
          bucket: some-bucket
          secretKey: some-secret-key
          accessKey: some-access-key
          customCA: |-
            -----BEGIN CERTIFICATE-----
            ...
            -----END CERTIFICATE-----
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              target: primary
              retentionPolicy: 10d
              credentials: test
              destinationPath: some-path
              manualBackups:
                - name: today
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        isKind:
          of: Secret
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        isAPIVersion:
          of: v1
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-creds
        equal:
          path: stringData
          value:
            ACCESS_SECRET_KEY: some-secret-key
            ACCESS_KEY_ID: some-access-key
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-ca
        isKind:
          of: Secret
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-ca
        isAPIVersion:
          of: v1
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-ca
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-ca
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-provider-backup-s3-ca
        equal:
          path: stringData
          value:
            ca.crt: |-
              -----BEGIN CERTIFICATE-----
              ...
              -----END CERTIFICATE-----
