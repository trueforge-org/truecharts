suite: cnpg cluster validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail without user
    set:
      cnpg:
        my-pg:
          enabled: true
          database: test-db
          password: test-password
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected a non-empty [user] key

  - it: should fail without database
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          password: test-password
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected a non-empty [database] key

  - it: should fail without password
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected a non-empty [password] key

  - it: should fail with invalid pgVersion
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          pgVersion: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected [pgVersion] to be one of [15, 16, 17, 18], but got [invalid]

  - it: should fail with vectors on pgVersion 18
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          type: vectors
          pgVersion: 18
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - type [vectors] is not available for pgVersion [18]; pgvecto.rs has been superseded by VectorChord, use type [vectorchord] instead

  - it: should fail with hibernate not a bool
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          hibernate: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected [hibernate] to be a boolean, but got [string]

  - it: should fail with invalid mode
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [mode] to be one of [standalone, replica, recovery], but got [invalid]

  - it: should fail with invalid type
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          type: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [type] to be one of [postgres, postgis, timescaledb, vectors, vectorchord], but got [invalid]

  - it: should fail with invalid log level
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            logLevel: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.logLevel] to be one of [error, warning, info, debug, trace], but got [invalid]

  - it: should fail with invalid primaryUpdateStrategy
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            primaryUpdateStrategy: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.primaryUpdateStrategy] to be one of [supervised, unsupervised], but got [invalid]

  - it: should fail with invalid primaryUpdateMethod
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            primaryUpdateMethod: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.primaryUpdateMethod] to be one of [switchover, restart], but got [invalid]

  - it: should fail with invalid walSegmentSize
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            initdb:
              walSegmentSize: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.initdb.walSegmentSize] to be an integer, but got [string]

  - it: should fail with too large walSegmentSize
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            initdb:
              walSegmentSize: 1025
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.initdb.walSegmentSize] to be between 1 and 1024, but got [1025]

  - it: should fail without recovery object when mode is recovery
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected a non-empty [recovery] key

  - it: should fail with revision in recovery not a string
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: backup
            backupName: some-backup-name
            revision: 5
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected [recovery.revision] to be a string, got [float64]

  - it: should fail with invalid recovery method
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected [recovery.method] to be one of [backup, object_store], but got [invalid]

  - it: should fail without backupName on recovery method backup
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: backup
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected a non-empty [recovery.backupName] key

  - it: should fail with revision in backups not a string
    set:
      credentials:
        test: &test
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          url: http://some-url
          encrKey: some-encr-key
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            revision: 5
            target: primary
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected [backups.revision] to be a string, got [float64]

  - it: should fail with invalid target when backups are enabled
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            target: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected [backups.target] to be one of [primary, prefer-standby], but got [invalid]

  - it: should fail with invalid retentionPolicy when backups are enabled
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            target: primary
            retentionPolicy: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected [backups.retentionPolicy] to match regex [^[1-9][0-9]*[dwm]$], got [invalid]

  - it: should fail with instances less than 1
    set:
      cnpg:
        my-pg:
          enabled: true
          instances: 0
          user: test-user
          database: test-db
          password: test-password
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected [instances] to be greater than 0, but got [0]

  - it: should fail with invalid retentionPolicy without a target
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            retentionPolicy: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected [backups.retentionPolicy] to match regex [^[1-9][0-9]*[dwm]$], got [invalid]

  - it: should not fail without a retentionPolicy
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
    asserts:
      - notFailedTemplate: {}

  - it: should fail with recovery and backup on the same archive without a target
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: object_store
            credentials: test
          backups:
            enabled: true
            credentials: test
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup/Recovery - [backups.revision] cannot match [recovery.revision] when in recovery mode and backup is enabled, for CNPG cluster [test-release-name-common-test-cnpg-my-pg]

  - it: should fail with recovery and backup on the same archive with the same serverName and revision
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: object_store
            credentials: test
            serverName: some-server-name
            revision: "1"
          backups:
            enabled: true
            credentials: test
            target: primary
            serverName: some-server-name
            revision: "1"
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup/Recovery - [backups.serverName] and [backups.revision] cannot match [recovery.serverName] and [recovery.revision] when in recovery mode and backup is enabled, for CNPG cluster [test-release-name-common-test-cnpg-my-pg]

  - it: should not fail with recovery and backup using a different revision
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: object_store
            credentials: test
          backups:
            enabled: true
            credentials: test
            revision: "1"
    asserts:
      - notFailedTemplate: {}

  - it: should not fail with recovery and backup using the same serverName on a different bucket
    set:
      credentials:
        test: *test
        other:
          <<: *test
          bucket: other-bucket
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: object_store
            credentials: test
          backups:
            enabled: true
            credentials: other
    asserts:
      - notFailedTemplate: {}

  - it: should not fail with recovery and backup using the same serverName and bucket on a different endpoint
    set:
      credentials:
        test: *test
        other:
          <<: *test
          url: http://some-other-url
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: object_store
            credentials: test
          backups:
            enabled: true
            credentials: other
    asserts:
      - notFailedTemplate: {}

  - it: should not fail with backup enabled when recovering from a backup object
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: backup
            backupName: some-backup-name
          backups:
            enabled: true
            credentials: test
    asserts:
      - notFailedTemplate: {}

  - it: should fail with servername in recovery
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: backup
            backupName: some-backup-name
            servername: some-server-name
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - [recovery.servername] is not supported, use [recovery.serverName] instead. Note that the previous value was never applied

  - it: should fail with servername in backups
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            servername: some-server-name
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - [backups.servername] is not supported, use [backups.serverName] instead. Note that the previous value was never applied

  - it: should fail with invalid barmanMode
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          barmanMode: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected [barmanMode] to be one of [inTree, plugin], but got [invalid]

  - it: should fail with backups in plugin mode when the plugin is not installed
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          barmanMode: plugin
          backups:
            enabled: true
            credentials: test
    asserts:
      - failedTemplate:
          errorMessage: CNPG - [barmanMode] is set to [plugin], but API [barmancloud.cnpg.io/v1/ObjectStore] was not found. Install the Barman Cloud plugin in the namespace of the CloudNativePG operator, or set [barmanMode] to [inTree], for CNPG cluster [test-release-name-common-test-cnpg-my-pg]. When rendering without access to a cluster, pass it with [--api-versions]

  - it: should fail with object store recovery in plugin mode when the plugin is not installed
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          barmanMode: plugin
          mode: recovery
          recovery:
            method: object_store
            credentials: test
    asserts:
      - failedTemplate:
          errorMessage: CNPG - [barmanMode] is set to [plugin], but API [barmancloud.cnpg.io/v1/ObjectStore] was not found. Install the Barman Cloud plugin in the namespace of the CloudNativePG operator, or set [barmanMode] to [inTree], for CNPG cluster [test-release-name-common-test-cnpg-my-pg]. When rendering without access to a cluster, pass it with [--api-versions]

  - it: should fail when fallbackDefaults selects plugin mode and the plugin is not installed
    set:
      global:
        fallbackDefaults:
          cnpg:
            barmanMode: plugin
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
    asserts:
      - failedTemplate:
          errorMessage: CNPG - [barmanMode] is set to [plugin], but API [barmancloud.cnpg.io/v1/ObjectStore] was not found. Install the Barman Cloud plugin in the namespace of the CloudNativePG operator, or set [barmanMode] to [inTree], for CNPG cluster [test-release-name-common-test-cnpg-my-pg]. When rendering without access to a cluster, pass it with [--api-versions]

  - it: should not fail in plugin mode when the plugin is installed
    capabilities:
      apiVersions:
        - barmancloud.cnpg.io/v1/ObjectStore
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          barmanMode: plugin
          backups:
            enabled: true
            credentials: test
    asserts:
      - notFailedTemplate: {}

  - it: should not need the plugin in plugin mode without backups or recovery
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          barmanMode: plugin
    asserts:
      - notFailedTemplate: {}

  - it: should not need the plugin in inTree mode with backups
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          barmanMode: inTree
          backups:
            enabled: true
            credentials: test
    asserts:
      - notFailedTemplate: {}

  - it: should fail with recovery from a backup object in plugin mode
    capabilities:
      apiVersions:
        - barmancloud.cnpg.io/v1/ObjectStore
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          barmanMode: plugin
          mode: recovery
          recovery:
            method: backup
            backupName: some-backup-name
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - [recovery.method] cannot be [backup] when [barmanMode] is [plugin], use [object_store] instead, for CNPG cluster [test-release-name-common-test-cnpg-my-pg]

  - it: should fail in plugin mode with recovery and backup on the same archive
    capabilities:
      apiVersions:
        - barmancloud.cnpg.io/v1/ObjectStore
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          barmanMode: plugin
          mode: recovery
          recovery:
            method: object_store
            credentials: test
          backups:
            enabled: true
            credentials: test
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup/Recovery - [backups.revision] cannot match [recovery.revision] when in recovery mode and backup is enabled, for CNPG cluster [test-release-name-common-test-cnpg-my-pg]
