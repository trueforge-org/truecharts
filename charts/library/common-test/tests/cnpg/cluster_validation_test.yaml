suite: cnpg cluster validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail without user
    set:
      cnpg:
        my-pg:
          enabled: true
          database: test-db
          password: test-password
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected a non-empty [user] key

  - it: should fail without database
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          password: test-password
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected a non-empty [database] key

  - it: should fail without password
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected a non-empty [password] key

  - it: should fail with invalid pgVersion
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          pgVersion: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/pgVersion': value must be one of"

  - it: should fail with hibernate not a bool
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          hibernate: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/hibernate': got string, want boolean"

  - it: should fail with invalid mode
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/mode': value must be one of"

  - it: should fail with invalid type
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          type: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/type': value must be one of"

  - it: should fail with invalid log level
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            logLevel: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/logLevel': value must be one of"

  - it: should fail with invalid primaryUpdateStrategy
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            primaryUpdateStrategy: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/primaryUpdateStrategy': value must be one of"

  - it: should fail with invalid primaryUpdateMethod
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            primaryUpdateMethod: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/primaryUpdateMethod': value must be one of"

  - it: should fail with invalid walSegmentSize
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            initdb:
              walSegmentSize: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/initdb/walSegmentSize': got string, want integer"

  - it: should fail with too large walSegmentSize
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            initdb:
              walSegmentSize: 1025
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/initdb/walSegmentSize': maximum: got"

  - it: should fail without recovery object when mode is recovery
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected a non-empty [recovery] key

  - it: should fail with revision in recovery not a string
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: backup
            backupName: some-backup-name
            revision: 5
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/recovery/revision': got number, want string"

  - it: should fail with invalid recovery method
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/recovery/method': value must be one of"

  - it: should fail without backupName on recovery method backup
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: backup
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected a non-empty [recovery.backupName] key

  - it: should fail with revision in backups not a string
    set:
      credentials:
        test: &test
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          url: http://some-url
          encrKey: some-encr-key
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            revision: 5
            target: primary
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/backups/revision': got number, want string"

  - it: should fail with invalid target when backups are enabled
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            target: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/backups/target': value must be one of"

  - it: should fail with invalid retentionPolicy when backups are enabled
    set:
      credentials:
        test: *test
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            credentials: test
            target: primary
            retentionPolicy: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/backups/retentionPolicy': .* does not match pattern"

  - it: should fail with instances less than 1
    set:
      cnpg:
        my-pg:
          enabled: true
          instances: 0
          user: test-user
          database: test-db
          password: test-password
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/instances': minimum: got"
