suite: cnpg cluster validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - barmancloud.cnpg.io/v1/ObjectStore
tests:
  - it: should fail without user
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: ""
            postgresqlDatabase: test-db
            password: test-password
    asserts:
      - failedTemplate:
          errorMessage: Dependencies - Expected [dependencies.postgresql.depconfig.postgresqlUsername] to not be empty

  - it: should fail without database
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: ""
            password: test-password
    asserts:
      - failedTemplate:
          errorMessage: Dependencies - Expected [dependencies.postgresql.depconfig.postgresqlDatabase] to not be empty

  - it: should fail with invalid pgVersion
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pgVersion: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected [pgVersion] to be one of [15, 16, 17, 18], but got [invalid]

  - it: should fail with vectors on pgVersion 18
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            type: vectors
            pgVersion: 18
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - type [vectors] is not available for pgVersion [18]; pgvecto.rs has been superseded by VectorChord, use type [vectorchord] instead

  - it: should fail with hibernate not a bool
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            hibernate: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected [hibernate] to be a boolean, but got [string]

  - it: should fail with invalid mode
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [mode] to be one of [standalone, replica, recovery], but got [invalid]

  - it: should fail with invalid type
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            type: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [type] to be one of [postgres, postgis, timescaledb, vectors, vectorchord], but got [invalid]

  - it: should fail with invalid log level
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            cluster:
              logLevel: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.logLevel] to be one of [error, warning, info, debug, trace], but got [invalid]

  - it: should fail with invalid primaryUpdateStrategy
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            cluster:
              primaryUpdateStrategy: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.primaryUpdateStrategy] to be one of [supervised, unsupervised], but got [invalid]

  - it: should fail with invalid primaryUpdateMethod
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            cluster:
              primaryUpdateMethod: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.primaryUpdateMethod] to be one of [switchover, restart], but got [invalid]

  - it: should fail with invalid walSegmentSize
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            cluster:
              initdb:
                walSegmentSize: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.initdb.walSegmentSize] to be an integer, but got [string]

  - it: should fail with too large walSegmentSize
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            cluster:
              initdb:
                walSegmentSize: 1025
    asserts:
      - failedTemplate:
          errorMessage: CNPG Cluster - Expected [cluster.initdb.walSegmentSize] to be between 1 and 1024, but got [1025]

  - it: should fail without recovery object when mode is recovery
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery: null
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected a non-empty [recovery] key

  - it: should fail with revision in recovery not a string
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: object_store
              revision: 5
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected [recovery.revision] to be a string, got [float64]

  - it: should fail with invalid recovery method
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected [recovery.method] to be one of [object_store], but got [invalid]

  - it: should fail with revision in backups not a string
    set:
      credentials:
        test: &test
          type: s3
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          url: http://some-url
          encrKey: some-encr-key
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
              revision: 5
              target: primary
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected [backups.revision] to be a string, got [float64]

  - it: should fail with invalid target when backups are enabled
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
              target: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected [backups.target] to be one of [primary, prefer-standby], but got [invalid]

  - it: should fail with invalid retentionPolicy when backups are enabled
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
              target: primary
              retentionPolicy: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected [backups.retentionPolicy] to match regex [^[1-9][0-9]*[dwm]$], got [invalid]

  - it: should fail with instances less than 1
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            instances: 0
    asserts:
      - failedTemplate:
          errorMessage: CNPG - Expected [instances] to be greater than 0, but got [0]

  - it: should fail with invalid retentionPolicy without a target
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
              retentionPolicy: invalid
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected [backups.retentionPolicy] to match regex [^[1-9][0-9]*[dwm]$], got [invalid]

  - it: should not fail without a retentionPolicy
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
    asserts:
      - notFailedTemplate: {}

  - it: should fail with recovery and backup on the same archive without a target
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            cluster:
              skipEmptyWalArchiveCheck: false
            mode: recovery
            recovery:
              method: object_store
              credentials: test
            backups:
              enabled: true
              credentials: test
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup/Recovery - [backups.revision] cannot match [recovery.revision] when in recovery mode and backup is enabled, for CNPG cluster [test-release-name-common-test-cnpg-main]

  - it: should fail with recovery and backup on the same archive with the same serverName and revision
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            cluster:
              skipEmptyWalArchiveCheck: false
            mode: recovery
            recovery:
              method: object_store
              credentials: test
              serverName: some-server-name
              revision: "1"
            backups:
              enabled: true
              credentials: test
              target: primary
              serverName: some-server-name
              revision: "1"
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup/Recovery - [backups.serverName] and [backups.revision] cannot match [recovery.serverName] and [recovery.revision] when in recovery mode and backup is enabled, for CNPG cluster [test-release-name-common-test-cnpg-main]

  - it: should not fail with recovery and backup using a different revision
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: object_store
              credentials: test
            backups:
              enabled: true
              credentials: test
              revision: "1"
    asserts:
      - notFailedTemplate: {}

  - it: should not fail with recovery and backup using the same serverName on a different bucket
    set:
      credentials:
        test: *test
        other:
          <<: *test
          bucket: other-bucket
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: object_store
              credentials: test
            backups:
              enabled: true
              credentials: other
    asserts:
      - notFailedTemplate: {}

  - it: should not fail with recovery and backup using the same serverName and bucket on a different endpoint
    set:
      credentials:
        test: *test
        other:
          <<: *test
          url: http://some-other-url
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: object_store
              credentials: test
            backups:
              enabled: true
              credentials: other
    asserts:
      - notFailedTemplate: {}

  - it: should fail with servername in recovery
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: object_store
              servername: some-server-name
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - [recovery.servername] is not supported, use [recovery.serverName] instead. Note that the previous value was never applied

  - it: should fail with servername in backups
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
              servername: some-server-name
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - [backups.servername] is not supported, use [backups.serverName] instead. Note that the previous value was never applied

  - it: should not fail when the plugin is installed
    capabilities:
      apiVersions:
        - barmancloud.cnpg.io/v1/ObjectStore
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
    asserts:
      - notFailedTemplate: {}

  - it: should not need the plugin without backups or recovery
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
    asserts:
      - notFailedTemplate: {}

  - it: should fail with recovery and backup on the same archive
    capabilities:
      apiVersions:
        - barmancloud.cnpg.io/v1/ObjectStore
    set:
      credentials:
        test: *test
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            cluster:
              skipEmptyWalArchiveCheck: false
            mode: recovery
            recovery:
              method: object_store
              credentials: test
            backups:
              enabled: true
              credentials: test
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup/Recovery - [backups.revision] cannot match [recovery.revision] when in recovery mode and backup is enabled, for CNPG cluster [test-release-name-common-test-cnpg-main]

  - it: should fail with the removed recovery method backup
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: backup
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery - Expected [recovery.method] to be one of [object_store], but got [backup]

  - it: should not fail with recovery and backup on the same archive when the empty archive check is skipped
    set:
      credentials:
        test:
          type: s3
          encrKey: some-encr-key
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          url: http://some-url
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: object_store
              credentials: test
            backups:
              enabled: true
              credentials: test
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: metadata.annotations["cnpg.io/skipEmptyWalArchiveCheck"]
          value: enabled
