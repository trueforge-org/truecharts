suite: cnpg cluster primary update schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render primaryUpdateMethod switchover and primaryUpdateStrategy unsupervised
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            primaryUpdateMethod: switchover
            primaryUpdateStrategy: unsupervised
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.primaryUpdateMethod
          value: switchover
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.primaryUpdateStrategy
          value: unsupervised

  - it: should render primaryUpdateMethod restart and primaryUpdateStrategy supervised
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            primaryUpdateMethod: restart
            primaryUpdateStrategy: supervised
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.primaryUpdateMethod
          value: restart
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.primaryUpdateStrategy
          value: supervised
