suite: cnpg credentials test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - barmancloud.cnpg.io/v1/ObjectStore
tests:
  - it: should generate the bootstrap secret and the shared credentials secret
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
    asserts:
      - documentSelector: &userSecret
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-user
        isKind:
          of: Secret
      - documentSelector: *userSecret
        isAPIVersion:
          of: v1
      - documentSelector: *userSecret
        equal:
          path: type
          value: kubernetes.io/basic-auth
      - documentSelector: *userSecret
        equal:
          path: stringData.username
          value: test-user
      - documentSelector: *userSecret
        equal:
          path: stringData.password
          value: test-password
      - documentSelector: &credsSecret
          path: metadata.name
          value: test-release-name-postgresqlcreds
        isKind:
          of: Secret
      - documentSelector: *credsSecret
        isSubset:
          path: stringData
          content:
            postgresql-password: test-password
            plainhost: test-release-name-common-test-cnpg-main-rw
            plainporthost: test-release-name-common-test-cnpg-main-rw:5432
            jdbc: jdbc:postgresql://test-release-name-common-test-cnpg-main-rw:5432/test-db
            url: postgresql://test-user:test-password@test-release-name-common-test-cnpg-main-rw:5432/test-db
            urlnossl: postgresql://test-user:test-password@test-release-name-common-test-cnpg-main-rw:5432/test-db?sslmode=disable
      - documentSelector: *credsSecret
        notExists:
          path: stringData.urlRO

  - it: should generate correct secret with pooler, only rw
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
              createRO: false
    asserts:
      - documentSelector: &credsSecret2
          path: metadata.name
          value: test-release-name-postgresqlcreds
        isKind:
          of: Secret
      - documentSelector: *credsSecret2
        isSubset:
          path: stringData
          content:
            postgresql-password: test-password
            plainhost: test-release-name-common-test-cnpg-main-pooler-rw
            plainporthost: test-release-name-common-test-cnpg-main-pooler-rw:5432
            jdbc: jdbc:postgresql://test-release-name-common-test-cnpg-main-pooler-rw:5432/test-db
            url: postgresql://test-user:test-password@test-release-name-common-test-cnpg-main-pooler-rw:5432/test-db
            urlnossl: postgresql://test-user:test-password@test-release-name-common-test-cnpg-main-pooler-rw:5432/test-db?sslmode=disable
      - documentSelector: *credsSecret2
        notExists:
          path: stringData.urlRO

  - it: should generate correct secret with pooler rw and ro
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
              createRO: true
    asserts:
      - documentSelector: &credsSecret3
          path: metadata.name
          value: test-release-name-postgresqlcreds
        isKind:
          of: Secret
      - documentSelector: *credsSecret3
        isSubset:
          path: stringData
          content:
            postgresql-password: test-password
            plainhost: test-release-name-common-test-cnpg-main-pooler-rw
            plainporthost: test-release-name-common-test-cnpg-main-pooler-rw:5432
            jdbc: jdbc:postgresql://test-release-name-common-test-cnpg-main-pooler-rw:5432/test-db
            url: postgresql://test-user:test-password@test-release-name-common-test-cnpg-main-pooler-rw:5432/test-db
            urlnossl: postgresql://test-user:test-password@test-release-name-common-test-cnpg-main-pooler-rw:5432/test-db?sslmode=disable
            plainhostRO: test-release-name-common-test-cnpg-main-pooler-ro
            plainporthostRO: test-release-name-common-test-cnpg-main-pooler-ro:5432
            jdbcRO: jdbc:postgresql://test-release-name-common-test-cnpg-main-pooler-ro:5432/test-db
            urlRO: postgresql://test-user:test-password@test-release-name-common-test-cnpg-main-pooler-ro:5432/test-db
            urlnosslRO: postgresql://test-user:test-password@test-release-name-common-test-cnpg-main-pooler-ro:5432/test-db?sslmode=disable

  - it: should use the placeholder password when not set
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-user
        equal:
          path: stringData.password
          value: PLACEHOLDERPASSWORD
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        equal:
          path: stringData.postgresql-password
          value: PLACEHOLDERPASSWORD

  # Failures
  - it: should fail with no credentials on recovery
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: recovery
            recovery:
              method: object_store
    asserts:
      - failedTemplate:
          errorMessage: CNPG Recovery Provider Secret Spawner - Expected [recovery.credentials] to be defined on [recovery] mode
  - it: should fail with no credentials on backup
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            mode: backup
            backups:
              enabled: true
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup Provider Secret Spawner - Expected [backups.credentials] to be defined on [backup] mode

  - it: should report the caller when a credential field is missing
    set:
      credentials:
        test:
          type: s3
          url: http://some-url
          bucket: some-bucket
          encrKey: some-encr-key
          accessKey: some-access-key
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              credentials: test
    asserts:
      - failedTemplate:
          errorMessage: CNPG Backup - Expected non-empty [secretKey] in [credentials.test]
