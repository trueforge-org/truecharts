suite: cnpg pooler schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render pooler with poolMode session
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          pooler:
            enabled: true
            poolMode: session
    asserts:
      - documentSelector:
          path: kind
          value: Pooler
        equal:
          path: spec.pgbouncer.poolMode
          value: session

  - it: should fail with an unknown key in pooler
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          pooler:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/pooler': additional properties 'unknownKey' not allowed"
