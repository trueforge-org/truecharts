suite: cnpg cluster core schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render logLevel error
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            logLevel: error
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.logLevel
          value: error

  - it: should render logLevel warning
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            logLevel: warning
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.logLevel
          value: warning

  - it: should render logLevel info
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            logLevel: info
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.logLevel
          value: info

  - it: should render logLevel trace
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            logLevel: trace
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.logLevel
          value: trace

  - it: should accept singleNode and skipEmptyWalArchiveCheck
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            singleNode: true
            skipEmptyWalArchiveCheck: true
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: metadata.annotations["cnpg.io/skipEmptyWalArchiveCheck"]
          value: enabled

  - it: should fail with an unknown key in cluster
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in nodeMaintenanceWindow
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          cluster:
            nodeMaintenanceWindow:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/cluster/nodeMaintenanceWindow': additional properties 'unknownKey' not allowed"
