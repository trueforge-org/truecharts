suite: cnpg recovery schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should accept recovery with every key
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          mode: recovery
          recovery:
            method: pg_basebackup
            serverName: my-server
            clusterName: my-cluster
            servername: my-servername
            pitrTarget:
              time: "2024-01-01T00:00:00Z"
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should fail with an unknown key in recovery
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          recovery:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/recovery': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in pitrTarget
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          recovery:
            pitrTarget:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/recovery/pitrTarget': additional properties 'unknownKey' not allowed"
