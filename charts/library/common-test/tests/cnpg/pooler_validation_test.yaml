suite: cnpg pooler validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with invalid poolMode
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          pooler:
            enabled: true
            poolMode: invalid
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/pooler/poolMode': value must be one of"

  - it: should fail with pooler instances less than 1
    set:
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          pooler:
            enabled: true
            instances: 0
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/pooler/instances': minimum: got"
