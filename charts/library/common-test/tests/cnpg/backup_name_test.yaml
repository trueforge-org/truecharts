suite: cnpg backup name test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - barmancloud.cnpg.io/v1/ObjectStore
tests:
  - it: should generate correct name
    set:
      credentials:
        test:
          type: s3
          encrKey: some-encr-key
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          url: http://some-url
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            target: primary
            retentionPolicy: 10d
            credentials: test
            destinationPath: some-path
            manualBackups:
              - name: today
        my-pg2:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          backups:
            enabled: true
            target: primary
            retentionPolicy: 10d
            credentials: test
            destinationPath: some-path
            manualBackups:
              - name: other
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-my-pg-backup-today
        isKind:
          of: Backup
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-my-pg-backup-today
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-my-pg-backup-today
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-my-pg-backup-today
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-my-pg2-backup-other
        isKind:
          of: Backup
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-my-pg2-backup-other
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-my-pg2-backup-other
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-my-pg2-backup-other
