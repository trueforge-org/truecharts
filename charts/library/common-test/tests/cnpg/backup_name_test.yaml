suite: cnpg backup name test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - barmancloud.cnpg.io/v1/ObjectStore
tests:
  - it: should generate correct name
    set:
      credentials:
        test:
          type: s3
          encrKey: some-encr-key
          accessKey: some-access-key
          secretKey: some-secret-key
          bucket: some-bucket
          url: http://some-url
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            backups:
              enabled: true
              target: primary
              retentionPolicy: 10d
              credentials: test
              destinationPath: some-path
              manualBackups:
                - name: today
                - name: other
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-today
        isKind:
          of: Backup
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-today
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-today
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-today
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-other
        isKind:
          of: Backup
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-other
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-other
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-backup-other
