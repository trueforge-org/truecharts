suite: cnpg pooler spec test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should generate correct spec
    set:
      param: someValue
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
              createRO: true
              poolMode: transaction
              instances: 1
              parameters:
                some: value
                someOther: "{{ .Values.param }}"
    asserts:
      - documentIndex: &poolerDoc 0
        isKind:
          of: Pooler
      - documentIndex: *poolerDoc
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentIndex: *poolerDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-pooler-rw
      - documentIndex: *poolerDoc
        equal:
          path: spec
          value:
            cluster:
              name: test-release-name-common-test-cnpg-main
            instances: 1
            type: rw
            pgbouncer:
              poolMode: transaction
              parameters:
                some: value
                someOther: someValue
      - documentIndex: &otherpoolerDoc 1
        isKind:
          of: Pooler
      - documentIndex: *otherpoolerDoc
        isAPIVersion:
          of: postgresql.cnpg.io/v1
      - documentIndex: *otherpoolerDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-pooler-ro
      - documentIndex: *otherpoolerDoc
        equal:
          path: spec
          value:
            cluster:
              name: test-release-name-common-test-cnpg-main
            instances: 1
            type: ro
            pgbouncer:
              poolMode: transaction
              parameters:
                some: value
                someOther: someValue
  - it: should generate correct spec with default pooler settings
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: test-user
            postgresqlDatabase: test-db
            password: test-password
          operator:
            pooler:
              enabled: true
    asserts:
      - documentIndex: &defaultPoolerDoc 0
        isKind:
          of: Pooler
      - documentIndex: *defaultPoolerDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-pooler-rw
      - documentIndex: *defaultPoolerDoc
        equal:
          path: spec
          value:
            cluster:
              name: test-release-name-common-test-cnpg-main
            instances: 2
            type: rw
            pgbouncer:
              poolMode: session
