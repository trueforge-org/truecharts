suite: cnpg root schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render pgVersion as a string 15
    set:
      postgres15Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "15.6"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          pgVersion: "15"
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.imageName
          value: ghcr.io/cloudnative-pg/postgresql:15.6

  - it: should render pgVersion as a string 16
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          pgVersion: "16"
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.imageName
          value: ghcr.io/cloudnative-pg/postgresql:16.3

  - it: should use global fallbackDefaults pgVersion as a string 15
    set:
      postgres15Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "15.6"
        pullPolicy: IfNotPresent
      global:
        fallbackDefaults:
          cnpg:
            pgVersion: "15"
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.imageName
          value: ghcr.io/cloudnative-pg/postgresql:15.6

  - it: should use global fallbackDefaults pgVersion as a string 16
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      global:
        fallbackDefaults:
          cnpg:
            pgVersion: "16"
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.imageName
          value: ghcr.io/cloudnative-pg/postgresql:16.3

  - it: should accept enabled as a string, primary false and upgradeMajor
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: "true"
          primary: false
          upgradeMajor: false
          user: test-user
          database: test-db
          password: test-password
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should render type postgres and mode standalone
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          type: postgres
          mode: standalone
          user: test-user
          database: test-db
          password: test-password
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should accept mode replica
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          mode: replica
          user: test-user
          database: test-db
          password: test-password
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should accept creds with every key
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          creds:
            password: my-password
            std: my-std
            nossl: my-nossl
            porthost: my-porthost
            host: my-host
            jdbc: my-jdbc
            stdRO: my-std-ro
            nosslRO: my-nossl-ro
            porthostRO: my-porthost-ro
            hostRO: my-host-ro
            jdbcRO: my-jdbc-ro
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        isKind:
          of: Cluster

  - it: should fail with an empty user
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: ""
          database: test-db
          password: test-password
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/user': minLength: got 0, want 1"

  - it: should fail with an empty database
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: ""
          password: test-password
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/database': minLength: got 0, want 1"

  - it: should fail with an empty password
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: ""
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/password': minLength: got 0, want 1"

  - it: should fail with an unknown key in the cnpg cluster
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg': additional properties 'unknownKey' not allowed"

  - it: should fail with an unknown key in creds
    set:
      postgres16Image:
        repository: ghcr.io/cloudnative-pg/postgresql
        tag: "16.3"
        pullPolicy: IfNotPresent
      cnpg:
        my-pg:
          enabled: true
          user: test-user
          database: test-db
          password: test-password
          creds:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/cnpg/my-pg/creds': additional properties 'unknownKey' not allowed"
