suite: container env test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should create the correct env
    set:
      some_value: value1
      some_other_value: 2
      image: &image
        repository: nginx
        tag: 1.19.0
        pullPolicy: IfNotPresent
      configmap:
        configmap-name:
          enabled: true
          data:
            key1: value1
            key2: value2
      secret:
        secret-name:
          enabled: true
          data:
            key1: value1
            key2: value2
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: &probes
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
                env:
                  VAR1: "{{ .Values.some_value }}"
                  VAR2: some_value
                  VAR3:
                    configMapKeyRef:
                      name: configmap-name
                      key: key1
                  VAR4:
                    secretKeyRef:
                      name: secret-name
                      key: key2
                  VAR5:
                    configMapKeyRef:
                      expandObjectName: false
                      name: configmap-name
                      key: key3
                  VAR6:
                    secretKeyRef:
                      expandObjectName: false
                      name: secret-name
                      key: key4
                  VAR7:
                    fieldRef:
                      fieldPath: metadata.name
                  VAR8: ""
                  VAR9: false
                  VAR10: "100000514"
                  VAR11: 100000514
                  VAR12: 1000text00514
                  VAR13: "100.40"
    asserts:
      - documentIndex: &deploymentDoc 2
        isKind:
          of: Deployment
      - documentIndex: *deploymentDoc
        isAPIVersion:
          of: apps/v1
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR1
            value: value1
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR2
            value: some_value
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR3
            valueFrom:
              configMapKeyRef:
                key: key1
                name: test-release-name-common-test-configmap-name
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR4
            valueFrom:
              secretKeyRef:
                key: key2
                name: test-release-name-common-test-secret-name
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR5
            valueFrom:
              configMapKeyRef:
                key: key3
                name: configmap-name
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR6
            valueFrom:
              secretKeyRef:
                key: key4
                name: secret-name
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR7
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR8
            value: ""
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR9
            value: "false"
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR10
            value: "100000514"
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR11
            value: "100000514"
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR12
            value: "1000text00514"
      - documentIndex: *deploymentDoc
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR13
            value: "100.40"

  # Failures
  - it: it should fail invalid ref
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    invalidKeyRef: {}
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/workload/workload-name/podSpec/containers/container-name1/env/VAR'': additional properties ''invalidKeyRef'' not allowed'

  - it: it should fail with more than one ref
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    configMapKeyRef: {}
                    secretKeyRef: {}
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected [env] in [containers.container-name1] with a ref to have one of [configMapKeyRef, secretKeyRef, fieldRef], but got [configMapKeyRef, secretKeyRef]

  - it: it should fail with empty name in configMapKeyRef
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    configMapKeyRef:
                      name: ""
                      key: key
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected non-empty [containers.container-name1.env.configMapKeyRef.name]

  - it: it should fail with empty key in configMapKeyRef
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    configMapKeyRef:
                      name: name
                      key: ""
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected non-empty [containers.container-name1.env.configMapKeyRef.key]

  - it: it should fail with empty name in secretKeyRef
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    secretKeyRef:
                      name: ""
                      key: key
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected non-empty [containers.container-name1.env.secretKeyRef.name]

  - it: it should fail with empty key in secretKeyRef
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    secretKeyRef:
                      name: name
                      key: ""
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected non-empty [containers.container-name1.env.secretKeyRef.key]

  - it: it should fail with referenced secret not defined
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    secretKeyRef:
                      name: secret-name
                      key: somekey
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected in [containers.container-name1.env] the referenced Secret [secret-name] to be defined

  - it: it should fail with referenced configmap not defined
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    configMapKeyRef:
                      name: configmap-name
                      key: somekey
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected in [containers.container-name1.env] the referenced Configmap [configmap-name] to be defined

  - it: it should fail with referenced key in configmap not defined
    set:
      image: *image
      configmap:
        configmap-name:
          enabled: true
          data:
            key1: value1
            key2: value2
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    configMapKeyRef:
                      name: configmap-name
                      key: somekey
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected in [containers.container-name1.env] the referenced key [somekey] in Configmap [configmap-name] to be defined

  - it: it should fail with referenced key in secret not defined
    set:
      image: *image
      secret:
        secret-name:
          enabled: true
          data:
            key1: value1
            key2: value2
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    secretKeyRef:
                      name: secret-name
                      key: somekey
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected in [containers.container-name1.env] the referenced key [somekey] in Secret [secret-name] to be defined

  - it: it should fail with empty fieldPath in fieldRef
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR:
                    fieldRef:
                      fieldPath: ""
    asserts:
      - failedTemplate:
          errorMessage: Container - Expected non-empty [containers.container-name1.env.fieldRef.fieldPath]

  - it: it should fail empty expandObjectName
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  key1:
                    secretKeyRef:
                      expandObjectName:
                      name: '{{ printf "secret-name" }}'
                      key: secret-key
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/workload/workload-name/podSpec/containers/container-name1/env/key1/secretKeyRef/expandObjectName'': got null, want boolean or string'

  - it: should drop empty env entries when global dropEmptyKeys is true
    set:
      global:
        dropEmptyKeys: true
      emptyValue: ""
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR_EMPTY: ""
                  VAR_NULL:
                  VAR_TPL_EMPTY: "{{ .Values.emptyValue }}"
                  VAR_ZERO: 0
                  VAR_FALSE: false
                  VAR_VALUE: value1
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_EMPTY
            value: ""
      - documentSelector:
          path: kind
          value: Deployment
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_NULL
            value: ""
      - documentSelector:
          path: kind
          value: Deployment
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_TPL_EMPTY
            value: ""
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_ZERO
            value: "0"
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_FALSE
            value: "false"
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_VALUE
            value: value1

  - it: should keep empty env entries when dropEmptyKeys is not set
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR_EMPTY: ""
                  VAR_NULL:
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_EMPTY
            value: ""
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_NULL
            value: ""

  - it: should keep empty env entries when global dropEmptyKeys is false
    set:
      global:
        dropEmptyKeys: false
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR_EMPTY: ""
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_EMPTY
            value: ""

  - it: should drop empty env entries when container dropEmptyKeys is true
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                dropEmptyKeys: true
                env:
                  VAR_EMPTY: ""
                  VAR_VALUE: value1
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_EMPTY
            value: ""
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_VALUE
            value: value1

  - it: should keep empty env entries when container dropEmptyKeys is false and global is true
    set:
      global:
        dropEmptyKeys: true
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                dropEmptyKeys: false
                env:
                  VAR_EMPTY: ""
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_EMPTY
            value: ""

  - it: should drop empty env entries when container dropEmptyKeys is a tpl string rendering true
    set:
      dropEnv: true
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                dropEmptyKeys: "{{ .Values.dropEnv }}"
                env:
                  VAR_EMPTY: ""
                  VAR_VALUE: value1
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_EMPTY
            value: ""
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_VALUE
            value: value1

  - it: should keep empty env entries when container dropEmptyKeys is a tpl string rendering false
    set:
      global:
        dropEmptyKeys: true
      dropEnv: false
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                dropEmptyKeys: "{{ .Values.dropEnv }}"
                env:
                  VAR_EMPTY: ""
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_EMPTY
            value: ""

  - it: should drop env refs to empty values in configmap and secret when global dropEmptyKeys is true
    set:
      global:
        dropEmptyKeys: true
      image: *image
      secret:
        secret-name:
          enabled: true
          data:
            key1: ""
            key2: value2
      configmap:
        configmap-name:
          enabled: true
          data:
            key1: ""
            key2: value2
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR_SECRET_EMPTY:
                    secretKeyRef:
                      name: secret-name
                      key: key1
                  VAR_SECRET_VALUE:
                    secretKeyRef:
                      name: secret-name
                      key: key2
                  VAR_CONFIGMAP_EMPTY:
                    configMapKeyRef:
                      name: configmap-name
                      key: key1
                  VAR_CONFIGMAP_VALUE:
                    configMapKeyRef:
                      name: configmap-name
                      key: key2
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_SECRET_EMPTY
            valueFrom:
              secretKeyRef:
                key: key1
                name: test-release-name-common-test-secret-name
      - documentSelector:
          path: kind
          value: Deployment
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_CONFIGMAP_EMPTY
            valueFrom:
              configMapKeyRef:
                key: key1
                name: test-release-name-common-test-configmap-name
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_SECRET_VALUE
            valueFrom:
              secretKeyRef:
                key: key2
                name: test-release-name-common-test-secret-name
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_CONFIGMAP_VALUE
            valueFrom:
              configMapKeyRef:
                key: key2
                name: test-release-name-common-test-configmap-name

  - it: should keep env refs with expandObjectName false to empty values when dropEmptyKeys is true
    set:
      global:
        dropEmptyKeys: true
      image: *image
      secret:
        secret-name:
          enabled: true
          data:
            key1: ""
            key2: value2
      configmap:
        configmap-name:
          enabled: true
          data:
            key1: ""
            key2: value2
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR_SECRET_RAW:
                    secretKeyRef:
                      expandObjectName: false
                      name: secret-name
                      key: key1
                  VAR_CONFIGMAP_RAW:
                    configMapKeyRef:
                      expandObjectName: false
                      name: configmap-name
                      key: key1
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_SECRET_RAW
            valueFrom:
              secretKeyRef:
                key: key1
                name: secret-name
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_CONFIGMAP_RAW
            valueFrom:
              configMapKeyRef:
                key: key1
                name: configmap-name

  - it: should drop env refs to empty values when container dropEmptyKeys is true and global is false
    set:
      image: *image
      secret:
        secret-name:
          enabled: true
          data:
            key1: ""
            key2: value2
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                dropEmptyKeys: true
                env:
                  VAR_SECRET_EMPTY:
                    secretKeyRef:
                      name: secret-name
                      key: key1
                  VAR_SECRET_VALUE:
                    secretKeyRef:
                      name: secret-name
                      key: key2
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_SECRET_EMPTY
            valueFrom:
              secretKeyRef:
                key: key1
                name: test-release-name-common-test-secret-name
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAR_SECRET_VALUE
            valueFrom:
              secretKeyRef:
                key: key2
                name: test-release-name-common-test-secret-name
