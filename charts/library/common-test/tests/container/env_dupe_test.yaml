suite: container env dupe test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  # Failures
  - it: should fail with dupe env in env and envFrom configmap
    set:
      image: &image
        repository: nginx
        tag: 1.19.0
        pullPolicy: IfNotPresent
      configmap:
        configmap-name:
          enabled: true
          data:
            VAR1: value
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: &probes
                  readiness:
                    enabled: false
                  liveness:
                    enabled: false
                  startup:
                    enabled: false
                env:
                  VAR1: some_value
                envFrom:
                  - configMapRef:
                      name: configmap-name
    asserts:
      - failedTemplate:
          errorMessage: Container - Environment Variable [VAR1] in [containers.container-name1.env] tried to override the Environment Variable that is already defined in [ConfigMap - configmap-name]

  - it: should fail with dupe env in env and envFrom secret
    set:
      image: *image
      secret:
        secret-name:
          enabled: true
          data:
            VAR1: value
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  VAR1: some_value
                envFrom:
                  - secretRef:
                      name: secret-name
    asserts:
      - failedTemplate:
          errorMessage: Container - Environment Variable [VAR1] in [containers.container-name1.env] tried to override the Environment Variable that is already defined in [Secret - secret-name]

  - it: should fail with dupe env in fixedEnv and env
    set:
      image: *image
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                env:
                  TZ: some_value
    asserts:
      - failedTemplate:
          errorMessage: Container - Environment Variable [TZ] in [containers.container-name1.env] tried to override the Environment Variable that is already defined in [containers.container-name1.fixedEnv]

  - it: should fail with dupe env in fixedEnv and envFrom configmap
    set:
      image: *image
      configmap:
        configmap-name:
          enabled: true
          data:
            TZ: value
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                envFrom:
                  - configMapRef:
                      name: configmap-name
    asserts:
      - failedTemplate:
          errorMessage: Container - Environment Variable [TZ] in [containers.container-name1.fixedEnv] tried to override the Environment Variable that is already defined in [ConfigMap - configmap-name]

  - it: should fail with dupe env in fixedEnv and envFrom secret
    set:
      image: *image
      secret:
        secret-name:
          enabled: true
          data:
            TZ: value
      workload:
        workload-name:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              container-name1:
                enabled: true
                primary: true
                imageSelector: image
                probes: *probes
                envFrom:
                  - secretRef:
                      name: secret-name
    asserts:
      - failedTemplate:
          errorMessage: Container - Environment Variable [TZ] in [containers.container-name1.fixedEnv] tried to override the Environment Variable that is already defined in [Secret - secret-name]
