    asserts:
      - documentIndex: 0
        isKind:
          of: Deployment
      - documentIndex: 0
        isAPIVersion:
          of: apps/v1
      - documentIndex: 0
        isSubset:
          path: spec.template.spec.containers[0]
          content:
            resources:
              limits:
                cpu: 1500m
                memory: 2400Mi
              requests:
                cpu: 75m
                memory: 1Gi

