  #
  # This test is currently disabled due to a known issue with helm-unittest v1.0.3
  # where documentIndex values greater than 7-8 are not properly handled.
  #
  # Test purpose:
  # - Verify that init/wait containers for dependencies get standard resource limits
  # - Ensure "excludeExtra" flag prevents GPU resources from being added to specific containers
  # - Check that 6 dependency wait containers (valkey, mongodb, mariadb, clickhouse, solr, cnpg)
  #   all receive the default resource limits (not the extra GPU limit)
  #
  # Expected document order (10 documents total):
  # - 0-6: Secrets (7 total - credentials for each dependency)
  # - 7: Service (valkey-main)
  # - 8: Deployment (workload-name1) - Contains the init containers to check
  # - 9: Cluster (cnpg)
  #
  # What happens:
  # - Test specifies documentIndex: 8 for Deployment and 9 for Cluster
  # - Helm unittest checks documentIndex: 0 instead (finds Secret, not Deployment)
  # - All assertions fail even though the actual templates are correct
  #
  # Verification:
  # The actual Helm templates work correctly. To manually verify:
  # ```bash
  # helm template test charts/library/common-test \
  #   --set dependencies.valkey.enabled=true \
  #   --set mongodb.enabled=true \
  #   --set mariadb.enabled=true \
  #   --set clickhouse.enabled=true \
  #   --set solr.enabled=true \
  #   --set cnpg.my-pg.enabled=true \
  #   --set 'resources.limits.nvidia\.com/gpu=1'
  # # Check that initContainers have standard limits (500m CPU, 512Mi memory)
  # # and do NOT have nvidia.com/gpu: 1
