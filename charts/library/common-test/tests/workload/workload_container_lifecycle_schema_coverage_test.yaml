suite: workload container lifecycle schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render container lifecycle exec hooks with a string and a list command
    set:
      workload:
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                imageSelector: ubuntuImage
                probes: &probes
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
                lifecycle:
                  postStart:
                    type: exec
                    command: echo
                  preStop:
                    type: exec
                    command:
                      - echo
                      - bye
    asserts:
      - documentIndex: &deploymentDoc 0
        isKind:
          of: Deployment
      - documentIndex: *deploymentDoc
        equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command
          value:
            - echo
            - bye

  - it: should render container lifecycle http hooks with integer and string ports and mixed header types
    set:
      workload:
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                imageSelector: ubuntuImage
                probes: *probes
                lifecycle:
                  postStart:
                    type: http
                    port: 8080
                    httpHeaders:
                      X-Bool: true
                      X-Number: 1.5
                  preStop:
                    type: https
                    host: example.com
                    path: /stop
                    port: "8443"
                    httpHeaders:
                      X-String: value
                      X-Number: 2
                      X-Bool: true
    asserts:
      - documentIndex: *deploymentDoc
        isKind:
          of: Deployment
      - documentIndex: *deploymentDoc
        equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.httpGet.host
          value: example.com
      - documentIndex: *deploymentDoc
        equal:
          path: spec.template.spec.containers[0].lifecycle.postStart.httpGet.port
          value: 8080

  - it: should fail on unknown keys in container lifecycle postStart and preStop
    set:
      workload:
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                imageSelector: ubuntuImage
                lifecycle:
                  postStart:
                    unknownKey: value
                  preStop:
                    unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/workload/my-workload/podSpec/containers/main/lifecycle/postStart': additional properties 'unknownKey' not allowed"
      - failedTemplate:
          errorPattern: "at '/workload/my-workload/podSpec/containers/main/lifecycle/preStop': additional properties 'unknownKey' not allowed"
