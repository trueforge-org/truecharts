suite: workload dbWait schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render workload with dbWait set to a boolean
    set:
      workload:
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          dbWait: true
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                imageSelector: ubuntuImage
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 0
