suite: redirectRegex middleware test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should pass with all set
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: redirect-regex
            data:
              regex: some-regex
              replacement: some-replacement
              permanent: true
    asserts:
      - documentIndex: &middlewareDoc 0
        isKind:
          of: Middleware
      - documentIndex: *middlewareDoc
        equal:
          path: spec
          value:
            redirectRegex:
              regex: some-regex
              replacement: some-replacement
              permanent: true

  - it: should fail with missing regex
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: redirect-regex
            data:
              replacement: some-replacement
              permanent: true
    asserts:
      - failedTemplate:
          errorMessage: Middleware (redirect-regex) - Expected [regex] to be set

  - it: should fail with missing replacement
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: redirect-regex
            data:
              regex: some-regex
              permanent: true
    asserts:
      - failedTemplate:
          errorMessage: Middleware (redirect-regex) - Expected [replacement] to be set

  - it: should fail with invalid permanent
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: redirect-regex
            data:
              regex: some-regex
              replacement: some-replacement
              permanent: some-value
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/ingressMiddlewares/traefik/my-middleware1/data/permanent'': got string, want boolean'

  - it: should quote regex and replacement with special characters
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: redirect-regex
            data:
              regex: "*.example.com: {path}"
              replacement: "[https://example.com/${1}]"
              permanent: true
    asserts:
      - documentIndex: 0
        equal:
          path: spec
          value:
            redirectRegex:
              regex: "*.example.com: {path}"
              replacement: "[https://example.com/${1}]"
              permanent: true
