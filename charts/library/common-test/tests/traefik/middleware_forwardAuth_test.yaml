suite: forward-auth middleware test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should pass with values
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              authResponseHeadersRegex: some-regex
              trustForwardHeader: true
              authResponseHeaders:
                - some-header
              authRequestHeaders:
                - some-header
              tls:
                insecureSkipVerify: true
    asserts:
      - documentIndex: &middlewareDoc 0
        isKind:
          of: Middleware
      - documentIndex: *middlewareDoc
        equal:
          path: spec
          value:
            forwardAuth:
              address: some-address
              authResponseHeadersRegex: some-regex
              trustForwardHeader: true
              authResponseHeaders:
                - some-header
              authRequestHeaders:
                - some-header
              tls:
                insecureSkipVerify: true

  - it: should fail with missing address
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              authResponseHeadersRegex: some-regex
    asserts:
      - failedTemplate:
          errorMessage: Middleware (forward-auth) - Expected [address] to be set

  - it: should fail with invalid authResponseHeaders
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              authResponseHeaders: some-header
    asserts:
      - failedTemplate:
          errorPattern: "at '/ingressMiddlewares/traefik/my-middleware1/data/authResponseHeaders': got string, want array"

  - it: should fail with invalid authRequestHeaders
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              authRequestHeaders: some-header
    asserts:
      - failedTemplate:
          errorPattern: "at '/ingressMiddlewares/traefik/my-middleware1/data/authRequestHeaders': got string, want array"

  - it: should fail with invalid tls.insecureSkipVerify
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              tls:
                insecureSkipVerify: some-value
    asserts:
      - failedTemplate:
          errorPattern: "at '/ingressMiddlewares/traefik/my-middleware1/data/tls/insecureSkipVerify': got string, want boolean"

  - it: should fail with invalid trustForwardHeader
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              trustForwardHeader: some-value
    asserts:
      - failedTemplate:
          errorPattern: "at '/ingressMiddlewares/traefik/my-middleware1/data/trustForwardHeader': got string, want boolean"
