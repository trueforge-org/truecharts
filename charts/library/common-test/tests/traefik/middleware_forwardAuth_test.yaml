suite: forward-auth middleware test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should pass with values
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              authResponseHeadersRegex: some-regex
              trustForwardHeader: true
              authResponseHeaders:
                - some-header
              authRequestHeaders:
                - some-header
              tls:
                insecureSkipVerify: true
    asserts:
      - documentIndex: &middlewareDoc 0
        isKind:
          of: Middleware
      - documentIndex: *middlewareDoc
        equal:
          path: spec
          value:
            forwardAuth:
              address: some-address
              authResponseHeadersRegex: some-regex
              trustForwardHeader: true
              authResponseHeaders:
                - some-header
              authRequestHeaders:
                - some-header
              tls:
                insecureSkipVerify: true

  - it: should pass with templated address from values
    set:
      authHost: auth.example.com
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: "https://{{ .Values.authHost }}/outpost.goauthentik.io/auth/traefik"
    asserts:
      - documentIndex: &middlewareDoc 0
        isKind:
          of: Middleware
      - documentIndex: *middlewareDoc
        equal:
          path: spec.forwardAuth.address
          value: https://auth.example.com/outpost.goauthentik.io/auth/traefik

  - it: should pass with templated address from release context
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: "http://{{ .Release.Name }}-server.{{ .Release.Namespace }}.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik"
    asserts:
      - documentIndex: &middlewareDoc 0
        isKind:
          of: Middleware
      - documentIndex: *middlewareDoc
        equal:
          path: spec.forwardAuth.address
          value: http://test-release-name-server.test-release-namespace.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik

  - it: should fail with missing address
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              authResponseHeadersRegex: some-regex
    asserts:
      - failedTemplate:
          errorMessage: Middleware (forward-auth) - Expected [address] to be set

  - it: should fail with invalid authResponseHeaders
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              authResponseHeaders: some-header
    asserts:
      - failedTemplate:
          errorMessage: Middleware (forward-auth) - Expected [authResponseHeaders] to be a list, but got [string]

  - it: should fail with invalid authRequestHeaders
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              authRequestHeaders: some-header
    asserts:
      - failedTemplate:
          errorMessage: Middleware (forward-auth) - Expected [authRequestHeaders] to be a list, but got [string]

  - it: should fail with invalid tls.insecureSkipVerify
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              tls:
                insecureSkipVerify: some-value
    asserts:
      - failedTemplate:
          errorMessage: Middleware (forward-auth) - Expected [tls.insecureSkipVerify] to be a boolean, but got [string]

  - it: should fail with invalid trustForwardHeader
    set:
      ingressMiddlewares:
        traefik:
          my-middleware1:
            enabled: true
            type: forward-auth
            data:
              address: some-address
              trustForwardHeader: some-value
    asserts:
      - failedTemplate:
          errorMessage: Middleware (forward-auth) - Expected [trustForwardHeader] to be a boolean, but got [string]
