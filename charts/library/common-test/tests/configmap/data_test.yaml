suite: configmap data test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should pass with key-value data
    set:
      configmap:
        my-configmap1:
          enabled: true
          data:
            foo: bar
    asserts:
      - documentIndex: &configmapDoc 0
        isKind:
          of: ConfigMap
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: bar

  - it: should pass with key-value data from tpl
    set:
      data: bar
      configmap:
        my-configmap1:
          enabled: true
          data:
            foo: "{{ .Values.data }}"
    asserts:
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: bar

  - it: should pass with scalar data
    set:
      configmap:
        my-configmap1:
          enabled: true
          data:
            foo: |
              some multi line
              string text
    asserts:
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: |
              some multi line
              string text

  - it: should pass with scalar data with tpl
    set:
      data: Some other text
      configmap:
        my-configmap:
          enabled: true
          data:
            foo: |
              file start
              {{ .Values.data }}
    asserts:
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: |
              file start
              Some other text

  - it: should pass with scalar data from tpl
    set:
      data: |
        Some other text
        some_text
      configmap:
        my-configmap1:
          enabled: true
          data:
            foo: |
              {{- .Values.data | nindent 2 }}
    asserts:
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: |
              Some other text
              some_text

  - it: should drop empty data keys when global dropEmptyKeys is true
    set:
      global:
        dropEmptyKeys: true
      emptyValue: ""
      zeroValue: 0
      falseValue: false
      configmap:
        my-configmap1:
          enabled: true
          data:
            foo: bar
            empty: ""
            tplEmpty: "{{ .Values.emptyValue }}"
            zero: "{{ .Values.zeroValue }}"
            no: "{{ .Values.falseValue }}"
    asserts:
      - documentIndex: *configmapDoc
        isKind:
          of: ConfigMap
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: bar
            zero: "0"
            no: "false"

  - it: should keep empty data keys when dropEmptyKeys is not set
    set:
      configmap:
        my-configmap1:
          enabled: true
          data:
            foo: bar
            empty: ""
    asserts:
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: bar
            empty: ""

  - it: should render empty data when all data keys are dropped
    set:
      global:
        dropEmptyKeys: true
      emptyValue: ""
      configmap:
        my-configmap1:
          enabled: true
          data:
            empty: ""
            tplEmpty: "{{ .Values.emptyValue }}"
    asserts:
      - documentIndex: *configmapDoc
        isKind:
          of: ConfigMap
      - documentIndex: *configmapDoc
        equal:
          path: data
          value: {}

  - it: should keep empty data keys when configmap dropEmptyKeys is false and global is true
    set:
      global:
        dropEmptyKeys: true
      configmap:
        my-configmap1:
          enabled: true
          dropEmptyKeys: false
          data:
            foo: bar
            empty: ""
    asserts:
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: bar
            empty: ""

  - it: should drop empty data keys when configmap dropEmptyKeys is true and global is false
    set:
      configmap:
        my-configmap1:
          enabled: true
          dropEmptyKeys: true
          data:
            foo: bar
            empty: ""
    asserts:
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: bar

  - it: should drop empty data keys when configmap dropEmptyKeys is a tpl string rendering true
    set:
      dropConfig: true
      configmap:
        my-configmap1:
          enabled: true
          dropEmptyKeys: "{{ .Values.dropConfig }}"
          data:
            foo: bar
            empty: ""
    asserts:
      - documentIndex: *configmapDoc
        equal:
          path: data
          value:
            foo: bar
