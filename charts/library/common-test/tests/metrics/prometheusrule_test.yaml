suite: metrics prometheusrule test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render the groups and additional groups
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      metrics:
        main:
          enabled: true
          type: servicemonitor
          endpoints:
            - port: main
          prometheusRule:
            enabled: true
            groups:
              somegroup:
                rules:
                  - alert: SomeAlert
                    expr: up == 0
                additionalrules:
                  - alert: OtherAlert
                    expr: up == 1
            additionalgroups:
              - name: anothergroup
                rules:
                  - alert: ThirdAlert
                    expr: up == 2
    asserts:
      - documentSelector: &rule
          path: kind
          value: PrometheusRule
        equal:
          path: metadata.name
          value: test-release-name-common-test
      - documentSelector: *rule
        isAPIVersion:
          of: monitoring.coreos.com/v1
      - documentSelector: *rule
        equal:
          path: spec.groups
          value:
            - name: test-release-name-common-test-somegroup
              rules:
                - alert: SomeAlert
                  expr: up == 0
                - alert: OtherAlert
                  expr: up == 1
            - name: test-release-name-common-test-anothergroup
              rules:
                - alert: ThirdAlert
                  expr: up == 2
