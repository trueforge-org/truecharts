suite: addon codeserver container envList schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render the codeserver addon container with envList
    set:
      workload: &workload
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                imageSelector: ubuntuImage
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      service: &service
        my-service:
          enabled: true
          primary: true
          targetSelector: my-workload
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      addons:
        codeserver:
          enabled: true
          targetSelector:
            - my-workload
          container:
            enabled: true
            primary: false
            imageSelector: codeserverImage
            envList:
              - name: MY_ENV
                value: my-value
    asserts:
      - isKind:
          of: Deployment
        documentIndex: 0
