suite: addon vpn schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should ignore an empty addons vpn object
    set:
      workload: &workload
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                imageSelector: ubuntuImage
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      service: &service
        my-service:
          enabled: true
          primary: true
          targetSelector: my-workload
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      addons:
        vpn: {}
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        isKind:
          of: Deployment

  - it: should reject the removed vpn addon with every legacy key
    set:
      workload: &workload
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                imageSelector: ubuntuImage
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      service: &service
        my-service:
          enabled: true
          primary: true
          targetSelector: my-workload
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      addons:
        vpn:
          type: gluetun
          config: placeholder config
          targetSelector:
            - main
          env:
            key: value
          scripts:
            up: echo up
            down: echo down
    asserts:
      - failedTemplate:
          errorPattern: "at '/addons/vpn': additional properties .* not allowed"

  - it: should fail on unknown keys in addons
    set:
      workload: &workload
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                imageSelector: ubuntuImage
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      service: &service
        my-service:
          enabled: true
          primary: true
          targetSelector: my-workload
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      addons:
        unknownAddon:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "at '/addons': additional properties 'unknownAddon' not allowed"
