suite: addon codeserver route
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1/ListenerSet
    - cert-manager.io/v1/Certificate
tests:
  - it: should merge the listeners of the chart and the addon with per domain certs from certManager
    set:
      workload: &workload
        main:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
      service: &service
        main:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        main:
          enabled: true
          gateway: external
          gatewayNamespace: networking
          hostnames:
            - app.example.com
          integrations:
            certManager:
              enabled: true
              certificateIssuer: some-issuer
      addons:
        codeserver:
          enabled: true
          route:
            enabled: true
            gateway: external
            gatewayNamespace: networking
            hostnames:
              - code.example.com
            integrations:
              certManager:
                enabled: true
                certificateIssuer: some-issuer
    asserts:
      - documentSelector: &ls
          path: kind
          value: ListenerSet
        equal:
          path: metadata.name
          value: test-release-name-common-test-external-443-some-issuer
      - documentSelector: *ls
        equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: some-issuer
      - documentSelector: *ls
        equal:
          path: spec.listeners
          value:
            - name: https-0
              hostname: code.example.com
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - group: ""
                    kind: Secret
                    name: test-release-name-common-test-tls-code-example-com
              allowedRoutes:
                namespaces:
                  from: Same
            - name: https-1
              hostname: app.example.com
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - group: ""
                    kind: Secret
                    name: test-release-name-common-test-tls-app-example-com
              allowedRoutes:
                namespaces:
                  from: Same
      - documentSelector:
          path: spec.hostnames[0]
          value: app.example.com
        equal:
          path: spec.parentRefs
          value: &lsParent
            - group: gateway.networking.k8s.io
              kind: ListenerSet
              name: test-release-name-common-test-external-443-some-issuer
              namespace: test-release-namespace
      - documentSelector:
          path: spec.hostnames[0]
          value: code.example.com
        equal:
          path: spec.parentRefs
          value: *lsParent
      - documentSelector:
          path: spec.hostnames[0]
          value: code.example.com
        equal:
          path: metadata.name
          value: test-release-name-common-test-codeserver

  - it: should share one listener when the addon uses the hostname of the chart with another path
    set:
      workload: *workload
      service: *service
      route:
        main:
          enabled: true
          gateway: external
          hostnames:
            - app.example.com
          integrations:
            certManager:
              enabled: true
              certificateIssuer: some-issuer
      addons:
        codeserver:
          enabled: true
          route:
            enabled: true
            gateway: external
            hostnames:
              - app.example.com
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /code
            integrations:
              certManager:
                enabled: true
                certificateIssuer: some-issuer
    asserts:
      - documentSelector: *ls
        lengthEqual:
          path: spec.listeners
          count: 1
      - documentSelector: *ls
        equal:
          path: spec.listeners[0].tls.certificateRefs[0].name
          value: test-release-name-common-test-tls-app-example-com
      - documentSelector:
          path: spec.rules[0].matches[0].path.value
          value: /code
        equal:
          path: spec.rules[0].backendRefs[0].name
          value: test-release-name-common-test-codeserver

  - it: should fail when the addon uses the hostname of the chart with another certificate
    set:
      workload: *workload
      service: *service
      route:
        main:
          enabled: true
          gateway: external
          hostnames:
            - app.example.com
          integrations:
            certManager:
              enabled: true
              certificateIssuer: some-issuer
      addons:
        codeserver:
          enabled: true
          route:
            enabled: true
            gateway: external
            hostnames:
              - app.example.com
            tls:
              - hosts:
                  - app.example.com
                secretName: other-secret
    asserts:
      - failedTemplate:
          errorMessage: Route - Routes [codeserver] and [main] use hostname [app.example.com] on the same gateway and port, so they share a listener, but with different TLS settings. Set the same TLS on both

  - it: should create the certificate of the addon with certificateIssuer
    set:
      workload: *workload
      addons:
        codeserver:
          enabled: true
          route:
            enabled: true
            gateway: external
            hostnames:
              - code.example.com
            tls:
              - hosts:
                  - code.example.com
                certificateIssuer: some-issuer
    asserts:
      - documentSelector:
          path: kind
          value: Certificate
        equal:
          path: spec.dnsNames
          value:
            - code.example.com
      - documentSelector:
          path: kind
          value: Certificate
        equal:
          path: spec.secretName
          value: test-release-name-common-test-tls-code-example-com
      - documentSelector: *ls
        equal:
          path: spec.listeners[0].tls.certificateRefs[0].name
          value: test-release-name-common-test-tls-code-example-com

  - it: should attach the addon to a listenerSet of the chart
    set:
      workload: *workload
      listenerSet:
        main:
          enabled: true
          parentRef:
            name: external
          listeners:
            - name: code
              hostname: code.example.com
              port: 443
              protocol: HTTPS
              tls:
                mode: Terminate
                certificateRefs:
                  - name: code-tls
      addons:
        codeserver:
          enabled: true
          route:
            enabled: true
            listenerSet: main
            hostnames:
              - code.example.com
    asserts:
      - documentSelector:
          path: kind
          value: HTTPRoute
        equal:
          path: spec.parentRefs[0].kind
          value: ListenerSet

  - it: should create a listenerset per issuer when the chart and the addon use different issuers
    set:
      workload: *workload
      service: *service
      route:
        main:
          enabled: true
          gateway: external
          hostnames:
            - app.example.com
          integrations:
            certManager:
              enabled: true
              certificateIssuer: issuer-a
      addons:
        codeserver:
          enabled: true
          route:
            enabled: true
            gateway: external
            hostnames:
              - code.other.org
            integrations:
              certManager:
                enabled: true
                certificateIssuer: issuer-b
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-external-443-issuer-a
        equal:
          path: spec.listeners[0].hostname
          value: app.example.com
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-external-443-issuer-a
        equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: issuer-a
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-external-443-issuer-b
        equal:
          path: spec.listeners[0].hostname
          value: code.other.org
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-external-443-issuer-b
        equal:
          path: spec.listeners[0].tls.certificateRefs[0].name
          value: test-release-name-common-test-tls-code-other-org
      - documentSelector:
          path: spec.hostnames[0]
          value: code.other.org
        equal:
          path: spec.parentRefs[0].name
          value: test-release-name-common-test-external-443-issuer-b
