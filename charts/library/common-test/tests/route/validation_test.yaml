suite: route validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with invalid kind
    set:
      service:
        main:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
        other:
          enabled: true
          ports:
            other:
              enabled: true
              primary: true
              port: 9090
      route:
        my-route:
          enabled: true
          kind: Invalid
          parentRefs:
            - name: some-gateway
          rules:
            - backendRefs:
                - targetSelector: main
    asserts:
      - failedTemplate:
          errorMessage: Not a valid route kind (Invalid)

  - it: should fail with matches on TCPRoute
    set:
      service:
        main:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
        other:
          enabled: true
          ports:
            other:
              enabled: true
              primary: true
              port: 9090
      route:
        my-route:
          enabled: true
          kind: TCPRoute
          parentRefs:
            - name: some-gateway
          rules:
            - backendRefs:
                - targetSelector: main
              matches: []
    asserts:
      - failedTemplate:
          errorMessage: Route - [route.my-route.rules.0.matches] is not supported by kind [TCPRoute]

