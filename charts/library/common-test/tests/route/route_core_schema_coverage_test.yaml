suite: route core schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render each route kind with primary, labels, annotations, nameOverride and hostnames
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          primary: true
          kind: GRPCRoute
          nameOverride: custom
          labels:
            my-label: my-value
          annotations:
            my-ann: my-value
          hostnames:
            - app.example.com
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - documentSelector:
          path: kind
          value: GRPCRoute
        equal:
          path: metadata.labels.my-label
          value: my-value
      - documentSelector:
          path: kind
          value: GRPCRoute
        equal:
          path: metadata.annotations.my-ann
          value: my-value
      - documentSelector:
          path: kind
          value: GRPCRoute
        equal:
          path: metadata.name
          value: test-release-name-common-test-custom
      - documentSelector:
          path: kind
          value: GRPCRoute
        equal:
          path: spec.hostnames[0]
          value: app.example.com

  - it: should render kind HTTPRoute
    set:
      service: *service
      route:
        my-route:
          enabled: true
          kind: HTTPRoute
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - documentSelector:
          path: kind
          value: HTTPRoute
        equal:
          path: kind
          value: HTTPRoute

  - it: should render kind TCPRoute
    set:
      service: *service
      route:
        my-route:
          enabled: true
          kind: TCPRoute
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - documentSelector:
          path: kind
          value: TCPRoute
        equal:
          path: kind
          value: TCPRoute

  - it: should render kind TLSRoute
    set:
      service: *service
      route:
        my-route:
          enabled: true
          kind: TLSRoute
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - documentSelector:
          path: kind
          value: TLSRoute
        equal:
          path: kind
          value: TLSRoute

  - it: should render kind UDPRoute
    set:
      service: *service
      route:
        my-route:
          enabled: true
          kind: UDPRoute
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - documentSelector:
          path: kind
          value: UDPRoute
        equal:
          path: kind
          value: UDPRoute

  - it: should fail on an invalid route kind
    set:
      service: *service
      route:
        my-route:
          enabled: true
          kind: FooRoute
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/kind'"

  - it: should fail on unknown keys in route
    set:
      service: *service
      route:
        my-route:
          enabled: true
          unknownKey: value
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route': additional properties 'unknownKey' not allowed"

  - it: should fail on a non-boolean primary in route
    set:
      service: *service
      route:
        my-route:
          enabled: true
          primary: "yes"
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/primary'"

  - it: should fail on a non-string nameOverride in route
    set:
      service: *service
      route:
        my-route:
          enabled: true
          nameOverride: 1
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/nameOverride'"

  - it: should fail on a non-array hostnames in route
    set:
      service: *service
      route:
        my-route:
          enabled: true
          hostnames: app.example.com
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/hostnames'"

  - it: should fail on a non-object annotations in route
    set:
      service: *service
      route:
        my-route:
          enabled: true
          annotations: foo
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/annotations'"

  - it: should fail on a non-object labels in route
    set:
      service: *service
      route:
        my-route:
          enabled: true
          labels: foo
          parentRefs:
            - name: some-gateway
              namespace: gw-ns
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/labels'"

