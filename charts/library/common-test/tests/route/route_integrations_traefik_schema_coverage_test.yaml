suite: route integrations traefik schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render route traefik integration with string enabled, ipStrategy lists, empty auth and chartMiddlewares
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      global:
        traefik:
          commonMiddlewares: []
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: "true"
              ipWhitelist:
                - 10.0.0.0/8
              ipStrategy:
                depth: "2"
                excludedIPs:
                  - 10.1.1.1
                ipv6Subnet: 64
              auth:
                type: ""
                responseHeaders: []
              chartMiddlewares: []
              themePark:
                enabled: "true"
                app: sonarr
                theme: nord
    asserts:
      - documentSelector: &route
          path: kind
          value: HTTPRoute
        isKind:
          of: HTTPRoute

  - it: should render route traefik integration with string ipv6Subnet
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      global:
        traefik:
          commonMiddlewares: []
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              ipWhitelist:
                - 10.0.0.0/8
              ipStrategy:
                ipv6Subnet: "64"
    asserts:
      - documentSelector: *route
        isKind:
          of: HTTPRoute

  - it: should render route traefik integration with middlewares with namespace and expandObjectName
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      global:
        traefik:
          commonMiddlewares: []
      ingressMiddlewares:
        traefik:
          my-mw:
            enabled: true
            type: add-prefix
            data:
              prefix: /foo
          my-mw2:
            enabled: true
            type: add-prefix
            data:
              prefix: /bar
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              middlewares:
                - name: my-mw
                  namespace: test-release-namespace
                  expandObjectName: true
                - name: my-mw2
                  expandObjectName: "true"
    asserts:
      - documentSelector: *route
        isKind:
          of: HTTPRoute

  - it: should fail on unknown keys and missing required keys in route integrations traefik
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/traefik': additional properties 'unknownKey' not allowed"

  - it: should fail on unknown keys and missing required keys in route integrations traefik ipStrategy
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              ipStrategy:
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/traefik/ipStrategy': additional properties 'unknownKey' not allowed"

  - it: should fail on unknown keys and missing required keys in route integrations traefik auth
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              auth:
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/traefik/auth': additional properties 'unknownKey' not allowed"

  - it: should fail on unknown keys and missing required keys in route integrations traefik themePark
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              themePark:
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/traefik/themePark': additional properties 'unknownKey' not allowed"

  - it: should fail on unknown keys in route integrations traefik redirectRegex
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              redirectRegex:
                - unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/traefik/redirectRegex/0': additional properties 'unknownKey' not allowed"

  - it: should fail on missing required keys in route integrations traefik redirectRegex
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              redirectRegex:
                - permanent: true
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/traefik/redirectRegex/0': missing propert"

  - it: should fail on unknown keys in route integrations traefik middlewares
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              middlewares:
                - unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/traefik/middlewares/0': additional properties 'unknownKey' not allowed"

  - it: should fail on missing required keys in route integrations traefik middlewares
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            traefik:
              enabled: true
              middlewares:
                - namespace: test-release-namespace
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/traefik/middlewares/0': missing property 'name'"
