suite: route rules schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render route rules with backendRefs group, string port and sessionPersistence
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          rules:
            - backendRefs:
                - group: ""
                  kind: Service
                  name: my-backend
                  port: "8080"
              sessionPersistence:
                sessionName: my-session
    asserts:
      - documentSelector: &route
          path: kind
          value: HTTPRoute
        equal:
          path: spec.rules[0].backendRefs[0].name
          value: my-backend
      - documentSelector: *route
        equal:
          path: spec.rules[0].sessionPersistence.sessionName
          value: my-session

  - it: should render route rules with null backendRefs namespace and port and a targetSelector
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          rules:
            - backendRefs:
                - targetSelector: my-service
                  name: null
                  namespace: null
                  port: null
    asserts:
      - documentSelector: *route
        isKind:
          of: HTTPRoute

  - it: should render route rules with a null backendRefs targetSelector
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          rules:
            - backendRefs:
                - name: my-backend
                  port: 8080
                  targetSelector: null
    asserts:
      - documentSelector: *route
        isKind:
          of: HTTPRoute

  - it: should render route rules with timeouts
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          rules:
            - timeouts:
                request: 10s
                backendRequest: 5s
    asserts:
      - documentSelector: *route
        equal:
          path: spec.rules[0].timeouts.request
          value: 10s

  - it: should fail on unknown keys in route rules backendRefs
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          rules:
            - backendRefs:
                - name: my-backend
                  port: 8080
                  unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/rules/0/backendRefs/0': additional properties 'unknownKey' not allowed"

  - it: should fail on unknown keys in route rules timeouts
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          rules:
            - timeouts:
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/rules/0/timeouts': additional properties 'unknownKey' not allowed"
