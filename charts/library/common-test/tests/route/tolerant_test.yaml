suite: route tolerant enabled, tpl parentRefs and name collisions
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1/ListenerSet
    - cert-manager.io/v1/Certificate
    - traefik.io/v1alpha1/Middleware
tests:
  - it: should treat an integration with enabled "false" as disabled
    set:
      service: &service
        main:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        main:
          enabled: true
          gateway: external
          hostnames:
            - a.example.com
          integrations:
            traefik:
              enabled: "false"
              ipWhitelist:
                - 10.0.0.0/8
            envoy:
              enabled: "false"
            homepage:
              enabled: "false"
            certManager:
              enabled: "false"
    asserts:
      - containsDocument:
          kind: Middleware
          apiVersion: traefik.io/v1alpha1
          any: true
        not: true
      - documentSelector:
          path: kind
          value: HTTPRoute
        notExists:
          path: metadata.annotations["gethomepage.dev/enabled"]
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          any: true
        not: true

  - it: should treat an integration without enabled as disabled
    set:
      service: *service
      route:
        main:
          enabled: true
          gateway: external
          integrations:
            traefik:
              ipWhitelist:
                - 10.0.0.0/8
    asserts:
      - containsDocument:
          kind: Middleware
          apiVersion: traefik.io/v1alpha1
          any: true
        not: true

  - it: should resolve a tpl string in enabled of an integration
    set:
      useTraefik: true
      service: *service
      route:
        main:
          enabled: true
          gateway: external
          integrations:
            traefik:
              enabled: "{{ .Values.useTraefik }}"
              ipWhitelist:
                - 10.0.0.0/8
    asserts:
      - documentSelector:
          path: kind
          value: Middleware
        equal:
          path: metadata.name
          value: test-release-name-common-test-ip-whitelist

  - it: should resolve tpl strings in parentRefs
    set:
      gw: my-gateway
      gwNs: gateway-ns
      section: https
      parentPort: 8443
      service: *service
      route:
        main:
          enabled: true
          parentRefs:
            - name: "{{ .Values.gw }}"
              namespace: "{{ .Values.gwNs }}"
              sectionName: "{{ .Values.section }}"
              port: "{{ .Values.parentPort }}"
    asserts:
      - documentSelector:
          path: kind
          value: HTTPRoute
        equal:
          path: spec.parentRefs[0]
          value:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: my-gateway
            namespace: gateway-ns
            sectionName: https
            port: 8443

  - it: should fail when a generated middleware has the name of a chart middleware
    set:
      service: *service
      ingressMiddlewares:
        traefik:
          ip-whitelist:
            enabled: true
            type: strip-prefix
            data:
              prefix:
                - /x
      route:
        main:
          enabled: true
          gateway: external
          integrations:
            traefik:
              enabled: true
              ipWhitelist:
                - 10.0.0.0/8
    asserts:
      - failedTemplate:
          errorPattern: "Generated Traefik Middleware \\[test-release-name-common-test-ip-whitelist\\] of \\[route.main\\] has the same name as \\[ingressMiddlewares.traefik.ip-whitelist\\]"

  - it: should fail when a route with TLS is in another namespace than a gateway that only allows the Same namespace
    set:
      service: *service
      gateway:
        web:
          enabled: true
          gatewayClassName: some-class
          namespace: gateway-namespace
          allowedListeners:
            namespaces:
              from: Same
          listeners:
            - name: http
              port: 80
              protocol: HTTP
      route:
        main:
          enabled: true
          targetSelector: web
          hostnames:
            - a.example.com
          integrations:
            certManager:
              enabled: true
              certificateIssuer: some-issuer
    asserts:
      - failedTemplate:
          errorPattern: "from\\] is \\[Same\\], but the ListenerSet of \\[route.main\\] is in namespace \\[test-release-namespace\\] and the gateway in \\[gateway-namespace\\]"

  - it: should fail when a listenerSet is in another namespace than a gateway that only allows the Same namespace
    set:
      gateway:
        web:
          enabled: true
          gatewayClassName: some-class
          namespace: gateway-namespace
          allowedListeners:
            namespaces:
              from: Same
          listeners:
            - name: http
              port: 80
              protocol: HTTP
      listenerSet:
        my-set:
          enabled: true
          targetSelector: web
          listeners:
            - name: https
              hostname: app.example.com
              port: 443
              protocol: HTTPS
    asserts:
      - failedTemplate:
          errorPattern: "from\\] is \\[Same\\], but \\[listenerSet.my-set\\] is in namespace \\[test-release-namespace\\] and the gateway in \\[gateway-namespace\\]"

  - it: should pass when the listenerSet is in the namespace of the gateway that allows Same
    set:
      gateway:
        web:
          enabled: true
          gatewayClassName: some-class
          namespace: gateway-namespace
          allowedListeners:
            namespaces:
              from: Same
          listeners:
            - name: http
              port: 80
              protocol: HTTP
      listenerSet:
        my-set:
          enabled: true
          namespace: gateway-namespace
          targetSelector: web
          listeners:
            - name: https
              hostname: app.example.com
              port: 443
              protocol: HTTPS
    asserts:
      - documentSelector:
          path: kind
          value: ListenerSet
        equal:
          path: metadata.namespace
          value: gateway-namespace
