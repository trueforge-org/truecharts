suite: route integrations certManager schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1/ListenerSet
    - cert-manager.io/v1/Certificate
tests:
  - it: should render route certManager integration with string enabled
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          hostnames:
            - a.example.com
          integrations:
            certManager:
              enabled: "true"
              certificateIssuer: some-issuer
    asserts:
      - documentSelector:
          path: kind
          value: ListenerSet
        isKind:
          of: ListenerSet

  - it: should fail on unknown keys and missing required keys in route integrations certManager
    set:
      service: &service
        my-service:
          enabled: true
          primary: true
          ports:
            main:
              enabled: true
              primary: true
              port: 8080
      route:
        my-route:
          enabled: true
          gateway: some-gateway
          integrations:
            certManager:
              enabled: true
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/route/my-route/integrations/certManager': additional properties 'unknownKey' not allowed"
