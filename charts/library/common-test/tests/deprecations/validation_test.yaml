suite: deprecations validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with the enabled top level redis
    set:
      redis:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Expected no [redis] key, it is replaced by [dependencies.valkey]. Move [enabled] to [dependencies.valkey], and [password] to [dependencies.valkey.depconfig]. The connection details are available under [dependencies.valkey.depconfig.creds]

  - it: should fail with the enabled top level valkey
    set:
      valkey:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Expected no [valkey] key, it is replaced by [dependencies.valkey]. Move [enabled] to [dependencies.valkey], and [password] to [dependencies.valkey.depconfig]. The connection details are available under [dependencies.valkey.depconfig.creds]

  - it: should fail with the top level valkey enabled using a template
    set:
      useValkey: true
      valkey:
        enabled: "{{ .Values.useValkey }}"
    asserts:
      - failedTemplate:
          errorMessage: Expected no [valkey] key, it is replaced by [dependencies.valkey]. Move [enabled] to [dependencies.valkey], and [password] to [dependencies.valkey.depconfig]. The connection details are available under [dependencies.valkey.depconfig.creds]

  - it: should fail with the enabled top level valkey, even when the dependency is enabled
    set:
      valkey:
        enabled: true
      dependencies:
        valkey:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Expected no [valkey] key, it is replaced by [dependencies.valkey]. Move [enabled] to [dependencies.valkey], and [password] to [dependencies.valkey.depconfig]. The connection details are available under [dependencies.valkey.depconfig.creds]

  - it: should not fail with the disabled top level redis and valkey
    set:
      redis:
        enabled: false
        password: testpassword
      valkey:
        enabled: false
        password: testpassword
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail with the top level redis and valkey disabled using a template
    set:
      useValkey: false
      redis:
        enabled: "{{ .Values.useValkey }}"
      valkey:
        enabled: "{{ .Values.useValkey }}"
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail with the top level redis and valkey without enabled
    set:
      redis:
        password: testpassword
      valkey:
        password: testpassword
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail with the top level redis and valkey unset
    set:
      redis: null
      valkey: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should not fail with the dependency valkey
    set:
      dependencies:
        valkey:
          enabled: true
    asserts:
      - documentSelector:
          path: kind
          value: Secret
        equal:
          path: metadata.name
          value: test-release-name-valkeycreds

  - it: should fail with the unused top level volumeClaimTemplates
    set:
      volumeClaimTemplates:
        data:
          enabled: true
          mountPath: /data
        config:
          enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "Expected no [volumeClaimTemplates], as this key is not used, so [config, data] would not be persisted. Use [persistence] instead, a new volume on an existing StatefulSet can't use [type: vct]"

  - it: should not fail with an empty top level volumeClaimTemplates
    set:
      volumeClaimTemplates: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail with the removed vpn add-on
    set:
      addons:
        vpn:
          type: wireguard
    asserts:
      - failedTemplate:
          errorMessage: Your current Common-Chart version does not support [.Values.addons.vpn] please use [.Values.addons.tailscale] or [.Values.addons.gluetun] instead

  - it: should not fail with the supported add-ons
    set:
      addons:
        gluetun:
          enabled: false
        tailscale:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
