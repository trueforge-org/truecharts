suite: volsync validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with empty name
    set:
      persistence:
        src-backup:
          enabled: true
          type: pvc
          mountPath: /backed-up
          volsync:
            - name: ""
              type: restic
              credentials: my-secret
              src:
                enabled: true
              dest:
                enabled: false
      credentials: {}
    asserts:
      - failedTemplate:
          errorMessage: VolSync - Expected non-empty [name]

  - it: should fail with empty credentials
    set:
      persistence:
        src-backup:
          enabled: true
          type: pvc
          mountPath: /backedup
          volsync:
            - name: my-backup
              type: restic
              credentials: ""
              src:
                enabled: true
              dest:
                enabled: false
    asserts:
      - failedTemplate:
          errorMessage: VolSync - Expected non-empty [credentials]

  - it: should fail if referenced credentials does not exist
    set:
      persistence: &persistence
        src-backup:
          enabled: true
          type: pvc
          mountPath: /backedup
          volsync:
            - name: my-backup
              type: restic
              credentials: my-secret
              src:
                enabled: true
              dest:
                enabled: false
      credentials:
        my-other-secret:
          type: s3
          url: http://some-url
          bucket: some-bucket
          encrKey: some-key
          accessKey: some-access-key
          secretKey: some-secret-key
    asserts:
      - failedTemplate:
          errorMessage: VolSync - Expected credentials [my-secret] to be defined in [credentials] which currently contains [my-other-secret] keys

  - it: should fail if credentials.url is empty
    set:
      persistence: *persistence
      credentials:
        my-secret:
          type: s3
          url: ""
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/credentials/my-secret/url'': minLength: got 0, want 1'

  - it: should fail if credentials.bucket is empty
    set:
      persistence: *persistence
      credentials:
        my-secret:
          type: s3
          url: http://some-url
          bucket: ""
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/credentials/my-secret/bucket'': minLength: got 0, want 1'

  - it: should fail if credentials.encrKey is empty
    set:
      persistence: *persistence
      credentials:
        my-secret:
          type: s3
          url: http://some-url
          bucket: some-bucket
          encrKey: ""
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/credentials/my-secret/encrKey'': minLength: got 0, want 1'

  - it: should fail if credentials.accessKey is empty
    set:
      persistence: *persistence
      credentials:
        my-secret:
          type: s3
          url: http://some-url
          bucket: some-bucket
          encrKey: some-key
          accessKey: ""
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/credentials/my-secret/accessKey'': minLength: got 0, want 1'

  - it: should fail if credentials.secretKey is empty
    set:
      persistence: *persistence
      credentials:
        my-secret:
          type: s3
          url: http://some-url
          bucket: some-bucket
          encrKey: some-key
          accessKey: some-access-key
          secretKey: ""
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/credentials/my-secret/secretKey'': minLength: got 0, want 1'

  - it: should fail with invalid copy method
    set:
      persistence:
        src-backup:
          enabled: true
          type: pvc
          mountPath: /backedup
          volsync:
            - name: my-backup
              type: restic
              credentials: my-secret
              copyMethod: invalid
              src:
                enabled: true
              dest:
                enabled: false
      credentials: &credentials
        my-secret:
          type: s3
          url: http://some-url
          bucket: some-bucket
          encrKey: some-key
          accessKey: some-access-key
          secretKey: some-secret-key
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/persistence/src-backup/volsync/0/copyMethod'': value must be one of ''Clone'', ''Direct'', ''Snapshot'''

  - it: should fail with empty type
    set:
      persistence:
        src-backup:
          enabled: true
          type: pvc
          mountPath: /backedup
          volsync:
            - name: my-backup
              type: ""
              credentials: my-secret
              src:
                enabled: true
              dest:
                enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/persistence/src-backup/volsync/0/type'': value must be ''restic'''

  - it: should fail with invalid type
    set:
      persistence:
        src-backup:
          enabled: true
          type: pvc
          mountPath: /backedup
          volsync:
            - name: my-backup
              type: invalid
              credentials: my-secret
              src:
                enabled: true
              dest:
                enabled: false
      credentials: *credentials
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/persistence/src-backup/volsync/0/type'': value must be ''restic'''

  - it: should fail with invalid credentials type
    set:
      persistence:
        src-backup:
          enabled: true
          type: pvc
          mountPath: /backedup
          volsync:
            - name: my-backup
              type: restic
              credentials: my-creds
              src:
                enabled: true
              dest:
                enabled: false
      credentials:
        my-creds:
          type: invalid
    asserts:
      - failedTemplate:
          errorMessage: VolSync - Expected [type] in [credentials.my-creds] to be one of [s3], but got [invalid]
