suite: serviceAccount schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render service account with string typed enabled
    set:
      serviceAccount:
        my-sa:
          enabled: "true"
          primary: true
    asserts:
      - isKind:
          of: ServiceAccount
        documentIndex: 0

  - it: should fail on unknown keys in service account
    set:
      serviceAccount:
        my-sa:
          enabled: true
          unknown: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/serviceAccount/my-sa': (additional properties|additionalProperties)"

  - it: should render service account with automountServiceAccountToken when it is set
    set:
      serviceAccount:
        my-sa:
          enabled: true
          primary: true
          automountServiceAccountToken: true
    asserts:
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: automountServiceAccountToken
          value: true
        documentIndex: 0
