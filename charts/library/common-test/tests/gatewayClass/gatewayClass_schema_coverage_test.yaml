suite: gatewayClass schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render a gatewayClass with string enabled, primary, annotations, labels and parametersRef namespace
    set:
      gatewayClass:
        my-class:
          enabled: "true"
          primary: true
          controllerName: example.com/controller
          annotations:
            my-annotation: my-value
          labels:
            my-label: my-value
          parametersRef:
            group: some.group
            kind: SomeKind
            name: some-name
            namespace: some-namespace
    asserts:
      - documentSelector: &gc
          path: kind
          value: GatewayClass
        equal:
          path: metadata.annotations.my-annotation
          value: my-value
      - documentSelector: *gc
        equal:
          path: spec.parametersRef.namespace
          value: some-namespace

  - it: should render a gatewayClass with a null parametersRef namespace
    set:
      gatewayClass:
        my-class:
          enabled: true
          controllerName: example.com/controller
          parametersRef:
            group: some.group
            kind: SomeKind
            name: some-name
            namespace: null
    asserts:
      - documentSelector: *gc
        isKind:
          of: GatewayClass

  - it: should fail on unknown keys in gatewayClass
    set:
      gatewayClass:
        my-class:
          enabled: true
          controllerName: example.com/controller
          unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/gatewayClass/my-class': additional properties 'unknownKey' not allowed"

  - it: should fail on unknown keys in gatewayClass parametersRef
    set:
      gatewayClass:
        my-class:
          enabled: true
          controllerName: example.com/controller
          parametersRef:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/gatewayClass/my-class/parametersRef': additional properties 'unknownKey' not allowed"

  - it: should fail on empty group, kind and name in gatewayClass parametersRef
    set:
      gatewayClass:
        my-class:
          enabled: true
          controllerName: example.com/controller
          parametersRef:
            group: ""
            kind: ""
            name: ""
    asserts:
      - failedTemplate:
          errorPattern: "at '/gatewayClass/my-class/parametersRef/group'"
