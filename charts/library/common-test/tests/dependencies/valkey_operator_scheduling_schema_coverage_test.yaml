suite: valkey operator scheduling schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should render valkey operator scheduling tolerations, nodeSelector and priorityClassName
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          scheduling:
            nodeSelector:
              disk: ssd
            priorityClassName: high
            tolerations:
            - key: a
              operator: Exists
              value: '1'
              effect: NoSchedule
              tolerationSeconds: 10
            - key: a
              operator: Equal
              value: '1'
              effect: PreferNoSchedule
              tolerationSeconds: 10
            - key: a
              operator: Lt
              value: '1'
              effect: NoExecute
              tolerationSeconds: 10
            - key: a
              operator: Gt
              value: '1'
              effect: NoSchedule
              tolerationSeconds: 10
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.priorityClassName
      value: high
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.tolerations[3].operator
      value: Gt
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.tolerations[2].effect
      value: NoExecute
- it: should render valkey operator scheduling topologySpreadConstraints
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          scheduling:
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  a: b
                matchExpressions:
                - key: k
                  operator: In
                  values:
                  - v
              minDomains: 2
              nodeAffinityPolicy: Honor
              nodeTaintsPolicy: Honor
              matchLabelKeys:
              - pod-template-hash
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  a: b
                matchExpressions:
                - key: k
                  operator: In
                  values:
                  - v
              minDomains: 2
              nodeAffinityPolicy: Ignore
              nodeTaintsPolicy: Ignore
              matchLabelKeys:
              - pod-template-hash
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.topologySpreadConstraints[1].whenUnsatisfiable
      value: ScheduleAnyway
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.topologySpreadConstraints[0].nodeTaintsPolicy
      value: Honor
- it: should render valkey operator scheduling nodeAffinity
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          scheduling:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: k
                      operator: In
                      values:
                      - v
                    - key: k
                      operator: NotIn
                      values:
                      - v
                    - key: k
                      operator: Exists
                      values:
                      - v
                    - key: k
                      operator: DoesNotExist
                      values:
                      - v
                    - key: k
                      operator: Gt
                      values:
                      - v
                    - key: k
                      operator: Lt
                      values:
                      - v
                    matchFields:
                    - key: k
                      operator: In
                      values:
                      - v
                    - key: k
                      operator: NotIn
                      values:
                      - v
                    - key: k
                      operator: Exists
                      values:
                      - v
                    - key: k
                      operator: DoesNotExist
                      values:
                      - v
                    - key: k
                      operator: Gt
                      values:
                      - v
                    - key: k
                      operator: Lt
                      values:
                      - v
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 1
                  preference:
                    matchExpressions:
                    - key: k
                      operator: In
                      values:
                      - v
                    - key: k
                      operator: NotIn
                      values:
                      - v
                    - key: k
                      operator: Exists
                      values:
                      - v
                    - key: k
                      operator: DoesNotExist
                      values:
                      - v
                    - key: k
                      operator: Gt
                      values:
                      - v
                    - key: k
                      operator: Lt
                      values:
                      - v
                    matchFields:
                    - key: k
                      operator: In
                      values:
                      - v
                    - key: k
                      operator: NotIn
                      values:
                      - v
                    - key: k
                      operator: Exists
                      values:
                      - v
                    - key: k
                      operator: DoesNotExist
                      values:
                      - v
                    - key: k
                      operator: Gt
                      values:
                      - v
                    - key: k
                      operator: Lt
                      values:
                      - v
                - weight: 100
                  preference: {}
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[1].weight
      value: 100
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[5].operator
      value: Lt
- it: should render valkey operator scheduling podAffinity and podAntiAffinity
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          scheduling:
            affinity:
              podAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      a: b
                  namespaces:
                  - x
                  namespaceSelector:
                    matchLabels:
                      n: m
                  topologyKey: kubernetes.io/hostname
                  matchLabelKeys:
                  - a
                  mismatchLabelKeys:
                  - b
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 50
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        a: b
                    namespaces:
                    - x
                    namespaceSelector:
                      matchLabels:
                        n: m
                    topologyKey: kubernetes.io/hostname
                    matchLabelKeys:
                    - a
                    mismatchLabelKeys:
                    - b
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      a: b
                  namespaces:
                  - x
                  namespaceSelector:
                    matchLabels:
                      n: m
                  topologyKey: kubernetes.io/hostname
                  matchLabelKeys:
                  - a
                  mismatchLabelKeys:
                  - b
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 50
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        a: b
                    namespaces:
                    - x
                    namespaceSelector:
                      matchLabels:
                        n: m
                    topologyKey: kubernetes.io/hostname
                    matchLabelKeys:
                    - a
                    mismatchLabelKeys:
                    - b
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.affinity.podAffinity.requiredDuringSchedulingIgnoredDuringExecution[0].topologyKey
      value: kubernetes.io/hostname
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
      value: 50
- it: should render valkey operator scheduling node spread, zone spread and zone pinning
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          scheduling:
            node:
              spread:
                shard:
                  mode: Disabled
                primaries:
                  mode: Preferred
                pods:
                  mode: Required
            zone:
              spread:
                shard:
                  mode: Required
                primaries:
                  mode: Disabled
                pods:
                  mode: Preferred
              pinning:
                zones:
                - zone-a
                - b
                - Z1_x.y
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.node.spread.pods.mode
      value: Required
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.zone.pinning.zones
      value:
      - zone-a
      - b
      - Z1_x.y
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.zone.spread.shard.mode
      value: Required
- it: should render valkey operator scheduling node spread with other modes
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          scheduling:
            node:
              spread:
                shard:
                  mode: Preferred
                primaries:
                  mode: Required
                pods:
                  mode: Disabled
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.node.spread.primaries.mode
      value: Required
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.scheduling.node.spread.pods.mode
      value: Disabled
