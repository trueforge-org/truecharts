suite: postgresql operator sidecar configuration schema coverage failures
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should fail on unknown keys and types in postgresql operator recovery sidecar configuration
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          recovery:
            instanceSidecarConfiguration:
              bogus: 1
              additionalContainerArgs: x
              logLevel: X
              resources:
                bogus: 1
                claims:
                - bogus: 1
                  request: 1
                limits:
                  cpu: []
                  a: 1
                requests:
                  cpu: {}
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/additionalContainerArgs'': got string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/logLevel'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/resources'': additional properties'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/resources/claims/0'': additional properties'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/resources/claims/0'': missing property'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/resources/claims/0/request'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/resources/limits/cpu'': got array'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/resources/requests/cpu'': got object'

- it: should fail on non string items in postgresql operator recovery sidecar configuration args and claims
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          recovery:
            instanceSidecarConfiguration:
              additionalContainerArgs:
              - 1
              resources:
                claims:
                - x
                limits: x
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/additionalContainerArgs/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/resources/claims/0'': got string, want object'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/resources/limits'': got string, want object'

- it: should fail on a non array env in postgresql operator recovery sidecar configuration
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          recovery:
            instanceSidecarConfiguration:
              env: x
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env'': got string, want array'

- it: should fail on unknown keys, types and missing name in postgresql operator recovery sidecar env
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          recovery:
            instanceSidecarConfiguration:
              env:
              - bogus: 1
                name: 1
                value: 1
                valueFrom: x
              - valueFrom:
                  bogus: 1
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/value'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom'': got string, want object'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1'': missing property ''name'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom'': additional properties'

- it: should fail on unknown keys, types and missing keys in postgresql operator recovery sidecar env config map and secret refs
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          recovery:
            instanceSidecarConfiguration:
              env:
              - name: A
                valueFrom:
                  configMapKeyRef:
                    bogus: 1
                    name: 1
                    optional: x
              - name: B
                valueFrom:
                  secretKeyRef:
                    bogus: 1
                    key: 1
                    name: 1
                    optional: x
              - name: C
                valueFrom:
                  secretKeyRef:
                    name: my-secret
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/2/valueFrom/secretKeyRef'': missing property ''key'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/configMapKeyRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/configMapKeyRef'': missing property ''key'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/configMapKeyRef/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/configMapKeyRef/optional'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/secretKeyRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/secretKeyRef/key'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/secretKeyRef/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/secretKeyRef/optional'': got string, want boolean'

- it: should fail on unknown keys, types and missing keys in postgresql operator recovery sidecar env field and resource refs
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          recovery:
            instanceSidecarConfiguration:
              env:
              - name: A
                valueFrom:
                  fieldRef:
                    bogus: 1
                    apiVersion: 1
              - name: B
                valueFrom:
                  resourceFieldRef:
                    bogus: 1
                    containerName: 1
                    divisor: []
                    resource: 1
              - name: C
                valueFrom:
                  resourceFieldRef:
                    resource: limits.cpu
                    divisor: true
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/fieldRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/fieldRef'': missing property ''fieldPath'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/fieldRef/apiVersion'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/resourceFieldRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/resourceFieldRef/containerName'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/resourceFieldRef/divisor'': got array'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/resourceFieldRef/resource'': got number, want string'

- it: should fail on unknown keys, types and missing keys in postgresql operator recovery sidecar env file ref
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          recovery:
            instanceSidecarConfiguration:
              env:
              - name: A
                valueFrom:
                  fileKeyRef:
                    bogus: 1
                    key: 1
                    optional: x
                    path: 1
                    volumeName: 1
              - name: B
                valueFrom:
                  fileKeyRef: {}
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/fileKeyRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/fileKeyRef/key'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/fileKeyRef/optional'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/fileKeyRef/path'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/fileKeyRef/volumeName'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/1/valueFrom/fileKeyRef'': missing propert'

- it: should fail on a missing resource in a postgresql operator recovery sidecar env resource ref
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          recovery:
            instanceSidecarConfiguration:
              env:
              - name: A
                valueFrom:
                  resourceFieldRef:
                    containerName: x
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/recovery/instanceSidecarConfiguration/env/0/valueFrom/resourceFieldRef'': missing property ''resource'''
