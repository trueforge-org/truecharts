suite: postgresql operator recovery schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
capabilities:
  apiVersions:
  - barmancloud.cnpg.io/v1/ObjectStore
tests:
- it: should render postgresql operator recovery with sidecar configuration
  template: common.yaml
  set:
    credentials:
      my-creds:
        type: s3
        accessKey: PLACEHOLDERACCESS
        secretKey: PLACEHOLDERSECRET
        bucket: my-bucket
        encrKey: PLACEHOLDERENCR
        url: http://example.invalid
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          mode: recovery
          recovery:
            destinationPath: s3://my-bucket/path
            credentials: my-creds
            pitrTarget:
              time: "2026-01-01 00:00:00"
            instanceSidecarConfiguration:
              logLevel: error
              additionalContainerArgs:
              - --foo
              retentionPolicyIntervalSeconds: 1800
              resources:
                claims:
                - name: my-claim
                  request: my-request
                limits:
                  cpu: 1
                  memory: 1Gi
                requests:
                  cpu: 1
                  memory: 128Mi
              env:
              - name: PLAIN
                value: plain
              - name: FROM_CONFIGMAP
                valueFrom:
                  configMapKeyRef:
                    name: my-configmap
                    key: my-key
                    optional: true
              - name: FROM_SECRET
                valueFrom:
                  secretKeyRef:
                    name: my-secret
                    key: my-key
                    optional: false
              - name: FROM_FIELD
                valueFrom:
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.name
              - name: FROM_FILE
                valueFrom:
                  fileKeyRef:
                    key: my-key
                    path: my/path
                    volumeName: my-volume
                    optional: true
              - name: FROM_RESOURCE_INT
                valueFrom:
                  resourceFieldRef:
                    containerName: my-container
                    resource: limits.cpu
                    divisor: 1
              - name: FROM_RESOURCE_STR
                valueFrom:
                  resourceFieldRef:
                    resource: limits.memory
                    divisor: 1Mi
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    isKind:
      of: Cluster

- it: should render postgresql operator recovery sidecar log levels
  template: common.yaml
  set:
    credentials:
      my-creds:
        type: s3
        accessKey: PLACEHOLDERACCESS
        secretKey: PLACEHOLDERSECRET
        bucket: my-bucket
        encrKey: PLACEHOLDERENCR
        url: http://example.invalid
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          mode: recovery
          recovery:
            credentials: my-creds
            instanceSidecarConfiguration:
              logLevel: warning
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    isKind:
      of: Cluster

