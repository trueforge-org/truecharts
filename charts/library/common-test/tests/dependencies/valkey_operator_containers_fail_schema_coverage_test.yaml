suite: valkey operator containers schema coverage failures
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should fail on unknown keys, missing required keys and wrong types in valkey operator containers
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - image: x
            bogus: 1
            imagePullPolicy: X
            restartPolicy: X
            terminationMessagePolicy: X
            command:
            - 1
            args:
            - 1
            workingDir: 1
            stdin: x
          - name: ''
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0'': missing property ''name'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/imagePullPolicy'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/restartPolicy'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/terminationMessagePolicy'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/command/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/args/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/workingDir'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/1/name'': minLength'
- it: should fail on unknown keys, missing required keys and wrong types in valkey operator container env
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - name: a
            env:
            - bogus: 1
              value: 1
            - name: x
              valueFrom:
                bogus: 1
                fieldRef:
                  bogus: 1
                  apiVersion: 1
                resourceFieldRef:
                  bogus: 1
                  containerName: 1
                  divisor: true
                configMapKeyRef:
                  bogus: 1
                  name: 1
                  optional: x
                secretKeyRef:
                  bogus: 1
                  name: 1
                  optional: x
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/0'': missing property ''name'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/0/value'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/fieldRef'': missing property ''fieldPath'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/fieldRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/fieldRef/apiVersion'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/resourceFieldRef'': missing property ''resource'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/resourceFieldRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/resourceFieldRef/containerName'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/configMapKeyRef'': missing property ''key'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/configMapKeyRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/configMapKeyRef/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/configMapKeyRef/optional'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/secretKeyRef'': missing property ''key'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/secretKeyRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/secretKeyRef/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/env/1/valueFrom/secretKeyRef/optional'': got string, want boolean'
- it: should fail on unknown keys and wrong types in valkey operator container envFrom
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - name: a
            envFrom:
            - bogus: 1
              prefix: 1
              configMapRef:
                bogus: 1
                name: 1
                optional: x
              secretRef:
                bogus: 1
                name: 1
                optional: x
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/envFrom/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/envFrom/0/prefix'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/envFrom/0/configMapRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/envFrom/0/configMapRef/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/envFrom/0/configMapRef/optional'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/envFrom/0/secretRef'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/envFrom/0/secretRef/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/envFrom/0/secretRef/optional'': got string, want boolean'
- it: should fail on unknown keys, missing required keys, bounds and enums in valkey operator container ports
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - name: a
            ports:
            - bogus: 1
              name: abcdefghijklmnopqrstuvw
              hostPort: 0
              protocol: X
              hostIP: 1
            - containerPort: 65536
              hostPort: 65536
            - containerPort: 0
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/0'': missing property ''containerPort'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/0/name'': maxLength: got'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/0/hostPort'': minimum: got'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/0/protocol'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/0/hostIP'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/1/containerPort'': maximum: got'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/1/hostPort'': maximum: got'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/ports/2/containerPort'': minimum: got'
- it: should fail on unknown keys, missing required keys and enums in valkey operator container volumes, resizePolicy and restartPolicyRules
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - name: a
            volumeMounts:
            - bogus: 1
              recursiveReadOnly: X
              mountPropagation: X
              readOnly: x
              subPath: 1
              subPathExpr: 1
              bindMountOptions:
              - 1
            volumeDevices:
            - bogus: 1
              name: 1
            - devicePath: /x
            resizePolicy:
            - bogus: 1
              restartPolicy: X
            - resourceName: cpu
            restartPolicyRules:
            - bogus: 1
              exitCodes:
                bogus: 1
                operator: X
                values:
                - a
            - action: X
            - action: Restart
              exitCodes: {}
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeMounts/0'': missing properties ''name'', ''mountPath'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeMounts/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeMounts/0/recursiveReadOnly'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeMounts/0/mountPropagation'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeMounts/0/readOnly'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeMounts/0/subPath'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeMounts/0/subPathExpr'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeMounts/0/bindMountOptions/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeDevices/0'': missing property ''devicePath'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeDevices/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeDevices/0/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/resizePolicy/0'': missing property ''resourceName'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/resizePolicy/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/resizePolicy/0/restartPolicy'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/restartPolicyRules/0'': missing property ''action'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/restartPolicyRules/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/restartPolicyRules/0/exitCodes'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/restartPolicyRules/0/exitCodes/operator'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/restartPolicyRules/0/exitCodes/values/0'': got string, want integer'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/restartPolicyRules/1/action'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/restartPolicyRules/2/exitCodes'': missing property ''operator'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/volumeDevices/1'': missing property ''name'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers/0/resizePolicy/1'': missing property ''restartPolicy'''
