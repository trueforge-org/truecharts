suite: dependencies databases depconfig schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should render the connection details of clickhouse depconfig creds
  template: common.yaml
  set:
    dependencies:
      clickhouse:
        enabled: true
        depconfig:
          creds:
            plainhost: my-host
  asserts:
  - documentSelector:
      path: kind
      value: StatefulSet
    isKind:
      of: StatefulSet

- it: should render the connection details of mariadb depconfig creds
  template: common.yaml
  set:
    dependencies:
      mariadb:
        enabled: true
        depconfig:
          creds:
            plainhost: my-host
  asserts:
  - documentSelector:
      path: kind
      value: StatefulSet
    isKind:
      of: StatefulSet

- it: should render the connection details of mongodb depconfig creds
  template: common.yaml
  set:
    dependencies:
      mongodb:
        enabled: true
        depconfig:
          creds:
            plainhost: my-host
  asserts:
  - documentSelector:
      path: kind
      value: StatefulSet
    isKind:
      of: StatefulSet

- it: should render the depconfig and operator settings of a generic dependency
  template: common.yaml
  set:
    dependencies:
      mydep:
        enabled: true
        depconfig:
          password: PLACEHOLDERPASSWORD
          creds:
            plainhost: my-host
        operator:
          anything: 1
  asserts:
  - notFailedTemplate: {}
