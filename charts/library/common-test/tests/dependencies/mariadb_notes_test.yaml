suite: dependencies mariadb notes test
templates:
  - common.yaml
  - NOTES.txt
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should show the connection details of mariadb
    template: NOTES.txt
    set:
      dependencies:
        mariadb:
          enabled: true
          depconfig:
            mariadbUsername: my-user
            mariadbDatabase: my-database
    asserts:
      - matchRegexRaw:
          pattern: "## MariaDB Database\n- Host: test-release-name-common-test-mariadb-main\n- Port: 3306\n"
      - matchRegexRaw:
          pattern: "- Database: my-database\n- Username: my-user\n"
      - matchRegexRaw:
          pattern: "- JDBC URL: .*jdbc:mariadb://test-release-name-common-test-mariadb-main:3306/my-database"

  - it: should not show mariadb with the dependency disabled
    template: NOTES.txt
    asserts:
      - notMatchRegexRaw:
          pattern: "MariaDB Database"
