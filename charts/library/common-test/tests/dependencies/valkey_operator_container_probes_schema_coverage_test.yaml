suite: valkey operator container probes and lifecycle schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should render valkey operator container probes
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - name: server
            livenessProbe:
              httpGet:
                path: /ping
                port: 8080
                host: localhost
                scheme: HTTPS
                httpHeaders:
                - name: X-A
                  value: b
                protocol: HTTP2
              initialDelaySeconds: 1
              timeoutSeconds: 2
              periodSeconds: 3
              successThreshold: 1
              failureThreshold: 4
              terminationGracePeriodSeconds: 5
            readinessProbe:
              tcpSocket:
                port: redis
                host: localhost
            startupProbe:
              exec:
                command:
                - valkey-cli
                - ping
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[0].livenessProbe.httpGet.path
      value: /ping
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[0].livenessProbe.failureThreshold
      value: 4
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[0].readinessProbe.tcpSocket.port
      value: redis
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[0].startupProbe.exec.command
      value:
      - valkey-cli
      - ping
- it: should render valkey operator container grpc probes and http variants
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - name: grpc-a
            image: example.com/x:1
            livenessProbe:
              grpc:
                port: 50051
                service: x
                mode: Plaintext
          - name: grpc-b
            image: example.com/x:1
            livenessProbe:
              grpc:
                port: 50052
                mode: TLS
          - name: http-a
            image: example.com/x:1
            readinessProbe:
              httpGet:
                port: http
                scheme: HTTP
                protocol: HTTP1
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[0].livenessProbe.grpc.port
      value: 50051
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[1].livenessProbe.grpc.mode
      value: TLS
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[2].readinessProbe.httpGet.scheme
      value: HTTP
- it: should render valkey operator container lifecycle hooks
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - name: life
            image: example.com/x:1
            lifecycle:
              postStart:
                exec:
                  command:
                  - sh
                  - -c
                  - 'true'
              preStop:
                httpGet:
                  port: 80
                  path: /stop
          - name: life-tcp
            image: example.com/x:1
            lifecycle:
              postStart:
                tcpSocket:
                  port: 80
                  host: h
              preStop:
                sleep:
                  seconds: 5
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[0].lifecycle.postStart.exec.command
      value:
      - sh
      - -c
      - 'true'
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[1].lifecycle.preStop.sleep.seconds
      value: 5
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[1].lifecycle.postStart.tcpSocket.port
      value: 80
- it: should render every stop signal of valkey operator container lifecycle
