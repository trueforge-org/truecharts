suite: mongodb dependency wait test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should wait for mongodb in the workloads of the chart only
    set:
      image:
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        my-app: &appWorkload
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              my-container:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        mongodb: &mongodb
          enabled: true
          depconfig:
            mongodbDatabase: mydb
    asserts:
      - documentSelector: &appDoc
          path: kind
          value: Deployment
        equal:
          path: metadata.name
          value: test-release-name-common-test
      - documentSelector: *appDoc
        equal:
          path: spec.template.spec.initContainers[0].name
          value: test-release-name-common-test-system-mongodb-wait
      - documentSelector: *appDoc
        matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: "^oci.trueforge.org/containerforge/mongosh:"
      - documentSelector: *appDoc
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MONGODB_HOST
            value: test-release-name-common-test-mongodb-main
      - documentSelector: *appDoc
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MONGODB_PORT
            value: "27017"
      - documentSelector: *appDoc
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MONGODB_DATABASE
            value: mydb
      - documentSelector: *appDoc
        matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: mongosh --host \$\{MONGODB_HOST\} --port \$\{MONGODB_PORT\} \$\{MONGODB_DATABASE\}
      - documentSelector:
          path: kind
          value: StatefulSet
        equal:
          path: metadata.name
          value: test-release-name-common-test-mongodb-main
      - documentSelector:
          path: kind
          value: StatefulSet
        notExists:
          path: spec.template.spec.initContainers

  - it: should wait on the port of the primary service of mongodb
    set:
      image:
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        my-app: *appWorkload
      dependencies:
        mongodb:
          enabled: true
          service:
            main:
              ports:
                main:
                  port: 37017
                  targetPort: 37017
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MONGODB_PORT
            value: "37017"

  - it: should not wait for mongodb in workloads of the chart with dbWait disabled
    set:
      image:
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        my-app:
          enabled: true
          primary: true
          type: Deployment
          dbWait: false
          podSpec:
            containers:
              my-container:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        mongodb: *mongodb
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        notExists:
          path: spec.template.spec.initContainers

  - it: should not add the wait with the mongodb dependency disabled
    set:
      image:
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        my-app: *appWorkload
      dependencies:
        mongodb:
          enabled: false
    asserts:
      - documentSelector:
          path: kind
          value: Deployment
        notExists:
          path: spec.template.spec.initContainers
