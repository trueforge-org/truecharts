suite: postgresql operator cluster schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should render postgresql operator cluster settings, update strategy and log level
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            singleNode: true
            logLevel: debug
            primaryUpdateMethod: restart
            primaryUpdateStrategy: supervised
            postgresql:
              max_connections: "100"
            initdb:
              walSegmentSize: 16
            envFrom:
            - configMapRef:
                name: my-configmap
                expandObjectName: false
            - secretRef:
                name: my-secret
                expandObjectName: false
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    isKind:
      of: Cluster
  - documentSelector:
      path: kind
      value: Cluster
    equal:
      path: spec.logLevel
      value: debug
  - documentSelector:
      path: kind
      value: Cluster
    equal:
      path: spec.primaryUpdateStrategy
      value: supervised

- it: should render the other postgresql operator cluster log levels
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            logLevel: trace
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    equal:
      path: spec.logLevel
      value: trace

- it: should render postgresql operator cluster log level error
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            logLevel: error
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    equal:
      path: spec.logLevel
      value: error

- it: should render postgresql operator cluster log level warning
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            logLevel: warning
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    equal:
      path: spec.logLevel
      value: warning

- it: should render postgresql operator cluster primaryUpdateMethod switchover and strategy unsupervised
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            primaryUpdateMethod: switchover
            primaryUpdateStrategy: unsupervised
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    isKind:
      of: Cluster

- it: should render postgresql operator cluster storage with data sources
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            storage:
              size: 1Gi
              accessModes:
              - ReadWriteOnce
              storageClass: my-class
              volumeName: my-volume
              dataSource:
                kind: VolumeSnapshot
                name: my-snapshot
              dataSourceRef:
                apiGroup: snapshot.storage.k8s.io
                kind: VolumeSnapshot
                name: my-snapshot
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    isKind:
      of: Cluster

- it: should render postgresql operator cluster log level info
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            logLevel: info
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    isKind:
      of: Cluster

- it: should render postgresql operator cluster envFrom as an object, a null postgresql and string accessModes
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            envFrom: {}
            postgresql: null
            storage:
              accessModes: ReadWriteOnce
  asserts:
  - documentSelector:
      path: kind
      value: Cluster
    isKind:
      of: Cluster
