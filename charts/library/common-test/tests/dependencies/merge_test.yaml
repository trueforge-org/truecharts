suite: dependencies merge test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with dependencies that are not a map
    set:
      dependencies: some-string
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/dependencies'': got string, want object'

  - it: should fail with an invalid dependency name
    set:
      dependencies:
        My_Dep:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: Dependencies - Expected the name of dependency \[My_Dep\] to be lowercase alphanumeric characters or \[-\]
