suite: valkey operator security contexts schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should render valkey operator exporter settings
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          exporter:
            enabled: true
            imageSelector: valkeyExporterImage
            args:
            - --debug
            resources:
              limits:
                cpu: 100m
                memory: 1
              requests:
                cpu: 10
              claims:
              - name: c
                request: r
              - name: d
            securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              procMount: Default
              readOnlyRootFilesystem: true
              runAsGroup: 568
              runAsNonRoot: true
              runAsUser: 568
              capabilities:
                add:
                - NET_BIND_SERVICE
                drop:
                - ALL
              appArmorProfile:
                type: Localhost
                localhostProfile: prof
              seccompProfile:
                type: Localhost
                localhostProfile: prof
              seLinuxOptions:
                level: s0
                role: r
                type: t
                user: u
              windowsOptions:
                gmsaCredentialSpec: a
                gmsaCredentialSpecName: b
                hostProcess: false
                runAsUserName: c
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.exporter.enabled
      value: true
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.exporter.args
      value:
      - --debug
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.exporter.securityContext.capabilities.drop
      value:
      - ALL
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.exporter.securityContext.windowsOptions.runAsUserName
      value: c
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.exporter.resources.claims[1].name
      value: d
- it: should render valkey operator exporter security context variants
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers:
          - name: metrics-exporter
            securityContext:
              procMount: Unmasked
              appArmorProfile:
                type: Unconfined
              seccompProfile:
                type: Unconfined
          - name: server
            securityContext:
              appArmorProfile:
                type: RuntimeDefault
              seccompProfile:
                type: RuntimeDefault
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[0].securityContext.procMount
      value: Unmasked
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.containers[1].securityContext.seccompProfile.type
      value: RuntimeDefault
- it: should render valkey operator podSecurityContext
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          podSecurityContext:
            fsGroup: 568
            fsGroupChangePolicy: Always
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
            seLinuxChangePolicy: MountOption
            supplementalGroups:
            - 1
            - 2
            supplementalGroupsPolicy: Strict
            sysctls:
            - name: net.core.somaxconn
              value: '1024'
            appArmorProfile:
              type: Localhost
              localhostProfile: prof
            seccompProfile:
              type: Localhost
              localhostProfile: prof
            seLinuxOptions:
              level: s0
              role: r
              type: t
              user: u
            windowsOptions:
              gmsaCredentialSpec: a
              gmsaCredentialSpecName: b
              hostProcess: false
              runAsUserName: c
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.supplementalGroupsPolicy
      value: Strict
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.sysctls[0].name
      value: net.core.somaxconn
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.seLinuxChangePolicy
      value: MountOption
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.fsGroupChangePolicy
      value: Always
- it: should render valkey operator podSecurityContext enum variants
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          podSecurityContext:
            fsGroupChangePolicy: OnRootMismatch
            seLinuxChangePolicy: Recursive
            supplementalGroupsPolicy: Merge
            appArmorProfile:
              type: Unconfined
            seccompProfile:
              type: RuntimeDefault
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.supplementalGroupsPolicy
      value: Merge
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.appArmorProfile.type
      value: Unconfined
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.seccompProfile.type
      value: RuntimeDefault
- it: should render valkey operator podSecurityContext appArmor RuntimeDefault and seccomp Unconfined
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          podSecurityContext:
            appArmorProfile:
              type: RuntimeDefault
            seccompProfile:
              type: Unconfined
  asserts:
  - documentSelector:
      path: kind
      value: ValkeyCluster
    isKind:
      of: ValkeyCluster
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.appArmorProfile.type
      value: RuntimeDefault
  - documentSelector:
      path: kind
      value: ValkeyCluster
    equal:
      path: spec.podSecurityContext.seccompProfile.type
      value: Unconfined
