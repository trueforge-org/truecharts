suite: valkey operator settings schema coverage failures
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should fail on unknown keys, bounds, enums and types in valkey operator
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          bogus: 1
          shards: 0
          replicas: -1
          imageSelector: 1
          workloadType: X
          config:
            a: []
          terminationGracePeriodSeconds: 0
          serviceAccountName: 1
          imagePullSecrets:
          - 1
          persistence:
            bogus: 1
            enabled: x
            size: 1
            storageClass: 1
            retain: x
          podDisruptionBudget:
            bogus: 1
            mode: X
          podMetadata:
            bogus: 1
            labels:
              a: 1
            annotations:
              a: 1
          networking:
            bogus: 1
            clusterDomain: 1
            discovery:
              bogus: 1
              preferredEndpointType: X
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/shards'': minimum: got'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/replicas'': minimum: got'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/imageSelector'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/workloadType'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/config/a'': got array'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/terminationGracePeriodSeconds'': minimum: got'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/serviceAccountName'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/imagePullSecrets/0'': ''anyOf'' failed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/persistence'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/persistence/enabled'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/persistence/size'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/persistence/storageClass'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/persistence/retain'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/podDisruptionBudget'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/podDisruptionBudget/mode'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/podMetadata'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/networking'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/networking/clusterDomain'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/networking/discovery'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/networking/discovery/preferredEndpointType'': value must be one of'
- it: should fail on unknown keys, missing required keys and patterns in valkey operator users
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          users:
          - bogus: 1
            name: _a
            enabled: x
            nopass: x
            resetpass: x
            permissions: 1
            passwordSecret:
              bogus: 1
              name: 1
              keys:
              - 1
            commands:
              bogus: 1
              allow:
              - a b
              - a|b|c
              - '@'
              deny:
              - a b
              - ''
            keys:
              bogus: 1
              readWrite:
              - 1
              readOnly:
              - 1
              writeOnly:
              - 1
            channels:
              bogus: 1
              patterns:
              - 1
          - enabled: true
          - name: ''
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/name'': .* does not match pattern'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/enabled'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/nopass'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/resetpass'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/permissions'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/passwordSecret'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/passwordSecret/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/passwordSecret/keys/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/commands'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/commands/allow/0'': .* does not match pattern'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/commands/allow/1'': .* does not match pattern'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/commands/allow/2'': .* does not match pattern'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/commands/deny/0'': .* does not match pattern'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/commands/deny/1'': .* does not match pattern'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/keys'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/keys/readWrite/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/keys/readOnly/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/keys/writeOnly/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/channels'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/0/channels/patterns/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/1'': missing property ''name'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users/2/name'': minLength: got'
- it: should fail on an unsupported imagePullSecrets item in valkey operator
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          imagePullSecrets:
          - bogus: 1
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/imagePullSecrets/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/imagePullSecrets/0'': missing property ''name'''
- it: should fail on unknown keys and bounds in valkey operator containers lists
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          containers: x
          users: x
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/containers'': got string, want array'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/users'': got string, want array'
