suite: dependencies password required test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail when postgresql is enabled without password
    set:
      dependencies:
        postgresql:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Postgresql - Expected [dependencies.postgresql.depconfig.password] to be set

  - it: should not require postgresql password when postgresql is disabled
    set:
      dependencies:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when mariadb is enabled without password
    set:
      dependencies:
        mariadb:
          enabled: true
          depconfig:
            rootPassword: test-password
    asserts:
      - failedTemplate:
          errorMessage: Mariadb - Expected [dependencies.mariadb.depconfig.password] to be set

  - it: should not require mariadb password when mariadb is disabled
    set:
      dependencies:
        mariadb:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when mariadb is enabled without rootPassword
    set:
      dependencies:
        mariadb:
          enabled: true
          depconfig:
            password: test-password
    asserts:
      - failedTemplate:
          errorMessage: Mariadb - Expected [dependencies.mariadb.depconfig.rootPassword] to be set

  - it: should fail when mongodb is enabled without password
    set:
      dependencies:
        mongodb:
          enabled: true
          depconfig:
            rootPassword: test-password
    asserts:
      - failedTemplate:
          errorMessage: Mongodb - Expected [dependencies.mongodb.depconfig.password] to be set

  - it: should not require mongodb password when mongodb is disabled
    set:
      dependencies:
        mongodb:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when mongodb is enabled without rootPassword
    set:
      dependencies:
        mongodb:
          enabled: true
          depconfig:
            password: test-password
    asserts:
      - failedTemplate:
          errorMessage: Mongodb - Expected [dependencies.mongodb.depconfig.rootPassword] to be set

  - it: should fail when clickhouse is enabled without password
    set:
      dependencies:
        clickhouse:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Clickhouse - Expected [dependencies.clickhouse.depconfig.password] to be set

  - it: should not require clickhouse password when clickhouse is disabled
    set:
      dependencies:
        clickhouse:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when valkey is enabled without password
    set:
      dependencies:
        valkey:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: Valkey - Expected [dependencies.valkey.depconfig.password] to be set

  - it: should not require valkey password when valkey is disabled
    set:
      dependencies:
        valkey:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should url encode the credentials in the urls and keep the raw passwords
    set:
      dependencies:
        postgresql:
          enabled: true
          mode: standalone
          depconfig:
            password: "p@ss:/# +1"
        mariadb:
          enabled: true
          depconfig:
            password: "p@ss:/# +1"
            rootPassword: "r@ot:/# +1"
        mongodb:
          enabled: true
          depconfig:
            password: "p@ss:/# +1"
            rootPassword: "r@ot:/# +1"
        clickhouse:
          enabled: true
          depconfig:
            password: "p@ss:/# +1"
        valkey:
          enabled: true
          depconfig:
            password: "p@ss:/# +1"
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        equal:
          path: stringData.postgresql-password
          value: "p@ss:/# +1"
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        matchRegex:
          path: stringData.url
          pattern: ^postgresql://app:p%40ss%3A%2F%23%20%2B1@
      - documentSelector:
          path: metadata.name
          value: test-release-name-mariadbcreds
        equal:
          path: stringData.mariadb-password
          value: "p@ss:/# +1"
      - documentSelector:
          path: metadata.name
          value: test-release-name-mariadbcreds
        matchRegex:
          path: stringData.url
          pattern: ^mysql://test:p%40ss%3A%2F%23%20%2B1@
      - documentSelector:
          path: metadata.name
          value: test-release-name-mongodbcreds
        matchRegex:
          path: stringData.url
          pattern: ^mongodb://test:p%40ss%3A%2F%23%20%2B1@
      - documentSelector:
          path: metadata.name
          value: test-release-name-clickhousecreds
        matchRegex:
          path: stringData.url
          pattern: ^http://test:p%40ss%3A%2F%23%20%2B1@
      - documentSelector:
          path: metadata.name
          value: test-release-name-valkeycreds
        matchRegex:
          path: stringData.url
          pattern: ^redis://default:p%40ss%3A%2F%23%20%2B1@
      - documentSelector:
          path: metadata.name
          value: test-release-name-valkeycreds
        equal:
          path: stringData.plainhostpass
          value: "test-release-name-common-test-valkey-main:p@ss:/# +1"
