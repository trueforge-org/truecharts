suite: postgresql operator test
templates:
  - common.yaml
  - NOTES.txt
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should spawn a CNPG Cluster by default
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-user
        isKind:
          of: Secret
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        isKind:
          of: Secret

  - it: should spawn a CNPG Cluster with mode operator
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          mode: operator
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main

  - it: should not spawn a CNPG Cluster in standalone mode
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          mode: standalone
    asserts:
      - hasDocuments:
          count: 4
      - documentSelector:
          path: kind
          value: StatefulSet
        equal:
          path: metadata.name
          value: test-release-name-common-test-postgresql-main

  - it: should not spawn anything when disabled
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should spawn a single CNPG Cluster named after the release
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          operator:
            cluster:
              instances: 3
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.instances
          value: 3

  - it: should create the credentials in depconfig.creds in operator mode
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            password: testpassword
            postgresqlUsername: my-user
            postgresqlDatabase: my-database
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        equal:
          path: stringData
          value:
            postgresql-password: testpassword
            plainhost: test-release-name-common-test-cnpg-main-rw
            plainporthost: test-release-name-common-test-cnpg-main-rw:5432
            url: postgresql://my-user:testpassword@test-release-name-common-test-cnpg-main-rw:5432/my-database
            urlnossl: postgresql://my-user:testpassword@test-release-name-common-test-cnpg-main-rw:5432/my-database?sslmode=disable
            jdbc: jdbc:postgresql://test-release-name-common-test-cnpg-main-rw:5432/my-database

  - it: should use the same credentials in the CNPG user secret and the shared secret
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            password: testpassword
            postgresqlUsername: my-user
            postgresqlDatabase: my-database
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-cnpg-main-user
        equal:
          path: stringData
          value:
            username: my-user
            password: testpassword
      - documentSelector:
          path: kind
          value: Cluster
        isSubset:
          path: spec.bootstrap.initdb
          content:
            database: my-database
            owner: my-user
            secret:
              name: test-release-name-common-test-cnpg-main-user

  - it: should use the default user and database of postgresql
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.bootstrap.initdb.database
          value: test
      - documentSelector:
          path: kind
          value: Cluster
        equal:
          path: spec.bootstrap.initdb.owner
          value: test
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        equal:
          path: stringData.postgresql-password
          value: PLACEHOLDERPASSWORD

  - it: should point the credentials to the pooler rw service with the pooler enabled
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          operator:
            pooler:
              enabled: true
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        equal:
          path: stringData.plainhost
          value: test-release-name-common-test-cnpg-main-pooler-rw
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        notExists:
          path: stringData.plainhostRO

  - it: should add the read-only credentials with the pooler and createRO
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            password: testpassword
            postgresqlDatabase: my-database
          operator:
            pooler:
              enabled: true
              createRO: true
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        equal:
          path: stringData
          value:
            postgresql-password: testpassword
            plainhost: test-release-name-common-test-cnpg-main-pooler-rw
            plainhostRO: test-release-name-common-test-cnpg-main-pooler-ro
            plainporthost: test-release-name-common-test-cnpg-main-pooler-rw:5432
            plainporthostRO: test-release-name-common-test-cnpg-main-pooler-ro:5432
            url: postgresql://test:testpassword@test-release-name-common-test-cnpg-main-pooler-rw:5432/my-database
            urlRO: postgresql://test:testpassword@test-release-name-common-test-cnpg-main-pooler-ro:5432/my-database
            urlnossl: postgresql://test:testpassword@test-release-name-common-test-cnpg-main-pooler-rw:5432/my-database?sslmode=disable
            urlnosslRO: postgresql://test:testpassword@test-release-name-common-test-cnpg-main-pooler-ro:5432/my-database?sslmode=disable
            jdbc: jdbc:postgresql://test-release-name-common-test-cnpg-main-pooler-rw:5432/my-database
            jdbcRO: jdbc:postgresql://test-release-name-common-test-cnpg-main-pooler-ro:5432/my-database

  - it: should ignore the service of the dependency in operator mode
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          service:
            main:
              primary: true
    asserts:
      - hasDocuments:
          count: 3
      - documentSelector:
          path: metadata.name
          value: test-release-name-postgresqlcreds
        equal:
          path: stringData.plainhost
          value: test-release-name-common-test-cnpg-main-rw

  - it: should add one postgresql-wait init container in operator mode
    template: common.yaml
    set:
      image: &image
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        main:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        postgresql:
          enabled: true
    asserts:
      - documentSelector: &deploymentDoc
          path: kind
          value: Deployment
        lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - documentSelector: *deploymentDoc
        equal:
          path: spec.template.spec.initContainers[0].name
          value: test-release-name-common-test-system-postgresql-wait
      - documentSelector: *deploymentDoc
        matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: pg_isready -U test -d test -h test-release-name-common-test-cnpg-main-rw

  - it: should wait on the cluster, the pooler and the read-only pooler
    template: common.yaml
    set:
      image: *image
      workload:
        main:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        postgresql:
          enabled: true
          operator:
            pooler:
              enabled: true
              createRO: true
    asserts:
      - documentSelector: *deploymentDoc
        lengthEqual:
          path: spec.template.spec.initContainers
          count: 1
      - documentSelector: *deploymentDoc
        matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: pg_isready -U test -d test -h test-release-name-common-test-cnpg-main-rw
      - documentSelector: *deploymentDoc
        matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: pg_isready -U test -d test -h test-release-name-common-test-cnpg-main-pooler-rw
      - documentSelector: *deploymentDoc
        matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: pg_isready -U test -d test -h test-release-name-common-test-cnpg-main-pooler-ro

  - it: should show the connection details in the notes in operator mode
    template: NOTES.txt
    set:
      dependencies:
        postgresql:
          enabled: true
          depconfig:
            postgresqlUsername: my-user
            postgresqlDatabase: my-database
    asserts:
      - matchRegexRaw:
          pattern: "## PostgreSQL Database\n- Host: test-release-name-common-test-cnpg-main-rw\n- Port: 5432\n"
      - matchRegexRaw:
          pattern: "- Database: my-database\n- Username: my-user\n"
      - matchRegexRaw:
          pattern: "- JDBC URL: .*jdbc:postgresql://test-release-name-common-test-cnpg-main-rw:5432/my-database"

  - it: should show the pooler host and the read-only url in the notes
    template: NOTES.txt
    set:
      dependencies:
        postgresql:
          enabled: true
          operator:
            pooler:
              enabled: true
              createRO: true
    asserts:
      - matchRegexRaw:
          pattern: "## PostgreSQL Database\n- Host: test-release-name-common-test-cnpg-main-pooler-rw\n- Port: 5432\n"
      - matchRegexRaw:
          pattern: "- Read-Only URL: "

  - it: should apply the operator settings of postgresql
    template: common.yaml
    set:
      dependencies:
        postgresql:
          enabled: true
          operator:
            pgVersion: 17
    asserts:
      - documentSelector:
          path: kind
          value: Cluster
        matchRegex:
          path: spec.imageName
          pattern: postgresql:17
