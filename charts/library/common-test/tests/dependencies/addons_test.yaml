suite: dependencies addons test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should add the addon to the valkey dependency
    set:
      dependencies:
        valkey:
          enabled: true
          addons:
            netshoot:
              enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - documentSelector: &valkeyDoc
          path: kind
          value: StatefulSet
        equal:
          path: metadata.name
          value: test-release-name-common-test-valkey-main
      - documentSelector: *valkeyDoc
        lengthEqual:
          path: spec.template.spec.containers
          count: 2
      - documentSelector: *valkeyDoc
        equal:
          path: spec.template.spec.containers[1].name
          value: test-release-name-common-test-netshoot
      - documentSelector:
          path: kind
          value: Secret
        equal:
          path: stringData.plainhost
          value: test-release-name-common-test-valkey-main

  - it: should add the route of the codeserver addon to the dependency
    set:
      dependencies:
        valkey:
          enabled: true
          addons:
            codeserver:
              enabled: true
              route:
                enabled: true
                gateway: external
    asserts:
      - documentSelector: &codeRoute
          path: kind
          value: HTTPRoute
        equal:
          path: metadata.name
          value: test-release-name-common-test-valkey-codeserver
      - documentSelector: *codeRoute
        equal:
          path: spec.rules[0].backendRefs[0].name
          value: test-release-name-common-test-valkey-codeserver
      - documentSelector: *codeRoute
        equal:
          path: spec.rules[0].backendRefs[0].port
          value: 12321
      - documentSelector: *codeRoute
        equal:
          path: spec.hostnames
          value:
            - code.chart-example.local
