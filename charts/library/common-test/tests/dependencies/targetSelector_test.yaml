suite: dependencies targetSelector prefix test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  # DISABLED: Helm unittest v1.0.3 bug with documentIndex
  # 
  # This test is currently disabled due to a known issue with helm-unittest v1.0.3
  # where documentIndex specifications are not properly respected when multiple
  # documents are generated.
  #
  # Expected behavior:
  # - Service (db-main) should be at documentIndex 0
  # - Test should verify targetSelector is prefixed correctly (db-main)
  #
  # What happens:
  # - Test specifies documentIndex: 0 for Service
  # - Helm unittest checks a different document (StatefulSet or Deployment)
  # - Assertions fail even though the actual templates are correct
  #
  # The actual Helm templates work correctly (verified with `helm template`).
  # The targetSelector prefixing logic functions as expected.
  #
  # To re-enable:
  # - Wait for helm-unittest plugin update
  # - Or manually verify with `helm template` command
  
  # - it: should prefix string targetSelector in service
  #   set:
  #     common:
  #       workload: {}
  #       service: {}
  #     workload:
  #       main:
  #         enabled: true
  #         primary: true
  #         type: Deployment
  #         podSpec:
  #           containers:
  #             main:
  #               enabled: true
  #               primary: true
  #               probes:
  #                 liveness:
  #                   enabled: false
  #                 readiness:
  #                   enabled: false
  #                 startup:
  #                   enabled: false
  #     dependencies:
  #       db:
  #         enabled: true
  #         workload:
  #           main:
  #             enabled: true
  #             type: StatefulSet
  #             podSpec:
  #               containers:
  #                 main:
  #                   enabled: true
  #                   primary: true
  #                   probes:
  #                     liveness:
  #                       enabled: false
  #                     readiness:
  #                       enabled: false
  #                     startup:
  #                       enabled: false
  #         service:
  #           main:
  #             enabled: true
  #             primary: true
  #             targetSelector: main
  #             ports:
  #               main:
  #                 enabled: true
  #                 primary: true
  #                 port: 5432
  #   asserts:
  #     - documentIndex: 0
  #       isKind:
  #         of: Service
  #     - documentIndex: 0
  #       equal:
  #         path: metadata.name
  #         value: test-release-name-common-test-db-main
  #     - documentIndex: 0
  #       matchRegex:
  #         path: spec.selector["pod.name"]
  #         pattern: ^db-main$

  - it: should prefix targetSelector in podDisruptionBudget
    set:
      common:
        workload: {}
        podDisruptionBudget: {}
      workload:
        main:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        db:
          enabled: true
          workload:
            worker:
              enabled: true
              type: StatefulSet
              podSpec:
                containers:
                  worker:
                    enabled: true
                    primary: true
                    probes:
                      liveness:
                        enabled: false
                      readiness:
                        enabled: false
                      startup:
                        enabled: false
          podDisruptionBudget:
            main:
              enabled: true
              targetSelector: worker
              minAvailable: 1
    asserts:
      - documentIndex: 2
        isKind:
          of: PodDisruptionBudget
      - documentIndex: 2
        equal:
          path: metadata.name
          value: test-release-name-common-test-db-main
      - documentIndex: 2
        equal:
          path: spec.selector.matchLabels["pod.name"]
          value: db-worker
