suite: dependencies credentials test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should load the mariadb root password from a secret in the mariadb wait
    set:
      image:
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        main:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        mariadb:
          enabled: true
          depconfig:
            password: test-password
            rootPassword: test-root-password
    asserts:
      - documentSelector: &mariadbSecretDoc
          path: metadata.name
          value: test-release-name-mariadbcreds
        equal:
          path: stringData.mariadb-root-password
          value: test-root-password
      - documentSelector: &workloadDoc
          path: kind
          value: Deployment
        equal:
          path: spec.template.spec.initContainers[0].name
          value: test-release-name-common-test-system-mariadb-wait
      - documentSelector: *workloadDoc
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MARIADB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-release-name-mariadbcreds
                key: mariadb-root-password
      - documentSelector: *workloadDoc
        notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MARIADB_ROOT_PASSWORD
            value: test-root-password
      - documentSelector: *workloadDoc
        notMatchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: test-root-password

  - it: should not store the credentials of the dependencies in a configmap
    set:
      workload:
        main:
          enabled: true
          primary: true
          type: Deployment
          podSpec:
            containers:
              main:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      configmap:
        my-config:
          enabled: true
          data:
            foo: bar
      mongodb:
        enabled: true
        password: test-password
        rootPassword: test-root-password
      clickhouse:
        enabled: true
        password: test-password
      solr:
        enabled: true
        password: test-password
      dependencies:
        mariadb:
          enabled: true
          depconfig:
            password: test-password
            rootPassword: test-root-password
        valkey:
          enabled: true
          depconfig:
            password: test-password
          image:
            repository: oci.trueforge.org/containerforge/valkey
            tag: 9.0.4
          workload:
            main:
              type: StatefulSet
          service:
            main:
              ports:
                main:
                  protocol: tcp
                  port: 6379
    asserts:
      - documentSelector:
          path: kind
          value: ConfigMap
        equal:
          path: data
          value:
            foo: bar
      - documentSelector:
          path: kind
          value: ConfigMap
        notMatchRegex:
          path: data.foo
          pattern: test-
      - documentSelector:
          path: metadata.name
          value: test-release-name-valkeycreds
        equal:
          path: stringData.valkey-password
          value: test-password
      - documentSelector:
          path: metadata.name
          value: test-release-name-mongodbcreds
        exists:
          path: stringData
