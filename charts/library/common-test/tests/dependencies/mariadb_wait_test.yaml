suite: mariadb dependency wait test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should wait for mariadb in the workloads of the chart only
    set:
      image:
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        my-app: &appWorkload
          enabled: true
          primary: true
          type: StatefulSet
          podSpec:
            containers:
              my-container:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        mariadb: &mariadb
          enabled: true
    asserts:
      - documentSelector: &appDoc
          path: kind
          value: StatefulSet
        equal:
          path: metadata.name
          value: test-release-name-common-test
      - documentSelector: *appDoc
        equal:
          path: spec.template.spec.initContainers[0].name
          value: test-release-name-common-test-system-mariadb-wait
      - documentSelector: *appDoc
        matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: "^oci.trueforge.org/containerforge/mariadb-client:"
      - documentSelector: *appDoc
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MARIADB_HOST
            value: test-release-name-common-test-mariadb-main
      - documentSelector: *appDoc
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MARIADB_PORT
            value: "3306"
      - documentSelector: *appDoc
        contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: MARIADB_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-release-name-mariadbcreds
                key: mariadb-root-password
      - documentSelector: *appDoc
        matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: mysqladmin -uroot -h"\$\{MARIADB_HOST\}" -P"\$\{MARIADB_PORT\}"
      - documentSelector:
          path: kind
          value: Deployment
        equal:
          path: metadata.name
          value: test-release-name-common-test-mariadb-main
      - documentSelector:
          path: kind
          value: Deployment
        notExists:
          path: spec.template.spec.initContainers

  - it: should not wait for mariadb in workloads of the chart with dbWait disabled
    set:
      image:
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        my-app:
          enabled: true
          primary: true
          type: StatefulSet
          dbWait: false
          podSpec:
            containers:
              my-container:
                enabled: true
                primary: true
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
      dependencies:
        mariadb: *mariadb
    asserts:
      - documentSelector:
          path: kind
          value: StatefulSet
        notExists:
          path: spec.template.spec.initContainers

  - it: should not add the wait with the mariadb dependency disabled
    set:
      image:
        repository: ghcr.io/traefik/whoami
        tag: v1.0.0
      workload:
        my-app: *appWorkload
      dependencies:
        mariadb:
          enabled: false
    asserts:
      - documentSelector:
          path: kind
          value: StatefulSet
        notExists:
          path: spec.template.spec.initContainers
