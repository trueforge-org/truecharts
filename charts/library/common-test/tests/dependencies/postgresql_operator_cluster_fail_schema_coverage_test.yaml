suite: postgresql operator cluster schema coverage failures
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should fail on unknown keys, types and enums in postgresql operator cluster
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            bogus: 1
            singleNode: x
            logLevel: X
            primaryUpdateMethod: X
            primaryUpdateStrategy: X
            postgresql: x
            initdb:
              bogus: 1
              walSegmentSize: 0
            nodeMaintenanceWindow:
              bogus: 1
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/singleNode'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/logLevel'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/primaryUpdateMethod'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/primaryUpdateStrategy'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/postgresql'': got string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/initdb'': additional properties'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/initdb/walSegmentSize'': minimum: got'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/nodeMaintenanceWindow'': additional properties'

- it: should fail on unknown keys and types in postgresql operator cluster envFrom
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            envFrom:
            - bogus: 1
              configMapRef:
                bogus: 1
                expandObjectName: x
                name: 1
            - secretRef:
                bogus: 1
                expandObjectName: x
                name: 1
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/envFrom/0'': additional properties'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/envFrom/0/configMapRef'': additional properties'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/envFrom/0/configMapRef/expandObjectName'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/envFrom/0/configMapRef/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/envFrom/1/secretRef'': additional properties'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/envFrom/1/secretRef/expandObjectName'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/envFrom/1/secretRef/name'': got number, want string'

- it: should fail on a non array or object postgresql operator cluster envFrom
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            envFrom: x
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/envFrom'': got string'

- it: should fail on unknown keys and types in postgresql operator cluster storage
  template: common.yaml
  set:
    dependencies:
      postgresql:
        enabled: true
        mode: operator
        operator:
          cluster:
            storage:
              bogus: 1
              size: 1
              accessModes: 1
              volumeName: 1
              storageClass: 1
              dataSource:
                bogus: 1
                kind: 1
                name: 1
              dataSourceRef:
                bogus: 1
                kind: 1
                name: 1
                apiGroup: 1
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/size'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/accessModes'': got number'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/volumeName'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/storageClass'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/dataSource'': additional properties'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/dataSource/kind'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/dataSource/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/dataSourceRef'': additional properties'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/dataSourceRef/kind'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/dataSourceRef/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/postgresql/operator/cluster/storage/dataSourceRef/apiGroup'': got number, want string'
