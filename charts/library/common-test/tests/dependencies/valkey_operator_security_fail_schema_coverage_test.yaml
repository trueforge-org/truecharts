suite: valkey operator security contexts schema coverage failures
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
- it: should fail on unknown keys, wrong types and enums in valkey operator exporter
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          exporter:
            bogus: 1
            enabled: x
            imageSelector: 1
            args:
            - 1
            securityContext:
              bogus: 1
              allowPrivilegeEscalation: x
              privileged: x
              procMount: X
              readOnlyRootFilesystem: x
              runAsGroup: x
              runAsNonRoot: x
              runAsUser: x
              capabilities:
                bogus: 1
                add:
                - 1
                drop:
                - 1
              appArmorProfile:
                bogus: 1
                type: X
                localhostProfile: 1
              seccompProfile:
                bogus: 1
                type: X
                localhostProfile: 1
              seLinuxOptions:
                bogus: 1
                level: 1
                role: 1
                type: 1
                user: 1
              windowsOptions:
                bogus: 1
                gmsaCredentialSpec: 1
                gmsaCredentialSpecName: 1
                hostProcess: x
                runAsUserName: 1
            resources:
              bogus: 1
              limits:
                cpu: true
              requests:
                cpu: []
              claims:
              - bogus: 1
                request: 1
              - name: 1
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/enabled'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/imageSelector'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/args/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/resources'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/resources/claims/0'': missing property ''name'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/resources/claims/0'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/resources/claims/0/request'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/resources/claims/1/name'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/allowPrivilegeEscalation'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/privileged'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/readOnlyRootFilesystem'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/runAsNonRoot'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/runAsGroup'': got string, want integer'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/runAsUser'': got string, want integer'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/procMount'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/capabilities'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/capabilities/add/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/capabilities/drop/0'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/appArmorProfile'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/appArmorProfile/type'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/appArmorProfile/localhostProfile'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seccompProfile'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seccompProfile/type'': value must be one of'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seccompProfile/localhostProfile'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seLinuxOptions'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seLinuxOptions/level'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seLinuxOptions/role'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seLinuxOptions/type'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seLinuxOptions/user'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/windowsOptions'': additional properties ''bogus'' not allowed'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/windowsOptions/gmsaCredentialSpec'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/windowsOptions/gmsaCredentialSpecName'': got number, want string'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/windowsOptions/hostProcess'': got string, want boolean'
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/windowsOptions/runAsUserName'': got number, want string'
- it: should fail on missing required keys in valkey operator exporter security context profiles
  template: common.yaml
  set:
    dependencies:
      valkey:
        enabled: true
        mode: operator
        operator:
          exporter:
            securityContext:
              appArmorProfile: {}
              seccompProfile: {}
  asserts:
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/appArmorProfile'': missing property ''type'''
  - failedTemplate:
      errorPattern: 'at ''/dependencies/valkey/operator/exporter/securityContext/seccompProfile'': missing property ''type'''
