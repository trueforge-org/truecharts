suite: persistence default-named volumes schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render the default-named persistence objects as type pvc in persistence fixed-name volumes
    set:
      configmap:
        my-configmap:
          enabled: true
          data:
            foo: bar
      persistence:
        shared:
          enabled: true
          type: pvc
          mountPath: /mnt/shared
          targetSelectAll: true
        varlogs:
          enabled: true
          type: pvc
          mountPath: /mnt/varlogs
          targetSelectAll: true
        varrun:
          enabled: true
          type: pvc
          mountPath: /mnt/varrun
          targetSelectAll: true
        tmp:
          enabled: true
          type: pvc
          mountPath: /mnt/tmp
          targetSelectAll: true
        devshm:
          enabled: true
          type: pvc
          mountPath: /mnt/devshm
          targetSelectAll: true
        crontab:
          enabled: true
          type: pvc
          mountPath: /mnt/crontab
          targetSelectAll: true
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-my-configmap
        isKind:
          of: ConfigMap
      - documentSelector:
          path: metadata.name
          value: test-release-name-common-test-shared
        isKind:
          of: PersistentVolumeClaim
  - it: should render the default-named persistence objects as type hostPath in persistence fixed-name volumes
