                  fsGroupChangePolicy: not-a-policy
                  seLinuxChangePolicy: not-a-policy
                  supplementalGroupsPolicy: not-a-policy
                  sysctls: not-a-list
              dest:
                enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/my-volume/volsync/0/src/moverSecurityContext/fsGroupChangePolicy': value must be one of 'OnRootMismatch', 'Always'"

