suite: persistence volsync schema coverage fail test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail on unknown keys in persistence volsync item
    set:
      persistence:
        my-volume:
          enabled: true
          type: pvc
          volsync:
            - name: mybackup
              type: restic
              credentials: mys3
              unknownKey: value
              src:
                enabled: true
              dest:
                enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/my-volume/volsync/0': additional properties 'unknownKey' not allowed"

  - it: should fail on missing required keys in persistence volsync item
    set:
      persistence:
        my-volume:
          enabled: true
          type: pvc
          volsync:
            - copyMethod: Direct
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/my-volume/volsync/0': missing properties 'name', 'type', 'credentials', 'src', 'dest'"

  - it: should fail on invalid type and copyMethod in persistence volsync item
    set:
      persistence:
        my-volume:
          enabled: true
          type: pvc
          volsync:
            - name: mybackup
              type: not-a-type
              credentials: mys3
              copyMethod: not-a-method
              src:
                enabled: true
              dest:
                enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/my-volume/volsync/0/type': value must be 'restic'"

  - it: should fail on missing required keys in persistence volsync src and dest
    set:
      persistence:
        my-volume:
          enabled: true
          type: pvc
          volsync:
            - name: mybackup
              type: restic
              credentials: mys3
              src: {}
              dest: {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/my-volume/volsync/0/src': missing property 'enabled'"

  - it: should fail on unknown keys in persistence volsync src
    set:
      persistence:
        my-volume:
          enabled: true
          type: pvc
          volsync:
            - name: mybackup
              type: restic
              credentials: mys3
              src:
                enabled: true
                unknownKey: value
              dest:
                enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/my-volume/volsync/0/src': additional properties 'unknownKey' not allowed"

  - it: should fail on a wrong type in persistence volsync src access modes and cache settings
    set:
      persistence:
        my-volume:
          enabled: true
          type: pvc
          volsync:
            - name: mybackup
              type: restic
              credentials: mys3
              src:
                enabled: true
                accessModes: 1
                cacheAccessModes: 1
                cacheCapacity: 1
                cacheStorageClassName: 1
              dest:
                enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/my-volume/volsync/0/src/accessModes': got number, want string or array"

  - it: should fail on a wrong type in persistence volsync src access modes items
    set:
      persistence:
        my-volume:
          enabled: true
