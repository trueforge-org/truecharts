suite: persistence static custom test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render the csi source of the PV, with the name as the default volume handle
    set:
      persistence:
        my-volume1:
          enabled: true
          type: pvc
          size: 10Gi
          static:
            mode: custom
            provisioner: some.provisioner.io
            driver: some.driver.io
    asserts:
      - documentSelector:
          path: kind
          value: PersistentVolume
        equal:
          path: metadata.annotations["pv.kubernetes.io/provisioned-by"]
          value: some.provisioner.io
      - documentSelector:
          path: kind
          value: PersistentVolume
        equal:
          path: spec.csi
          value:
            driver: some.driver.io
            volumeHandle: test-release-name-common-test-my-volume1-1460604890

  - it: should render the volume handle and attributes with tpl
    set:
      someHandle: some-handle
      someValue: some-value
      persistence:
        my-volume1:
          enabled: true
          type: pvc
          size: 10Gi
          static:
            mode: custom
            provisioner: some.provisioner.io
            driver: some.driver.io
            volumeHandle: "{{ .Values.someHandle }}"
            volumeAttributes:
              some-attribute: "{{ .Values.someValue }}"
    asserts:
      - documentSelector:
          path: kind
          value: PersistentVolume
        equal:
          path: spec.csi
          value:
            driver: some.driver.io
            volumeHandle: some-handle
            volumeAttributes:
              some-attribute: some-value

  - it: should change the name of the PV and PVC when the driver changes
    set:
      persistence:
        my-volume1:
          enabled: true
          type: pvc
          size: 10Gi
          static:
            mode: custom
            provisioner: some.provisioner.io
            driver: other.driver.io
    asserts:
      - documentSelector:
          path: kind
          value: PersistentVolume
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-volume1-1748897864
      - documentSelector:
          path: kind
          value: PersistentVolumeClaim
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-volume1-1748897864

  - it: should fail without a driver
    set:
      persistence:
        my-volume1:
          enabled: true
          type: pvc
          static:
            mode: custom
            provisioner: some.provisioner.io
    asserts:
      - failedTemplate:
          errorMessage: Custom CSI - Expected [driver] to be non-empty

  - it: should fail without a provisioner
    set:
      persistence:
        my-volume1:
          enabled: true
          type: pvc
          static:
            mode: custom
            driver: some.driver.io
    asserts:
      - failedTemplate:
          errorMessage: Custom CSI - Expected [provisioner] to be non-empty
