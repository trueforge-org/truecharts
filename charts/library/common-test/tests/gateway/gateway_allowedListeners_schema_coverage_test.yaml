suite: gateway allowedListeners schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render gateway allowedListeners from None
    set:
      gateway:
        my-gateway:
          enabled: true
          gatewayClassName: some-class
          allowedListeners:
            namespaces:
              from: None
          listeners:
            - name: http
              port: 80
              protocol: HTTP
    asserts:
      - documentSelector: &gw
          path: kind
          value: Gateway
        equal:
          path: spec.allowedListeners.namespaces.from
          value: None

  - it: should render gateway allowedListeners from Selector with a selector
    set:
      gateway:
        my-gateway:
          enabled: true
          gatewayClassName: some-class
          allowedListeners:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  my-label: my-value
          listeners:
            - name: http
              port: 80
              protocol: HTTP
    asserts:
      - documentSelector: *gw
        equal:
          path: spec.allowedListeners.namespaces.from
          value: Selector
      - documentSelector: *gw
        equal:
          path: spec.allowedListeners.namespaces.selector.matchLabels.my-label
          value: my-value

  - it: should fail on unknown keys in gateway allowedListeners
    set:
      gateway:
        my-gateway:
          enabled: true
          gatewayClassName: some-class
          allowedListeners:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/gateway/my-gateway/allowedListeners': additional properties 'unknownKey' not allowed"

  - it: should fail on unknown keys in gateway allowedListeners namespaces
    set:
      gateway:
        my-gateway:
          enabled: true
          gatewayClassName: some-class
          allowedListeners:
            namespaces:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/gateway/my-gateway/allowedListeners/namespaces': additional properties 'unknownKey' not allowed"
