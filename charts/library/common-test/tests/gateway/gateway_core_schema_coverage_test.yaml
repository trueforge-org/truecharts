suite: gateway core schema coverage test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render a gateway with string enabled, nameOverride, annotations, labels and tls backend
    set:
      gateway:
        my-gateway:
          enabled: "true"
          gatewayClassName: some-class
          nameOverride: my-override
          annotations:
            my-annotation: my-value
          labels:
            my-label: my-value
          tls:
            backend:
              clientCertificateRef:
                name: some-cert
          listeners:
            - name: http
              port: 80
              protocol: HTTP
    asserts:
      - documentSelector: &gw
          path: kind
          value: Gateway
        equal:
          path: metadata.name
          value: test-release-name-common-test-my-override
      - documentSelector: *gw
        equal:
          path: metadata.annotations.my-annotation
          value: my-value
      - documentSelector: *gw
        equal:
          path: metadata.labels.my-label
          value: my-value
      - documentSelector: *gw
        equal:
          path: spec.tls.backend.clientCertificateRef.name
          value: some-cert

  - it: should fail on unknown keys in gateway
    set:
      gateway:
        my-gateway:
          enabled: true
          gatewayClassName: some-class
          unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/gateway/my-gateway': additional properties 'unknownKey' not allowed"

  - it: should fail on unknown keys in gateway addresses
    set:
      gateway:
        my-gateway:
          enabled: true
          gatewayClassName: some-class
          addresses:
            - type: IPAddress
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/gateway/my-gateway/addresses/0': additional properties 'unknownKey' not allowed"

  - it: should fail on missing required keys in gateway addresses
    set:
      gateway:
        my-gateway:
          enabled: true
          gatewayClassName: some-class
          addresses:
            - type: IPAddress
    asserts:
      - failedTemplate:
          errorPattern: "at '/gateway/my-gateway/addresses/0': missing property 'value'"

  - it: should fail on unknown keys in gateway tls
    set:
      gateway:
        my-gateway:
          enabled: true
          gatewayClassName: some-class
          tls:
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/gateway/my-gateway/tls': additional properties 'unknownKey' not allowed"
