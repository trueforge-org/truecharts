suite: secret expandObjectName schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render secret with boolean expandObjectName
    set:
      secret:
        my-secret:
          enabled: true
          expandObjectName: false
          data:
            foo: bar
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: my-secret
        documentIndex: 0

  - it: should render secret with string expandObjectName
    set:
      secret:
        my-secret:
          enabled: true
          expandObjectName: "false"
          data:
            foo: bar
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: my-secret
        documentIndex: 0
