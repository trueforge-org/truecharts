suite: secret schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render secret with string typed enabled
    set:
      secret:
        my-secret:
          enabled: "true"
          data:
            foo: bar
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0

  - it: should not prefix the secret name when expandObjectName is false or "false"
    set:
      secret:
        my-a:
          enabled: true
          expandObjectName: false
          data:
            foo: bar
        my-b:
          enabled: true
          expandObjectName: "false"
          data:
            foo: bar
    asserts:
      - documentSelector:
          path: metadata.name
          value: my-a
        isKind:
          of: Secret
      - documentSelector:
          path: metadata.name
          value: my-b
        isKind:
          of: Secret

  - it: should drop empty data keys with a boolean dropEmptyKeys
    set:
      secret:
        my-secret:
          enabled: true
          dropEmptyKeys: true
          data:
            foo: bar
            empty: ""
    asserts:
      - documentIndex: 0
        isKind:
          of: Secret
      - documentIndex: 0
        equal:
          path: stringData
          value:
            foo: bar

  - it: should drop empty data keys with a string dropEmptyKeys
    set:
      dropData: true
      secret:
        my-secret:
          enabled: true
          dropEmptyKeys: "{{ .Values.dropData }}"
          data:
            foo: bar
            empty: ""
    asserts:
      - documentIndex: 0
        equal:
          path: stringData
          value:
            foo: bar
