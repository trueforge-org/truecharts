suite: secret schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render secret with string typed enabled
    set:
      secret:
        my-secret:
          enabled: "true"
          data:
            foo: bar
    asserts:
      - isKind:
          of: Secret
        documentIndex: 0
