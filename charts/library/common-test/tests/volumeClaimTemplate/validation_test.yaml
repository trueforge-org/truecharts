suite: volumeClaimTemplates validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with annotations not a dict
    set:
      persistence:
        volume1:
          enabled: true
          type: vct
          annotations: not-a-dict
      workload:
        main:
          enabled: true
          primary: true
          type: StatefulSet
          podSpec: {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/volume1/annotations': got string, want object"

  - it: should fail with labels not a dict
    set:
      persistence:
        volume1:
          enabled: true
          type: vct
          labels: not-a-dict
      workload:
        main:
          enabled: true
          primary: true
          type: StatefulSet
          podSpec: {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/volume1/labels': got string, want object"

  - it: should fail with pod targetSelector not a map
    set:
      persistence:
        volume1:
          enabled: true
          type: vct
          targetSelector: not-a-map
      workload:
        main:
          enabled: true
          primary: true
          type: StatefulSet
          podSpec: {}
    asserts:
      - failedTemplate:
          errorPattern: "at '/persistence/volume1/targetSelector': got string, want object"
