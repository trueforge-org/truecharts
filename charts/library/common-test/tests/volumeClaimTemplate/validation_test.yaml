suite: volumeClaimTemplates validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with the unused top level key
    set:
      volumeClaimTemplates:
        data:
          enabled: true
          mountPath: /data
    asserts:
      - failedTemplate:
          errorMessage: "Expected no [volumeClaimTemplates], as this key is not used, so [data] would not be persisted. Use [persistence] instead, a new volume on an existing StatefulSet can't use [type: vct]"

  - it: should fail with the unused key on a dependency
    set:
      dependencies:
        valkey:
          enabled: true
          volumeClaimTemplates:
            data:
              enabled: true
              mountPath: /data
    asserts:
      - failedTemplate:
          errorMessage: "Expected no [volumeClaimTemplates], as this key is not used, so [valkey-data] would not be persisted. Use [persistence] instead, a new volume on an existing StatefulSet can't use [type: vct]"

  - it: should fail with annotations not a dict
    set:
      persistence:
        volume1:
          enabled: true
          type: vct
          annotations: not-a-dict
      workload:
        main:
          enabled: true
          primary: true
          type: StatefulSet
          podSpec: {}
    asserts:
      - failedTemplate:
          errorMessage: Volume Claim Templates - Expected [annotations] to be a dictionary, but got [string]

  - it: should fail with labels not a dict
    set:
      persistence:
        volume1:
          enabled: true
          type: vct
          labels: not-a-dict
      workload:
        main:
          enabled: true
          primary: true
          type: StatefulSet
          podSpec: {}
    asserts:
      - failedTemplate:
          errorMessage: Volume Claim Templates - Expected [labels] to be a dictionary, but got [string]

  - it: should fail with pod targetSelector not a map
    set:
      persistence:
        volume1:
          enabled: true
          type: vct
          targetSelector: not-a-map
      workload:
        main:
          enabled: true
          primary: true
          type: StatefulSet
          podSpec: {}
    asserts:
      - failedTemplate:
          errorMessage: Persistence - Expected [targetSelector] to be [dict], but got [string]
