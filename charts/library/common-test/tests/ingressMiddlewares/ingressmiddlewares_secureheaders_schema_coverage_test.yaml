suite: ingress middlewares tc-basic-secure-headers schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render the tc-basic-secure-headers middleware with all keys set
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: true
            type: headers
            data:
              accessControlAllowMethods:
                - GET
                - OPTIONS
              accessControlMaxAge: 100
              stsSeconds: 63072000
              forceSTSHeader: true
              contentTypeNosniff: true
              browserXssFilter: true
              referrerPolicy: same-origin
              customRequestHeaders:
                X-Forwarded-Proto: https
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Middleware
      - equal:
          path: metadata.name
          value: test-release-name-common-test-tc-basic-secure-headers
  - it: should accept a string for enabled in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: "true"
            type: headers
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Middleware
  - it: should accept type add-prefix in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: false
            type: add-prefix
    asserts:
      - hasDocuments:
          count: 0
  - it: should accept type basic-auth in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: false
            type: basic-auth
    asserts:
      - hasDocuments:
          count: 0
  - it: should accept type buffering in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: false
            type: buffering
    asserts:
      - hasDocuments:
          count: 0
  - it: should accept type chain in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: false
            type: chain
    asserts:
      - hasDocuments:
          count: 0
  - it: should accept type compress in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: false
            type: compress
    asserts:
      - hasDocuments:
          count: 0
  - it: should accept type content-type in tc-basic-secure-headers
    set:
