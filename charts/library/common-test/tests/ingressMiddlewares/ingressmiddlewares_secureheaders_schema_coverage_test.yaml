  - it: should fail on unknown keys in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: true
            type: headers
            unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/ingressMiddlewares/traefik/tc-basic-secure-headers': "
  - it: should fail on unknown keys in tc-basic-secure-headers data
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: true
            type: headers
            data:
              unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/ingressMiddlewares/traefik/tc-basic-secure-headers/data': "
  - it: should fail on unknown keys in tc-basic-secure-headers customRequestHeaders
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: true
            type: headers
            data:
              customRequestHeaders:
                unknownKey: value
    asserts:
      - failedTemplate:
          errorPattern: "at '/ingressMiddlewares/traefik/tc-basic-secure-headers/data/customRequestHeaders': "
