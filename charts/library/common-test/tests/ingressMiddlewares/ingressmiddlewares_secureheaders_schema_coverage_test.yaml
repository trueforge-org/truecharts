  - it: should accept type headers in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: false
            type: headers
    asserts:
      - hasDocuments:
          count: 0
  - it: should accept type ip-allow-list in tc-basic-secure-headers
    set:
      ingressMiddlewares:
        traefik:
          tc-basic-secure-headers:
            enabled: false
            type: ip-allow-list
