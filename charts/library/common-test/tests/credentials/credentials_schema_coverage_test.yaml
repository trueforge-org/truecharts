suite: credentials schema coverage
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should render with credentials with a custom CA secret reference
    set:
      credentials:
        my-creds:
          type: s3
          url: https://example.invalid
          bucket: my-bucket
          accessKey: PLACEHOLDERACCESS
          secretKey: PLACEHOLDERSECRET
          encrKey: PLACEHOLDERENCR
          customCASecretRef:
            name: my-ca-secret
            key: ca.crt
            expandObjectName: false
      service:
        my-service:
          enabled: true
          primary: true
          ports:
            my-port:
              enabled: true
              primary: true
              port: 12345
    asserts:
      - isKind:
          of: Service
        documentIndex: 0

  - it: should fail on unknown keys in credentials
    set:
      credentials:
        my-creds:
          unknown: value
      service:
        my-service:
          enabled: true
          primary: true
          ports:
            my-port:
              enabled: true
              primary: true
              port: 12345
    asserts:
      - failedTemplate:
          errorPattern: "at '/credentials/my-creds': (additional properties|additionalProperties)"

  - it: should fail on empty strings in credentials
    set:
      credentials:
        my-creds:
          type: ""
      service:
        my-service:
          enabled: true
          primary: true
          ports:
            my-port:
              enabled: true
              primary: true
              port: 12345
    asserts:
      - failedTemplate:
          errorPattern: "at '/credentials/my-creds/type': value must be 's3'"

  - it: should fail on unknown keys and empty strings in credentials customCASecretRef
    set:
      credentials:
        my-creds:
          customCASecretRef:
            name: ""
            key: ""
            unknown: value
      service:
        my-service:
          enabled: true
          primary: true
          ports:
            my-port:
              enabled: true
              primary: true
              port: 12345
    asserts:
      - failedTemplate:
          errorPattern: "at '/credentials/my-creds/customCASecretRef': (additional properties|additionalProperties)"
      - failedTemplate:
          errorPattern: "at '/credentials/my-creds/customCASecretRef/name': (minLength|length)"
      - failedTemplate:
          errorPattern: "at '/credentials/my-creds/customCASecretRef/key': (minLength|length)"
