suite: cronjob validation test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should fail with invalid concurrencyPolicy
    set:
      workload:
        workload-name:
          enabled: true
          primary: true
          type: CronJob
          concurrencyPolicy: not-a-policy
          podSpec: {}
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/workload/workload-name/concurrencyPolicy'': value must be one of ''Allow'', ''Replace'', ''Forbid'''

  - it: should fail with empty schedule
    set:
      workload:
        workload-name:
          enabled: true
          primary: true
          type: CronJob
          schedule:
          podSpec: {}
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/workload/workload-name/schedule'': got null, want string'

  - it: should fail with invalid completionMode (make sure job validation kicks in)
    set:
      workload:
        workload-name:
          enabled: true
          primary: true
          type: CronJob
          schedule: "* * * * *"
          completionMode: not-a-mode
          podSpec: {}
    asserts:
      - failedTemplate:
          errorPattern: 'at ''/workload/workload-name/completionMode'': value must be one of ''Indexed'', ''NonIndexed'''

  - it: should fail with namespace longer than 63 characters
    set:
      workload:
        workload-name:
          enabled: true
          primary: true
          type: CronJob
          schedule: "* * * * *"
          namespace: my-extra-super-duper-long-name-that-is-longer-than-63-characters
          podSpec: {}
    asserts:
      - failedTemplate:
          errorMessage: CronJob - Namespace [my-extra-super-duper-long-name-that-is-longer-than-63-characters] is not valid. Must start and end with an alphanumeric lowercase character. It can contain '-'. And must be at most 63 characters.

  - it: should fail with restartPolicy "Always" for CronJob
    set:
      workload:
        workload-name:
          enabled: true
          primary: true
          type: CronJob
          schedule: "* * * * *"
          podSpec:
            restartPolicy: Always
    asserts:
      - failedTemplate:
          errorMessage: Expected [restartPolicy] to be one of [Never, OnFailure] for [CronJob] but got [Always]
