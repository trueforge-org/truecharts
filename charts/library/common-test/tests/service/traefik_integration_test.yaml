suite: service (traefik integration) test
templates:
  - common.yaml
release:
  name: test-release-name
  namespace: test-release-namespace
tests:
  - it: should pass with traefik integration enabled
    set:
      service:
        my-service:
          enabled: true
          primary: true
          type: ClusterIP
          integrations:
            traefik:
              enabled: true
          ports:
            port-name:
              enabled: true
              primary: true
              port: 12345
              protocol: https
      workload:
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec: {}
    asserts:
      - documentIndex: &serviceDoc 1
        isKind:
          of: Service
      - documentIndex: *serviceDoc
        isAPIVersion:
          of: v1
      - documentIndex: *serviceDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test
      - documentIndex: *serviceDoc
        isSubset:
          path: metadata.annotations
          content:
            traefik.ingress.kubernetes.io/service.serversscheme: "https"
  - it: should pass with traefik integration and forceTLS enabled
    set:
      service:
        my-service:
          enabled: true
          primary: true
          type: ClusterIP
          integrations:
            traefik:
              enabled: true
              forceTLS: true
          ports:
            port-name:
              enabled: true
              primary: true
              port: 12345
              protocol: http # Not HTTPS, so forceTLS is needed
      workload:
        my-workload:
          enabled: true
          primary: true
          type: Deployment
          podSpec: {}
    asserts:
      - documentIndex: &serviceDoc 1
        isKind:
          of: Service
      - documentIndex: *serviceDoc
        isAPIVersion:
          of: v1
      - documentIndex: *serviceDoc
        equal:
          path: metadata.name
          value: test-release-name-common-test
      - documentIndex: *serviceDoc
        isSubset:
          path: metadata.annotations
          content:
            traefik.ingress.kubernetes.io/service.serversscheme: "https"
