service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 8080

workload:
  main:
    enabled: true
    podSpec:
      containers:
        main:
          enabled: true
          args:
            - --port
            - "8080"
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true

dependencies:
  postgresql:
    enabled: true
    mode: operator
    depconfig:
      postgresqlDatabase: app
      postgresqlUsername: app
      password: test-password
    operator:
      # -- no pgVersion, exercises the default PostgreSQL 18 (postgres18Image)
      cluster:
        # -- number of instances for both postgres and pgbouncer (1 to keep the install test light, cnpg-values.yaml covers HA)
        instances: 1
        # -- change to supervised to disable unsupervised updates
        primaryUpdateStrategy: unsupervised
      pooler:
        # -- enable to create extra pgbouncer for readonly access
        createRO: false
        instances: 1
      monitoring:
        # -- set to enable prometheus metrics
        enablePodMonitor: false
