service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 8080

workload:
  main:
    enabled: true
    podSpec:
      containers:
        main:
          enabled: true
          args:
            - --port
            - "8080"
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true

dependencies:
  postgresql:
    enabled: true
    mode: operator
    depconfig:
      postgresqlDatabase: app
      postgresqlUsername: app
      password: test-password
    operator:
      # -- exercise PostGIS on PostgreSQL 18 (postgresPostgis18Image)
      type: postgis
      pgVersion: 18
      cluster:
        # -- number of instances for both postgres and pgbouncer
        instances: 2
        # -- change to supervised to disable unsupervised updates
        primaryUpdateStrategy: unsupervised
      pooler:
        # -- enable to create extra pgbouncer for readonly access
        createRO: false
        instances: 2
      monitoring:
        # -- set to enable prometheus metrics
        enablePodMonitor: false
