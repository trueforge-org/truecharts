service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 8080

workload:
  main:
    enabled: true
    podSpec:
      containers:
        main:
          enabled: true
          args:
            - --port
            - "8080"
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true

dependencies:
  valkey:
    enabled: true
    depconfig:
      password: "testpassword"
    image:
      repository: docker.io/bitnamisecure/valkey
      pullPolicy: IfNotPresent
      tag: latest@sha256:4dc6511a8a9d4d4cbf3ccf1270ddcc6929819a1e0f4005462cf782cc96d1c3b6
    workload:
      main:
        enabled: true
        replicas: 1
        type: StatefulSet
        strategy: RollingUpdate
        podSpec:
          containers:
            main:
              env:
                REDIS_PASSWORD: "testpassword"

