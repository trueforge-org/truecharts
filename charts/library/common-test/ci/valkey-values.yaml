service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 8080

workload:
  main:
    enabled: true
    podSpec:
      containers:
        main:
          enabled: true
          args:
            - --port
            - "8080"
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true

dependencies:
  valkey:
    enabled: true
    depconfig:
      password: "testpassword"
    image:
      repository: docker.io/bitnamisecure/valkey
      pullPolicy: IfNotPresent
      tag: latest@sha256:14dc12c4cc5912747b63d41e237512989d958fa6020dbcb1170cc0fe91f48644
    workload:
      main:
        enabled: true
        replicas: 1
        type: StatefulSet
        strategy: RollingUpdate
        podSpec:
          containers:
            main:
              enabled: true
              primary: true
              env:
                REDIS_REPLICATION_MODE: master
                ALLOW_EMPTY_PASSWORD: "no"
                REDIS_PORT: "6379"
                REDIS_PASSWORD: "testpassword"
              probes:
                liveness:
                  enabled: true
                  type: exec
                  command:
                    - sh
                    - -c
                    - /health/ping_liveness_local.sh 2
                readiness:
                  enabled: true
                  type: exec
                  command:
                    - sh
                    - -c
                    - /health/ping_readiness_local.sh 2
                startup:
                  enabled: true
                  type: exec
                  command:
                    - sh
                    - -c
                    - /health/ping_readiness_local.sh 2
    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsGroup: 0
    configmap:
      health:
        enabled: true
        data:
          ping_readiness_local.sh: |-
            #!/bin/bash
            [[ -n "$REDIS_PASSWORD" ]] && export REDISCLI_AUTH="$REDIS_PASSWORD"
            response=$(
              timeout -s 3 $1 \
              redis-cli \
                -h localhost \
                -p $REDIS_PORT \
                ping
            )
            if [ "$response" != "PONG" ]; then
              echo "failed to connect using password: $REDIS_PASSWORD response: $response"
              exit 1
            fi
          ping_liveness_local.sh: |-
            #!/bin/bash
            [[ -n "$REDIS_PASSWORD" ]] && export REDISCLI_AUTH="$REDIS_PASSWORD"
            response=$(
              timeout -s 3 $1 \
              redis-cli \
                -h localhost \
                -p $REDIS_PORT \
                ping
            )
            if [ "$response" != "PONG" ] && [ "$response" != "LOADING Valkey is loading the dataset in memory" ]; then
              echo "$response"
              exit 1
            fi
          ping_readiness_master.sh: |-
            #!/bin/bash
            [[ -n "$REDIS_MASTER_PASSWORD" ]] && export REDISCLI_AUTH="$REDIS_MASTER_PASSWORD"
            response=$(
              timeout -s 3 $1 \
              redis-cli \
                -h $REDIS_MASTER_HOST \
                -p $REDIS_MASTER_PORT_NUMBER \
                ping
            )
            if [ "$response" != "PONG" ]; then
              echo "$response"
              exit 1
            fi
          ping_liveness_master.sh: |-
            #!/bin/bash
            [[ -n "$REDIS_MASTER_PASSWORD" ]] && export REDISCLI_AUTH="$REDIS_MASTER_PASSWORD"
            response=$(
              timeout -s 3 $1 \
              redis-cli \
                -h $REDIS_MASTER_HOST \
                -p $REDIS_MASTER_PORT_NUMBER \
                ping
            )
            if [ "$response" != "PONG" ] && [ "$response" != "LOADING Valkey is loading the dataset in memory" ]; then
              echo "$response"
              exit 1
            fi
          ping_readiness_local_and_master.sh: |-
            script_dir="$(dirname "$0")"
            exit_status=0
            "$script_dir/ping_readiness_local.sh" $1 || exit_status=$?
            "$script_dir/ping_readiness_master.sh" $1 || exit_status=$?
            exit $exit_status
          ping_liveness_local_and_master.sh: |-
            script_dir="$(dirname "$0")"
            exit_status=0
            "$script_dir/ping_liveness_local.sh" $1 || exit_status=$?
            "$script_dir/ping_liveness_master.sh" $1 || exit_status=$?
            exit $exit_status
    service:
      main:
        enabled: true
        ports:
          main:
            enabled: true
            port: 6379
            targetPort: 6379
    volumeClaimTemplates:
      data:
        enabled: true
        accessModes:
          - ReadWriteOnce
        mountPath: "/bitnami/valkey"
    persistence:
      valkey-health:
        enabled: true
        type: configmap
        objectName: health
        mountPath: "/health"
        defaultMode: "0755"
        items:
          - key: ping_readiness_local.sh
            path: ping_readiness_local.sh
          - key: ping_liveness_local.sh
            path: ping_liveness_local.sh
          - key: ping_readiness_master.sh
            path: ping_readiness_master.sh
          - key: ping_liveness_master.sh
            path: ping_liveness_master.sh
          - key: ping_liveness_local_and_master.sh
            path: ping_liveness_local_and_master.sh
          - key: ping_readiness_local_and_master.sh
            path: ping_readiness_local_and_master.sh

