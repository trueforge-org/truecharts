service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 8080

workload:
  main:
    enabled: true
    podSpec:
      containers:
        main:
          enabled: true
          args:
            - --port
            - "8080"
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true

dependencies:
  valkey:
    enabled: true
    depconfig:
      password: "testpassword"
    image:
      repository: oci.trueforge.org/containerforge/valkey
      pullPolicy: IfNotPresent
      tag: 9.0.4@sha256:754db2901b782f36076b5e7d3c1990342670973be6316f2ecf3ad145da0c852d
    workload:
      main:
        enabled: true
        replicas: 1
        type: StatefulSet
        strategy: RollingUpdate
        podSpec:
          containers:
            main:
              enabled: true
              primary: true
              imageSelector: valkeyImage
              env:
                REDIS_PASSWORD: "testpassword"
              probes:
                liveness:
                  enabled: true
                  type: tcp
                  port: 6379
                readiness:
                  enabled: true
                  type: tcp
                  port: 6379
                startup:
                  enabled: true
                  type: tcp
                  port: 6379
    service:
      main:
        enabled: true
        ports:
          main:
            enabled: true
            port: 6379

