service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 8080

workload:
  main:
    enabled: true
    podSpec:
      containers:
        main:
          enabled: true
          args:
            - --port
            - "8080"
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true

cnpg:
  main:
    enabled: true
    # -- number of instances for both postgres and pgbouncer
    instances: 2
    database: "app"
    user: "app"
    password: test-password
    pooler:
      # -- enable to create extra pgbouncer for readonly access
      createRO: false
      instances: 2
    # -- set to enable prometheus metrics
    monitoring:
      enablePodMonitor: false
    # -- contains credentials and urls output by generator
    creds: {}
  ro:
    enabled: true
    # -- number of instances for both postgres and pgbouncer
    instances: 2
    database: "app2"
    user: "app2"
    password: test-password
    pooler:
      # -- enable to create extra pgbouncer for readonly access
      createRO: true
      instances: 2
    # -- set to enable prometheus metrics
    monitoring:
      enablePodMonitor: false
    # -- contains credentials and urls output by generator
    creds: {}
  mon:
    enabled: true
    # -- number of instances for both postgres and pgbouncer
    instances: 2
    database: "app2"
    user: "app2"
    password: test-password
    pooler:
      # -- enable to create extra pgbouncer for readonly access
      createRO: true
      instances: 2
    # -- set to enable prometheus metrics
    monitoring:
      enablePodMonitor: true
    # -- contains credentials and urls output by generator
    creds: {}
