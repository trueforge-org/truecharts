service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 8080

workload:
  main:
    enabled: true
    podSpec:
      containers:
        main:
          enabled: true
          args:
            - --port
            - "8080"
          env:
            POSTGRES_HOST: '{{ .Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"" }}'
            POSTGRES_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
            POSTGRES_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true

dependencies:
  postgresql:
    enabled: true
    mode: operator
    depconfig:
      postgresqlDatabase: app
      postgresqlUsername: app
      password: test-password
    operator:
      # The default is covered by cnpg-pg18-values.yaml
      pgVersion: 16
      cluster:
        # -- number of instances for both postgres and pgbouncer
        instances: 2
        # -- change to supervised to disable unsupervised updates
        # Example of rolling update strategy:
        # - unsupervised: automated update of the primary once all
        #                 replicas have been upgraded (default)
        # - supervised: requires manual supervision to perform
        #               the switchover of the primary
        primaryUpdateStrategy: unsupervised
      pooler:
        # -- enable to create extra pgbouncer for readonly access
        createRO: false
        instances: 2
      monitoring:
        # -- set to enable prometheus metrics
        enablePodMonitor: false
