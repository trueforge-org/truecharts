service:
  main:
    enabled: true
    primary: true
    ports:
      main:
        enabled: true
        primary: true
        protocol: http
        port: 8080

workload:
  main:
    enabled: true
    primary: true
    type: Deployment
    podSpec:
      containers:
        main:
          enabled: true
          primary: true
          args:
            - --port
            - "8080"
          probes:
            liveness:
              enabled: true
              type: http
              port: "{{ .Values.service.main.ports.main.port }}"
            readiness:
              enabled: true
              type: http
              port: "{{ .Values.service.main.ports.main.port }}"
            startup:
              enabled: true
              type: http
              port: "{{ .Values.service.main.ports.main.port }}"

configMapsFromFolder:
  enabled: true
  basePath: "files/configMaps"
  configMapsOverrides:
    test-config:
      labels:
        test-label: "config-label"
      annotations:
        test-annotation: "config-annotation"
      fileAttributeOverrides:
        template.tpl:
          escaped: true
        .gitkeep:
          exclude: true
    test-scripts:
      labels:
        test-label: "scripts-label"
