{{/* Make sure all variables are set properly */}}
{{- include "tc.v1.common.loader.init" . -}}

{{- include "rustatio.validation" $ -}}

{{/* Render secrets for rustatio */}}
{{- $secret := include "rustatio.secrets" . | fromYaml -}}
{{- if $secret -}}
  {{- $_ := set .Values.secret "rustatio-secrets" $secret -}}
{{- end -}}

{{/* Render the templates */}}
{{- include "tc.v1.common.loader.apply" . -}}
