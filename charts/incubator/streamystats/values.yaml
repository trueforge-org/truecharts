# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/fredrikburmester/streamystats-nextjs
  pullPolicy: IfNotPresent
  tag: 2.18.0@sha256:2057cfd30ebcc614119eecbfff40fd7d5f19e8411db528eb6f48b222ae077bbf

jobServerImage:
  repository: ghcr.io/fredrikburmester/streamystats-job-server
  pullPolicy: IfNotPresent
  tag: 2.18.0@sha256:669037d3a9726e51bd9a10056badd200becd980b5023f01edb9b3a0007646264

# Upstream runs as root; the nextjs and job-server images both need to
# write to /tmp and the database migrations create files at runtime.
securityContext:
  container:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: false

streamystats:
  # SESSION_SECRET used to sign session cookies. The chart refuses to
  # start without one, so we ship a non-secret placeholder that passes
  # the upstream's "is this empty?" check. **Always override this in
  # production** with something like:
  #   openssl rand -base64 48
  sessionSecret: "change-me"

service:
  main:
    ports:
      main:
        port: 3000
        protocol: http
  job-server:
    enabled: true
    targetSelector: job-server
    ports:
      main:
        enabled: true
        port: 3005
        protocol: http
        targetPort: 3005

workload:
  main:
    enabled: true
    type: Deployment
    podSpec:
      containers:
        main:
          enabled: true
          primary: true
          env:
            NODE_ENV: production
            HOSTNAME: "0.0.0.0"
            PORT: "3000"
            # Built directly from the cnpg secret values. urlquery escapes any special chars
            # in the password.
            DATABASE_URL: '{{ printf "postgresql://%s:%s@%s:5432/%s" .Values.cnpg.main.user (urlquery .Values.cnpg.main.creds.password) (.Values.cnpg.main.creds.host | trimAll "\"") .Values.cnpg.main.database }}'
            # In-cluster DNS name of the job-server Service.
            JOB_SERVER_URL: "http://{{ printf \"%s-%s\" .Release.Name \"job-server\" }}.{{ .Release.Namespace }}.svc.cluster.local:3005"
            SESSION_SECRET: "{{ .Values.streamystats.sessionSecret }}"
          probes:
            liveness:
              type: http
              path: /api/health
              port: 3000
            readiness:
              type: http
              path: /api/health
              port: 3000
            startup:
              type: http
              path: /api/health
              port: 3000
  job-server:
    enabled: true
    type: Deployment
    podSpec:
      containers:
        job-server:
          enabled: true
          primary: true
          imageSelector: jobServerImage
          env:
            NODE_ENV: production
            PORT: "3005"
            HOST: "0.0.0.0"
            DATABASE_URL: '{{ printf "postgresql://%s:%s@%s:5432/%s" .Values.cnpg.main.user (urlquery .Values.cnpg.main.creds.password) (.Values.cnpg.main.creds.host | trimAll "\"") .Values.cnpg.main.database }}'
            SESSION_SECRET: "{{ .Values.streamystats.sessionSecret }}"
            SESSION_POLL_INTERVAL_MS: "5000"
            CRON_ACTIVITY_SYNC: "*/1 * * * *"
            CRON_RECENT_ITEMS_SYNC: "*/1 * * * *"
            CRON_USER_SYNC: "*/1 * * * *"
            CRON_PEOPLE_SYNC: "*/15 * * * *"
            CRON_EMBEDDINGS_SYNC: "*/15 * * * *"
            CRON_GEOLOCATION_SYNC: "*/5 * * * *"
            CRON_FINGERPRINT_SYNC: "0 4 * * *"
            CRON_JOB_CLEANUP: "*/1 * * * *"
            CRON_OLD_JOB_CLEANUP: "0 3 * * *"
            CRON_FULL_SYNC: "0 2 * * *"
            CRON_DELETED_ITEMS_CLEANUP: "0 * * * *"
            SKIP_STARTUP_FULL_SYNC: "false"
          probes:
            liveness:
              type: http
              path: /health
              port: 3005
            readiness:
              type: http
              path: /health
              port: 3005
            startup:
              type: http
              path: /health
              port: 3005

# Use the CNPG `postgres` superuser (not a dedicated `streamystats`
# user) because StreamyStats's job-server migrations include
# `CREATE EXTENSION IF NOT EXISTS vector;` which requires superuser
# privileges. A regular user can't enable extensions and the
# migration would silently fail, leaving the schema uncreated —
# which is what produces the "relation 'servers' does not exist"
# error on the first request.
cnpg:
  main:
    enabled: true
    user: postgres
    database: streamystats
