# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/awesometic/h5ai
  tag: latest@sha256:f45fc5a8ec89a3b7045fe83dcddb44eade4a143eb490bd9bcefa69c0d13476e5
persistence:
  config:
    enabled: true
    mountPath: /config
  directorystorage:
    enabled: true
    mountPath: /h5ai
    readOnly: true

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 80
        protocol: tcp
        targetPort: 80
