# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/awesometic/h5ai
  tag: latest@sha256:945ac26f1ff751cef57d01dd731d773594027265afa096e66ab36b445c985c9d
persistence:
  config:
    enabled: true
    mountPath: /config
  directorystorage:
    enabled: true
    mountPath: /h5ai
    readOnly: true

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 80
        protocol: tcp
        targetPort: 80
