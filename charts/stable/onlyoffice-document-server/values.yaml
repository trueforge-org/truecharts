# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/onlyoffice/documentserver
  tag: 10.0.0@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10043
        targetPort: 80
# Enabled postgres
# Enabled redis
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: onlyoffice
      postgresqlDatabase: onlyoffice
  valkey:
    enabled: true

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/healthcheck"
            readiness:
              path: "/healthcheck"
            startup:
              path: "/healthcheck"
          env:
            WOPI_ENABLED: true
            JWT_ENABLED: true
            DB_TYPE: "postgres"
            DB_PORT: 5432
            DB_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            REDIS_SERVER_PORT: 6379
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DB_PWD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            REDIS_SERVER_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: plainhost
            REDIS_SERVER_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: valkey-password
            JWT_SECRET:
              secretKeyRef:
                name: env-secrets
                key: JWT_SECRET

secret:
  env-secrets:
    enabled: true
    data:
      JWT_SECRET: "randomgeneratedstring"
