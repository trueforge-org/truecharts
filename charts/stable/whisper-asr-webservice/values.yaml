# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/onerahmet/openai-whisper-asr-webservice
  pullPolicy: IfNotPresent
  tag: "v1.11.0@sha256:ee1be3f75828d009517d1f27be2a6a52d0ca5e8e9f6a0d75ed65fd492fa25810"
gpuImage:
  repository: docker.io/onerahmet/openai-whisper-asr-webservice
  pullPolicy: IfNotPresent
  tag: "v1.11.0-gpu@sha256:a9236935bb0b2921f92ed53a477a627275e9ddadcae3cba667bab0acc06f0072"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          imageSelector: image
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          env:
            ASR_MODEL: tiny
            ASR_ENGINE: faster_whisper
service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 9000
        port: 19900
persistence:
  pip:
    enabled: true
    mountPath: "/root/.cache/pip"
  poetry:
    enabled: true
    mountPath: "/root/.cache/poetry"
  whisper:
    enabled: true
    mountPath: "/root/.cache/whisper"

updated: true
