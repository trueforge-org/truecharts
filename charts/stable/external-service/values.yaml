# yaml-language-server: $schema=./values.schema.json
# Fake external service image
image:
  repository: alpine
  pullPolicy: IfNotPresent
  tag: 3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf

service:
  main:
    type: ExternalIP
    externalIP: "1.1.1.1"
    useSlice: true
    ports:
      main:
        protocol: https
        port: 10003
        # Target port is the port of the "external service"
        # Defaults to "port" if not set
workload:
  main:
    enabled: false
    podSpec:
      containers:
        main:
          env: {}

ingress:
  main:
    annotations:
      traefik.frontend.passHostHeader: "false"
