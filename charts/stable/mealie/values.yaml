# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/mealie-recipes/mealie
  tag: v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
  pullPolicy: IfNotPresent
mealie:
  frontend:
    theme:
      light_primary: "#E58325"
      light_accent: "#007A99"
      light_secondary: "#973542"
      light_success: "#43A047"
      light_info: "#1976D2"
      light_warning: "#FF6D00"
      light_error: "#EF5350"
      dark_primary: "#E58325"
      dark_accent: "#007A99"
      dark_secondary: "#973542"
      dark_success: "#43A047"
      dark_info: "#1976D2"
      dark_warning: "#FF6D00"
      dark_error: "#EF5350"
  api:
    general:
      allow_signup: true
      default_group: Home
      base_url: ""
      token_time: 48
    security:
      max_login_attempts: 5
      user_lockout_time: 24
    smtp:
      user: ""
      password: ""
      host: ""
      port: 587
      from_name: Mealie
      from_email: ""
      # TLS | SSL | NONE
      auth_strategy: TLS
    webworkers:
      workers_per_core: 1
      max_workers: 1
      web_concurrency: 1
    ldap:
      auth_enabled: false
      server_url: ""
      tls_insecure: false
      enable_starttls: false
      tls_cacertfile: ""
      base_dn: ""
      query_bind: ""
      query_password: ""
      user_filter: ""
      admin_filter: ""
      id_attribute: uid
      name_attribute: name
      mail_attribute: mail
    oidc:
      auth_enabled: false
      signup_enabled: true
      configuration_url: ""
      client_id: ""
      client_secret: ""
      user_group: ""
      admin_group: ""
      auto_redirect: false
      provider_name: "OAuth"
      remember_me: false
workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
            - secretRef:
                name: frontend
            - secretRef:
                name: api
service:
  main:
    ports:
      main:
        port: 10018
        protocol: http
secret:
  frontend:
    enabled: true
    data:
      THEME_LIGHT_PRIMARY: '{{ .Values.mealie.frontend.theme.light_primary | default "#E58325" }}'
      THEME_LIGHT_ACCENT: '{{ .Values.mealie.frontend.theme.light_accent | default "#007A99" }}'
      THEME_LIGHT_SECONDARY: '{{ .Values.mealie.frontend.theme.light_secondary | default "#973542" }}'
      THEME_LIGHT_SUCCESS: '{{ .Values.mealie.frontend.theme.light_success | default "#43A047" }}'
      THEME_LIGHT_INFO: '{{ .Values.mealie.frontend.theme.light_info | default "#1976D2" }}'
      THEME_LIGHT_WARNING: '{{ .Values.mealie.frontend.theme.light_warning | default "#FF6D00" }}'
      THEME_LIGHT_ERROR: '{{ .Values.mealie.frontend.theme.light_error | default "#EF5350" }}'
      THEME_DARK_PRIMARY: '{{ .Values.mealie.frontend.theme.dark_primary | default "#E58325" }}'
      THEME_DARK_ACCENT: '{{ .Values.mealie.frontend.theme.dark_accent | default "#007A99" }}'
      THEME_DARK_SECONDARY: '{{ .Values.mealie.frontend.theme.dark_secondary | default "#973542" }}'
      THEME_DARK_SUCCESS: '{{ .Values.mealie.frontend.theme.dark_success | default "#43A047" }}'
      THEME_DARK_INFO: '{{ .Values.mealie.frontend.theme.dark_info | default "#1976D2" }}'
      THEME_DARK_WARNING: '{{ .Values.mealie.frontend.theme.dark_warning | default "#FF6D00" }}'
      THEME_DARK_ERROR: '{{ .Values.mealie.frontend.theme.dark_error | default "#EF5350" }}'

persistence:
  data:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: /app/data
  nltk:
    enabled: true
    type: emptyDir
    size: 5Gi
    targetSelector:
      main:
        main:
          mountPath: /nltk_data
cnpg:
  main:
    enabled: true
    user: mealie
    database: mealie

ingress:
  main:
    integrations:
      homepage:
        widget:
          version: 2
