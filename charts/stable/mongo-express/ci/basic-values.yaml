dependencies:
  mongodb:
    enabled: true
    depconfig:
      mongodbUsername: mongoexpress
      mongodbDatabase: mongoexpress

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            ME_CONFIG_MONGODB_PORT: 27017
            ME_CONFIG_MONGODB_AUTH_DATABASE: "{{ .Values.dependencies.mongodb.depconfig.mongodbDatabase }}"
            ME_CONFIG_MONGODB_AUTH_USERNAME: "{{ .Values.dependencies.mongodb.depconfig.mongodbUsername }}"
            ME_CONFIG_BASICAUTH_USERNAME: admin
            ME_CONFIG_MONGODB_SSL: false
            ME_CONFIG_MONGODB_ENABLE_ADMIN: false
            ME_CONFIG_MONGODB_SERVER:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mongodbcreds" }}'
                key: plainhost
secret:
  env-secrets:
    enabled: true
    data:
      ME_CONFIG_BASICAUTH_PASSWORD: pass
