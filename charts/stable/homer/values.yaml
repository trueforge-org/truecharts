# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/b4bz/homer
  tag: v26.08.2@sha256:83e40d1b7c9d4be4b9b9081e7151543ceb081576301b33b38615ae3f1d6b3e92
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10178
        targetPort: 8080
persistence:
  config:
    enabled: true
    mountPath: "/www/assets"

securityContext:
  container:
    runAsUser: 1000
    runAsGroup: 1000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            INIT_ASSETS: true
