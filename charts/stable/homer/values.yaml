# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/b4bz/homer
  tag: v26.08.3@sha256:febc8967c9f7648ec37633ef3ae1ec90dbe8b7c46fecab80299f08f05be7ecb6
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10178
        targetPort: 8080
persistence:
  config:
    enabled: true
    mountPath: "/www/assets"

securityContext:
  container:
    runAsUser: 1000
    runAsGroup: 1000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            INIT_ASSETS: true
