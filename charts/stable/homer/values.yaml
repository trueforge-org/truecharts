# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/bastienwirtz/homer
  tag: v26.11.1@sha256:4f91088d51de94585d463f89e84bea18fd22ca5250202abfe8e7090ad1d1f0ac
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10178
        targetPort: 8080
persistence:
  config:
    enabled: true
    mountPath: "/www/assets"

securityContext:
  container:
    runAsUser: 1000
    runAsGroup: 1000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            INIT_ASSETS: true
