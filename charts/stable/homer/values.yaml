# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/bastienwirtz/homer
  tag: v26.11.2@sha256:ce91f7506b0bf04d18e76bc193281e450c0b6e9b9bc5dae5639468e06dd7eaae
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10178
        targetPort: 8080
persistence:
  config:
    enabled: true
    mountPath: "/www/assets"

securityContext:
  container:
    runAsUser: 1000
    runAsGroup: 1000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            INIT_ASSETS: true
