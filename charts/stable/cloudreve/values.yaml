# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/cloudreve/cloudreve
  tag: 4.19.1@sha256:5c6c5baf7fa5bc6e1bb9a7509c09dde00e80b618d180244eb1d5f7e36b358ea2
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CR_CONF_Database.Type: postgres
            CR_CONF_Database.Host: '{{ .Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"" }}'
            CR_CONF_Database.User: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            CR_CONF_Database.Name: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            CR_CONF_Database.Password:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            CR_CONF_Database.Port: 5432
            CR_CONF_Redis.Server: '{{ .Values.dependencies.valkey.depconfig.creds.plain | trimAll "\"" }}:6379'
            CR_CONF_Redis.User: "default"
            CR_CONF_Redis.Password:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: valkey-password
persistence:
  config:
    enabled: true
    mountPath: "/cloudreve/data"
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 5212
        targetPort: 5212
dependencies:
  valkey:
    enabled: true
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: cloudreve
      postgresqlDatabase: cloudreve
