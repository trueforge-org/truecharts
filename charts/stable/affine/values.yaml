# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/toeverything/affine
  pullPolicy: IfNotPresent
  tag: 0.27.4@sha256:c312116a134184947d98749c8a8e29f4e3bc97f4f2a51c9a3497f9baea2eec2b

securityContext:
  container:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: false

service:
  main:
    ports:
      main:
        port: 3010
        protocol: http

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            # The upstream image doesn't set HOME, so os.homedir() returns "/",
            # which makes self-host-predeploy.js try to mkdir "/.affine/config"
            # (missing the /root prefix). Hardcoding /root here is required.
            HOME: /root
            NODE_ENV: production
            PORT: "{{ .Values.service.main.ports.main.port }}"
            REDIS_SERVER_HOST: '{{ .Values.dependencies.valkey.depconfig.creds.plainhost | trimAll "\"" }}'
            REDIS_SERVER_PORT: "6379"
            REDIS_SERVER_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: valkey-password
            DATABASE_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
            # AFFINE_SERVER_EXTERNAL_URL: "https://affine.example.com"
            # AFFINE_SERVER_HOST: "affine.example.com"
            # AFFINE_SERVER_HTTPS: "true"
            # AFFINE_INDEXER_ENABLED: "false"
      initContainers:
        affine-migration:
          enabled: true
          type: init
          imageSelector: image
          env:
            HOME: /root
            NODE_ENV: production
            REDIS_SERVER_HOST: '{{ .Values.dependencies.valkey.depconfig.creds.plainhost | trimAll "\"" }}'
            REDIS_SERVER_PORT: "6379"
            REDIS_SERVER_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: valkey-password
            DATABASE_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
          command:
            - node
          args:
            - ./scripts/self-host-predeploy.js

persistence:
  config:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: /root/.affine/config
        affine-migration:
          mountPath: /root/.affine/config
  storage:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: /root/.affine/storage
        affine-migration:
          mountPath: /root/.affine/storage

# `type: vectors` (pgvector) is required by AFFiNE; the common default is `postgres`.
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: affine
      postgresqlDatabase: affine
    operator:
      type: vectors
  valkey:
    enabled: true
