# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/nzbhydra2
  pullPolicy: IfNotPresent
  tag: 9.3.2@sha256:9dc8b2c2a9cfd736435664955a7d269f0be0464e58e94858380a4771b7c2d985
service:
  main:
    ports:
      main:
        port: 5076
        targetPort: 5076
persistence:
  config:
    enabled: true
    mountPath: "/config"

securityContext:
  container:
    readOnlyRootFilesystem: false
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: true
              type: http
              path: /actuator/health/livenessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
            readiness:
              enabled: true
              type: http
              path: /actuator/health/readinessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
            startup:
              enabled: true
              type: http
              path: /actuator/health/readinessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
