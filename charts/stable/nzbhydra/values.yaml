# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/nzbhydra2
  pullPolicy: IfNotPresent
  tag: 9.3.4@sha256:05e26d96a4a207065950ce477e6d3073d97b16264539661b14e9fcc7060d0a47
service:
  main:
    ports:
      main:
        port: 5076
        targetPort: 5076
persistence:
  config:
    enabled: true
    mountPath: "/config"

securityContext:
  container:
    readOnlyRootFilesystem: false
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: true
              type: http
              path: /actuator/health/livenessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
            readiness:
              enabled: true
              type: http
              path: /actuator/health/readinessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
            startup:
              enabled: true
              type: http
              path: /actuator/health/readinessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
