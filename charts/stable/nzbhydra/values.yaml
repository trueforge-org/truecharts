# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/nzbhydra2
  pullPolicy: IfNotPresent
  tag: 9.2.0@sha256:2a18550d97c5ec420b7e9442ce2cc6a1d6f27af66f43478b7c91c49ed93ed779
service:
  main:
    ports:
      main:
        port: 5076
        targetPort: 5076
persistence:
  config:
    enabled: true
    mountPath: "/config"

securityContext:
  container:
    readOnlyRootFilesystem: false
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: true
              type: http
              path: /actuator/health/livenessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
            readiness:
              enabled: true
              type: http
              path: /actuator/health/readinessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
            startup:
              enabled: true
              type: http
              path: /actuator/health/readinessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
