# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/nzbhydra2
  pullPolicy: IfNotPresent
  tag: 9.3.1@sha256:6b42a4dd86843d7f4b8cbf421348ef08a169cd7695e0ca33d8e9892080c47d69
service:
  main:
    ports:
      main:
        port: 5076
        targetPort: 5076
persistence:
  config:
    enabled: true
    mountPath: "/config"

securityContext:
  container:
    readOnlyRootFilesystem: false
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: true
              type: http
              path: /actuator/health/livenessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
            readiness:
              enabled: true
              type: http
              path: /actuator/health/readinessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
            startup:
              enabled: true
              type: http
              path: /actuator/health/readinessState
              port: 5076
              spec:
                failureThreshold: 5
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 10
