# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/krateng/maloja
  tag: latest@sha256:313b58d282934b2e7dc27f794462eb2ceb1567db23806b49f78b706dd86afe09
persistence:
  config:
    enabled: true
    mountPath: /config

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 42010
        protocol: tcp
        targetPort: 42010
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            MALOJA_DATA_DIRECTORY: /config
            MALOJA_HOST: 0.0.0.0
