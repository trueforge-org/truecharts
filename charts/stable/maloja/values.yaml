# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/krateng/maloja
  tag: latest@sha256:8864145b0107f9edfdd6672b366deb84378f4b20ea48730206bc5a56e3f82460
persistence:
  config:
    enabled: true
    mountPath: /config

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 42010
        protocol: tcp
        targetPort: 42010
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            MALOJA_DATA_DIRECTORY: /config
            MALOJA_HOST: 0.0.0.0
