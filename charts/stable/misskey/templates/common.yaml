{{/* Make sure all variables are set properly */}}
{{- include "tc.v1.common.loader.init" . }}

{{- $configmap := include "misskey.configmap" . | fromYaml -}}
{{- if $configmap -}}
  {{- $_ := set .Values.configmap "misskeyconfig" $configmap -}}
{{- end -}}

{{/* Render the templates */}}
{{/* Store the configs that contain credentials as secrets, not configmaps */}}
{{- range $name := list "misskeyconfig" -}}
  {{- with (get $.Values.configmap $name) -}}
    {{- $_ := set $.Values.secret $name . -}}
    {{- $_ := unset $.Values.configmap $name -}}
  {{- end -}}
{{- end }}

{{ include "tc.v1.common.loader.apply" . }}
