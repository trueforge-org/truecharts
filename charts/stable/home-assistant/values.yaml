# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/home-assistant
  pullPolicy: IfNotPresent
  tag: "2026.11.2@sha256:9d5c2c119ac5954e3acf0c41abdf7d8f3bacd38530dc1326b51d01ebac89b656"

yqImage:
  pullPolicy: IfNotPresent
  repository: oci.trueforge.org/containerforge/go-yq
  tag: "4.54.3@sha256:6bc96b27afd5bf67c8af7d93f2346c2395bb5244fab3d9051f3094ba36ece2a5"

service:
  main:
    ports:
      main:
        port: 8123
        targetPort: 8123
workload:
  main:
    podSpec:
      initContainers:
        init:
          type: init
          enabled: true
          imageSelector: yqImage
          command: /config/init/init.sh

# Enable a prometheus-operator servicemonitor
prometheus:
  serviceMonitor:
    enabled: false
    # interval: 1m
    # additionalLabels: {}
persistence:
  config:
    enabled: true
    mountPath: /config
    targetSelectAll: true
  init:
    enabled: true
    type: configmap
    objectName: init
    mountPath: "/config/init"
    defaultMode: "0777"
    readOnly: true
    targetSelector:
      main:
        init: {}
configmap:
  init:
    enabled: true
    data:
      init.sh: |-
        #!/bin/sh
        {{- $haDBURL := (printf "%s?client_encoding=utf8" ($.Values.cnpg.main.creds.std | trimAll "\"")) }}
        config="/config/configuration.yaml"
        default="/config/init"
        if [ ! -f "$config" ]; then
          echo "File [$config] does NOT exist. Creating..."
          cp "$default/configuration.yaml.default" "$config"
        fi
        if ! grep -q "recorder:" "$config"; then
          echo "Section [recorder] does NOT exist in [$config]. Appending..."
          echo "" >> "$config"
          cat "$default/recorder.default" >> "$config"
        fi

        echo "Updating database URL"
        yq -i '.recorder.db_url = "{{ $haDBURL }}"' "$config"
        echo "Done"

        echo "Creating include files..."
        for include_file in groups.yaml automations.yaml scripts.yaml scenes.yaml; do
          if [ ! -f "/config/$include_file" ]; then
            echo "File [$include_file] missing. Creating"
            touch "/config/$include_file"
          fi
        done
      configuration.yaml.default: |-
        # Configure a default setup of Home Assistant (frontend, api, etc)
        default_config:

        # Text to speech
        tts:
          - platform: google_translate

        group: !include groups.yaml
        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
      recorder.default: |-
        recorder:
          purge_keep_days: 30
          commit_interval: 3
          db_url: {{ (printf "%s?client_encoding=utf8" (.Values.cnpg.main.creds.std | trimAll "\"")) | quote }}
cnpg:
  main:
    enabled: true
    user: home-assistant
    database: home-assistant

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    capabilities:
      add:
        - NET_RAW
        - NET_BIND_SERVICE
