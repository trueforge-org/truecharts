# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/alam00000/bentopdf-simple
  pullPolicy: IfNotPresent
  tag: 2.8.10@sha256:b5227a308e796d2bd00d2eb6da9d7296093107a8be7efef38a006d06506dc3c0

service:
  main:
    ports:
      main:
        port: 8080
        protocol: http
        targetPort: 8080

persistence:
  # nginx needs writable pid + temp dirs at runtime (root FS is read-only by default)
  nginx-cache:
    enabled: true
    type: emptyDir
    mountPath: /var/cache/nginx
  nginx-tmp:
    enabled: true
    type: emptyDir
    mountPath: /etc/nginx/tmp
