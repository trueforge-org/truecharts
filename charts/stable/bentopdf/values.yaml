# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/alam00000/bentopdf-simple
  pullPolicy: IfNotPresent
  tag: 2.8.12@sha256:f96da8c4a347880b891d66aa2ebfa6b63f76277dafcfcdfa40c8e6b92c59ef44

service:
  main:
    ports:
      main:
        port: 8080
        protocol: http
        targetPort: 8080

persistence:
  # nginx needs writable pid + temp dirs at runtime (root FS is read-only by default)
  nginx-cache:
    enabled: true
    type: emptyDir
    mountPath: /var/cache/nginx
  nginx-tmp:
    enabled: true
    type: emptyDir
    mountPath: /etc/nginx/tmp
