# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/alam00000/bentopdf-simple
  pullPolicy: IfNotPresent
  tag: 2.8.11@sha256:3bbab98791694b77bc70ab03bf1b2ea89e568a75ef172c27d95cbdbdf810038f

service:
  main:
    ports:
      main:
        port: 8080
        protocol: http
        targetPort: 8080

persistence:
  # nginx needs writable pid + temp dirs at runtime (root FS is read-only by default)
  nginx-cache:
    enabled: true
    type: emptyDir
    mountPath: /var/cache/nginx
  nginx-tmp:
    enabled: true
    type: emptyDir
    mountPath: /etc/nginx/tmp
