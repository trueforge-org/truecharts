# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/sissbruecker/linkding
  tag: 1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10210
persistence:
  data:
    enabled: true
    mountPath: "/etc/linkding/data"
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            LD_SERVER_PORT: "{{ .Values.service.main.ports.main.port }}"
            # User Defined
            LD_REQUEST_TIMEOUT: 60
            LD_DISABLE_BACKGROUND_TASKS: false
            LD_DISABLE_URL_VALIDATION: false
            LD_SUPERUSER_NAME: "superuser"
            LD_SUPERUSER_PASSWORD: "somesecret"
