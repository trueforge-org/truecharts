# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/towfiqi/serpbear
  tag: latest@sha256:7a2e29bfe682082642be1e0fe0a0d7b561470427d25a4afd25eca1e7223b993b
persistence:
  data:
    enabled: true
    mountPath: /app/data

serpbear:
  api_key: ""
  app_url: http://localhost:10605
  password: secret
  session_duration: 24
  user: admin
service:
  main:
    ports:
      main:
        port: 10605
        protocol: http
        targetPort: 3000
workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
            - secretRef:
                name: serpbear-secret
