# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/dictionarry-hub/profilarr
  pullPolicy: IfNotPresent
  tag: 2.3.0@sha256:11ed9f4c62311b956f1a89b44e19cf0908cd3e5169c3e43d59ab8144bbf7fe7d
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        protocol: http
        port: 6868
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            HOST: 0.0.0.0
            # Auth mode (on, oidc, off)
            # on is default
            AUTH: "on"
            # OIDC_CLIENT_ID: ""
            # OIDC_CLIENT_SECRET: ""
            # OIDC_DISCOVERY_URL: ""
            # auto set url
            ORIGIN: "{{ .Values.chartContext.appUrl }}"
persistence:
  config:
    enabled: true
    mountPath: "/config"
