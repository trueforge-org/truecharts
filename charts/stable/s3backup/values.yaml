# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/joch/s3backup
  tag: latest@sha256:f81c2bb5de6ee13413f4e63bd720d2221605956344833df086e14554b44b2776
persistence: {}

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            ACCESS_KEY:
              secretKeyRef:
                name: env-secrets
                key: ACCESS_KEY
            CRON_SCHEDULE: 0 * * * *
            S3CMDPARAMS: ""
            S3PATH: s3://mybucket/
            SECRET_KEY:
              secretKeyRef:
                name: env-secrets
                key: SECRET_KEY
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false

secret:
  env-secrets:
    enabled: true
    data:
      ACCESS_KEY: 'Your AWS Access key'
      SECRET_KEY: 'Your AWS Access secret'
