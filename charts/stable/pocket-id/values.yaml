# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/pocket-id/pocket-id
  pullPolicy: IfNotPresent
  tag: v2.19.3@sha256:189e03bb73bb86d7108fe81cbe2237c408cff2176b14cd7a39cc12a2ee8b2762

service:
  main:
    ports:
      main:
        port: 1411
        protocol: http
        targetPort: 1411

persistence:
  data:
    enabled: true
    mountPath: /app/data

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: /healthz
              type: http
            readiness:
              path: /healthz
              type: http
            startup:
              path: /healthz
              type: http
          env:
            APP_URL: "https://your-pocket-id-domain.com"
            TRUST_PROXY: "true"
            ANALYTICS_DISABLED: "true"
            VERSION_CHECK_DISABLED: "false"
            MAXMIND_LICENSE_KEY:
              secretKeyRef:
                name: env-secrets
                key: MAXMIND_LICENSE_KEY
            ENCRYPTION_KEY:
              secretKeyRef:
                name: env-secrets
                key: ENCRYPTION_KEY
            DB_CONNECTION_STRING: file:data/pocket-id.db

secret:
  env-secrets:
    enabled: true
    data:
      MAXMIND_LICENSE_KEY: ""
      ENCRYPTION_KEY: "changeme_changeme!!"
