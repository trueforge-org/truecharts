# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/pocket-id/pocket-id
  pullPolicy: IfNotPresent
  tag: v2.18.0@sha256:323e7ef5bfacf7cf32f22f3d10ccdf48e0c97c94d67e7e40b0b996830deb5165

service:
  main:
    ports:
      main:
        port: 1411
        protocol: http
        targetPort: 1411

persistence:
  data:
    enabled: true
    mountPath: /app/data

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: /healthz
              type: http
            readiness:
              path: /healthz
              type: http
            startup:
              path: /healthz
              type: http
          env:
            APP_URL: "localhost"
            TRUST_PROXY: "true"
            ANALYTICS_DISABLED: "true"
            VERSION_CHECK_DISABLED: "false"
            MAXMIND_LICENSE_KEY: ""
            ENCRYPTION_KEY: changeme_changeme!!
            DB_CONNECTION_STRING: file:data/pocket-id.db
