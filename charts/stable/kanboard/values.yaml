# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/kanboard/kanboard
  tag: "v1.2.58@sha256:51a912ecd3b6df0cca2cfb521edb2cb92462c59fff427a4938465178b1f54d19"
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10015
        targetPort: 80
persistence:
  data:
    enabled: true
    mountPath: "/var/www/app/data"
  ssl:
    enabled: true
    mountPath: "/etc/nginx/ssl"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: kanboard
      postgresqlDatabase: kanboard

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            MAIL_CONFIGURATION: false
            LOG_DRIVER: stdout
            DB_DRIVER: "postgres"
            DB_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_PORT: "5432"
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DB_HOSTNAME:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
