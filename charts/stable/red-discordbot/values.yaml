# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/phasecorex/red-discordbot
  tag: full@sha256:07a97b414b83acd993d0332a6e7dbdcf9c4cb25d2f316c2967b1946d6c0728b2
persistence:
  data:
    enabled: true
    mountPath: /data

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PREFIX: ""
            TOKEN:
              secretKeyRef:
                name: env-secrets
                key: TOKEN
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false

secret:
  env-secrets:
    enabled: true
    data:
      TOKEN: ''
