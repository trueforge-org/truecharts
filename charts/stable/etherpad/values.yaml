# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/ether/etherpad
  pullPolicy: IfNotPresent
  tag: 3.3.22@sha256:a6c5adbdf315beac5062e01059fd3021f2f790bfaf1669372a72bb300527b323
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        port: 10060
        targetPort: 9001
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DB_TYPE: "postgres"
            DB_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_PORT: "5432"
            DB_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            # User Defined

            TITLE: "Etherpad"
            FAVICON: "favicon.ico"
            DEFAULT_PAD_TEXT: "Welcome to Etherpad! This pad text is synchronized as you type, so that everyone viewing this page sees the same text. This allows you to collaborate seamlessly on documents! Get involved with Etherpad at https://etherpad.org"
            ADMIN_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: ADMIN_PASSWORD
            USER_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: USER_PASSWORD
persistence:
  data:
    enabled: true
    mountPath: "/opt/etherpad-lite/var"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: etherpad
      postgresqlDatabase: etherpad
secret:
  env-secrets:
    enabled: true
    data:
      ADMIN_PASSWORD: "adminpass"
      USER_PASSWORD: "firstuserpass"
