# yaml-language-server: $schema=./values.schema.json
image:
  repository: public.ecr.aws/docker/library/xwiki
  tag: 18.9.0-postgres-tomcat@sha256:1a71cc7c7555c30588117b28a558449b7e80f0ee793192592a1d5caa6830ee91
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10208
        targetPort: 8080
persistence:
  config:
    enabled: true
    mountPath: "/usr/local/xwiki"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: xwiki
      postgresqlDatabase: xwiki

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            # User Defined
            JAVA_OPTS: ""
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
