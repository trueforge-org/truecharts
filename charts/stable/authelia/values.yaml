# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/authelia/authelia
  pullPolicy: IfNotPresent
  tag: 4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54

# Raw Authelia configuration
# Replace it with your configuration
# https://www.authelia.com/configuration/prologue/introduction/
authelia:
  access_control:
    default_policy: one_factor
  session:
    cookies:
      - domain: example.com
        authelia_url: https://example.com

workload:
  main:
    replicas: 2
    strategy: RollingUpdate
    podSpec:
      containers:
        main:
          env:
            # Update the following secrets with your own values
            AUTHELIA_SESSION_SECRET:
              secretKeyRef:
                name: env-secrets
                key: AUTHELIA_SESSION_SECRET
            AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET:
              secretKeyRef:
                name: env-secrets
                key: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
            AUTHELIA_STORAGE_ENCRYPTION_KEY:
              secretKeyRef:
                name: env-secrets
                key: AUTHELIA_STORAGE_ENCRYPTION_KEY
            # Don't change the following envs
            X_AUTHELIA_CONFIG: "{{ .Values.persistence.configfile.mountPath }}"
            AUTHELIA_SERVER_DISABLE_HEALTHCHECK: "true"
            AUTHELIA_SERVER_ADDRESS: "tcp://:{{ .Values.service.main.ports.main.port }}/"
            AUTHELIA_STORAGE_POSTGRES_ADDRESS: 'tcp://{{ .Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"" }}:{{ .Values.dependencies.postgresql.depconfig.creds.plainport | trimAll "\"" }}'
            AUTHELIA_STORAGE_POSTGRES_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            AUTHELIA_STORAGE_POSTGRES_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            AUTHELIA_STORAGE_POSTGRES_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            AUTHELIA_SESSION_REDIS_HOST: '{{ .Values.dependencies.valkey.depconfig.creds.plain | trimAll "\"" }}'
            AUTHELIA_SESSION_REDIS_PORT: "{{ .Values.dependencies.valkey.service.main.ports.main.port }}"
            AUTHELIA_SESSION_REDIS_DATABASE_INDEX: "0"
            AUTHELIA_SESSION_REDIS_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: valkey-password

          probes:
            liveness:
              type: http
              path: "/api/health"
            readiness:
              type: http
              path: "/api/health"
            startup:
              type: http
              path: "/api/health"
service:
  main:
    ports:
      main:
        port: 9091

secret:
  env-secrets:
    enabled: true
    data:
      AUTHELIA_SESSION_SECRET: "some-secret-replace-me"
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "some-secret-replace-me"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "some-secret-replace-me"
  authelia-configfile:
    enabled: true
    data:
      configuration.yaml: |
        {{- $.Values.authelia | toYaml | nindent 2 }}

persistence:
  config:
    enabled: true
    mountPath: /config
  configfile:
    enabled: true
    mountPath: /configuration.yaml
    subPath: configuration.yaml
    readOnly: true
    type: secret
    objectName: authelia-configfile

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: authelia
      postgresqlDatabase: authelia
  valkey:
    enabled: true
