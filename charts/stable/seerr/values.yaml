# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/seerr
  tag: "3.5.2@sha256:04c0db9919a121ef33eee426ab29d772fdfe9bc9264d66506f9e969706968f72"
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10241
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: true
              path: /api/v1/status
            readiness:
              enabled: true
              path: /api/v1/status
            startup:
              enabled: true
              type: tcp
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            # User Defined
            # is this really needed?
            # JELLYFIN_TYPE: ""
            LOG_LEVEL: "info"
            DB_TYPE: postgres
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DB_PORT: "5432"
            DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DB_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_LOG_QUERIES: "false"
persistence:
  config:
    enabled: true
    mountPath: "/config"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: seerr
      postgresqlDatabase: seerr
