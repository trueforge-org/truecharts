# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/linuxserver/quassel-core
  pullPolicy: IfNotPresent
  tag: 0.14.0@sha256:cefb9aa752d4db099d98be5966432e9dcd298695571c8eedc84ffc298f3258e0
service:
  main:
    ports:
      main:
        targetPort: 4242
        port: 4242
  ident:
    enabled: true
    ports:
      ident:
        enabled: true
        targetPort: 10113
        port: 10113
persistence:
  varrun:
    enabled: true
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: quassel-core
      postgresqlDatabase: quassel-core

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          env:
            DB_BACKEND: "PostgreSQL"
            DB_PGSQL_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_PGSQL_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_PGSQL_PORT: 5432
            AUTH_AUTHENTICATOR: "Database"
            RUN_OPTS: "--config-from-environment"
            DB_PGSQL_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DB_PGSQL_HOSTNAME:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
