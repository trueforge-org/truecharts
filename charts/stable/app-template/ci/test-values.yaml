image:
  repository: oci.trueforge.org/containerforge/whoami
  pullPolicy: IfNotPresent
  tag: 1.12.0@sha256:9e3747a349b104939f44547e2d875f56ba56836c6d8355ccc4eb8c72d7b3e433

workload:
  main:
    podSpec:
      containers:
        main:
          args:
            - --port
            - "8080"

service:
  main:
    enabled: true
    ports:
      main:
        port: 8080
        targetPort: 8080
      extraport:
        enabled: true
        port: 9118
        targetPort: 9118
  extraservice:
    enabled: true
    ports:
      extrasvcport:
        enabled: true
        port: 9119
        targetPort: 9119

persistence:
  config:
    enabled: true
    mountPath: "/config"
    type: pvc
    accessMode: ReadWriteOnce
    size: "100Gi"
