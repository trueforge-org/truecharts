image:
  repository: oci.trueforge.org/containerforge/whoami
  pullPolicy: IfNotPresent
  tag: 1.12.0@sha256:9ed5d0de8d00aeb16d2788a533da2b0739799592977f72e63c49bfee9459b2d7

workload:
  main:
    podSpec:
      containers:
        main:
          args:
            - --port
            - "8080"

service:
  main:
    enabled: true
    ports:
      main:
        port: 8080
        targetPort: 8080
      extraport:
        enabled: true
        port: 9118
        targetPort: 9118
  extraservice:
    enabled: true
    ports:
      extrasvcport:
        enabled: true
        port: 9119
        targetPort: 9119

persistence:
  config:
    enabled: true
    mountPath: "/config"
    type: pvc
    accessMode: ReadWriteOnce
    size: "100Gi"
