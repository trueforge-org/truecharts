image:
  repository: oci.trueforge.org/containerforge/whoami
  pullPolicy: IfNotPresent
  tag: 1.12.0@sha256:ab5d621fc3ecf2ddcc52a728551bab0b942c1e777126b9595df1cfa4e7b9adfa

workload:
  main:
    podSpec:
      containers:
        main:
          args:
            - --port
            - "8080"

service:
  main:
    enabled: true
    ports:
      main:
        port: 8080
        targetPort: 8080
    portsList:
      - name: "extraport"
        enabled: true
        port: 9118
        targetPort: 9118

serviceList:
  - name: extraservice
    enabled: true
    portsList:
      - name: "extrasvcport"
        enabled: true
        port: 9119
        targetPort: 9119

persistence:
  config:
    enabled: true
    mountPath: "/config"
    type: pvc
    accessMode: ReadWriteOnce
    size: "100Gi"
