# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/cloudflareddns
  pullPolicy: IfNotPresent
  tag: 3.0.0@sha256:c73bb4b241adc9b6155f80197e30731a520577f2eb28b3097edf55fba495dfcd
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
            UPDATE_IPV4: true
            UPDATE_IPV6: true
            DETECTION_MODE: "dig-whoami.cloudflare"
            LOG_LEVEL: 3
            CF_APITOKEN:
              secretKeyRef:
                name: env-secrets
                key: CF_APITOKEN
            #  CF_USER: not needed with API Token
            #  CF_APIKEY: not needed with API Token
            CF_HOSTS: "subdomain.example.com, subdomain.example.org"
            INTERVAL: 300
persistence:
  config:
    enabled: true
    mountPath: /config
secret:
  env-secrets:
    enabled: true
    data:
      CF_APITOKEN: "CLOUDFLARETOKEN"
