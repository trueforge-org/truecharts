# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/danmed/tasmobackupv1
  tag: 1.07.00@sha256:1b3b673888bc672ff292d1865a9f57328d234af89187baca1b69dad8368cf58a
  pullPolicy: IfNotPresent

env:
  DBNAME: data/tasmobackup
  DBTYPE: sqlite

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DBNAME: data/tasmobackup
            DBTYPE: sqlite
service:
  main:
    ports:
      main:
        port: 8259
        protocol: http
        targetPort: 80

persistence:
  data:
    enabled: true
    mountPath: /var/www/html/data
