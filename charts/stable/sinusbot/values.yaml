# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/gamer92000/sinusbot-docker
  tag: latest@sha256:1ee6aa699e94aeb035149b3b1dca12d8d971944796dda4ec3b13bdb459ff385b
persistence:
  data:
    enabled: true
    mountPath: /opt/sinusbot/data
  scriptspath:
    enabled: true
    mountPath: /opt/sinusbot/scripts

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8087
        protocol: tcp
        targetPort: 8087
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            OVERRIDE_PASSWORD: foobar
