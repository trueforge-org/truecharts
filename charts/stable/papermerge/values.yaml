# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/papermerge/papermerge
  pullPolicy: IfNotPresent
  tag: 3.5.3@sha256:78c7a24609066b253cad18c6f8486af505e3b8da30aa73a45f064359a6516d16
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        targetPort: 80
        port: 12000
papermerge:
  # Security secret key. MUST be changed, use a random string of at least 32 characters.
  secretKey: "PLACEHOLDERSECRETKEYXXXXXXXXXXXX"
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PAPERMERGE__SECURITY__SECRET_KEY:
              secretKeyRef:
                name: papermerge-secrets
                key: PAPERMERGE__SECURITY__SECRET_KEY
            PAPERMERGE__AUTH__USERNAME: admin
            PAPERMERGE__AUTH__PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: PAPERMERGE__AUTH__PASSWORD
            PAPERMERGE__DATABASE__URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
            PAPERMERGE__REDIS__URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: url
persistence:
  config:
    enabled: true
    mountPath: "/core_app/index_db"
  media:
    enabled: true
    mountPath: "/core_app/media"
  varrun:
    enabled: false
dependencies:
  valkey:
    enabled: true
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: papermerge
      postgresqlDatabase: papermerge

secret:
  env-secrets:
    enabled: true
    data:
      PAPERMERGE__AUTH__PASSWORD: 'admin'
