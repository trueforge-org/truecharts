# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: oci.trueforge.org/containerforge/autoscan
  tag: 1.4.0@sha256:32e1c8dcb9b9b2c3629b15f73a847b4fc2a53af99e575c8d66fedb009f0851ee
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3030
        protocol: http
        targetPort: 3030
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
            PLEX_LOGIN: ""
            PLEX_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: PLEX_PASSWORD
persistence:
  config:
    enabled: true
    mountPath: /config

secret:
  env-secrets:
    enabled: true
    data:
      PLEX_PASSWORD: ""
