# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: oci.trueforge.org/containerforge/autoscan
  tag: 1.4.0@sha256:6dc4e8cdeac1ad7a0ea22b76c0c2c25d7c72c33f61ddc0a3f4a196a76d8bae52
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3030
        protocol: http
        targetPort: 3030
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
            PLEX_LOGIN: ""
            PLEX_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: PLEX_PASSWORD
persistence:
  config:
    enabled: true
    mountPath: /config

secret:
  env-secrets:
    enabled: true
    data:
      PLEX_PASSWORD: ""
