# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/linuxserver/boinc
  pullPolicy: IfNotPresent
  tag: latest@sha256:c6c6997286e92ca1231e737673650b7f77ace777779cbcedf4f5a18296e16e54
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        targetPort: 8080
        protocol: tcp
        port: 10142
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: PASSWORD
persistence:
  config:
    enabled: true
    mountPath: /config
secret:
  env-secrets:
    enabled: true
    data:
      PASSWORD: ""
