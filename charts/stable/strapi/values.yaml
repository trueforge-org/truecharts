# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/vshadbolt/strapi
  tag: 5.57.0-alpine@sha256:f9f0b0485d60c330382fb773d262fb0ef94d75db519c30ba8c7705c63efdfe0f
  pullPolicy: Always
service:
  main:
    ports:
      main:
        port: 1337
persistence:
  data:
    enabled: true
    mountPath: /srv/app
# Enabled postgres
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: strapi
      postgresqlDatabase: strapi

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            NPM_CONFIG_AUDIT: "false"
            NPM_CONFIG_FUND: "false"
            PORT: "{{ .Values.service.main.ports.main.port }}"
            DATABASE_CLIENT: postgres
            DATABASE_PORT: 5432
            DATABASE_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DATABASE_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DATABASE_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DATABASE_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            # STRAPI_LICENSE
            # PUBLIC_URL
            NODE_ENV: development
            STRAPI_DISABLE_UPDATE_NOTIFICATION: true
            FAST_REFRESH: false
            EXTRA_ARGS: ""
            JWT_SECRET:
              secretKeyRef:
                name: env-secrets
                key: JWT_SECRET
            ADMIN_JWT_SECRET:
              secretKeyRef:
                name: env-secrets
                key: ADMIN_JWT_SECRET
            APP_KEYS:
              secretKeyRef:
                name: env-secrets
                key: APP_KEYS

resources:
  requests:
    cpu: 1000m
  limits:
    cpu: 4000m

secret:
  env-secrets:
    enabled: true
    data:
      JWT_SECRET: "my_jwt_secret"
      ADMIN_JWT_SECRET: "my_admin_jwt_secret"
      APP_KEYS: '["keya", "keyb"]'
