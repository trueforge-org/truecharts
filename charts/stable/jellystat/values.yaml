# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/cyfershepard/jellystat
  pullPolicy: IfNotPresent
  tag: latest@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        protocol: http
        port: 10681
        targetPort: 3000
      ws:
        enabled: true
        protocol: tcp
        port: 10682
        targetPort: 3004
jellystat:
  # Must be changed. Random string, at least 32 characters.
  jwtSecret: "PLACEHOLDERJWTSECRET00000000000000"

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/"
            readiness:
              path: "/"
            startup:
              path: "/"
          env:
            # PORT variables do not work.
            # PORT: "{{ .Values.service.main.ports.main.port }}"
            # WS_PORT: "{{ .Values.service.main.ports.ws.port }}"
            POSTGRES_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            POSTGRES_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            POSTGRES_IP:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            POSTGRES_PORT: 5432
            JWT_SECRET:
              secretKeyRef:
                name: jellystat-secrets
                key: JWT_SECRET
persistence:
  backup:
    enabled: true
    mountPath: "/app/backend/backup-data"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: jfstat
      postgresqlDatabase: jfstat
