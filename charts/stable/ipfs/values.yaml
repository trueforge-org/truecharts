# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/ipfs/kubo
  pullPolicy: IfNotPresent
  tag: v0.43.2@sha256:31b965f24ee47e3cb3832a5e3973f5102dd643932a9621a8c2fd7dbe5a0a799b
service:
  main:
    ports:
      main:
        port: 10125
        targetPort: 5001
  peer-tcp:
    enabled: true
    ports:
      peer-tcp:
        enabled: true
        targetPort: 4001
        port: 4001
  peer-udp:
    enabled: true
    ports:
      peer-udp:
        protocol: udp
        enabled: true
        targetPort: 4001
        port: 4001
  gateway:
    enabled: true
    type: ClusterIP
    ports:
      gateway:
        enabled: true
        targetPort: 8080
        port: 10147
persistence:
  data:
    enabled: true
    mountPath: "/data/ipfs"
  staging:
    enabled: true
    mountPath: "/export"
  ipfs:
    enabled: true
    mountPath: "/ipfs"
  ipns:
    enabled: true
    mountPath: "/ipns"

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/webui"
            readiness:
              path: "/webui"
            startup:
              path: "/webui"
          env:
            IPFS_PROFILE: "server"
            IPFS_SWARM_KEY:
              secretKeyRef:
                name: env-secrets
                key: IPFS_SWARM_KEY
            IPFS_SWARM_KEY_FILE: ""
secret:
  env-secrets:
    enabled: true
    data:
      IPFS_SWARM_KEY: ""
