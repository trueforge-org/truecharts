# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/nextcloud-fpm
  pullPolicy: IfNotPresent
  tag: "35.0.2@sha256:7e9cd931ac1f2b4d1868895d6690e54be6ec9f9b902e343904d290e06436287b"
nginxImage:
  repository: oci.trueforge.org/containerforge/nginx
  pullPolicy: IfNotPresent
  tag: "1.28.3@sha256:f5096c09d4a2b634b481c3ab7f7bfb576b264c63821f21ef6fe26cdb7f679f72"
imaginaryImage:
  repository: oci.trueforge.org/containerforge/nextcloud-imaginary
  pullPolicy: IfNotPresent
  tag: "20230401@sha256:abc9ae5dca44011b6a8a94ff3e0f211892651324a68f14db5ba0b4a94f894b7c"
hpbImage:
  repository: oci.trueforge.org/containerforge/nextcloud-notify-push
  pullPolicy: IfNotPresent
  tag: "1.4.2@sha256:ce48b5db14869362c583d161782d3f3bf711a2e39d8404089dbfdba3a11a1f7f"
clamavImage:
  repository: docker.io/clamav/clamav
  pullPolicy: IfNotPresent
  tag: 1.5.4@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
collaboraImage:
  repository: docker.io/collabora/code
  pullPolicy: IfNotPresent
  tag: 26.04.6.1.1@sha256:95f29f1c0a1778999125f53f058d968fe0afb37c95e32ebfb9f3444140faebd2

nextcloud:
  # Initial Credentials
  credentials:
    initialAdminUser: admin
    initialAdminPassword: adminpass
  # General settings
  general:
    # Custom Nextcloud Scripts
    run_optimize: true
    default_phone_region: GR
    # IP used for exposing nextcloud,
    # often the loadbalancer IP
    accessIP: ""
    # Allows Nextcloud to connect to unsecure (http) endpoints
    force_enable_allow_local_remote_servers: false
  # File settings
  files:
    shared_folder_name: Shared
    max_chunk_size: 10485760
  # Expiration settings
  expirations:
    activity_expire_days: 90
    trash_retention_obligation: auto
    versions_retention_obligation: auto
  # Previews settings
  previews:
    enabled: true
    # It will also deploy the container
    imaginary: true
    cron: true
    schedule: "*/30 * * * *"
    max_x: 2048
    max_y: 2048
    # Nextcloud default: PHP skips images it would need more memory (MB) than this to decode
    max_memory: 256
    max_file_size_image: 50
    # Setting for Imaginary
    # Megapixels; covers 48-50MP phone cameras. Larger images get no thumbnail
    max_allowed_resolution: 50.0
    jpeg_quality: 60
    square_sizes: 32 256
    width_sizes: 256 384
    height_sizes: 256
    # Casings are important
    # https://github.com/nextcloud/server/blob/master/config/config.sample.php#L1269
    # Only the last part of the provider is needed
    providers:
      - PNG
      - JPEG
  # Logging settings
  logging:
    log_level: 2
    log_file: /var/log/nextcloud/nextcloud.log
    log_audit_file: /var/log/nextcloud/audit.log
    log_date_format: d/m/Y H:i:s
  # ClamAV settings
  clamav:
    # It will also deploy the container
    # Note that this runs as root
    enabled: false
    stream_max_length: 26214400
    file_max_size: -1
    infected_action: only_log
  # Notify Push settings
  notify_push:
    # It will also deploy the container
    enabled: true
  # Collabora settings
  collabora:
    # It will also deploy the container
    enabled: false
    # default|compact|tabbed
    interface_mode: default
    username: admin
    password: changeme
    dictionaries:
      - de_DE
      - en_GB
      - en_US
      - el_GR
      - es_ES
      - fr_FR
      - pt_BR
      - pt_PT
      - it
      - nl
      - ru
  onlyoffice:
    # It will not deploy the container
    # Only add the OnlyOffice settings
    enabled: false
    url: ""
    internal_url: ""
    verify_ssl: true
    jwt: ""
    jwt_header: Authorization
  # PHP settings
  php:
    memory_limit: 1G
    upload_limit: 10G
    # Sized to fit the 3000Mi main container limit (~100Mi per worker)
    pm_max_children: 24
    pm_start_servers: 4
    pm_min_spare_servers: 2
    pm_max_spare_servers: 6
  opcache:
    interned_strings_buffer: 32
    max_accelerated_files: 10000
    memory_consumption: 128
    revalidate_freq: 60
    jit_buffer_size: 128
# Do NOT edit below this line
workload:
  # Nextcloud php-fpm
  main:
    type: Deployment
    podSpec:
      containers:
        main:
          enabled: true
          primary: true
          resources:
            limits:
              cpu: 2000m
              memory: 3000Mi
            requests:
              cpu: 200m
              memory: 500Mi
          envFrom:
            - configMapRef:
                name: nextcloud-config
          probes:
            liveness:
              enabled: true
              type: exec
              command: /healthcheck.sh
            readiness:
              enabled: true
              type: exec
              command: /healthcheck.sh
            startup:
              enabled: true
              type: tcp
              port: "{{ .Values.service.nextcloud.ports.nextcloud.targetPort }}"
  nginx:
    enabled: true
    type: Deployment
    strategy: RollingUpdate
    replicas: 1
    podSpec:
      containers:
        nginx:
          enabled: true
          primary: true
          imageSelector: nginxImage
          resources:
            excludeExtra: true
          probes:
            readiness:
              enabled: true
              path: /robots.txt
              port: "{{ .Values.service.main.ports.main.port }}"
              httpHeaders:
                Host: kube.internal.healthcheck
            liveness:
              enabled: true
              path: /robots.txt
              port: "{{ .Values.service.main.ports.main.port }}"
              httpHeaders:
                Host: kube.internal.healthcheck
            startup:
              enabled: true
              type: tcp
              port: "{{ .Values.service.main.ports.main.port }}"
  notify:
    enabled: true
    type: Deployment
    strategy: RollingUpdate
    replicas: 1
    podSpec:
      containers:
        notify:
          primary: true
          enabled: true
          imageSelector: hpbImage
          resources:
            excludeExtra: true
          envFrom:
            - configMapRef:
                name: hpb-config
          probes:
            readiness:
              enabled: true
              type: tcp
              port: 7867
            liveness:
              enabled: true
              type: tcp
              port: 7867
            startup:
              enabled: true
              type: tcp
              port: 7867
  imaginary:
    enabled: true
    type: Deployment
    strategy: RollingUpdate
    replicas: 1
    podSpec:
      containers:
        imaginary:
          primary: true
          enabled: true
          imageSelector: imaginaryImage
          resources:
            excludeExtra: true
          command: imaginary
          args:
            - -p
            - "{{ .Values.service.imaginary.ports.imaginary.port }}"
            - -concurrency
            - "10"
            - -max-allowed-resolution
            - "{{ .Values.nextcloud.previews.max_allowed_resolution }}"
            - -enable-url-source
            - -return-size
          probes:
            readiness:
              enabled: true
              path: /health
              port: "{{ .Values.service.imaginary.ports.imaginary.port }}"
            liveness:
              enabled: true
              path: /health
              port: "{{ .Values.service.imaginary.ports.imaginary.port }}"
            startup:
              enabled: true
              type: tcp
              port: "{{ .Values.service.imaginary.ports.imaginary.port }}"
  clamav:
    enabled: true
    type: Deployment
    strategy: RollingUpdate
    replicas: 1
    podSpec:
      containers:
        clamav:
          primary: true
          enabled: true
          imageSelector: clamavImage
          resources:
            excludeExtra: true
          # FIXME: https://github.com/Cisco-Talos/clamav/issues/478
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            readOnlyRootFilesystem: false
          envFrom:
            - configMapRef:
                name: clamav-config
          probes:
            readiness:
              enabled: true
              type: exec
              command: clamdcheck.sh
            liveness:
              enabled: true
              type: exec
              command: clamdcheck.sh
            startup:
              enabled: true
              type: tcp
              port: "{{ .Values.service.clamav.ports.clamav.targetPort }}"
  collabora:
    enabled: true
    type: Deployment
    strategy: RollingUpdate
    replicas: 1
    podSpec:
      containers:
        collabora:
          primary: true
          enabled: true
          imageSelector: collaboraImage
          resources:
            limits:
              cpu: 2000m
              memory: 3000Mi
            requests:
              cpu: 200m
              memory: 500Mi
            excludeExtra: true
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - CHOWN
                - FOWNER
                - SYS_CHROOT
                - MKNOD
          envFrom:
            - configMapRef:
                name: collabora-config
          probes:
            readiness:
              enabled: true
              type: http
              path: /collabora/
              port: "{{ .Values.service.collabora.ports.collabora.targetPort }}"
            liveness:
              enabled: true
              type: http
              path: /collabora/
              port: "{{ .Values.service.collabora.ports.collabora.targetPort }}"
            startup:
              enabled: true
              type: tcp
              port: "{{ .Values.service.collabora.ports.collabora.targetPort }}"
cronjobs:
  # Don't change names, it's used in the persistence
  - name: nextcloud-cron
    enabled: true
    schedule: "*/5 * * * *"
    cmd:
      - echo "Running [php -f /var/www/html/cron.php] ..."
      - php -f /var/www/html/cron.php
      - echo "Finished [php -f /var/www/html/cron.php]"
  - name: preview-cron
    enabled: "{{ .Values.nextcloud.previews.cron }}"
    schedule: "{{ .Values.nextcloud.previews.schedule }}"
    cmd:
      - echo "Running [occ preview:pre-generate] ..."
      - occ preview:pre-generate
      - echo "Finished [occ preview:pre-generate]"
service:
  # Main service links to ingress easier
  # That's why the nginx is swapped with nextcloud
  main:
    targetSelector: nginx
    ports:
      main:
        targetSelector: nginx
        port: 8080
  nextcloud:
    enabled: true
    targetSelector: main
    ports:
      nextcloud:
        enabled: true
        targetSelector: main
        port: 9000
        targetPort: 9000
  notify:
    enabled: true
    targetSelector: notify
    ports:
      notify:
        enabled: true
        primary: true
        port: 7867
        targetPort: 7867
        targetSelector: notify
      metrics:
        enabled: true
        port: 7868
        targetSelector: notify
  imaginary:
    enabled: true
    targetSelector: imaginary
    ports:
      imaginary:
        enabled: true
        port: 9090
        targetSelector: imaginary
  clamav:
    enabled: true
    targetSelector: clamav
    ports:
      clamav:
        enabled: true
        port: 3310
        targetPort: 3310
        targetSelector: clamav
  collabora:
    enabled: true
    targetSelector: collabora
    ports:
      collabora:
        enabled: true
        port: 9980
        targetPort: 9980
        targetSelector: collabora
persistence:
  php-tune:
    enabled: true
    type: configmap
    objectName: php-tune
    targetSelector:
      main:
        main:
          mountPath: /usr/local/etc/php-fpm.d/zz-tune.conf
          subPath: zz-tune.conf
          readOnly: true
  redis-session:
    enabled: true
    type: configmap
    objectName: redis-session
    targetSelector:
      main:
        main:
          mountPath: /usr/local/etc/php/conf.d/redis-session.ini
          subPath: redis-session.ini
          readOnly: true
  opcache-recommended:
    enabled: true
    type: configmap
    objectName: opcache
    targetSelector:
      main:
        main:
          mountPath: /usr/local/etc/php/conf.d/opcache-recommended.ini
          subPath: opcache-recommended.ini
          readOnly: true
  nginx:
    enabled: true
    type: configmap
    objectName: nginx-config
    targetSelector:
      nginx:
        nginx:
          mountPath: /config/nginx.conf
          subPath: nginx.conf
          readOnly: true
  nginx-temp:
    enabled: true
    type: emptyDir
    targetSelector:
      nginx:
        nginx:
          mountPath: /tmp/nginx
  html:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: /var/www/html
      nextcloud-cron:
        nextcloud-cron:
          mountPath: /var/www/html
      preview-cron:
        preview-cron:
          mountPath: /var/www/html
      nginx:
        nginx:
          mountPath: /var/www/html
          readOnly: true
  config:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: /var/www/html/config
      nextcloud-cron:
        nextcloud-cron:
          mountPath: /var/www/html/config
      preview-cron:
        preview-cron:
          mountPath: /var/www/html/config
      notify:
        notify:
          mountPath: /var/www/html/config
          readOnly: true
      nginx:
        nginx:
          mountPath: /var/www/html/config
          readOnly: true
  data:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: /var/www/html/data
        init-perms:
          mountPath: /var/www/html/data
      nextcloud-cron:
        nextcloud-cron:
          mountPath: /var/www/html/data
      preview-cron:
        preview-cron:
          mountPath: /var/www/html/data
      nginx:
        nginx:
          mountPath: /var/www/html/data
          readOnly: true
  # Holds nextcloud.logging.log_file and log_audit_file. Kept outside data/: on root-squashed NFS
  # data the runtime cannot create a nested mountpoint, and outside the webroot served by nginx
  logs:
    enabled: true
    size: 2Gi
    targetSelector:
      main:
        main:
          mountPath: /var/log/nextcloud
      nextcloud-cron:
        nextcloud-cron:
          mountPath: /var/log/nextcloud
      preview-cron:
        preview-cron:
          mountPath: /var/log/nextcloud
cnpg:
  main:
    enabled: true
    user: nextcloud
    database: nextcloud
redis:
  enabled: true
  username: default

ingressMiddlewares:
  traefik:
    nextcloud-redirect:
      enabled: false
      type: redirect-regex
      data:
        regex: "https://(.*)/.well-known/(card|cal)dav"
        replacement: "https://${1}/remote.php/dav/"

ingress:
  main:
    required: true
    annotations:
      nginx.ingress.kubernetes.io/configuration-snippet: |
        rewrite ^/\.well-known/(card|cal)dav$ /remote.php/dav/ permanent;
    integrations:
      traefik:
        chartMiddlewares:
          - name: nextcloud-redirect
configmap:
  php-tune:
    enabled: true
    data:
      zz-tune.conf: |
        [www]
        pm.max_children = {{ .Values.nextcloud.php.pm_max_children }}
        pm.start_servers = {{ .Values.nextcloud.php.pm_start_servers }}
        pm.min_spare_servers = {{ .Values.nextcloud.php.pm_min_spare_servers }}
        pm.max_spare_servers = {{ .Values.nextcloud.php.pm_max_spare_servers }}

  opcache:
    enabled: true
    data:
      opcache-recommended.ini: |
        opcache.enable=1
        opcache.save_comments=1
        opcache.jit=1255
        opcache.interned_strings_buffer={{ .Values.nextcloud.opcache.interned_strings_buffer }}
        opcache.max_accelerated_files={{ .Values.nextcloud.opcache.max_accelerated_files }}
        opcache.memory_consumption={{ .Values.nextcloud.opcache.memory_consumption }}
        opcache.revalidate_freq={{ .Values.nextcloud.opcache.revalidate_freq }}
        opcache.jit_buffer_size={{ printf "%vM" .Values.nextcloud.opcache.jit_buffer_size }}

  redis-session:
    enabled: true
    data:
      redis-session.ini: |
        session.save_handler = redis
        session.save_path = {{ printf "tcp://%v:6379?auth=%v" (.Values.redis.creds.plainhost | trimAll "\"") (.Values.redis.password | trimAll "\"") | quote }}
        redis.session.locking_enabled = 1
        redis.session.lock_retries = -1
        redis.session.lock_wait_time = 10000

  hpb-config:
    enabled: '{{ .Values.nextcloud.notify_push.enabled }}'
    data:
      NEXTCLOUD_URL: '{{ printf "http://%v:%v" (include "tc.v1.common.lib.chart.names.fullname" $) .Values.service.main.ports.main.port }}'
      HPB_HOST: kube.internal.healthcheck
      CONFIG_FILE: '{{ printf "%v/config.php" .Values.persistence.config.targetSelector.notify.notify.mountPath }}'
      METRICS_PORT: '{{ .Values.service.notify.ports.metrics.port }}'

  clamav-config:
    enabled: '{{ .Values.nextcloud.clamav.enabled }}'
    data:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: "1800"

  collabora-config:
    enabled: '{{ .Values.nextcloud.collabora.enabled }}'
    data:
      aliasgroup1: '{{ (include "nextcloud.accessurl" $) }}'
      server_name: '{{ (regexReplaceAll ".*://(.*)" (include "nextcloud.accessurl" $) "${1}") }}'
      dictionaries: '{{ join " " .Values.nextcloud.collabora.dictionaries }}'
      username: '{{ .Values.nextcloud.collabora.username }}'
      password: '{{ .Values.nextcloud.collabora.password }}'
      DONT_GEN_SSL_CERT: "true"
      # mount_jail_tree is only used for local storage
      # not needed for WOPI https://github.com/CollaboraOnline/online/issues/3604#issuecomment-989833814
      extra_params: |
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:net.service_root=/collabora
        --o:home_mode.enable=true
        --o:welcome.enable=false
        --o:logging.level=warning
        --o:logging.level_startup=warning
        --o:security.seccomp=true
        --o:mount_jail_tree=false
        --o:user_interface.mode={{ .Values.nextcloud.collabora.interface_mode }}

  # TODO: Replace locations with ingress
  # like /push, /.well-known/carddav, /.well-known/caldav
  # needs some work as nginx converts urls to pretty urls
  # before matching them to locations, so ingress needs to
  # take that into consideration.
  nginx-config:
    enabled: true
    data:
      nginx.conf: |-
        worker_processes auto;

        error_log               /var/log/nginx/error.log warn;
        # Set to /tmp so it can run as non-root
        pid                     /tmp/nginx.pid;

        events {
          worker_connections  1024;
        }

        http {
          # Set to /tmp so it can run as non-root
          client_body_temp_path /tmp/nginx/client_temp;
          proxy_temp_path       /tmp/nginx/proxy_temp_path;
          fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
          uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
          scgi_temp_path        /tmp/nginx/scgi_temp;

          include               /etc/nginx/mime.types;
          default_type          application/octet-stream;

          log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

          access_log  /var/log/nginx/access.log  main;

          sendfile        on;
          #tcp_nopush     on;

          # Prevent nginx HTTP Server Detection
          server_tokens   off;

          keepalive_timeout  65;

          #gzip  on;

          upstream php-handler {
            server {{ printf "%v-nextcloud" (include "tc.v1.common.lib.chart.names.fullname" $) }}:{{ .Values.service.nextcloud.ports.nextcloud.targetPort }};
          }

          server {
            listen {{ .Values.service.main.ports.main.port }};
            absolute_redirect off;

            {{- if .Values.nextcloud.notify_push.enabled }}
            # Forward Notify_Push "High Performance Backend"  to it's own container
            location ^~ /push/ {
                # The trailing "/" is important!
                proxy_pass http://{{ printf "%v-notify" (include "tc.v1.common.lib.chart.names.fullname" $) }}:{{ .Values.service.notify.ports.notify.targetPort }}/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
            {{- end }}

            # HSTS settings
            # WARNING: Only add the preload option once you read about
            # the consequences in https://hstspreload.org/. This option
            # will add the domain to a hardcoded list that is shipped
            # in all major browsers and getting removed from this list
            # could take several months.
            #add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload;" always;

            # Set max upload size
            client_max_body_size {{ .Values.nextcloud.php.upload_limit | default "512M" }};
            fastcgi_buffers 64 4K;

            # Enable gzip but do not remove ETag headers
            gzip on;
            gzip_vary on;
            gzip_comp_level 4;
            gzip_min_length 256;
            gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
            gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

            # Pagespeed is not supported by Nextcloud, so if your server is built
            # with the `ngx_pagespeed` module, uncomment this line to disable it.
            #pagespeed off;

            include /etc/nginx/mime.types;
            types {
                text/javascript js mjs;
            }

            # HTTP response headers borrowed from Nextcloud `.htaccess`
            add_header Referrer-Policy                      "no-referrer"       always;
            add_header X-Content-Type-Options               "nosniff"           always;
            add_header X-Download-Options                   "noopen"            always;
            add_header X-Frame-Options                      "SAMEORIGIN"        always;
            add_header X-Permitted-Cross-Domain-Policies    "none"              always;
            add_header X-Robots-Tag                         "noindex, nofollow" always;
            add_header X-XSS-Protection                     "1; mode=block"     always;

            # Remove X-Powered-By, which is an information leak
            fastcgi_hide_header X-Powered-By;

            # Path to the root of your installation
            root {{ .Values.persistence.html.targetSelector.nginx.nginx.mountPath }};

            # Specify how to handle directories -- specifying `/index.php$request_uri`
            # here as the fallback means that Nginx always exhibits the desired behaviour
            # when a client requests a path that corresponds to a directory that exists
            # on the server. In particular, if that directory contains an index.php file,
            # that file is correctly served; if it doesn't, then the request is passed to
            # the front-end controller. This consistent behaviour means that we don't need
            # to specify custom rules for certain paths (e.g. images and other assets,
            # `/updater`, `/ocm-provider`, `/ocs-provider`), and thus
            # `try_files $uri $uri/ /index.php$request_uri`
            # always provides the desired behaviour.
            index index.php index.html /index.php$request_uri;

            # Rule borrowed from `.htaccess` to handle Microsoft DAV clients
            location = / {
              if ( $http_user_agent ~ ^DavClnt ) {
                return 302 /remote.php/webdav/$is_args$args;
              }
            }

            location = /robots.txt {
              allow all;
              log_not_found off;
              access_log off;
            }

            # Make a regex exception for `/.well-known` so that clients can still
            # access it despite the existence of the regex rule
            # `location ~ /(\.|autotest|...)` which would otherwise handle requests
            # for `/.well-known`.
            location ^~ /.well-known {
              # The rules in this block are an adaptation of the rules
              # in `.htaccess` that concern `/.well-known`.

              location = /.well-known/carddav { return 301 /remote.php/dav/; }
              location = /.well-known/caldav  { return 301 /remote.php/dav/; }

              location /.well-known/acme-challenge    { try_files $uri $uri/ =404; }
              location /.well-known/pki-validation    { try_files $uri $uri/ =404; }

              # Let Nextcloud's API for `/.well-known` URIs handle all other
              # requests by passing them to the front-end controller.
              return 301 /index.php$request_uri;
            }

            # Rules borrowed from `.htaccess` to hide certain paths from clients
            location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)  { return 404; }
            location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)                { return 404; }

            # Ensure this block, which passes PHP files to the PHP process, is above the blocks
            # which handle static assets (as seen below). If this block is not declared first,
            # then Nginx will encounter an infinite rewriting loop when it prepends `/index.php`
            # to the URI, resulting in a HTTP 500 error response.
            location ~ \.php(?:$|/) {
              # Required for legacy support
              rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|oc[ms]-provider\/.+|.+\/richdocumentscode\/proxy) /index.php$request_uri;

              fastcgi_split_path_info ^(.+?\.php)(/.*)$;
              set $path_info $fastcgi_path_info;

              try_files $fastcgi_script_name =404;

              include /etc/nginx/fastcgi_params;
              fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
              fastcgi_param PATH_INFO $path_info;
              #fastcgi_param HTTPS on;

              fastcgi_param modHeadersAvailable true;         # Avoid sending the security headers twice
              fastcgi_param front_controller_active true;     # Enable pretty urls
              fastcgi_pass php-handler;

              fastcgi_intercept_errors on;
              fastcgi_request_buffering off;
              proxy_send_timeout 3600s;
              proxy_read_timeout 3600s;
              fastcgi_send_timeout 3600s;
              fastcgi_read_timeout 3600s;
            }

            location ~ \.(?:css|js|svg|gif)$ {
              try_files $uri /index.php$request_uri;
              expires 6M;         # Cache-Control policy borrowed from `.htaccess`
              access_log off;     # Optional: Don't log access to assets
            }

            location ~ \.woff2?$ {
              try_files $uri /index.php$request_uri;
              expires 7d;         # Cache-Control policy borrowed from `.htaccess`
              access_log off;     # Optional: Don't log access to assets
            }

            # Rule borrowed from `.htaccess`
            location /remote {
              return 301 /remote.php$request_uri;
            }

            location / {
              try_files $uri $uri/ /index.php$request_uri;
            }
          }
        }
