image:
  repository: oci.trueforge.org/containerforge/it-tools
  pullPolicy: IfNotPresent
  tag: "2024.10.22"
service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 80
        port: 18082
workload:
  main:
    podSpec:
      initContainers:
        init-mkdir:
          enabled: true
          type: init
          imageSelector: "image"
          command:
            - /bin/sh
            - -c
          args:
            - mkdir -p /tmp/nginx-temp
persistence:
  cache:
    enabled: true
    type: emptyDir
    mountPath: "/var/cache/nginx"
securityContext:
  container:
    readOnlyRootFilesystem: false
