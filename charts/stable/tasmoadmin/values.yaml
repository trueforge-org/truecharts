# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/tasmoadmin/tasmoadmin
  tag: v5.1.1@sha256:78eae5e6e8813a9c33eafb1cd18ff8cffcfd23bff5ecd0ef73ba729e5308a076
  pullPolicy: IfNotPresent

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            TASMO_DEBUG: 1

service:
  main:
    ports:
      main:
        port: 9541
        protocol: http
        targetPort: 80

persistence:
  data:
    enabled: true
    mountPath: /data
