# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/tasmoadmin/tasmoadmin
  tag: v5.1.0@sha256:87820bbb28e777875f747ca8efea092d5f88a8e07cfedad9bb3c865106855774
  pullPolicy: IfNotPresent

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            TASMO_DEBUG: 1

service:
  main:
    ports:
      main:
        port: 9541
        protocol: http
        targetPort: 80

persistence:
  data:
    enabled: true
    mountPath: /data
