# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/chromium
  tag: latest@sha256:b147169cc5ff21c62df977f314598537eecf566591c13ad0726b1e5cbd0d01ca
persistence:
  datadir:
    enabled: true
    mountPath: /config
  browsercache:
    enabled: true
    type: emptyDir
    mountPath: /config/.cache

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8080
        protocol: tcp
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CUSTOM_PORT: "{{ .Values.service.main.ports.main.port }}"
