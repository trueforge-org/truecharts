# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/chromium
  tag: latest@sha256:6d2a8da6a45d4083a7287211a619ca29fdb518ebea0ef562c27392ba2f6698d2
persistence:
  datadir:
    enabled: true
    mountPath: /config
  browsercache:
    enabled: true
    type: emptyDir
    mountPath: /config/.cache

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8080
        protocol: tcp
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CUSTOM_PORT: "{{ .Values.service.main.ports.main.port }}"
