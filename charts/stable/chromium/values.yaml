# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/linuxserver/chromium
  tag: latest@sha256:ff1b8235e20367c3b660d31892e14428687df75e2d62e274b7d8d40cf5537108
persistence:
  datadir:
    enabled: true
    mountPath: /config
  browsercache:
    enabled: true
    type: emptyDir
    mountPath: /config/.cache

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8080
        protocol: tcp
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            CUSTOM_PORT: "{{ .Values.service.main.ports.main.port }}"
