# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/metabase/metabase
  pullPolicy: IfNotPresent
  tag: v0.65.7@sha256:f8dbde1aa67b525ed64637f1903a79c9320319360a9d7a3b995d68b8c0f3c2bb
service:
  main:
    ports:
      main:
        protocol: http
        port: 13030
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            MB_JETTY_PORT: "{{ .Values.service.main.ports.main.port }}"
            JAVA_TIMEZONE: "{{ .Values.TZ }}"
            MB_DB_TYPE: "postgres"
            MB_DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            MB_DB_DBNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            MB_DB_PORT: 5432
            MB_DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            MB_DB_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
persistence:
  plugins:
    enabled: true
    mountPath: "/plugins"
# Enabled postgres
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: metabase
      postgresqlDatabase: metabase
