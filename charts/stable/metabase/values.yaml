# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/metabase/metabase
  pullPolicy: IfNotPresent
  tag: v0.65.6@sha256:21a0c25c12a9d6334c9efb3d74db9973707baaf543ae6abb43bd6d42818e01af
service:
  main:
    ports:
      main:
        protocol: http
        port: 13030
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            MB_JETTY_PORT: "{{ .Values.service.main.ports.main.port }}"
            JAVA_TIMEZONE: "{{ .Values.TZ }}"
            MB_DB_TYPE: "postgres"
            MB_DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            MB_DB_DBNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            MB_DB_PORT: 5432
            MB_DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            MB_DB_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
persistence:
  plugins:
    enabled: true
    mountPath: "/plugins"
# Enabled postgres
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: metabase
      postgresqlDatabase: metabase
