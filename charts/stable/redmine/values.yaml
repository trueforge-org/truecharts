# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/redmine
  pullPolicy: IfNotPresent
  tag: 6.1.0
redmine:
  # Rails secret key base. MUST be changed, use a random string of at least 80 characters.
  secretKeyBase: "PLACEHOLDERSECRETKEYXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  plugins_migrate: true
  no_db_migrate: false
service:
  main:
    ports:
      main:
        port: 10171
        targetPort: 3000
persistence:
  data:
    enabled: true
    mountPath: "/usr/src/redmine/files"
# Enabled postgres
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: redmine
      postgresqlDatabase: redmine

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsUser: 999
    runAsGroup: 999
  pod:
    fsGroup: 999
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            REDMINE_DB_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            REDMINE_DB_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            REDMINE_DB_PORT: "5432"
            # Anything but empty means true, empty means false
            REDMINE_NO_DB_MIGRATE: '{{ ternary "true" "" .Values.redmine.no_db_migrate }}'
            REDMINE_PLUGINS_MIGRATE: '{{ ternary "true" "" .Values.redmine.plugins_migrate }}'
            REDMINE_DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            REDMINE_DB_POSTGRES:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            REDMINE_SECRET_KEY_BASE:
              secretKeyRef:
                name: secrets
                key: REDMINE_SECRET_KEY_BASE
