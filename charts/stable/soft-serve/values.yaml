# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/charmbracelet/soft-serve
  pullPolicy: IfNotPresent
  tag: v0.12.3@sha256:e8a12ff7f112558a6cd461ca192fe237d9deb2ec081ace944d2b5a61138a0db9
softserve:
  host: localhost
  key_path: /.ssh/soft_serve_server_ed25519
  init_admin_key: ""
service:
  main:
    ports:
      main:
        protocol: tcp
        port: 23231
persistence:
  config:
    enabled: true
    mountPath: /soft-serve
  ssh:
    enabled: true
    mountPath: /.ssh
  repos:
    enabled: true
    mountPath: /repos

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsGroup: 0
    runAsUser: 0
workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
            - secretRef:
                name: "env-secret"
