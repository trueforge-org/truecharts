# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/charmbracelet/soft-serve
  pullPolicy: IfNotPresent
  tag: v0.12.4@sha256:740a313b3075ddbf4a24765cda8cfa1560c3fcad96e71d355dc365aeab351db6
softserve:
  host: localhost
  key_path: /.ssh/soft_serve_server_ed25519
  init_admin_key: ""
service:
  main:
    ports:
      main:
        protocol: tcp
        port: 23231
persistence:
  config:
    enabled: true
    mountPath: /soft-serve
  ssh:
    enabled: true
    mountPath: /.ssh
  repos:
    enabled: true
    mountPath: /repos

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsGroup: 0
    runAsUser: 0
workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
            - secretRef:
                name: "env-secret"
secret:
  env-secret:
    enabled: true
    data:
      SOFT_SERVE_BIND_ADDRESS: 0.0.0.0
      SOFT_SERVE_REPO_PATH: '{{ .Values.persistence.repos.mountPath }}'
      SOFT_SERVE_PORT: '{{ .Values.service.main.ports.main.port }}'
      SOFT_SERVE_HOST: '{{ .Values.softserve.host }}'
      SOFT_SERVE_KEY_PATH: '{{ .Values.softserve.key_path }}'
      SOFT_SERVE_INITIAL_ADMIN_KEY: '{{ .Values.softserve.init_admin_key }}'
