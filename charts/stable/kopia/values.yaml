# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/kopia
  tag: 0.23.1@sha256:c6805fe576af3d6fcc19b4e3ff63ed0ae453210dcd7800f73906480d1e0d9242
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        protocol: http
        port: 51515

kopia:
  user: "user"
  password: "secret"
  server_username: "user"
  server_password: "password"

workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
            - secretRef:
                name: "kopia-secrets"
          args:
            - --server-username={{ .Values.kopia.server_username }}
            - --server-password={{ .Values.kopia.server_password }}
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false

secret:
  kopia-secrets:
    enabled: true
    data:
      USER: '{{ .Values.kopia.user | default "user" }}'
      KOPIA_PASSWORD: '{{ .Values.kopia.password | default "secret" }}'

persistence:
  config:
    enabled: true
    mountPath: "/config"
  cache:
    enabled: true
    mountPath: "/config/cache"
  logs:
    enabled: true
    mountPath: "/config/logs"
  rclone:
    enabled: true
    mountPath: "/config/rclone"
