# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/kopia
  tag: 0.23.1@sha256:32775e4d84b3cc1a55c2a5a1ab0ad18068685c74f3c3f69ef1904c7400c3e9d8
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        protocol: http
        port: 51515

kopia:
  user: "user"
  password: "secret"
  server_username: "user"
  server_password: "password"

workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
            - secretRef:
                name: "kopia-secrets"
          args:
            - --server-username={{ .Values.kopia.server_username }}
            - --server-password={{ .Values.kopia.server_password }}
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false

persistence:
  config:
    enabled: true
    mountPath: "/config"
  cache:
    enabled: true
    mountPath: "/config/cache"
  logs:
    enabled: true
    mountPath: "/config/logs"
  rclone:
    enabled: true
    mountPath: "/config/rclone"
