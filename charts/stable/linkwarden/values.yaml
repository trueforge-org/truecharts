# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/linkwarden/linkwarden
  pullPolicy: IfNotPresent
  tag: v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46

linkwarden:
  # Must be changed. NextAuth secret, any long random string (32+ chars recommended).
  nextauthSecret: "PLACEHOLDERNEXTAUTHSECRETCHANGEME"
config:
  nextauth_url: "http://example.com"
  pagination_take_count: 20
  autoscroll_timeout: 30
  disable_registration: false
  archive_limit: 5

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0

service:
  main:
    ports:
      main:
        port: 2985
        targetPort: 3000

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DATABASE_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
            NEXTAUTH_SECRET:
              secretKeyRef:
                name: linkwarden-secrets
                key: NEXTAUTH_SECRET
            NEXTAUTH_URL: "{{ .Values.config.nextauth_url }}"
            PAGINATION_TAKE_COUNT: "{{ .Values.config.pagination_take_count }}"
            STORAGE_FOLDER: "data"
            AUTOSCROLL_TIMEOUT: "{{ .Values.config.autoscroll_timeout }}"
            NEXT_PUBLIC_DISABLE_REGISTRATION: "{{ .Values.config.disable_registration }}"
            RE_ARCHIVE_LIMIT: "{{ .Values.config.archive_limit }}"

persistence:
  data:
    enabled: true
    mountPath: "/data/data"

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlDatabase: linkwarden
      postgresqlUsername: linkwarden
