# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/thomst08/requestrr
  pullPolicy: IfNotPresent
  tag: v2.1.11@sha256:7fa1615f556e543556eabcf82d18c2bdf80680f7e8810a1c3a4fe05915cdeacd

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0

service:
  main:
    ports:
      main:
        targetPort: 4545
        port: 4545

persistence:
  config:
    enabled: true
    mountPath: "/root/config"
  varrun:
    enabled: true
