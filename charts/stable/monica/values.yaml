# yaml-language-server: $schema=./values.schema.json
image:
  repository: monica
  tag: 4.1.2@sha256:4e39d3401ebae1bb95393d7d79bbfebade3e2573cda6f86a86fce2c8c5f68053
  pullPolicy: IfNotPresent
monica:
  # Must be changed. Laravel APP_KEY, exactly 32 characters.
  appKey: "PLACEHOLDERAPPKEYCHANGEME1234567"
service:
  main:
    ports:
      main:
        port: 10119
        targetPort: 80
persistence:
  config:
    enabled: true
    mountPath: "/var/www/html/storage"
dependencies:
  mariadb:
    enabled: true
    depconfig:
      mariadbUsername: monica
      mariadbDatabase: monica

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          env:
            APP_ENV: production
            APP_URL: https://crm.k8s-at-home.com
            DB_DATABASE: monica
            DB_USERNAME: monica
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                key: plainhost
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                key: mariadb-password
            APP_KEY:
              secretKeyRef:
                name: appkey
                key: appkey
