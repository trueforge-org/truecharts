# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/meeb/tubesync
  tag: latest@sha256:cd8a771a111848b7ca6ae71a32f3ddddbcc30056961f996a3f7d3db47324e263
persistence:
  config:
    enabled: true
    mountPath: /config
  downloads:
    enabled: true
    mountPath: /downloads
  varrun:
    enabled: false

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 4848
        protocol: tcp
        targetPort: 4848
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DATABASE_CONNECTION:
              secretKeyRef:
                name: env-secrets
                key: DATABASE_CONNECTION
            http_PASS:
              secretKeyRef:
                name: env-secrets
                key: http_PASS
            http_USER: ""
            TUBESYNC_DEBUG: "False"
            TUBESYNC_HOSTS: ""
            TUBESYNC_WORKERS: "2"

secret:
  env-secrets:
    enabled: true
    data:
      http_PASS: ""
      DATABASE_CONNECTION: ""
