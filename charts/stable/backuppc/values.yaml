# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/adferrand/backuppc
  tag: 4@sha256:0c4bb8f0c2992cfa29ad28ed5ee2b99861f901d31400f2c73040994aac26d34f
  pullPolicy: IfNotPresent

service:
  main:
    ports:
      main:
        protocol: tcp
        port: 8080

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            BACKUPPC_UUID: "{{ .Values.securityContext.container.PUID }}"
            BACKUPPC_GUID: "{{ .Values.securityContext.pod.fsGroup }}"

persistence:
  config:
    enabled: true
    mountPath: /etc/backuppc
  ssh:
    enabled: true
    mountPath: /home/backuppc
  data:
    enabled: true
    mountPath: /data/backuppc
