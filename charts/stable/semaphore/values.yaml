# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/semaphoreui/semaphore
  tag: v2.20.24@sha256:c547d31cba238bee4a9f2b5eec9d0f42b2d5ecb399377a2e63008500d74fbf3a
  pullPolicy: IfNotPresent

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

service:
  main:
    ports:
      main:
        port: 3000
        protocol: http
        targetPort: 3000

semaphore:
  # Access key encryption secret. MUST be changed, use a random base64 string (32 bytes recommended).
  accessKeyEncryption: "PLACEHOLDERSECRETKEYXXXXXXXXXXXX"
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            # DB
            SEMAPHORE_DB_DIALECT: postgres
            SEMAPHORE_DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            SEMAPHORE_DB: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            SEMAPHORE_DB_PORT: 5432
            SEMAPHORE_DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            SEMAPHORE_DB_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            SEMAPHORE_ACCESS_KEY_ENCRYPTION:
              secretKeyRef:
                name: semaphore-secrets
                key: SEMAPHORE_ACCESS_KEY_ENCRYPTION
            # set paths to /data
            SEMAPHORE_PLAYBOOK_PATH: "{{.Values.persistence.data.mountPath }}"
            SEMAPHORE_ADMIN: admin
            SEMAPHORE_ADMIN_NAME: admin
            SEMAPHORE_ADMIN_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: SEMAPHORE_ADMIN_PASSWORD
            SEMAPHORE_ADMIN_EMAIL: admin@localhost
            # LDAP
            # no | yes
            SEMAPHORE_LDAP_ACTIVATED: "no"
            # SEMAPHORE_LDAP_HOST: dc01.local.example.com
            # SEMAPHORE_LDAP_PORT: '636'
            # no | yes
            SEMAPHORE_LDAP_NEEDTLS: "no"
            # SEMAPHORE_LDAP_DN_BIND: 'uid=bind_user,cn=users,cn=accounts,dc=local,dc=shiftsystems,dc=net'
            # SEMAPHORE_LDAP_PASSWORD: 'ldap_bind_account_password'
            # SEMAPHORE_LDAP_DN_SEARCH: 'dc=local,dc=example,dc=com'
            # SEMAPHORE_LDAP_SEARCH_FILTER: "(\u0026(uid=%s)(memberOf=cn=ipausers,cn=groups,cn=accounts,dc=local,dc=example,dc=com))"

persistence:
  config:
    enabled: true
    mountPath: /etc/semaphore
  data:
    enabled: true
    mountPath: /data

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: semaphore
      postgresqlDatabase: semaphore

secret:
  env-secrets:
    enabled: true
    data:
      SEMAPHORE_ADMIN_PASSWORD: 'changeme'
