# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/wiserain/flexget
  pullPolicy: IfNotPresent
  tag: 3.22.13@sha256:5a84efb38f0fa5ef896d5be507ceea0d7b5e21cf904062d86c8d2ea3892ee152
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /
            readiness:
              type: http
              path: /
            startup:
              type: http
              path: /
          env:
            FG_LOG_LEVEL: info
            FG_LOG_FILE: flexget.log
            FG_WEBUI_PASSWD: "jLeT78KBDPW"
service:
  main:
    ports:
      main:
        port: 10174
        targetPort: 5050
persistence:
  config:
    enabled: true
    mountPath: /config
  data:
    enabled: true
    mountPath: /data
