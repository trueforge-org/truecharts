# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/mescon/muximux
  pullPolicy: IfNotPresent
  tag: 3.7.4@sha256:31d2810f33513502535d376ebe1fa80fe67b4a93ca18678cb13274d154a3bcf2

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            startup:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            readiness:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            liveness:
              enabled: true
              type: http
              port: 8080
              path: /api/health

service:
  main:
    ports:
      main:
        port: 10019
        targetPort: 8080

persistence:
  config:
    enabled: true
    mountPath: "/app/data"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
