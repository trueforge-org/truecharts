# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/mescon/muximux
  pullPolicy: IfNotPresent
  tag: 3.6.1@sha256:47371b4f5edd4e0be0edc62e4b867d640b74f1777eaae7e2d9b19ead38b99aab

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            startup:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            readiness:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            liveness:
              enabled: true
              type: http
              port: 8080
              path: /api/health

service:
  main:
    ports:
      main:
        port: 10019
        targetPort: 8080

persistence:
  config:
    enabled: true
    mountPath: "/app/data"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
