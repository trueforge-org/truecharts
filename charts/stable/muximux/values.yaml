# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/mescon/muximux
  pullPolicy: IfNotPresent
  tag: 3.7.3@sha256:31a0f6655912c9f0de2259c39f78feaa83267a127384e25e8842fad65faeb766

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            startup:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            readiness:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            liveness:
              enabled: true
              type: http
              port: 8080
              path: /api/health

service:
  main:
    ports:
      main:
        port: 10019
        targetPort: 8080

persistence:
  config:
    enabled: true
    mountPath: "/app/data"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
