# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/mescon/muximux
  pullPolicy: IfNotPresent
  tag: 3.7.1@sha256:bfe73df52ecf84aed096d7f493bcbd3d0ce1ec510af2b6926b00dd14eb1956d4

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            startup:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            readiness:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            liveness:
              enabled: true
              type: http
              port: 8080
              path: /api/health

service:
  main:
    ports:
      main:
        port: 10019
        targetPort: 8080

persistence:
  config:
    enabled: true
    mountPath: "/app/data"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
