# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/mescon/muximux
  pullPolicy: IfNotPresent
  tag: 3.6.2@sha256:85d87934a2291d9b06e41b409de0d50a61d15a5cd551696119e9f9fd2b04f6a0

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            startup:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            readiness:
              enabled: true
              type: http
              port: 8080
              path: /api/health
            liveness:
              enabled: true
              type: http
              port: 8080
              path: /api/health

service:
  main:
    ports:
      main:
        port: 10019
        targetPort: 8080

persistence:
  config:
    enabled: true
    mountPath: "/app/data"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
