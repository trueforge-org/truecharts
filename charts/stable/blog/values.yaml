# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/m1k1o/blog
  pullPolicy: IfNotPresent
  tag: latest@sha256:30229ce39ca857fc85083b0c179d4cd79054352dce97f5bd8043514ec5998ee9
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        port: 10111
        protocol: http
        targetPort: 80
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /
            readiness:
              type: http
              path: /
            startup:
              type: http
              path: /
          env:
            BLOG_TITLE: "Blog"
            BLOG_NAME: "Max Musermann"
            BLOG_LANG: "en"
            BLOG_DB_CONNECTION: "postgres"
            BLOG_POSTGRES_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            BLOG_POSTGRES_PORT: "5432"
            BLOG_DB_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            BLOG_POSTGRES_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            BLOG_POSTGRES_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            BLOG_NICK: username
            BLOG_PASS:
              secretKeyRef:
                name: env-secrets
                key: BLOG_PASS
persistence:
  data:
    enabled: true
    mountPath: /var/www/html/data
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: blog
      postgresqlDatabase: blog
secret:
  env-secrets:
    enabled: true
    data:
      BLOG_PASS: "password"
