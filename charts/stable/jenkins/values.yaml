# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/jenkins/jenkins
  pullPolicy: IfNotPresent
  tag: 2.544-jdk17@sha256:c9059deaa1a6b393ea6a447b13efca888d1817a57b924df9424a7075f51d9348
security:
  container:
    runAsGroup: 1000
    runAsUser: 1000
  pod:
    fsGroup: 1000
# securityContext:
#   readOnlyRootFilesystem: false
jenkins:
  java_opts: []
  jenkins_opts: []
  jenkins_java_opts: []
  plugins_force_upgrade: false
  upgrade_if_no_marker: false
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /login
            readiness:
              type: http
              path: /login
            startup:
              type: tcp
          envFrom:
            - secretRef:
                name: "jenkins-secret"
service:
  main:
    ports:
      main:
        protocol: http
        port: 10280
  agent:
    enabled: true
    ports:
      agent:
        enabled: true
        port: 50000
secret:
  jenkins-secret:
    enabled: true
    data:
      JAVA_OPTS: '{{ join " " .Values.jenkins.java_opts | replace "\x27" "\x27\x27" }}'
      JENKINS_OPTS: '{{ join " " (concat (list (printf "--httpPort=%v" .Values.service.main.ports.main.port)) .Values.jenkins.jenkins_opts) | replace "\x27" "\x27\x27" }}'
      JENKINS_JAVA_OPTS: '{{ join " " (concat (list (printf "-Djenkins.model.Jenkins.slaveAgentPort=%v" .Values.service.agent.ports.agent.port) "-Djenkins.model.Jenkins.slaveAgentPortEnforce=true") .Values.jenkins.jenkins_java_opts) | replace "\x27" "\x27\x27" }}'
      PLUGINS_FORCE_UPGRADE: '{{ .Values.jenkins.plugins_force_upgrade }}'
      TRY_UPGRADE_IF_NO_MARKER: '{{ .Values.jenkins.upgrade_if_no_marker }}'

persistence:
  data:
    enabled: true
    mountPath: /var/jenkins_home
