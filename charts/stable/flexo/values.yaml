# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/nroi/flexo
  tag: 1.6.14@sha256:3787e3d1ac567423d61f17b07b3128e59a26b7cd980443462b220528b5929c6d

service:
  main:
    ports:
      main:
        port: 7878
        protocol: http
persistence:
  data:
    enabled: true
    type: "emptyDir"
    size: 10Gi
    mountPath: "/var/cache/flexo"
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/metrics"
            readiness:
              path: "/metrics"
            startup:
              path: "/metrics"
          env:
            FLEXO_LISTEN_IP_ADDRESS: "0.0.0.0"
            FLEXO_PORT: "{{ .Values.service.main.ports.main.port }}"
