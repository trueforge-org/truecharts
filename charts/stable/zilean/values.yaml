# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/ipromknight/zilean
  pullPolicy: IfNotPresent
  tag: v3.5.0@sha256:1b828ac0604235de7adb7757d11c88c1b3bb1a6319071b0c9d99325bc0f9d477

service:
  main:
    ports:
      main:
        port: 8181
        targetPort: 8181

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/healthchecks/ping"
            readiness:
              path: "/healthchecks/ping"
            startup:
              path: "/healthchecks/ping"
          env:
            Zilean__Database__ConnectionString:
              secretKeyRef:
                name: env-secrets
                key: Zilean__Database__ConnectionString

persistence:
  data:
    enabled: true
    mountPath: "/app/data"

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: postgres
      postgresqlDatabase: zilean

secret:
  env-secrets:
    enabled: true
    data:
      Zilean__Database__ConnectionString: '{{ printf "Host=%s;Port=5432;Database=%s;Username=%s;Password=%s" (.Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"") .Values.dependencies.postgresql.depconfig.postgresqlDatabase .Values.dependencies.postgresql.depconfig.postgresqlUsername (.Values.dependencies.postgresql.depconfig.creds.postgresqlPassword | trimAll "\"") }}'
