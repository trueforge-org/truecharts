# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/lissy93/dashy
  tag: latest@sha256:e054ad2407fe16ca687e5bb910664bf46b309cd444e4c92feb448423f993c9f4
  pullPolicy: IfNotPresent
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        port: 10310
        protocol: http
        targetPort: 8080
resources:
  limits:
    cpu: 2000m
    memory: 3000Mi
  requests:
    cpu: 200m
    memory: 500Mi
dashy:
  # Enable config directory mount from host path
  enabled: false
  configDirectoryHostPath: ""
  configDirectoryHostReadOnly: true
# Leave empty if you plan to use config directory from host path
dashyConfig: {}
# pageInfo:
#   title: Home Lab

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            NODE_ENV: production
          probes:
            liveness:
              enabled: true
              type: exec
              command:
                - node
                - /app/services/healthcheck
            readiness:
              enabled: true
              type: exec
              command:
                - node
                - /app/services/healthcheck
            startup:
              enabled: true
              type: exec
              command:
                - node
                - /app/services/healthcheck
persistence:
  icons:
    enabled: true
    mountPath: /app/public/item-icons
