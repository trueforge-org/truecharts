# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/sbondco/watcharr
  tag: v4.4.0@sha256:28673ff5eac318cb6fda2251bfd53d3402810288d4c335ce6c98060ace0940e6
  pullPolicy: IfNotPresent

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 3080
        port: 10684

watcharr:
  # -- Must be changed. JWT signing secret.
  jwtSecret: "PLACEHOLDERJWTSECRETCHANGEME000000000000000000000000000000000000"
  mode: prod
  jellyfin_host: ""
  signup_enabled: true
  tmdb_key: ""
  debug: false

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            JELLYFIN_HOST: "{{ .Values.watcharr.jellyfin_host }}"
            SIGNUP_ENABLED: "{{ .Values.watcharr.signup_enabled }}"
            TMDB_KEY:
              secretKeyRef:
                name: env-secrets
                key: TMDB_KEY
            DEBUG: "{{ .Values.watcharr.debug }}"
            MODE: "{{ .Values.watcharr.mode }}"
            JWT_SECRET:
              secretKeyRef:
                name: watcharr-secrets
                key: JWT_SECRET

persistence:
  data:
    enabled: true
    mountPath: "/data"
secret:
  env-secrets:
    enabled: true
    data:
      TMDB_KEY: "{{ .Values.watcharr.tmdb_key }}"
