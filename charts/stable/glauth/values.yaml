# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/glauth/glauth
  tag: latest@sha256:93b1fffc865ce137ff7630a573ae413b85c45568cd63d2860971fe5ed121e0f8
persistence:
  config:
    enabled: true
    mountPath: /app/config

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  ldapport:
    enabled: true
    ports:
      ldapport:
        enabled: true
        port: 389
        protocol: tcp
        targetPort: 389
  ldapsport:
    enabled: true
    ports:
      ldapsport:
        enabled: true
        port: 636
        protocol: tcp
        targetPort: 636
  main:
    ports:
      main:
        port: 5555
        protocol: http
        targetPort: 5555
