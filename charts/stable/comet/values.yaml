# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/g0ldyy/comet
  pullPolicy: IfNotPresent
  tag: latest@sha256:3dcb2b1802bcc45ea9c1f1206088985baa88a8321ab3cb3408976356bfa8bbb3

service:
  main:
    ports:
      main:
        port: 8000
        targetPort: 8000

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            comet__Database__ConnectionString:
              secretKeyRef:
                name: env-secrets
                key: comet__Database__ConnectionString
            ADDON_ID: comet.selfhosted.org
            ADDON_NAME: Comet | Selfhosted
            ZILEAN_URL: None
            INDEXER_MANAGER_TYPE: None
            INDEXER_MANAGER_TIMEOUT: "30"
            # INDEXER_MANAGER_URL: http://jackett:9117
            # INDEXER_MANAGER_API_KEY:
            # INDEXER_MANAGER_INDEXERS: '["bitsearch","eztv","thepiratebay","therarbg","yts"]'
            GET_TORRENT_TIMEOUT: "5"
            # DEBRID_PROXY_URL: http://127.0.0.1:1080
            FASTAPI_WORKERS: "1"
            SCRAPE_TORRENTIO: "False"
            DATABASE_TYPE: postgresql
            DATABASE_URL:
              secretKeyRef:
                name: env-secrets
                key: DATABASE_URL

persistence:
  data:
    enabled: true
    mountPath: "/data"
  cache:
    enabled: true
    type: emptyDir
    mountPath: "/.cache"

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: comet
      postgresqlDatabase: comet
secret:
  env-secrets:
    enabled: true
    data:
      comet__Database__ConnectionString: '{{ printf "Host=%s;Port=5432;Database=%s;Username=%s;Password=%s" (.Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"") .Values.dependencies.postgresql.depconfig.postgresqlDatabase .Values.dependencies.postgresql.depconfig.postgresqlUsername (.Values.dependencies.postgresql.depconfig.creds.postgresqlPassword | trimAll "\"") }}'
      DATABASE_URL: '{{ printf "%s:%s@%s:5432" .Values.dependencies.postgresql.depconfig.postgresqlUsername (.Values.dependencies.postgresql.depconfig.creds.postgresqlPassword | trimAll "\"") (.Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"") }}'
