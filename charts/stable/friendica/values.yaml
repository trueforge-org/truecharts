# yaml-language-server: $schema=./values.schema.json
image:
  repository: friendica
  pullPolicy: IfNotPresent
  tag: 2026.05@sha256:8dcdec007cd31b706335695bad942c8c92ae726f27d82678eaef2f421e8d811d
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/ping"
            readiness:
              path: "/ping"
            startup:
              path: "/ping"
          env:
            MYSQL_USER: "{{ .Values.dependencies.mariadb.depconfig.mariadbUsername }}"
            MYSQL_DATABASE: "{{ .Values.dependencies.mariadb.depconfig.mariadbDatabase }}"
            MYSQL_PORT: 3306
            REDIS_PORT: 6379
            REDIS_DB: 1
            FRIENDICA_TZ: "{{ .Values.TZ }}"
            FRIENDICA_DATA_DIR: "/data"
            FRIENDICA_CONFIG_DIR: "/config"
            # User Defined
            FRIENDICA_ADMIN_MAIL: "my@domain.com"
            FRIENDICA_URL: "http://localhost:{{ .Values.service.main.ports.main.port }}"
            FRIENDICA_UPGRADE: false
            FRIENDICA_SITENAME: ""
            PHP_MEMORY_LIMIT: "512M"
            PHP_UPLOAD_LIMIT: "512M"
            MYSQL_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                key: plainhost
            MYSQL_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                key: mariadb-password
            REDIS_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: plainhost
            REDIS_PW:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: valkey-password
service:
  main:
    ports:
      main:
        port: 10058
        targetPort: 80
persistence:
  varrun:
    enabled: true
  config:
    enabled: true
    mountPath: /config
  data:
    enabled: true
    mountPath: /data
dependencies:
  valkey:
    enabled: true
  mariadb:
    enabled: true
    depconfig:
      mariadbUsername: friendica
      mariadbDatabase: friendica
