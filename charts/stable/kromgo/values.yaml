# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/home-operations/kromgo
  tag: 0.12.2@sha256:33a15e6087ecfbbf9cf39f24ca418ca30738dddd5af5ec9efee1e99742f49e57
  pullPolicy: IfNotPresent

# Raw Kromgo configuration
# checkout the readme for the current configuration setup
# https://github.com/home-operations/kromgo#badges

kromgo:
  defaults:
    cacheSeconds: 0
    badge:
        font: go-regular
        size: 11
        style: flat
        gallery:
            hidden: false
    graph:
        maxDuration: 1h
        width: 600
        height: 200
        legend: true
        theme: light
        font: roboto
        gallery:
            hidden: false
  badges:
    - id: talos_version
      query: node_os_info{ name="Talos"}
      value: labels["version_id"]
      icon: si:talos
      title: Talos Version
    - id: kubernetes_version
      query: kubernetes_build_info{ service="kubernetes"}
      value: labels["git_version"]
      icon: si:kubernetes
      title: Kubernetes Version
    - id: flux_version
      query: label_replace(gotk_resource_info{exported_namespace="flux-system",name="flux",customresource_kind="Kustomization"}, "revision", "$1", "revision", "(.+)@sha256:.+")
      value: labels["revision"]
      icon: si:flux
      title: Flux Version

service:
  main:
    ports:
      main:
        port: 80
      health:
        enabled: true
        port: 8080

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PROMETHEUS_URL: "http://prometheus-operated.kube-prometheus-stack.svc.cluster.local:9090"
            SERVER_PORT: "{{ $.Values.service.main.ports.main.port }}"
            HEALTH_PORT: "{{ $.Values.service.main.ports.health.port }}"
            # SERVER_LOGGING	no	false	Enable HTTP request access logging
            # SERVER_READ_TIMEOUT	no	—	HTTP read timeout (e.g. 5s)
            # SERVER_WRITE_TIMEOUT	no	—	HTTP write timeout (e.g. 10s)
            # QUERY_TIMEOUT	no	30s	Timeout applied to each Prometheus query
            # LOG_LEVEL	no	info	Log level: debug, info, warn, error
            # LOG_FORMAT	no	json	Log format: json or text
          probes:
            liveness:
              type: http
              path: "/healthz"
              port: "{{ $.Values.service.main.ports.health.port }}"
            readiness:
              type: http
              path: "/readyz"
              port: "{{ $.Values.service.main.ports.health.port }}"
            startup:
              type: http
              path: "/readyz"
              port: "{{ $.Values.service.main.ports.health.port }}"

configmap:
  kromgo-configfile:
    enabled: true
    data:
      config.yaml: |
        {{- $.Values.kromgo | toYaml | nindent 2 }}

persistence:
  configfile:
    enabled: true
    type: configmap
    readOnly: true
    objectName: kromgo-configfile
    mountPath: /kromgo/config.yaml
    subPath: config.yaml
