# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/kylemanna/bitcoind
  tag: latest@sha256:6402dda4113475e220d8fcbc84be3fc60e5495fd4983cc482d2a5e4c9f30f571
persistence:
  blockhainstorage:
    enabled: true
    mountPath: /bitcoin/.bitcoin

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8332
        protocol: tcp
        targetPort: 8332
  port2:
    enabled: true
    ports:
      port2:
        enabled: true
        port: 8333
        protocol: tcp
        targetPort: 8333
