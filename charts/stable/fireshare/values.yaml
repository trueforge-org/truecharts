# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/shaneisrael/fireshare
  tag: 1.9.4@sha256:275b81a519a30df2b3fc65d200c93e78d5d2536d6b2063e9ae5a429b8b41b4d8

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            SECRET_KEY:
              secretKeyRef:
                name: fireshare-secrets
                key: SECRET_KEY
            MINUTES_BETWEEN_VIDEO_SCANS: 5
            ADMIN_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: ADMIN_PASSWORD
            # TODO ADD LDAP
            # LDAP_ENABLE: false
            # LDAP_URL: ""
            # LDAP_BINDDN: ""
            # LDAP_PASSWORD: ""
            # LDAP_BASEDN: ""
            # LDAP_USER_FILTER: ""
            # LDAP_ADMIN_GROUP: ""

fireshare:
  # Must be changed. Random string, at least 32 characters.
  secretKey: "PLACEHOLDERSECRETKEY000000000000"

service:
  main:
    ports:
      main:
        port: 10287
        protocol: http
        targetPort: 80

persistence:
  data:
    enabled: true
    mountPath: /data
  processeddata:
    enabled: true
    mountPath: /processed
  videos:
    enabled: true
    mountPath: /videos
  images:
    enabled: true
    mountPath: /images

secret:
  env-secrets:
    enabled: true
    data:
      ADMIN_PASSWORD: "changeme"
