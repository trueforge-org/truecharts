# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/atuinsh/atuin
  pullPolicy: IfNotPresent
  tag: 18.25.1@sha256:8049083e74727566e314ca5de07f4d9db6f7baf357035b3adb23cbe23bcc2926

securityContext:
  container:
    runAsUser: 1000
    runAsGroup: 1000

service:
  main:
    ports:
      main:
        protocol: http
        port: 8888

atuin:
  open_registration: false

workload:
  main:
    podSpec:
      containers:
        main:
          args:
            - start
          env:
            ATUIN_HOST: 0.0.0.0
            ATUIN_PORT: "{{ .Values.service.main.ports.main.port }}"
            ATUIN_OPEN_REGISTRATION: "{{ .Values.atuin.open_registration }}"
            ATUIN_CONFIG_DIR: /config
            ATUIN_DB_URI:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
            ATUIN_DB_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            ATUIN_DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password

persistence:
  config:
    enabled: true
    mountPath: "/config"

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: atuin
      postgresqlDatabase: atuin
