# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/fancybits/channels-dvr
  pullPolicy: Always
  tag: latest@sha256:8b430c5865c95378750226f0198c49332d084c276485053146c8ebfc020f0abf
tveImage:
  repository: docker.io/fancybits/channels-dvr
  pullPolicy: Always
  tag: tve@sha256:4d4916586f08e6ecb9ff9e5e736f3887994e2f3006f3b732bafe6d2c7515169c
service:
  main:
    ports:
      main:
        port: 8089
        protocol: http
        targetPort: 8089
persistence:
  config:
    enabled: true
    mountPath: /channels-dvr
  recordings:
    enabled: true
    mountPath: /shares/DVR

workload:
  main:
    podSpec:
      containers:
        main:
          imageSelector: image
          probes:
            liveness:
              port: 8089
              type: http
            readiness:
              port: 8089
              type: http
            startup:
              port: 8089
              type: http
updated: true
