              #     port: http
              #     httpHeaders:
              #       - name: Accept
              #         value: text/plain
              #   initialDelaySeconds: 30
              #   periodSeconds: 10
              #   timeoutSeconds: 10
            readiness:
              enabled: true
              # custom: true
              # spec:
              #   failureThreshold: 5
              #   httpGet:
              #     path: /health
              #     port: http
              #     httpHeaders:
              #       - name: Accept
              #         value: text/plain
              #   initialDelaySeconds: 30
              #   periodSeconds: 10
              #   timeoutSeconds: 10
            startup:
              enabled: false
