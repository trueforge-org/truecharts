# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/zwave-js/zwave-js-ui
  pullPolicy: IfNotPresent
  tag: 11.25.2@sha256:ac4874a3cbea61c0c60002a8fd8ae05104cc8eb2eae91aa05bd184972aa06853
service:
  main:
    ports:
      main:
        port: 8091
        targetPort: 8091
  ws:
    enabled: true
    ports:
      ws:
        enabled: true
        port: 10046
        targetPort: 3000
persistence:
  config:
    enabled: true
    mountPath: "/usr/src/app/store"
securityContext:
  container:
    readOnlyRootFilesystem: false
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: true
              # custom: true
              # spec:
              #   failureThreshold: 5
              #   httpGet:
