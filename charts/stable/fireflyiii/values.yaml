# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/fireflyiii/core
  pullPolicy: IfNotPresent
  tag: version-6.2.21@sha256:3db5043e29495ec61b3b1fe163e42629629df7b7841eac3bad7bff13dbe05fad
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsUser: 33
    runAsGroup: 33
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/healthcheck"
            readiness:
              path: "/healthcheck"
            startup:
              path: "/healthcheck"
          env:
            DB_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_CONNECTION: pgsql
            DB_PORT: 5432
            REDIS_DB: "0"
            REDIS_CACHE_DB: "1"
            CACHE_DRIVER: redis
            SESSION_DRIVER: redis
            REDIS_SCHEME: tcp
            REDIS_PORT: 6379
            APP_URL: ""
            TRUSTED_PROXIES: "172.16.0.0/16"
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            REDIS_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: plainhost
            REDIS_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: valkey-password
            STATIC_CRON_TOKEN:
              secretKeyRef:
                name: firefly-secrets
                key: STATIC_CRON_TOKEN
            APP_KEY:
              secretKeyRef:
                name: firefly-secrets
                key: APP_KEY
service:
  main:
    ports:
      main:
        port: 10082
        targetPort: 8080
ingress:
  main:
    integrations:
      homepage:
        widget:
          type: firefly
persistence:
  data:
    enabled: true
    mountPath: "/var/www/html/storage/upload"
  varrun:
    enabled: false
fireflyiii:
  # Must be changed. Exactly 32 characters.
  appKey: "PLACEHOLDERAPPKEY0000000000000000"
  # Must be changed. At least 32 characters.
  cronToken: "PLACEHOLDERCRONTOKEN00000000000000"
cronjob:
  schedule: "0 3 * * *"
  annotations: {}
  failedJobsHistoryLimit: 5
  successfulJobsHistoryLimit: 2
# Enabled redis
# Enabled postgres
dependencies:
  valkey:
    enabled: true
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: firefly
      postgresqlDatabase: firefly
