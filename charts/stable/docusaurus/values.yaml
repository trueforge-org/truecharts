# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/docusaurus
  pullPolicy: IfNotPresent
  tag: 3.10.2@sha256:fe7fb9367938fdd529fd472e92840b3dda8dbe806c8e0e6d0b57cc096604e166
service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 3000
        port: 13080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            AUTO_UPDATE: true
            WEBSITE_NAME: "Docusaurus HomeLab Website"
            TEMPLATE: classic
            RUN_MODE: development
          probes:
            startup:
              spec:
                # First start scaffolds the site and installs its dependencies
                failureThreshold: 120
persistence:
  config:
    enabled: true
    mountPath: /config
