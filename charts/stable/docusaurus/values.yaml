# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/docusaurus
  pullPolicy: IfNotPresent
  tag: 3.10.2@sha256:3ca4557029c79dad897207d04b57842ce687da408e535e04d0c3b1b0590e7e1e
service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 3000
        port: 13080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            AUTO_UPDATE: true
            WEBSITE_NAME: "Docusaurus HomeLab Website"
            TEMPLATE: classic
            RUN_MODE: development
          probes:
            startup:
              spec:
                # First start scaffolds the site and installs its dependencies
                failureThreshold: 120
persistence:
  config:
    enabled: true
    mountPath: /config
