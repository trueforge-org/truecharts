# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/sickgear/sickgear
  pullPolicy: IfNotPresent
  tag: latest@sha256:b4c4ec32d2d959146be9e6cd5d5eeeb9e6815eaa00d2ea12fdde05815e31f1f4
service:
  main:
    ports:
      main:
        port: 10066
        targetPort: 8081
persistence:
  config:
    enabled: true
    mountPath: "/config"
  varrun:
    enabled: true

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            APP_DATA: /config
