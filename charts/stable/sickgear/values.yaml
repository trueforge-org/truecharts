# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/sickgear/sickgear
  pullPolicy: IfNotPresent
  tag: latest@sha256:d7f4e21989ba663d22c779064aa31ced12d3f96a044fe0a999298f359889d308
service:
  main:
    ports:
      main:
        port: 10066
        targetPort: 8081
persistence:
  config:
    enabled: true
    mountPath: "/config"
  varrun:
    enabled: true

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            APP_DATA: /config
