# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker
  pullPolicy: IfNotPresent
  tag: 29.9.3-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
podOptions:
  hostNetwork: true
securityContext:
  container:
    privileged: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: true
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
  pod:
    fsGroup: 0
service:
  main:
    enabled: true
    type: ClusterIP
    ports:
      main:
        port: 2376
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: tcp
              spec:
                initialDelaySeconds: 30
            readiness:
              type: tcp
              spec:
                initialDelaySeconds: 30
            startup:
              type: tcp
              spec:
                initialDelaySeconds: 30
          env:
            DOCKER_TLS_CERTDIR: /certs
    type: StatefulSet
    replicas: 1
    strategy: RollingUpdate
persistence:
  docker-certs-ca:
    enabled: true
    mountPath: /config
  docker-certs-client:
    enabled: true
    mountPath: /certs/client
  docker:
    enabled: true
    mountPath: /var/lib/docker
