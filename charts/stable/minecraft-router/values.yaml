# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/itzg/mc-router
  pullPolicy: IfNotPresent
  tag: 1.46.2@sha256:802a6adef1a298fd0557b6c2223b94a7bc06cd16a007315d5ba2f498e72ce5de
service:
  main:
    ports:
      main:
        port: 25565
  api:
    enabled: true
    ports:
      api:
        enabled: true
        port: 25564

# manual option
mcrouter:
  # vanilla:25565
  default: ""
  mappings: []
    # - vanilla:25565
    # - forge:25565

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              port: "{{ .Values.service.api.ports.api.port }}"
              path: /routes
              httpHeaders:
                Accept: application/json
            readiness:
              port: "{{ .Values.service.api.ports.api.port }}"
              path: /routes
              httpHeaders:
                Accept: application/json
            startup:
              port: "{{ .Values.service.api.ports.api.port }}"
              path: /routes
              httpHeaders:
                Accept: application/json
          env:
            API_BINDING: ":{{ .Values.service.api.ports.api.port }}"
            PORT: "{{ .Values.service.main.ports.main.port }}"
            # enabled for auto discovery to work
            IN_KUBE_CLUSTER: true
            # leave blank for all namespaces
            # KUBE_NAMESPACE: ""
            DEFAULT: "{{ .Values.mcrouter.default }}"
            MAPPING: '{{ join "," .Values.mcrouter.mappings }}'

rbac:
  main:
    enabled: true
    primary: true
    clusterWide: true
    rules:
      - apiGroups: [""]
        resources:
          - "services"
        verbs:
          - "list"
          - "watch"

serviceAccount:
  main:
    enabled: true
    primary: true

podOptions:
  automountServiceAccountToken: true
