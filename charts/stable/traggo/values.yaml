# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/traggo/server
  pullPolicy: IfNotPresent
  tag: 0.8.3@sha256:8bf510774ce1729b5bd9a8930e174de03ebec8c25ca4aaa087c0e56e2bcbb67a
traggo:
  username: admin
  password: admin
  pass_strength: 10
  log_level: info
service:
  main:
    ports:
      main:
        protocol: http
        port: 12117
secret:
  secret:
    enabled: true
    data:
      TRAGGO_DATABASE_DIALECT: sqlite3
      TRAGGO_DATABASE_CONNECTION: /opt/traggo/data/traggo.db
      TRAGGO_PORT: '{{ .Values.service.main.ports.main.port }}'
      TRAGGO_PASS_STRENGTH: '{{ .Values.traggo.pass_strength }}'
      TRAGGO_DEFAULT_USER_NAME: '{{ .Values.traggo.username }}'
      TRAGGO_DEFAULT_USER_PASS: '{{ .Values.traggo.password }}'
      TRAGGO_LOG_LEVEL: '{{ .Values.traggo.log_level }}'
persistence:
  config:
    enabled: true
    mountPath: /opt/traggo/data

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
            readiness:
              type: http
            startup:
              type: http
          envFrom:
            - secretRef:
                name: "secret"
