# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/fclairamb/solidping
  tag: 0.40.0@sha256:31f43723331f237f7a4d64ef4a4bb433ce7da143cd18b34b7d4b099873ce8072

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /api/mgmt/health
            readiness:
              type: http
              path: /api/mgmt/health
            startup:
              type: http
              path: /api/mgmt/health
          env:
            SP_SERVER_LISTEN: ":{{ .Values.service.main.ports.main.targetPort }}"
            SP_DB_TYPE: postgres
            SP_DB_URL:
              secretKeyRef:
                name: cnpg-main-urls
                key: std
            SP_FILESTORAGE_LOCAL_ROOT: /data/files

service:
  main:
    ports:
      main:
        port: 10541
        protocol: http
        targetPort: 4000

persistence:
  data:
    enabled: true
    mountPath: /data

cnpg:
  main:
    enabled: true
    user: solidping
    database: solidping
