# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/fclairamb/solidping
  tag: 0.57.0@sha256:adc5ab3efa16207198470f18f81119afe9ac80a4a25c18c36dc8bc5189ea4b5a

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /api/mgmt/health
            readiness:
              type: http
              path: /api/mgmt/health
            startup:
              type: http
              path: /api/mgmt/health
          env:
            SP_SERVER_LISTEN: ":{{ .Values.service.main.ports.main.targetPort }}"
            SP_DB_TYPE: postgres
            SP_DB_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
            SP_FILESTORAGE_LOCAL_ROOT: /data/files

service:
  main:
    ports:
      main:
        port: 10541
        protocol: http
        targetPort: 4000

persistence:
  data:
    enabled: true
    mountPath: /data

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: solidping
      postgresqlDatabase: solidping
