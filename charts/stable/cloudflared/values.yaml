# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/cloudflare/cloudflared
  pullPolicy: IfNotPresent
  tag: 2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            TUNNEL_TOKEN:
              secretKeyRef:
                name: env-secrets
                key: TUNNEL_TOKEN
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
secret:
  env-secrets:
    enabled: true
    data:
      TUNNEL_TOKEN: ""
