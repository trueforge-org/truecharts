# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/vallezw/sheetable
  tag: v0.8.1@sha256:87db05053f61e89ead0ac2a97e1ec28335e6aec8bac1f01d352229fea880a207
persistence:
  config:
    enabled: true
    mountPath: /app/config

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: sheetable
      postgresqlDatabase: sheetable
secretEnv:
  ADMIN_EMAIL: email@domain.com
  ADMIN_PASSWORD: changeme
service:
  main:
    ports:
      main:
        port: 10284
        protocol: http
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            API_SECRET:
              secretKeyRef:
                key: API_SECRET
                name: sheetable-secrets
            CONFIG_PATH: /app/config/
            DB_DRIVER: postgres
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DB_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DB_PORT: "5432"
            DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            PORT: "{{ .Values.service.main.ports.main.port }}"

sheetable:
  # -- Must be changed. Secret used to sign API tokens.
  apiSecret: "PLACEHOLDERAPISECRET"
