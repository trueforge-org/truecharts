# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/beromir/servas
  pullPolicy: IfNotPresent
  tag: 1.2.0@sha256:662b0d8f37e67addc0448eb0fecb87c9a1314e2ef51dd8eb3ba222e8a2b726e3
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 80
        port: 11080
servas:
  # Laravel application key. MUST be changed, use a random string of exactly 32 characters.
  appKey: "PLACEHOLDERAPPKEYXXXXXXXXXXXXXXX"
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/"
              type: http
            readiness:
              path: "/"
              type: http
            startup:
              path: "/"
              type: http
          env:
            APP_NAME: Servas
            APP_KEY:
              secretKeyRef:
                name: servas-secrets
                key: APP_KEY
            APP_ENV: production
            APP_DEBUG: false
            # APP_URL: "http://localhost:{{ .Values.service.main.ports.main.port }}"
            SERVAS_ENABLE_REGISTRATION: true
            DB_CONNECTION: mysql
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                key: plainhost
            DB_PORT: 3306
            DB_DATABASE: "{{ .Values.dependencies.mariadb.depconfig.mariadbDatabase }}"
            DB_USERNAME: "{{ .Values.dependencies.mariadb.depconfig.mariadbUsername }}"
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                key: mariadb-password
persistence:
  nginx:
    enabled: true
    mountPath: "/var/run/nginx"
    type: emptyDir
dependencies:
  mariadb:
    enabled: true
    depconfig:
      mariadbUsername: servas
      mariadbDatabase: servas
