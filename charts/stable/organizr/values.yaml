# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/organizr/organizr
  pullPolicy: Always
  tag: latest@sha256:a3451b1ef949c7d02fe304ec5964cc621d29e2236c0bf755c24a96d2af36a0b8
service:
  main:
    ports:
      main:
        port: 10022
        targetPort: 80
persistence:
  config:
    enabled: true
    mountPath: "/config"
  data:
    enabled: true
    mountPath: "/data"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
