# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/organizr/organizr
  pullPolicy: Always
  tag: latest@sha256:52183b1eeb25632e68b677adafbcbaa5436d62cbbbe049edd4fcfa527baa0b1d
service:
  main:
    ports:
      main:
        port: 10022
        targetPort: 80
persistence:
  config:
    enabled: true
    mountPath: "/config"
  data:
    enabled: true
    mountPath: "/data"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
