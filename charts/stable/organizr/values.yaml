# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/organizr/organizr
  pullPolicy: Always
  tag: latest@sha256:703de7b15e3ca0046c9bcfee03c72539f74acc5e26929f2911aa1af2be8ebb01
service:
  main:
    ports:
      main:
        port: 10022
        targetPort: 80
persistence:
  config:
    enabled: true
    mountPath: "/config"
  data:
    enabled: true
    mountPath: "/data"

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
