# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/ghostfolio/ghostfolio
  pullPolicy: IfNotPresent
  tag: 3.100.0@sha256:1bc2ff4740410dd2c3bdde95738268f4c619cf4eeec491e3967bec18c95130b1
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        port: 3333
        targetPort: 3333
ghostfolio:
  # Must be changed. Random strings, at least 32 characters.
  accessTokenSalt: "PLACEHOLDERACCESSTOKENSALT0000000000"
  jwtSecretKey: "PLACEHOLDERJWTSECRETKEY00000000000000"
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/"
              type: http
            readiness:
              path: "/"
              type: http
            startup:
              type: tcp
          env:
            ALPHA_VANTAGE_API_KEY:
              secretKeyRef:
                name: env-secrets
                key: ALPHA_VANTAGE_API_KEY
            ACCESS_TOKEN_SALT:
              secretKeyRef:
                name: ghostfolio-secrets
                key: ACCESS_TOKEN_SALT
            JWT_SECRET_KEY:
              secretKeyRef:
                name: ghostfolio-secrets
                key: JWT_SECRET_KEY
            DATABASE_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: urlutf8
            REDIS_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: plainhost
            REDIS_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: valkey-password
            REDIS_PORT: "6379"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: ghostfolio
      postgresqlDatabase: ghostfolio
  valkey:
    enabled: true

secret:
  env-secrets:
    enabled: true
    data:
      ALPHA_VANTAGE_API_KEY: ""
