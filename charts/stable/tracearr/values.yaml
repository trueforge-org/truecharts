# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/connorgallopo/tracearr
  pullPolicy: IfNotPresent
  tag: 3.2.1@sha256:6bcaf17c012b4fe11b898f343244af19b3c87b7847bdc652897e2c9781465f2c

securityContext:
  container:
    readOnlyRootFilesystem: false

service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 3000
        port: 3000

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: tracearr
      postgresqlDatabase: tracearr
  valkey:
    enabled: true

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            JWT_SECRET:
              secretKeyRef:
                name: env-secrets
                key: JWT_SECRET
            COOKIE_SECRET:
              secretKeyRef:
                name: env-secrets
                key: COOKIE_SECRET
            # Optional MaxMind GeoIP license key
            MAXMIND_LICENSE_KEY:
              secretKeyRef:
                name: env-secrets
                key: MAXMIND_LICENSE_KEY
            CORS_ORIGIN: "*"
            LOG_LEVEL: info
            # Enable reverse proxy support
            TRUST_PROXY: true
            DATABASE_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
            REDIS_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: url

secret:
  env-secrets:
    enabled: true
    data:
      JWT_SECRET: "changeme"
      COOKIE_SECRET: "changeme"
      MAXMIND_LICENSE_KEY: ""
