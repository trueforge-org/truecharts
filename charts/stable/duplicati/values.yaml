# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/duplicati
  tag: 2.4.1@sha256:a29f75065409ba7ac8f8f56d8efd4350ede142f23ec91215fd502b08187f559e
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 8200
        targetPort: 8200
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /
            readiness:
              type: http
              path: /
            startup:
              type: http
              path: /
          env:
            DUPLICATI__WEBSERVICE_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: DUPLICATI__WEBSERVICE_PASSWORD
            SETTINGS_ENCRYPTION_KEY:
              secretKeyRef:
                name: env-secrets
                key: SETTINGS_ENCRYPTION_KEY
            DUPLICATI__ALLOW_INSECURE_DATAFOLDER: true
            # DOTNET_SYSTEM_IO_DISABLEFILELOCKING: true

persistence:
  config:
    enabled: true
    mountPath: /data
secret:
  env-secrets:
    enabled: true
    data:
      DUPLICATI__WEBSERVICE_PASSWORD: "SuperSecretPassword"
      SETTINGS_ENCRYPTION_KEY: "real_encryption_key"
