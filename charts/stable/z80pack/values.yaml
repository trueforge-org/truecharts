# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/dlandon/z80pack
  tag: latest@sha256:c1287d3b1258a21c1049a8d353834b9d0f40f4a87f13b9b1f8383b79436da831
persistence:
  config:
    enabled: true
    mountPath: /config

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 4200
        protocol: tcp
        targetPort: 4200
