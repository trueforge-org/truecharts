image:
  pullPolicy: IfNotPresent
  repository: docker.io/shaarli/shaarli
  tag: v0.16.0@sha256:3662940999cc1ec7d6fbfec356a91252f2b205f4d50709b2b7096d32cc0c18d3
persistence:
  cache:
    enabled: true
    mountPath: /var/www/shaarli/cache
  data:
    enabled: true
    mountPath: /var/www/shaarli/data

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8000
        protocol: tcp
        targetPort: 80
