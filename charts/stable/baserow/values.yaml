# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/baserow/baserow
  tag: 2.4.1@sha256:2229bc0ad9c8e1c3c44cef3324ff0501639d44a7b6f64026ebaa44f61cfb038e
  pullPolicy: IfNotPresent
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        port: 10228
        protocol: http
workload:
  main:
    podSpec:
      containers:
        main:
          securityContext:
            capabilities:
              add:
                # bundled caddy binary has file capability cap_net_bind_service
                - NET_BIND_SERVICE
                # supervisord stops its child processes running as another user
                - KILL
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          env:
            DATABASE_NAME: "{{ .Values.cnpg.main.database }}"
            DATABASE_USER: "{{ .Values.cnpg.main.user }}"
            DATABASE_PORT: "5432"
            REDIS_USER: "{{ .Values.redis.redisUsername }}"
            REDIS_PORT: "6379"
            REDIS_PROTOCOL: "redis"
            BASEROW_CADDY_ADDRESSES: ":{{ .Values.service.main.ports.main.port }}"
            # User Defined
            BASEROW_TRIGGER_SYNC_TEMPLATES_AFTER_MIGRATION: false
            BASEROW_PUBLIC_URL: "http://127.0.0.1:10228"
            FROM_EMAIL: ""
            EMAIL_SMTP: ""
            EMAIL_SMTP_USE_TLS: ""
            EMAIL_SMTP_HOST: ""
            EMAIL_SMTP_PORT: 587
            EMAIL_SMTP_USER: ""
            EMAIL_SMTP_PASSWORD: ""
            DATABASE_HOST:
              secretKeyRef:
                name: cnpg-main-urls
                key: host
            DATABASE_PASSWORD:
              secretKeyRef:
                name: cnpg-main-user
                key: password
            REDIS_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                key: plainhost
            REDIS_PASSWORD: "{{ .Values.redis.password }}"
            SECRET_KEY:
              secretKeyRef:
                name: secrets
                key: SECRET_KEY
persistence:
  data:
    enabled: true
    mountPath: /baserow/data
cnpg:
  main:
    enabled: true
    user: baserow
    database: baserow
redis:
  enabled: true
  redisUsername: "default"
