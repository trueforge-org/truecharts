# yaml-language-server: $schema=./values.schema.json
image:
  repository: public.ecr.aws/docker/library/odoo
  pullPolicy: IfNotPresent
  tag: 20.0@sha256:8bcae4c1f895683ee851e19dd3e7d999e81e770defe9015bc9dad8bbf10f2b0d
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsUser: 1000
    runAsGroup: 1000
service:
  main:
    ports:
      main:
        port: 8069
odoo:
  additionalConf: []
workload:
  main:
    podSpec:
      initContainers:
        init-db:
          type: install
          enabled: true
          imageSelector: "image"
          env:
            ODOO_RC: /etc/odoo/odoo.conf
          command:
            - /bin/bash
          args:
            - -c
            - |
              /usr/bin/odoo --config=/etc/odoo/odoo.conf \
                            --stop-after-init \
                            --without-demo=all \
                            --init=base
      containers:
        main:
          probes:
            liveness:
              enabled: true
              type: http
              path: /web/health
            readiness:
              enabled: true
              type: http
              path: /web/health
            startup:
              enabled: true
              type: http
              path: /web/health
          env:
            ODOO_RC: /etc/odoo/odoo.conf
persistence:
  odoo:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: "/var/lib/odoo"
        init-db:
          mountPath: "/var/lib/odoo"
  addons:
    enabled: true
    targetSelector:
      main:
        main:
          mountPath: "/mnt/extra-addons"
        init-db:
          mountPath: "/mnt/extra-addons"
  odoo-config:
    enabled: true
    type: configmap
    objectName: odoo-config
    targetSelector:
      main:
        main:
          mountPath: /etc/odoo/odoo.conf
          subPath: odoo.conf
          readOnly: true
        init-db:
          mountPath: /etc/odoo/odoo.conf
          subPath: odoo.conf
          readOnly: true
# Enabled postgres
cnpg:
  main:
    enabled: true
    user: odoo
    database: odoo
configmap:
  odoo-config:
    enabled: true
    data:
      odoo.conf: |-
        [options]
        ; Paths
        data_dir = {{ .Values.persistence.odoo.targetSelector.main.main.mountPath }}
        addons_path = {{ .Values.persistence.addons.targetSelector.main.main.mountPath }}
        ; Network Details
        http_enable = True
        http_interface = 0.0.0.0
        http_port = {{ .Values.service.main.ports.main.port }}
        ; Database Details
        db_port = 5432
        db_host = {{ .Values.cnpg.main.creds.host | trimAll "\"" }}
        db_name = {{ .Values.cnpg.main.database }}
        db_user = {{ .Values.cnpg.main.user }}
        db_sslmode = disable
        db_password = {{ .Values.cnpg.main.creds.password | trimAll "\"" }}
        {{- /* xmlrpc* keys are deprecated and http* keys are used in their place */ -}}
        {{- $reservedKeys := (list "data_dir" "addons_path" "http_enable" "http_interface" "http_port" "xmlrpc" "xmlrpc_port" "xmlrpc_interface" "db_port" "db_host" "db_name" "db_user" "db_sslmode" "db_password") -}}
        {{- $userKeys := list -}}
        {{- range $opt := .Values.odoo.additionalConf -}}
          {{- if (mustHas $opt.key $reservedKeys) -}}
            {{- fail (printf "Odoo - Key [%v] is not allowed to be modified") -}}
          {{- end -}}
          {{- $userKeys = mustAppend $userKeys $opt.key -}}
          {{- printf "%s = %s" $opt.key $opt.value | nindent 5 -}}
        {{- end -}}
        {{- if not (deepEqual $userKeys (uniq $userKeys)) -}}
          {{- fail (printf "Odoo - Additional configuration keys must be unique, but got [%v]" (join ", " $userKeys)) -}}
        {{- end }}
