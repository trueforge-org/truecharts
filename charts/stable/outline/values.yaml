# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/outlinewiki/outline
  pullPolicy: IfNotPresent
  tag: 1.13.0@sha256:4583bb244dbb4464d8a632c75044d3b2f9fe44382b6a4b84d97995f473b823e4
outline:
  # Must be changed. Both must be hex strings of exactly 64 characters (32 bytes).
  secretKey: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
  utilsSecret: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
service:
  main:
    ports:
      main:
        port: 10196
# Enabled redis
# Enabled postgres
dependencies:
  valkey:
    enabled: true
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: outline
      postgresqlDatabase: outline

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/_health"
            readiness:
              path: "/_health"
            startup:
              path: "/_health"
          env:
            FORCE_HTTPS: false
            PGSSLMODE: "disable"
            PORT: "{{ .Values.service.main.ports.main.port }}"
            # User defined
            URL: "http://localhost:{{ .Values.service.main.ports.main.port }}"
            SLACK_MESSAGE_ACTIONS: true
            ENABLE_UPDATES: true
            WEB_CONCURRENCY: 1
            MAXIMUM_IMPORT_SIZE: 5120000
            DEFAULT_LANGUAGE: "en_US"
            FILE_STORAGE: ""
            FILE_STORAGE_UPLOAD_MAX_SIZE: ""
            # TEAM_LOGO: ""
            # COLLABORATION_URL: ""
            # SLACK_KEY: ""
            # SLACK_SECRET: ""
            # SLACK_VERIFICATION_TOKEN: ""
            # SLACK_APP_ID: ""
            # GOOGLE_CLIENT_ID: ""
            # GOOGLE_CLIENT_SECRET: ""
            # GOOGLE_ANALYTICS_ID: ""
            # AZURE_CLIENT_ID: ""
            # AZURE_CLIENT_SECRET: ""
            # AZURE_RESOURCE_APP_ID: ""
            # OIDC_CLIENT_ID: ""
            # OIDC_CLIENT_SECRET: ""
            # OIDC_AUTH_URI: ""
            # OIDC_TOKEN_URI: ""
            # OIDC_USERINFO_URI: ""
            # OIDC_USERNAME_CLAIM: ""
            # OIDC_DISPLAY_NAME: ""
            # OIDC_SCOPES: ""
            # SENTRY_DSN: ""
            # AWS_ACCESS_KEY_ID: ""
            # AWS_SECRET_ACCESS_KEY: ""
            # AWS_REGION: ""
            # AWS_S3_ACCELERATE_URL: ""
            # AWS_S3_UPLOAD_BUCKET_URL: ""
            # AWS_S3_UPLOAD_BUCKET_NAME: ""
            # AWS_S3_UPLOAD_MAX_SIZE: 26214400
            # AWS_S3_FORCE_PATH_STYLE: true
            # AWS_S3_ACL: ""
            # SMTP_HOST: ""
            # SMTP_PORT: 587
            # SMTP_USERNAME: ""
            # SMTP_PASSWORD: ""
            # SMTP_FROM_EMAIL: ""
            # SMTP_REPLY_EMAIL: ""
            # SMTP_SECURE: true

            DATABASE_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: url
            REDIS_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: url
            SECRET_KEY:
              secretKeyRef:
                name: secrets
                key: SECRET_KEY
            UTILS_SECRET:
              secretKeyRef:
                name: secrets
                key: UTILS_SECRET
persistence:
  data:
    enabled: true
    mountPath: /var/lib/outline/data
