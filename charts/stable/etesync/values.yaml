# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/victorrds/etesync
  pullPolicy: IfNotPresent
  tag: 0.14.2@sha256:ab89c9eb94b51d1007ff0945c079d042f82ddefd12f4007e5f30f97e26e0ba37
securityContext:
  container:
    runAsUser: 373
    runAsGroup: 373
    readOnlyRootFilesystem: false
  pod:
    fsGroup: 373
# Docker image configuration docs:
# https://github.com/victor-rds/docker-etebase#settings-and-customization

# EteSync configuration docs:
# https://github.com/etesync/server#configuration
etesync:
  # Must be changed. Django SECRET_KEY, random string (32+ characters).
  secretKey: "PLACEHOLDERSECRETKEYCHANGEME0000"

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            REGEN_INI: true
            # App
            SERVER: http
            AUTO_UPDATE: true
            ALLOWED_HOSTS: "localhost"
            AUTO_SIGNUP: false
            LANGUAGE_CODE: "en-us"
            TIME_ZONE: "{{ .Values.TZ }}"
            # Debugging
            DEBUG: false
            SHELL_DEBUG: false
            DEBUG_DJANGO: false
            # Postgres
            DB_ENGINE: postgres
            DATABASE_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DATABASE_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DATABASE_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DATABASE_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DATABASE_PORT: 5432
            REDIS_URI:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: url
            # Superuser
            SUPER_USER: "admin"
            SUPER_PASS:
              secretKeyRef:
                name: env-secrets
                key: SUPER_PASS
            SUPER_EMAIL: ""
service:
  main:
    ports:
      main:
        protocol: http
        port: 10254
persistence:
  app:
    enabled: true
    mountPath: "/data"
  secret:
    enabled: true
    type: secret
    readOnly: true
    mountPath: "/data/secret.txt"
    subPath: "secret.txt"
    objectName: "etesync-secret"
# Enabled postgres
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: etesync
      postgresqlDatabase: etesync
  valkey:
    enabled: true
secret:
  env-secrets:
    enabled: true
    data:
      SUPER_PASS: ""
