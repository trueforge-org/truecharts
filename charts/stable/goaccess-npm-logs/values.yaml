# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/xavier-hernandez/goaccess-for-nginxproxymanager
  tag: latest@sha256:a306dab0ed63d5bedd991d374cb5e3f37b518da708f5fef547665dfd46e02e2f
persistence:
  hostpath1:
    enabled: true
    mountPath: /opt/log
    readOnly: true

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 7880
        protocol: tcp
        targetPort: 7880
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            BASIC_AUTH: "True"
            BASIC_AUTH_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: BASIC_AUTH_PASSWORD
            BASIC_AUTH_USERNAME: x
            DEBUG: "False"
            EXCLUDE_IPS: ""
            SKIP_ARCHIVED_LOGS: "False"

secret:
  env-secrets:
    enabled: true
    data:
      BASIC_AUTH_PASSWORD: "x"
