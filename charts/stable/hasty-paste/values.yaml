# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/enchant97/hasty-paste
  tag: 2.5.1@sha256:d69120f176fd330304914a13505c68d8d8df85a4ec9f9cf37613f2af769c9f8a
persistence:
  config:
    enabled: true
    mountPath: /opt/hasty-paste/data
service:
  main:
    ports:
      main:
        port: 10601
        protocol: http
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PUBLIC_URL: "http://example.com"
            # Secrets can be generated by this command: openssl rand -base64 32
            AUTH_TOKEN_SECRET: ""
            SESSION_SECRET: ""
            BIND__PORT: "{{ .Values.service.main.ports.main.port }}"
