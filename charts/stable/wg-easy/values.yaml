# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/wg-easy
  pullPolicy: IfNotPresent
  tag: 15.5.0@sha256:5a94d8b6a62a71653b014f8c517ef477ba6790d71ecc86f7f72c37c690c1e9de
securityContext:
  container:
    PUID: 0
    runAsUser: 0
    runAsGroup: 0
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    privileged: true
    capabilities:
      add:
        - NET_ADMIN
        - NET_RAW
        - SYS_MODULE
service:
  main:
    ports:
      main:
        port: 51821
  vpn:
    enabled: true
    ports:
      vpn:
        enabled: true
        protocol: udp
        port: 51820
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          env:
            HOST: "0.0.0.0"
            PORT: "{{ .Values.service.main.ports.main.port }}"
            INSECURE: false
persistence:
  config:
    enabled: true
    mountPath: "/etc/wireguard"
  modules:
    enabled: true
    hostPath: "/lib/modules"
    mountPath: "/lib/modules"
    readOnly: true
    type: hostPath
