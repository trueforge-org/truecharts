# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/sublivion/gridcoinwalletgui
  tag: latest@sha256:968d03e0d25da240cc09bbd01ab66c95b8e435ff8fa5868bae9040966a742fe5
persistence:
  appdataconfigpath:
    enabled: true
    mountPath: /headless/.GridcoinResearch/
  boincdatadir:
    enabled: true
    mountPath: /var/lib/boinc-client/

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 6901
        protocol: http
        targetPort: 6901
  vncport:
    enabled: true
    ports:
      vncport:
        enabled: true
        port: 5901
        protocol: tcp
        targetPort: 5901
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            VNC_PW:
              secretKeyRef:
                name: env-secrets
                key: VNC_PW
            VNC_RESOLUTION: 1920x1080
secret:
  env-secrets:
    enabled: true
    data:
      VNC_PW: "vncpassword"
