# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/c4illin/convertx
  tag: v0.20.0@sha256:6259e0c1e063120b1ddbc6937372a83be58182b2c9dc82264f58e100907b3e51
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 3000
        targetPort: 3000
persistence:
  data:
    enabled: true
    mountPath: /app/data

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            HTTP_ALLOWED: "true"
