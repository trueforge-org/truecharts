# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/teslamate/teslamate
  pullPolicy: IfNotPresent
  tag: 4.5.0@sha256:a285b02171a789cf2af5075502d2ec9034b58a42db777a30ae86aef2d0c12af4

securityContext:
  container:
    readOnlyRootFilesystem: false

service:
  main:
    ports:
      main:
        protocol: http
        port: 4000

workload:
  main:
    replicas: 1
    strategy: RollingUpdate
    podSpec:
      containers:
        main:
          env:
            ENCRYPTION_KEY:
              secretKeyRef:
                name: teslamate-secrets
                key: TESLAMATE_ENCRYPTION_KEY
            DATABASE_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DATABASE_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DATABASE_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DATABASE_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DISABLE_MQTT: true
            MQTT_HOST: ""
            MQTT_PORT: 1883
            MQTT_USERNAME: ""
            MQTT_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: MQTT_PASSWORD

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: teslamate
      postgresqlDatabase: teslamate
    operator:
      cluster:
        initdb:
          postInitApplicationSQL:
            - ALTER USER teslamate WITH SUPERUSER

secret:
  env-secrets:
    enabled: true
    data:
      MQTT_PASSWORD: ""
  datasource:
    enabled: true
    labels:
      grafana_datasource: "1"
    data:
      datasourceteslamatepsql.yaml: |-
        apiVersion: 1
        datasources:
        - name: TeslaMate
          type: postgres
          uid: TeslaMate
          url: {{ printf "%s.%s:5432" (.Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"") .Release.Namespace }}
          access: proxy
          user: {{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}
          secureJsonData:
            password: {{ .Values.dependencies.postgresql.depconfig.creds.postgresqlPassword | default "na" }}
          jsonData:
            database: {{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}
            sslmode: 'disable' # disable/require/verify-ca/verify-full
            maxOpenConns: 100 # Grafana v5.4+
            maxIdleConns: 100 # Grafana v5.4+
            maxIdleConnsAuto: true # Grafana v9.5.1+
            connMaxLifetime: 14400 # Grafana v5.4+
            postgresVersion: 1500 # 903=9.3, 904=9.4, 905=9.5, 906=9.6, 1000=10
            timescaledb: false

teslamate:
  # -- Must be changed. Key used to encrypt the Tesla API tokens in the database. Changing it later invalidates stored tokens.
  encryptionKey: "PLACEHOLDERENCRYPTIONKEYCHANGEME00000000000000000000000000000000"
