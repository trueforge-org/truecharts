# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/fluidd-core/fluidd
  tag: v1.38.0@sha256:bc3f7ea0a5875e7b96ccb2a86881226906c5c1ba509e20ff27ac7a1761eb6db5
  pullPolicy: IfNotPresent
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /
            readiness:
              type: http
              path: /
            startup:
              type: http
              path: /
          env: {}
service:
  main:
    ports:
      main:
        port: 10224
        targetPort: 80
