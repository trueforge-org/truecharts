# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/jbaten/spotweb
  pullPolicy: IfNotPresent
  tag: 1.5.4@sha256:2255a7483ecd4ec2ea573a3d4c7e3f8513b44cc4319d3a4f596f6c35e55399cb
service:
  main:
    ports:
      main:
        port: 10050
        targetPort: 80
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: spotweb
      postgresqlDatabase: spotweb

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            SPOTWEB_SYSTEMTYPE: "single"
            SPOTWEB_FIRSTNAME: "demo"
            SPOTWEB_LASTNAME: "spotweb"
            SPOTWEB_MAIL: "demo@spotweb.com"
            SPOTWEB_RETRIEVE: "15min"
            DB_ENGINE: "pdo_pgsql"
            DB_PORT: "5432"
            DB_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_SCHEMA: "public"
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            SPOTWEB_USERNAME: "myawesomeuser"
            SPOTWEB_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: SPOTWEB_PASSWORD

secret:
  env-secrets:
    enabled: true
    data:
      SPOTWEB_PASSWORD: "changeme"
