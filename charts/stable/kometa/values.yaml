image:
  repository: ghcr.io/trueforge-org/kometa
  tag: sandbox@sha256:ad0bbbae36508a4eaff10328ad28a10f2695723dd1c2521bc5564cb01d610fd6
  pullPolicy: IfNotPresent

service:
  main:
    enabled: false
    ports:
      main:
        enabled: false

kometa:
  run: false
  no_countdown: true
  time:
    - "00:00"
  # plex_url: ""
  # plex_token: ""

workload:
  main:
    podSpec:
      initContainers:
        create-init-config-file:
          enabled: true
          type: init
          imageSelector: "image"
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "Creating config.yml file..."
              if [ -f /app/config/config.yml ]; then
                echo "Config file exists! Skipping..."
              else
                echo "Config file is missing, getting a new one!"
                curl -fLvo /app/config/config.yml https://raw.githubusercontent.com/kometa-team/kometa/master/config/config.yml.template || (echo "Downloading config file, FAILED..." && exit 1)
              fi
      containers:
        main:
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          envFrom:
            - secretRef:
                name: "secret"

persistence:
  config:
    enabled: true
    mountPath: /app/config
    targetSelectAll: true
