# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/linuxserver/speedtest-tracker
  pullPolicy: IfNotPresent
  tag: 1.15.2@sha256:5b9532220c558055a999bee20b190adc5a17c6fdbdc81b7af44538773899ae59
service:
  main:
    ports:
      main:
        targetPort: 80
        port: 9004
ingress:
  main:
    integrations:
      homepage:
        widget:
          type: speedtest
persistence:
  config:
    enabled: true
    mountPath: "/config"
  varrun:
    enabled: false
dependencies:
  valkey:
    enabled: true
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: speedtest-tracker
      postgresqlDatabase: speedtest-tracker

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          securityContext:
            capabilities:
              add:
                - SYS_CHROOT
                - KILL
          probes:
            liveness:
              enabled: true
              type: http
              path: /api/healthcheck
            startup:
              enabled: true
              type: http
              path: /api/healthcheck
            readiness:
              enabled: true
              type: http
              path: /api/healthcheck
          env:
            APP_URL: ""
            DB_CONNECTION: pgsql
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            DB_PORT: "5432"
            DB_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            APP_KEY:
              secretKeyRef:
                name: speedtest-tracker-secrets
                key: APP_KEY
            MAIL_MAILER: "smtp"
            MAIL_PORT: 465
            MAIL_USERNAME: ""
            MAIL_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: MAIL_PASSWORD
            MAIL_SCHEME: "smtps"
            MAIL_FROM_ADDRESS: ""
            MAIL_FROM_NAME: "Speedtest Tracker"
            TELEGRAM_BOT_TOKEN:
              secretKeyRef:
                name: env-secrets
                key: TELEGRAM_BOT_TOKEN
            CACHE_STORE: redis
            REDIS_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: url
            PUBLIC_DASHBOARD: true
            APP_NAME: "Speedtest Tracker"

secret:
  speedtest-tracker-secrets:
    enabled: true
    data:
      APP_KEY: '{{ required "speedtestTracker.appKey must be set" .Values.speedtestTracker.appKey }}'
  env-secrets:
    enabled: true
    data:
      MAIL_PASSWORD: ""
      TELEGRAM_BOT_TOKEN: ""

speedtestTracker:
  # -- Must be changed. Laravel application key, exactly 32 characters (or "base64:" followed by a base64 encoded 32 byte key).
  appKey: "PLACEHOLDERAPPKEYCHANGEME0000000"
