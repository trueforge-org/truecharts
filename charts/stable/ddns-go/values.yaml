# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/jeessy2/ddns-go
  pullPolicy: IfNotPresent
  tag: v6.17.9@sha256:17bfd1e05df8fbfdf0a5a2fcd931fef2026e91dd5e3b6377b4590dab2759a28a
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        targetPort: 9876
        protocol: http
        port: 10168
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /
            readiness:
              type: http
              path: /
            startup:
              type: http
              path: /
          env: {}
persistence:
  data:
    enabled: true
    mountPath: /root
