# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/jeessy2/ddns-go
  pullPolicy: IfNotPresent
  tag: v6.18.0@sha256:3dd66ffc7490487e02f9d94e414786c79e9b80c046792f612a1033eca872af12
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        targetPort: 9876
        protocol: http
        port: 10168
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /
            readiness:
              type: http
              path: /
            startup:
              type: http
              path: /
          env: {}
persistence:
  data:
    enabled: true
    mountPath: /root
