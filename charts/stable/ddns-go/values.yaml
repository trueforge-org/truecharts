# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/jeessy2/ddns-go
  pullPolicy: IfNotPresent
  tag: v6.17.8@sha256:4b41295f8206a0ae812466a915314b9711e993587de947206d5b80d8df9432fd
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        targetPort: 9876
        protocol: http
        port: 10168
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /
            readiness:
              type: http
              path: /
            startup:
              type: http
              path: /
          env: {}
persistence:
  data:
    enabled: true
    mountPath: /root
