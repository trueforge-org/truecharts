  pullPolicy: IfNotPresent
  tag: 2.21.0@sha256:1a1197ee812a49ad1fde89391cc63950c4b0ed9cb7c438c89689013e50d54f45
service:
  main:
    ports:
      main:
        targetPort: 5700
        port: 10176
persistence:
  data:
    enabled: true
    mountPath: "/ql/data"

securityContext:
