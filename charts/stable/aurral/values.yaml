# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/lklynet/aurral
  tag: 3.1.0@sha256:17d1f8ff2aaa3907d846c38b47eebdd44b10fbe00b2c993373a6da940ac2504f

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /api/health
            readiness:
              type: http
              path: /api/health
            startup:
              type: http
              path: /api/health

service:
  main:
    ports:
      main:
        port: 3001
        protocol: http
        targetPort: 3001

persistence:
  config:
    enabled: true
    mountPath: /config

  # The image ships fontconfig (fonts-dejavu-core, fonts-noto-color-emoji) and
  # the container runs with a read-only root filesystem, so fontconfig's cache
  # directory needs a writable mount.
  varcache:
    enabled: true
    type: emptyDir
    mountPath: /var/cache
