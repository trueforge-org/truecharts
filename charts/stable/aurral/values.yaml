# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/lklynet/aurral
  tag: 2.9.1@sha256:5690b43d50c76f81af3d0163ae05061f3227e8631da5bffbdd67c0d6407a334e

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /api/health
            readiness:
              type: http
              path: /api/health
            startup:
              type: http
              path: /api/health

service:
  main:
    ports:
      main:
        port: 3001
        protocol: http
        targetPort: 3001

persistence:
  config:
    enabled: true
    mountPath: /config

  # The image ships fontconfig (fonts-dejavu-core, fonts-noto-color-emoji) and
  # the container runs with a read-only root filesystem, so fontconfig's cache
  # directory needs a writable mount.
  varcache:
    enabled: true
    type: emptyDir
    mountPath: /var/cache
