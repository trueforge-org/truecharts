# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/lklynet/aurral
  tag: 2.11.0@sha256:a772c2d6c35dd9dd90128cf350bfc35b37bdd3c59ab5810374b7aa1a4063855c

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: http
              path: /api/health
            readiness:
              type: http
              path: /api/health
            startup:
              type: http
              path: /api/health

service:
  main:
    ports:
      main:
        port: 3001
        protocol: http
        targetPort: 3001

persistence:
  config:
    enabled: true
    mountPath: /config

  # The image ships fontconfig (fonts-dejavu-core, fonts-noto-color-emoji) and
  # the container runs with a read-only root filesystem, so fontconfig's cache
  # directory needs a writable mount.
  varcache:
    enabled: true
    type: emptyDir
    mountPath: /var/cache
