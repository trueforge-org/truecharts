# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/wisemapping/wisemapping
  pullPolicy: IfNotPresent
  tag: latest@sha256:5a0a48137a284a7c4b7e3051c457addb6e5c991b99356a32735059f847269b78

# When this is defined, the contents will be mounted
# as configmap into the container at /usr/local/tomcat/webapps/ROOT/WEB-INF/app.properties.
wisemappingConfig: {}

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

service:
  main:
    ports:
      main:
        port: 8080
        targetPort: 8080

workload:
  main:
    podSpec:
      initContainers:
        init-config:
          enabled: true
          type: init
          imageSelector: "image"
          command:
            - /bin/sh
            - -c
          args:
            - |
              mkdir -p /usr/local/tomcat/webapps/ROOT/WEB-INF/
              if [ ! -f /usr/local/tomcat/webapps/ROOT/WEB-INF/app.properties ]; then
                echo "Config file not found, copying dummy..."
                cp /usr/local/tomcat/webapps/ROOT/WEB-INF/app.properties.dummy /usr/local/tomcat/webapps/ROOT/WEB-INF/app.properties
                echo "Config file copied, you can now edit it at /usr/local/tomcat/webapps/ROOT/WEB-INF/app.properties"
              fi
      containers:
        main:
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          env:
            ADMIN_EMAIL: "change@me.com"

configmap:
  wisemapping-config:
    enabled: true
    data:
      '{{ if .Values.wisemappingConfig }}app.properties{{ else }}app.properties.dummy{{ end }}': |-
        {{- if .Values.wisemappingConfig }}
        {{- .Values.wisemappingConfig | toYaml | nindent 8 }}
        {{- else }}
        ; Database Details
        database.url=jdbc:{{ .Values.cnpg.main.creds.host | trimAll "\"" }}/wisemapping
        database.driver=org.postgresql.Driver
        database.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
        database.username= {{ .Values.cnpg.main.user }}
        database.password= {{ .Values.cnpg.main.creds.password | trimAll "\"" }}
        database.validation.enabled=true
        database.validation.query=
        database.validation.enabled=false
        ; Paths
        admin.user = {{ .Values.workload.main.podSpec.containers.main.env.ADMIN_EMAIL }}
        #site.baseurl = http://localhost:8080
        # Site Homepage URL. This will be used as URL for homepage location.
        site.homepage = c/login
        # Font end static content can be deployed externally to the web app. Uncomment here and specify the url base location.
        site.static.js.url = /static
        {{- end }}

persistence:
  wisemapping-config:
    enabled: true
    type: configmap
    objectName: wisemapping-config
    targetSelector:
      main:
        main: {}
        init-config: {}
    mountPath: '{{ if .Values.wisemappingConfig }}/usr/local/tomcat/webapps/ROOT/WEB-INF/{{ else }}/usr/local/tomcat/webapps/ROOT/WEB-INF/dummy{{ end }}'
    items:
      - key: '{{ if .Values.wisemappingConfig }}app.properties{{ else }}app.properties.dummy{{ end }}'
        path: '{{ if .Values.wisemappingConfig }}app.properties{{ else }}app.properties.dummy{{ end }}'
  config:
    # Only enable when not using wisemappingConfig
    enabled: false
    mountPath: /usr/local/tomcat/webapps/ROOT/WEB-INF/
    targetSelector:
      main:
        main: {}
        init-config: {}

cnpg:
  main:
    enabled: true
    user: wisemapping
    database: wisemapping
