# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/mosquitto
  tag: 2.0.22@sha256:0f0c8ce0a70128b20924b6fc8ea226febeb96d6840d2a05d4590fc51fa6a650d
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 1883
        targetPort: 1883
  websockets:
    enabled: true
    ports:
      websockets:
        enabled: true
        port: 9001
        targetPort: 9001
workload:
  main:
    podSpec:
      containers:
        main:
          # Use the config and data paths that the host AppArmor "mosquitto" profile
          # (e.g. on Ubuntu 26.04) allows for /usr/sbin/mosquitto. The image's
          # /start.sh always reads /mosquitto/config, so start mosquitto directly.
          command:
            - /usr/sbin/mosquitto
            - -c
            - /etc/mosquitto/mosquitto.conf
          probes:
            liveness:
              enabled: true
              type: tcp
              port: 1883
            readiness:
              enabled: true
              type: tcp
              port: 1883
            startup:
              enabled: true
              type: tcp
              port: 1883
ingress:
  websockets:
    enabled: false
    targetSelector:
      websockets: websockets
auth:
  # -- By enabling this, `allow_anonymous` gets set to `false` in the mosquitto config.
  enabled: false
websockets:
  # -- By enabling this, an additional listener with protocol websockets is added in the mosquitto config.
  enabled: false
configmap:
  config:
    enabled: true
    data:
      mosquitto.conf: |
        listener {{ .Values.service.main.ports.main.targetPort }}
        {{- if .Values.websockets.enabled }}
        listener {{ .Values.service.websockets.ports.websockets.targetPort }}
        protocol websockets
        {{- end }}
        {{- if .Values.auth.enabled }}
        allow_anonymous false
        {{- else }}
        allow_anonymous true
        {{- end }}
        {{- if .Values.persistence.data.enabled }}
        persistence true
        persistence_location {{ trimSuffix "/" .Values.persistence.data.mountPath }}/
        autosave_interval 1800
        {{- end }}
        {{- if .Values.persistence.configinc.enabled }}
        include_dir {{ .Values.persistence.configinc.mountPath }}
        {{- end }}
persistence:
  data:
    enabled: true
    mountPath: "/var/lib/mosquitto"
  configinc:
    enabled: true
    mountPath: "/etc/mosquitto/conf.d"
  mosquitto-config:
    enabled: true
    mountPath: "/etc/mosquitto/mosquitto.conf"
    subPath: "mosquitto.conf"
    type: configmap
    objectName: config
