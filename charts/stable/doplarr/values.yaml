# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/doplarr
  tag: "3.8.0@sha256:752d72d111bc0c2315710861ca6105685d731239a4fbeb5b371f9458b45848a7"
  pullPolicy: IfNotPresent
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
            OVERSEERR__URL: ""
            DISCORD__MAX_RESULTS: 25
            DISCORD__REQUESTED_MSG_STYLE: ":plain"
            SONARR__URL: ""
            SONARR__QUALITY_PROFILE: ""
            SONARR__LANGUAGE_PROFILE: ""
            RADARR__URL: ""
            RADARR__QUALITY_PROFILE: ""
            PARTIAL_SEASONS: true
            LOG_LEVEL: ":info"
            OVERSEERR__API: ""
            OVERSEERR__DEFAULT_ID: ""
            SONARR__API: ""
            RADARR__API: ""
            DISCORD__ROLE_ID: ""
            DISCORD__TOKEN:
              secretKeyRef:
                name: env-secrets
                key: DISCORD__TOKEN
secret:
  env-secrets:
    enabled: true
    data:
      DISCORD__TOKEN: ""
