# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/xthursdayx/gpodder-docker
  tag: latest@sha256:76cb41a1cca8de985f42d43a4b98f7a0a9129e415399b445cf787bd375e04d61
persistence:
  config:
    enabled: true
    mountPath: /config
  downloadspath:
    enabled: true
    mountPath: /downloads
  varrun:
    enabled: false

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 3000
        protocol: tcp
        targetPort: 3000
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PASSWORD: ""
