# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/shibaobun/cannery
  pullPolicy: IfNotPresent
  tag: 1.5.9@sha256:bf1da2b577b1893c68ff3a68895b46971b14b5216b9042f0adb991aa160f0226
service:
  main:
    ports:
      main:
        protocol: http
        port: 4000
workload:
  main:
    podSpec:
      containers:
        main:
          command:
            - /bin/sh
            - -c
          args:
            - |
              mkdir -p "${UPLOADS_PATH}/tmp"
              exec /app/bin/cannery start
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            # HOST must be set!
            # without http/https, preferrably the ingress url
            HOST: "cannery.local"
            # ecto://postgres:postgres@cannery-db/cannery
            DATABASE_URL:
              secretKeyRef:
                name: env-secrets
                key: DATABASE_URL
            CLOAK_KEY:
              secretKeyRef:
                name: env-secrets
                key: CLOAK_KEY
            SECRET_KEY_BASE:
              secretKeyRef:
                name: env-secrets
                key: SECRET_KEY_BASE
            # Ecto should use ipv6 to connect to PostgreSQL
            ECTO_IPV6: false
            # Controls the pool size to use with PostgreSQL. Defaults to 10.
            # POOL_SIZE: 10
            # Controls if user sign-up should be invite only or set to public. Set to public to enable public registration. Defaults to invite.
            REGISTRATION: "invite"
            # Sets a custom default locale. Defaults to en_US | de, fr and es
            LOCALE: en_US
            # The url for your SMTP email provider. Must be set.
            SMTP_HOST: "smtp.gmail.com"
            # The port for your SMTP relay. Defaults to 587.
            # SMTP_PORT: 587
            # The username for your SMTP relay. Must be set!
            SMTP_USERNAME: "example@gmail.com"
            # The password for your SMTP relay. Must be set!
            SMTP_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: SMTP_PASSWORD
            # Set to true to enable SSL for emails. Defaults to false.
            SMTP_SSL: false
            # Sets the sender email in sent emails. Defaults to no-reply@HOST where HOST was previously defined.
            EMAIL_FROM: "no-reply@HOST"
            # Sets the sender name in sent emails. Defaults to "Cannery".
            EMAIL_NAME: Cannery

persistence:
  uploads:
    enabled: true
    mountPath: "/var/cannery/uploads"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: cannery
      postgresqlDatabase: cannery
secret:
  env-secrets:
    enabled: true
    data:
      DATABASE_URL: '{{ printf "ecto://%s:%s@%s:5432/%s" .Values.dependencies.postgresql.depconfig.postgresqlUsername (.Values.dependencies.postgresql.depconfig.creds.postgresqlPassword | trimAll "\"") (.Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"") .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}'
      SECRET_KEY_BASE: "change-me-this-is-really-important-seriously-change-it-please-use-a-64-byte-secret-key"
      SMTP_PASSWORD: "example"
      CLOAK_KEY: "change-me-32-random-bytes-base64"
