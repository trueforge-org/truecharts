# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/manyfold3d/manyfold
  tag: 0.154.4@sha256:f5fd40e90e21cbc91d5b0fe18f1e0d856edcbf06e14b328327806ebb854da0c2
  pullPolicy: IfNotPresent
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
manyfold:
  # Must be changed. Rails SECRET_KEY_BASE, any long random string (64+ chars recommended).
  secretKeyBase: "PLACEHOLDERSECRETKEYBASECHANGEMEPLACEHOLDERSECRETKEYBASECHANGEME"
service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 3214
        port: 3214
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DATABASE_ADAPTER: postgresql
            DATABASE_HOST: '{{ .Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"" }}'
            DATABASE_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DATABASE_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DATABASE_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            SECRET_KEY_BASE:
              secretKeyRef:
                name: manyfold-secrets
                key: SECRET_KEY_BASE
            REDIS_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: url
          probes:
            readiness:
              path: /health
            liveness:
              path: /health
            startup:
              path: /health
persistence:
  libraries:
    enabled: true
    mountPath: "/libraries"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: manyfold
      postgresqlDatabase: manyfold
  valkey:
    enabled: true
