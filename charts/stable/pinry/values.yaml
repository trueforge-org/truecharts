# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/getpinry/pinry
  tag: 2.1.15@sha256:7914a84adeb7875479b8bd2b7aba73bb99e5662bf06637209859793039d35569
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10213
        targetPort: 80
persistence:
  data:
    enabled: true
    mountPath: "/data"
    targetSelectAll: true

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
pinry:
  # Django secret key. MUST be changed, use a random string of at least 32 characters.
  secretKey: "PLACEHOLDERSECRETKEYXXXXXXXXXXXX"
workload:
  main:
    podSpec:
      initContainers:
        1-create-key-file:
          type: install
          enabled: true
          imageSelector: "image"
          env:
            SECRET_KEY:
              secretKeyRef:
                name: secrets
                key: SECRET_KEY
          command:
            - sh
            - -c
          args:
            - |
              keyfile="/data/production_secret_key.txt";
              if [ ! -f ${keyfile} ]; then
                echo "No ${keyfile} File...";
                echo "Creating ${keyfile} file...";
                echo "${SECRET_KEY}" > ${keyfile};
                if [ -f ${keyfile} ];
                then
                  echo "Success!";
                else
                  echo "Failed.";
                fi;
              else
                echo "${keyfile} File exists. Skipping...";
              fi;
      containers:
        main:
          env:
            SECRET_KEY:
              secretKeyRef:
                name: secrets
                key: SECRET_KEY
