# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/pepperlabs/peppermint
  pullPolicy: IfNotPresent
  tag: latest@sha256:d13932713561c8d69baea49820ba2d42ea145b28193b6a7e33950a05812406fd

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0

service:
  main:
    ports:
      main:
        protocol: http
        targetPort: 3000
        port: 10699
  api:
    enabled: true
    type: ClusterIP
    ports:
      api:
        enabled: true
        protocol: http
        port: 5003

peppermint:
  # Application secret. MUST be changed, use a random string of at least 64 characters.
  secretKey: "PLACEHOLDERSECRETKEYXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DB_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            SECRET:
              secretKeyRef:
                name: peppermint-secrets
                key: SECRET
            API_URL: '{{ printf "http://%v:%v" (include "tc.v1.common.lib.chart.names.fullname" $) .Values.service.api.ports.api.port }}'

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: peppermint
      postgresqlDatabase: peppermint
