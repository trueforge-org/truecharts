# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/mtlynch/picoshare
  tag: v1.5.5@sha256:4f4bd8e09aaa4649ec7904e12a395ae437e4aad3b20fba9c53be387d34cd779f
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10209
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            # web admin password
            PS_SHARED_SECRET:
              secretKeyRef:
                name: env-secrets
                key: PS_SHARED_SECRET
            # optional
            LITESTREAM_BUCKET: ""
            LITESTREAM_ENDPOINT: ""
            LITESTREAM_ACCESS_KEY_ID:
              secretKeyRef:
                name: env-secrets
                key: LITESTREAM_ACCESS_KEY_ID
            LITESTREAM_SECRET_ACCESS_KEY:
              secretKeyRef:
                name: env-secrets
                key: LITESTREAM_SECRET_ACCESS_KEY
            LITESTREAM_RETENTION: 72h
persistence:
  data:
    enabled: true
    mountPath: "/data"

secret:
  env-secrets:
    enabled: true
    data:
      PS_SHARED_SECRET: "somesecretcode"
      LITESTREAM_ACCESS_KEY_ID: ""
      LITESTREAM_SECRET_ACCESS_KEY: ""
