# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/rickdb/plexanisync
  pullPolicy: IfNotPresent
  tag: 1.4.4@sha256:c42034ced809b3a2a9b74139b1a3f5dade31af4d18a413b6f49da37b55ab9f18
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
plexanisync:
  interval: 3600
  plex:
    anime_section: []
    # - section1
    # - section2
    # direct | myplex
    plex_auth_method: direct
    # myplex
    myplex_server: ""
    myplex_user: ""
    myplex_token: ""
    # direct
    plex_url: ""
    plex_token: ""
    # Home user sync
    home_user_sync: false
    home_username: ""
    home_server_url: ""
  anilist:
    ani_username: ""
    ani_token: ""
    plex_ep_count_priority: false
    skip_list_update: false
    log_failed_matches: false
custom_mappings: []
# remote_urls:
#   - https://blabal
# entries:
#   - title: title
#     seasons:
#       - season: 1
#         anilist_id: 2345
#     synonyms:
#       - asfdasd

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          envFrom:
            - configMapRef:
                name: config
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
persistence:
  settings:
    enabled: true
    type: secret
    readOnly: true
    defaultMode: "0600"
    objectName: secret
    mountPath: /plexanisync/settings.ini
    subPath: settings.ini
  custommappings:
    enabled: '{{ ternary "true" "false" (not (empty .Values.custom_mappings)) }}'
    type: secret
    readOnly: true
    defaultMode: "0600"
    objectName: secret
    mountPath: /plexanisync/custom_mappings.yaml
    subPath: custom_mappings.yaml
configmap:
  config:
    enabled: true
    data:
      SETTINGS_FILE: '{{ .Values.persistence.settings.mountPath }}'
      INTERVAL: '{{ .Values.plexanisync.interval }}'
secret:
  secret:
    enabled: true
    data:
      settings.ini: |
        [PLEX]
        anime_section = {{ join "|" .Values.plexanisync.plex.anime_section }}

        authentication_method = {{ .Values.plexanisync.plex.plex_auth_method }}

        {{- if eq .Values.plexanisync.plex.plex_auth_method "direct" }}
        base_url = {{ .Values.plexanisync.plex.plex_url }}
        token = {{ .Values.plexanisync.plex.plex_token }}
        {{- end }}

        {{- if eq .Values.plexanisync.plex.plex_auth_method "myplex" }}
        server = {{ .Values.plexanisync.plex.myplex_server_name }}
        myplex_user = {{ .Values.plexanisync.plex.myplex_user }}
        myplex_token = {{ .Values.plexanisync.plex.myplex_token }}
        {{- end }}

        home_user_sync = {{ ternary "True" "False" .Values.plexanisync.plex.home_user_sync }}
        {{- if .Values.plexanisync.plex.home_user_sync }}
        home_username = {{ .Values.plexanisync.plex.home_username }}
        home_server_base_url = {{ .Values.plexanisync.plex.home_server_url }}
        {{- end }}

        [ANILIST]
        access_token = {{ .Values.plexanisync.anilist.ani_token }}
        plex_episode_count_priority = {{ ternary "True" "False" .Values.plexanisync.anilist.plex_ep_count_priority }}
        skip_list_update = {{ ternary "True" "False" .Values.plexanisync.anilist.skip_list_update }}
        username = {{ .Values.plexanisync.anilist.ani_username }}
        log_failed_matches = {{ ternary "True" "False" .Values.plexanisync.anilist.log_failed_matches }}

      custom_mappings.yaml: |-
        # https://github.com/RickDB/PlexAniSync/blob/master/custom_mappings.yaml.example
        {{- with .Values.custom_mappings }}
        {{- with .remote_urls }}
        remote-urls:
          {{- range $url := . }}
          - {{ . | quote }}
          {{- end }}
        {{- end -}}

        {{- with .entries }}
        entries:
          {{- range $entry := . }}
          - title: {{ $entry.title | quote }}
            {{- with $entry.seasons }}
            seasons:
              {{- range $season_entry := . }}
              - season: {{ $season_entry.season }}
                anilist-id: {{ $season_entry.anilist_id }}
              {{- end }}
            {{- end -}}
            {{- with $entry.synonyms }}
            synonyms:
              {{- range $synonym := . }}
              - {{ . | quote }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end -}}
        {{- end }}
