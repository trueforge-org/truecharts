# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/linuxserver/projectsend
  pullPolicy: IfNotPresent
  tag: latest@sha256:3ca77c223fb2f8ea09e571700bcd454e7648ed652f2d94edf42bbde18f245e40
securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        targetPort: 80
        port: 10127
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              type: tcp
            readiness:
              type: tcp
            startup:
              type: tcp
          env:
            MAX_UPLOAD: 5000
            PHP_MEMORY_LIMIT: "512M"
            PHP_MAX_FILE_UPLOAD: 200
persistence:
  config:
    enabled: true
    mountPath: "/config"
  projectsend-config:
    enabled: true
    type: configmap
    objectName: projectsend-config
    mountPath: /config/projectsend/sys.config.php
    subPath: sys.config.php
    readOnly: true
  data:
    enabled: true
    mountPath: "/data"
  varrun:
    enabled: true
mariadb:
  enabled: true
  mariadbUsername: projectsend
  mariadbDatabase: projectsend
configmap:
  projectsend-config:
    enabled: true
    data:
      sys.config.php: |-
        <?php
         define('DB_DRIVER', 'mysql');

         define('DB_NAME', "{{ .Values.mariadb.mariadbDatabase }}");
         define('DB_HOST', "{{ .Values.mariadb.creds.plainhost | trimAll "\"" }}");
         define('DB_USER', "{{ .Values.mariadb.mariadbUsername }}");

         define('DB_PASSWORD', "{{ .Values.mariadb.creds.mariadbPassword | trimAll "\"" }}");
         define('TABLES_PREFIX', 'tbl_');

         define('SITE_LANG','en');
         define('MAX_FILESIZE',2048);
         define('EMAIL_ENCODING', 'utf-8');
         define('DEBUG', false);
