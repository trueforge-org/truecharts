# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/joplin/server
  tag: 3.7.6@sha256:1cd9097ec3f788ba9813b7907dd8d525c834b93c725da1add189bfd08f746cf0
  pullPolicy: IfNotPresent
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/api/ping"
              port: "{{ .Values.service.main.ports.main.port }}"
              httpHeaders:
                Host: '{{ tpl .Values.workload.main.podSpec.containers.main.env.APP_BASE_URL $ | replace "https://" "" | replace "http://" "" }}'
            readiness:
              path: "/api/ping"
              port: "{{ .Values.service.main.ports.main.port }}"
              httpHeaders:
                Host: '{{ tpl .Values.workload.main.podSpec.containers.main.env.APP_BASE_URL $ | replace "https://" "" | replace "http://" "" }}'
            startup:
              type: tcp
              port: "{{ .Values.service.main.ports.main.port }}"
          env:
            APP_BASE_URL: ""
            APP_PORT: "{{ .Values.service.main.ports.main.port }}"
            DB_CLIENT: "pg"
            POSTGRES_DATABASE: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            POSTGRES_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            POSTGRES_PORT: "5432"
            POSTGRES_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            POSTGRES_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            MAILER_ENABLED: 0
            MAILER_HOST: ""
            MAILER_PORT: 465
            MAILER_SECURITY: tls
            MAILER_AUTH_USER: ""
            MAILER_AUTH_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: MAILER_AUTH_PASSWORD
            MAILER_NOREPLY_NAME: ""
            MAILER_NOREPLY_EMAIL: ""
service:
  main:
    ports:
      main:
        port: 22300
persistence:
  config:
    enabled: true
    mountPath: "/config"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: joplin
      postgresqlDatabase: joplin
secret:
  env-secrets:
    enabled: true
    data:
      MAILER_AUTH_PASSWORD: ""
