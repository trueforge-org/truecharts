# yaml-language-server: $schema=./values.schema.json
image:
  pullPolicy: IfNotPresent
  repository: docker.io/library/phpmyadmin
  tag: 5.2.3@sha256:64293e1f91d6509e9530d51059b1d45a31d3e4b38ead27cc9648b915b061ba2c

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsUser: 0
service:
  main:
    ports:
      main:
        port: 8080
        protocol: http
        targetPort: 80
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            MYSQL_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: MYSQL_PASSWORD
            MYSQL_USER: root
            PMA_HOST: 192.168.70.99
            PMA_PORT: "3306"

secret:
  env-secrets:
    enabled: true
    data:
      MYSQL_PASSWORD: 'root'
