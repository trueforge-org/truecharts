image:
  repository: oci.trueforge.org/containerforge/deluge
  pullPolicy: IfNotPresent
  tag: "2.2.0"
service:
  main:
    ports:
      main:
        port: 58846
        targetPort: 58846
  rpc:
    enabled: true
    ports:
      rpc:
        enabled: true
        port: 58846
        targetPort: 58846
  torrent:
    enabled: true
    ports:
      tcp:
        enabled: true
        port: 6881
        targetPort: 6881
      udp:
        enabled: true
        port: "{{ .Values.service.torrent.ports.tcp.port }}"
        targetPort: "{{ .Values.service.torrent.ports.tcp.targetPort }}"
        protocol: udp
persistence:
  config:
    enabled: true
    mountPath: /config
