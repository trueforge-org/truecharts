# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/sismics/docs
  tag: v1.12@sha256:29ce750d44fd7de8ab995d77aa2bb50978f4ba0862e6aa827bf67517d8758c7b
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        port: 10100
        targetPort: 8080
persistence:
  data:
    enabled: true
    mountPath: "/data"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: teedyuser
      postgresqlDatabase: teedydb

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DOCS_DEFAULT_LANGUAGE: "eng"
            DOCS_BASE_URL: ""
            DOCS_SMTP_HOSTNAME: ""
            DOCS_SMTP_PORT: 0
            DATABASE_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DATABASE_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DATABASE_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: jdbc
            DOCS_ADMIN_EMAIL_INIT: ""
            DOCS_ADMIN_PASSWORD_INIT:
              secretKeyRef:
                name: env-secrets
                key: DOCS_ADMIN_PASSWORD_INIT
            DOCS_SMTP_USERNAME: ""
            DOCS_SMTP_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: DOCS_SMTP_PASSWORD

secret:
  env-secrets:
    enabled: true
    data:
      DOCS_ADMIN_PASSWORD_INIT: ""
      DOCS_SMTP_PASSWORD: ""
