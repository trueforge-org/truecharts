# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/0xerr0r/blocky
  tag: v0.36.0@sha256:191c0f1e688aa37698297ef4059e11a2b080299a878f5b31d6d32ace9d0c54b2
  pullPolicy: IfNotPresent
k8sgatewayImage:
  repository: ghcr.io/k8s-gateway/k8s_gateway
  pullPolicy: IfNotPresent
  tag: 1.8.2@sha256:e7d334bc486fc78e2f2366da2029b7308240d500330e85d2367d4d9cc46a5e52

workload:
  main:
    replicas: 2
    strategy: RollingUpdate
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false
              type: exec
              command:
                - /app/blocky
                - healthcheck
            readiness:
              enabled: false
              type: exec
              command:
                - /app/blocky
                - healthcheck
            startup:
              enabled: false
              type: exec
              command:
                - /app/blocky
                - healthcheck
# -- Blocky Config File content
blockyConfig: {}
# upstream:
#   default:
#     - 1.1.1.1

# -- some general blocky settings
blocky:
  # -- Enable prometheus annotations
  enablePrometheus: true
service:
  main:
    enabled: true
    ports:
      main:
        enabled: true
        port: 4000
        protocol: http
        targetPort: 4000
  dns:
    enabled: true
    ports:
      dns:
        enabled: true
        port: 53
        protocol: udp
        targetPort: 53
      dnstcp:
        enabled: true
        protocol: tcp
        port: "{{ .Values.service.dns.ports.dns.port }}"
        targetPort: 53
  dot:
    enabled: true
    ports:
      dot:
        enabled: true
        port: 853
        protocol: tcp
        targetPort: 853
  https:
    enabled: true
    ports:
      https:
        enabled: true
        port: 4443
        protocol: https
        targetPort: 4443
  k8sgateway:
    enabled: true
    ports:
      k8sgateway:
        enabled: true
        port: 5353
        protocol: udp
        targetPort: 5353

# -- Path to cert and key file for SSL encryption. If not set, self-signed certificate will be generated
certFile: ""
keyFile: ""

# -- logging configuration
# Log level (one from trace, debug, info, warn, error)
logLevel: info
# Log format (text or json)
logFormat: text
# log timestamps (true or false)
logTimestamp: true
# Obfuscate log output (replace all alphanumeric characters with *) for user sensitive data like request domains or responses to increase privacy. (true or false)
logPrivacy: false

# -- Mininal TLS version that the DoH and DoT server will use
minTlsServeVersion: 1.2

# -- set the default DNS upstream servers
defaultUpstreams:
  # Cloudflare
  - 1.1.1.1
  - 1.0.0.1
  # Google
  - 8.8.8.8
  - 8.8.4.4
  # Quad9
  - 9.9.9.9
  - 149.112.112.112
  # OpenDNS
  - 208.67.222.222
  - 208.67.220.220
  # ComodoSecure DNS
  - 8.26.56.26
  - 8.20.247.20

# -- set additional upstreams
upstreams:
#  - name: group2
#    dnsservers:
#      - 1.1.1.1

# -- optional: timeout to query the upstream resolver. Default: 1s
upstreamTimeout: 1s

# -- set bootstrap dns (not needed)
# Ensures bootstrap encryption and ensure it doesn't use k8s dns
# When using an upstream specified by IP, and not by hostname, you can write only the upstream and skip ips.
bootstrapDns:
  # -- Upstream
  upstream: ""
  # -- IP's linked to upstream DoT/DoH DNS name
  ips: []
# -- set additional bootstrap dns (not needed, only used if bootstrapDns is set)
additionalBootstrapDns: []
# - upstream: ""
#   ips: []

# -- Return empty answer for these queries
filtering:
  # -- Ensures filtering by query type
  queryTypes: []

# -- Set manual custom DNS resolution
customDNS:
  customTTL: 1h
  filterUnmappedTypes: true
  rewrite: []
  # - in: something.com
  #   out: somethingelse.com
  mapping: []
  # - domain: something.com
  #   dnsserver: 192.168.178.1

# -- Setup client-name lookup
clientLookup:
  # -- upstream used for client-name lookup
  upstream: ""
  singleNameOrder: []
  clients:
  # - domain: laptop
  #   ips: []

# -- Configuration for caching of DNS responsesg
caching:
  minTime: 15m
  maxTime: 0m
  maxItemsCount: 0
  prefetching: true
  prefetchExpires: 12h
  prefetchThreshold: 5
  prefetchMaxItemsCount: 0
  cacheTimeNegative: 30m

# -- set conditional settings
conditional:
  fallbackUpstream: false
  rewrite: []
  # - in: something.com
  #   out: somethingelse.com
  mapping: []
  # - domain: something.com
  #   dnsserver: 192.168.178.1

# -- set blocking settings using Lists
blocking:
  # -- Sets the blocktype
  blockType: nxDomain
  # -- Sets the block ttl
  blockTTL: 6h
  # -- Sets the block refreshPeriod
  refreshPeriod: 4h
  # -- Sets the block download timeout
  downloadTimeout: 60s
  # -- timeout for list write to disk (each url)
  writeTimeout: 60s
  # -- timeout for reading the download (each url).
  readTimeout: 60s
  # -- timeout for reading request headers for the download (each url)
  readHeaderTimeout: 60s
  # -- Sets the block download attempt count
  downloadAttempts: 3
  # -- Sets the block download cooldown
  downloadCooldown: 5s
  # -- Sets how many list-groups can be processed at the same time
  processingConcurrency: 8
  # -- Set the start strategy (blocking | failOnError | fast)
  startStrategy: fast
  # -- Number of errors allowed in a list before it is considered invalid
  maxErrorsPerSource: 5

  # --  Add blocky whitelists
  # `default` name is reservered for TrueCharts included default whitelist
  # example shows the structure, though name should be changed when used
  whitelist:
    []
    # - name: default
    #  lists:
    #   - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/optional-list.txt
    #   - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
    #   - https://raw.githubusercontent.com/rahilpathan/pihole-whitelist/main/1.LowWL.txt

  # -- Blocky blacklists
  # `default` name is reservered for TrueCharts included default blacklist
  # example shows the structure, though name should be changed when used
  blacklist:
    []
    # - name: default
    #  lists:
    #   - https://big.oisd.nl/domainswild

  # -- Blocky clientGroupsBlock
  clientGroupsBlock:
    - name: default
      groups:
        - default
        - default-ads
        - default-tracking
        - default-malicious
        - default-suspicious

# -- configure using hostsfile for lookups
# Allows for using the hosts configured in kubernetes and such
hostsFile:
  enabled: false
  sources:
    - /etc/hosts
    - https://example.com/hosts
    - |
      # inline hosts
      127.0.0.1 example.com
  hostsTTL: 1h
  filterLoopback: falsr
  loading:
    refreshPeriod: 4h
    downloads:
      timeout: 5s
      attempts: 3
      cooldown: 500ms
    concurrency: 4
    strategy: blocking
    maxErrorsPerSource: 5

podOptions:
  automountServiceAccountToken: true

serviceAccount:
  main:
    # -- Specifies whether a service account should be created
    enabled: true
    primary: true

# -- Create a ClusterRole and ClusterRoleBinding
# used by k8sgateway
rbac:
  main:
    # -- Enables or disables the ClusterRole and ClusterRoleBinding
    enabled: true
    primary: true
    clusterWide: true
    # -- Set Rules on the ClusterRole
    rules:
      # General CRDs
      - apiGroups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - watch
      # Ingress
      - apiGroups:
          - extensions
          - networking.k8s.io
        resources:
          - ingresses
        verbs:
          - list
          - watch
      # Service
      - apiGroups:
          - ""
        resources:
          - services
          - namespaces
        verbs:
          - list
          - watch
      # HTTPRoute, TLSRoute, GRPCRoute
      - apiGroups:
          - gateway.networking.k8s.io
        resources:
          - "*"
        verbs:
          - watch
          - list
      # DNSEndpoint
      - apiGroups:
          - externaldns.k8s.io
        resources:
          - dnsendpoints
        verbs:
          - get
          - watch
          - list
      - apiGroups:
          - externaldns.k8s.io
        resources:
          - dnsendpoints/status
        verbs:
          - "*"

k8sgateway:
  enabled: true
  # -- TTL for non-apex responses (in seconds)
  ttl: 300
  # -- Limit what kind of resources to watch, e.g. watchedResources: [ Ingress | Service | HTTPRoute | TLSRoute | GRPCRoute | DNSEndpoint ]
  watchedResources:
    - Ingress
    - Service
    - HTTPRoute
  # -- Service name of a secondary DNS server (should be `serviceName.namespace`)
  secondary: ""
  # -- Override the default `serviceName.namespace` domain apex
  apex: ""
  # -- list of processed domains
  domains: []
  # -- Delegated domain
  # - domain: "example.com"
  #   # -- Optional configuration option for DNS01 challenge that will redirect all acme
  #   # challenge requests to external cloud domain (e.g. managed by cert-manager)
  #   # See: https://cert-manager.io/docs/configuration/acme/dns01/
  #   dnsChallenge:
  #     enabled: false
  #     domain: dns01.clouddns.com
  forward:
    enabled: false
    primary: tls://1.1.1.1
    secondary: tls://1.0.0.1
    options:
      - name: tls_servername
        value: cloudflare-dns.com

configmap:
  config:
    enabled: true
    data:
      config.yml: |
        {{- define "blocky.config" }}
        redis:
          address: {{ printf "%v-%v" .Release.Name "redis" }}:6379
          password: {{ .Values.redis.creds.redisPassword | trimAll "\"" }}
          database: 0
          required: true
          connectionAttempts: 10
          connectionCooldown: 3s

        prometheus:
          enable: true
          path: /metrics

        queryLog:
          # optional one of: postgresql, csv, csv-client. If empty, log to console
          type: {{ .Values.queryLog.type }}
          # directory (should be mounted as volume in docker) for csv, db connection string for mysql/postgresql
          #postgresql target: postgres://user:password@db_host_or_ip:5432/db_name
          {{- if eq .Values.queryLog.type "postgresql" }}
          target: {{ .Values.cnpg.main.creds.std }}
          {{- else }}
          target: {{ .Values.queryLog.target }}
          {{- end }}
          # if > 0, deletes log files which are older than ... days
          logRetentionDays: {{ .Values.queryLog.logRetentionDays | default 0 }}
          # optional: Max attempts to create specific query log writer
          creationAttempts: {{ .Values.queryLog.creationAttempts | default 3 }}
          # optional: Time between the creation attempts
          creationCooldown: {{ .Values.queryLog.creationCooldown | default "2s" }}

        upstreams:
          groups:
            default:
        {{- .Values.defaultUpstreams | toYaml | nindent 12 }}
        {{- range $id, $value := .Values.upstreams }}
            {{ $value.name }}:
        {{- $value.dnsservers | toYaml | nindent 12 }}
        {{- end }}
          timeout: {{ .Values.upstreamTimeout | default "1s" }}

        ports:
          {{- if .Values.service.dns.enabled }}
          dns: {{ .Values.service.dns.ports.dns.targetPort }}
          {{- end }}
          {{- if .Values.service.dot.enabled }}
          tls: {{ .Values.service.dot.ports.dot.targetPort }}
          {{- end }}
          {{- if .Values.service.main.enabled }}
          http: {{ .Values.service.main.ports.main.targetPort }}
          {{- end }}
          {{- if .Values.service.https.enabled }}
          https: {{ .Values.service.https.ports.https.targetPort }}
          {{- end }}

        {{- if .Values.certFile }}
        certFile: {{ .Values.certFile }}
        {{- end }}
        {{- if .Values.keyFile }}
        keyFile: {{ .Values.keyFile }}
        {{- end }}

        log:
          {{- if .Values.logLevel }}
          level: {{ .Values.logLevel }}
          {{- end }}
          {{- if .Values.logFormat }}
          format: {{ .Values.logFormat }}
          {{- end }}
          {{- if .Values.logTimestamp }}
          timestamp: {{ .Values.logTimestamp }}
          {{- end }}
          {{- if .Values.logPrivacy }}
          privacy: {{ .Values.logPrivacy }}
          {{- end }}

        {{- if .Values.minTlsServeVersion }}
        minTlsServeVersion: {{ .Values.minTlsServeVersion }}
        {{- end }}

        caching:
        {{- toYaml .Values.caching | nindent 4 }}

        {{- if .Values.hostsFile.enabled }}
        {{ $hostsfile := omit .Values.hostsFile "enabled" }}
        hostsFile:
        {{- toYaml $hostsfile | nindent 4 }}
        {{- end }}

        {{- if or .Values.bootstrapDns.upstream .Values.bootstrapDns.ips }}
        bootstrapDns:
          {{- if .Values.bootstrapDns.upstream }}
          - upstream: {{ .Values.bootstrapDns.upstream }}
          {{- end }}
          {{- if .Values.bootstrapDns.ips }}
            ips:
            {{- range $id, $value := .Values.bootstrapDns.ips }}
              - {{ $value }}
            {{- end }}
          {{- end }}
          {{/* Add additional Bootstrap DNS */}}
          {{- range .Values.additionalBootstrapDns }}
          {{- with .upstream }}
          - upstream: {{ . }}
          {{- end }}
          {{- if .ips }}
            ips:
            {{- range $id, $value := .ips }}
              - {{ $value }}
            {{- end }}
          {{- end }}
          {{- end }}
        {{- end }}

        {{- if .Values.filtering.queryTypes }}
        filtering:
          queryTypes:
          {{- range .Values.filtering.queryTypes }}
            - {{ . }}
          {{- end }}
        {{- end }}

        {{- if or .Values.customDNS.filterUnmappedTypes .Values.customDNS.customTTL .Values.customDNS.rewrite .Values.customDNS.mapping }}
        customDNS:
        {{- if .Values.customDNS.customTTL }}
          customTTL: {{ .Values.customDNS.customTTL }}
        {{- end }}
        {{- if .Values.customDNS.filterUnmappedTypes }}
          filterUnmappedTypes: {{ .Values.customDNS.filterUnmappedTypes }}
        {{- end }}
        {{- if .Values.customDNS.rewrite }}
          rewrite:
        {{- range $id, $value := .Values.customDNS.rewrite }}
            {{ $value.in }}: {{ $value.out }}
        {{- end }}
        {{- end }}
        {{- if .Values.customDNS.mapping }}
          mapping:
        {{- range $id, $value := .Values.customDNS.mapping }}
            {{ $value.domain }}: {{ $value.dnsserver }}
        {{- end }}
        {{- end }}
        {{- end }}

        {{- if or .Values.clientLookup.upstream .Values.clientLookup.ips }}
        clientLookup:
        {{- if .Values.clientLookup.upstream }}
          upstream: {{ .Values.clientLookup.upstream }}
        {{- end }}
        {{- if .Values.clientLookup.ips }}
          singleNameOrder:
        {{- range $id, $value := .Values.clientLookup.ips }}
            - {{ $value }}
        {{- end }}
        {{- end }}
        {{- if .Values.clientLookup.clients }}
          clients:
        {{- range $id, $value := .Values.clientLookup.clients }}
            {{ $value.domain }}:
              {{- range $id, $value := .ips }}
              - {{ $value }}
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}

        {{- if or .Values.conditional.rewrite .Values.conditional.mapping ( and .Values.k8sgateway.enabled .Values.k8sgateway.domains ) }}
        conditional:
        {{- if .Values.conditional.fallbackUpstream }}
          fallbackUpstream: {{ .Values.conditional.fallbackUpstream }}
        {{- end }}
        {{- if .Values.conditional.rewrite }}
          rewrite:
        {{- range $id, $value := .Values.conditional.rewrite }}
            {{ $value.in }}: {{ $value.out }}
        {{- end }}
        {{- end }}
        {{- if or .Values.conditional.mapping ( and .Values.k8sgateway.enabled .Values.k8sgateway.domains ) }}
          mapping:
        {{- if and .Values.k8sgateway.enabled .Values.k8sgateway.domains }}
        {{- range $id, $value := .Values.k8sgateway.domains }}
            {{ .domain }}: 127.0.0.1:{{ $.Values.service.k8sgateway.ports.k8sgateway.targetPort }}
        {{- end }}
        {{- end }}
        {{- range $id, $value := .Values.conditional.mapping }}
            {{ $value.domain }}: {{ $value.dnsserver }}
        {{- end }}
        {{- end }}
        {{- end }}

        blocking:
          blockType: {{ .Values.blocking.blockType }}
          blockTTL: {{ .Values.blocking.blockTTL }}
          loading:
            refreshPeriod: {{ .Values.blocking.refreshPeriod }}
            downloads:
              timeout: {{ .Values.blocking.downloadTimeout }}
              writeTimeout: {{ .Values.blocking.writeTimeout }}
              readTimeout: {{ .Values.blocking.readTimeout }}
              readHeaderTimeout: {{ .Values.blocking.readHeaderTimeout }}
              attempts: {{ .Values.blocking.downloadAttempts }}
              cooldown: {{ .Values.blocking.downloadCooldown }}
            concurrency: {{ .Values.blocking.processingConcurrency }}
            strategy: {{ .Values.blocking.startStrategy }}
            maxErrorsPerSource: {{ .Values.blocking.maxErrorsPerSource }}

          allowlists:
            default:
              - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/optional-list.txt
              - https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt
              - https://raw.githubusercontent.com/rahilpathan/pihole-whitelist/main/1.LowWL.txt
        {{- range $id, $value := .Values.blocking.whitelist }}
            {{ $value.name }}:
        {{- $value.lists | toYaml | nindent 12 }}
        {{- end }}

          denylists:
            default:
              - https://big.oisd.nl/domainswild
              - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
            default-ads:
              - https://adaway.org/hosts.txt
              - https://v.firebog.net/hosts/AdguardDNS.txt
              - https://v.firebog.net/hosts/Admiral.txt
              - https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt
              - https://v.firebog.net/hosts/Easylist.txt
              - https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext
              - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/UncheckyAds/hosts
              - https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts
            default-tracking:
              - https://v.firebog.net/hosts/Easyprivacy.txt
              - https://v.firebog.net/hosts/Prigent-Ads.txt
              - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.2o7Net/hosts
              - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
              - https://hostfiles.frogeye.fr/firstparty-trackers-hosts.txt
            default-malicious:
              - https://raw.githubusercontent.com/DandelionSprout/adfilt/master/Alternate%20versions%20Anti-Malware%20List/AntiMalwareHosts.txt
              - https://v.firebog.net/hosts/Prigent-Crypto.txt
              - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Risk/hosts
              - https://bitbucket.org/ethanr/dns-blacklists/raw/8575c9f96e5b4a1308f2f12394abd86d0927a4a0/bad_lists/Mandiant_APT1_Report_Appendix_D.txt
              - https://phishing.army/download/phishing_army_blocklist_extended.txt
              - https://gitlab.com/quidsup/notrack-blocklists/raw/master/notrack-malware.txt
              - https://v.firebog.net/hosts/Prigent-Malware.txt
              # - https://v.firebog.net/hosts/RPiList-Malware.txt (see: https://github.com/0xERR0R/blocky/issues/1718 )
              # - https://v.firebog.net/hosts/RPiList-Phishing.txt (see: https://github.com/0xERR0R/blocky/issues/1718 )
              - https://raw.githubusercontent.com/Spam404/lists/master/main-blacklist.txt
              - https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/generated/hosts
              - https://netapi.com/api2/?method=compromised&dataset_type=url&format=hosts
              # - https://urlhaus.abuse.ch/downloads/hostfile/ (abuse.ch retired the keyless downloads, answers 410 since 2026-10-21)
              # - https://lists.cyberhost.uk/malware.txt (see: https://github.com/0xERR0R/blocky/issues/950)
            default-suspicious:
              - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
              - https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Spam/hosts
              - https://v.firebog.net/hosts/static/w3kbl.txt

        {{- range $id, $value := .Values.blocking.blacklist }}
            {{ $value.name }}:
        {{- $value.lists | toYaml | nindent 12 }}
        {{- end }}

        {{- if .Values.blocking.clientGroupsBlock }}
          clientGroupsBlock:
        {{- range $id, $value := .Values.blocking.clientGroupsBlock }}
            {{ $value.name }}:
        {{- $value.groups | toYaml | nindent 12 }}
        {{- end }}
        {{- end }}

        {{- end }}
        {{- $config := mustMerge ( include "blocky.config" . | fromYaml ) ( .Values.blockyConfig ) }}
        {{- $config | toYaml | nindent 2 }}
  corefile:
    enabled: true
    data:
      Corefile: |
        {{ $values := .Values.k8sgateway -}}
        {{- $fqdn := ( include "tc.v1.common.lib.chart.names.fqdn" . ) -}}
        .:{{ .Values.service.k8sgateway.ports.k8sgateway.targetPort }} {
            errors
            log
            health {
                lameduck 5s
            }
            ready
            {{- range .Values.k8sgateway.domains }}
            {{- if .dnsChallenge.enabled }}
              {{- if not .dnsChallenge.domain -}}
                {{- fail "DNS01 challenge domain is mandatory" -}}
              {{- end }}

            template IN ANY {{ required "Delegated domain ('domain') is mandatory" .domain }} {
               match "_acme-challenge[.](.*)[.]{{ if .dnsChallenge.domain }}{{ .dnsChallenge.domain | replace "." "[.]" }}{{ else }}unset{{ end }}"
               answer "{{ "{{ .Name }}" }} 5 IN CNAME {{ "{{ index .Match 1 }}" }}.{{ .dnsChallenge.domain }}"
               fallthrough
            }
            {{- end }}
            {{- end }}
            k8s_gateway {{ range .Values.k8sgateway.domains }}"{{ required "Delegated domain ('domain') is mandatory " .domain }}"{{ end }} {
              apex {{ $values.apex | default $fqdn }}
              ttl {{ $values.ttl }}
              {{- if $values.secondary }}
              secondary {{ $values.secondary }}
              {{- end }}
              {{- if $values.watchedResources }}
              resources {{ join " " $values.watchedResources }}
              {{- end }}
              fallthrough
            }

            prometheus 0.0.0.0:9153
            {{- if .Values.k8sgateway.forward.enabled }}
            forward . {{ .Values.k8sgateway.forward.primary }} {{ .Values.k8sgateway.forward.secondary }} {
              {{- range .Values.k8sgateway.forward.options }}
              {{ .name }} {{ .value }}
              {{- end }}
            }
            {{- else }}
            forward . 1.1.1.1
            {{- end }}
            loop
            reload
            loadbalance
        }
  dashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"
    data:
      blocky.json: >-
        {{ .Files.Get "dashboard.json" | indent 8 }}
      blockypostgres.json: >-
        {{ .Files.Get "dashboardpsql.json" | indent 8 }}
  datasource:
    enabled: true
    labels:
      grafana_datasource: "1"
    data:
      datasourceblockypsql.yaml: |-
        apiVersion: 1
        datasources:
        - name: BlockyPostgres
          type: postgres
          uid: blockypostgres
          url: {{ printf "%s.%s:5432" (.Values.cnpg.main.creds.host | trimAll "\"") .Release.Namespace }}
          access: proxy
          user: {{ .Values.cnpg.main.user }}
          secureJsonData:
            password: {{ .Values.cnpg.main.creds.password | default "na" }}
          jsonData:
            database: {{ .Values.cnpg.main.database }}
            sslmode: 'disable' # disable/require/verify-ca/verify-full
            maxOpenConns: 100 # Grafana v5.4+
            maxIdleConns: 100 # Grafana v5.4+
            maxIdleConnsAuto: true # Grafana v9.5.1+
            connMaxLifetime: 14400 # Grafana v5.4+
            postgresVersion: 1500 # 903=9.3, 904=9.4, 905=9.5, 906=9.6, 1000=10
            timescaledb: false

persistence:
  tc-config:
    enabled: true
    type: configmap
    mountPath: /app/config.yml
    objectName: config
    readOnly: true
    subPath: config.yml
  config-volume:
    enabled: '{{ if and .Values.k8sgateway.enabled .Values.k8sgateway.domains }}true{{ else }}false{{ end }}'
    type: configmap
    objectName: corefile
    items:
      - key: Corefile
        path: Corefile
    targetSelector:
      main:
        k8sgateway:
          mountPath: "/etc/coredns"
          readOnly: true

metrics:
  main:
    # -- Enable and configure a Prometheus serviceMonitor for the chart under this key.
    # @default -- See values.yaml
    enabled: true
    type: "servicemonitor"
    endpoints:
      - port: main
        path: /metrics
    # -- Enable and configure Prometheus Rules for the chart under this key.
    # @default -- See values.yaml
    prometheusRule:
      enabled: false

redis:
  enabled: true

queryLog:
  # optional one of: mysql, postgresql, csv, csv-client. If empty, log to console
  type: "postgresql"
  # directory (should be mounted as volume in docker) for csv, db connection string for mysql, ignored for included postgresql
  # target: /var/log/something
  # postgresql target: postgres://user:password@db_host_or_ip:5432/db_name
  # if > 0, deletes log files which are older than ... days
  logRetentionDays: 0
  # optional: Max attempts to create specific query log writer, default: 3
  creationAttempts: 3
  # optional: Time between the creation attempts, default: 2s
  creationCooldown: 2s

cnpg:
  main:
    enabled: true
    user: blocky
    database: blocky
