# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/calibrain/shelfmark
  pullPolicy: IfNotPresent
  tag: v1.6.1@sha256:0e5c9ff5f858a9695dc18bc355d8aa29dfee5c0d9c634919484c2bab9955ad5a

service:
  main:
    ports:
      main:
        port: 8084
        protocol: http
        targetPort: 8084

persistence:
  config:
    enabled: true
    mountPath: /config

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            LOG_ROOT: /var/logs
          probes:
            liveness:
              type: http
              path: /api/health
            readiness:
              type: http
              path: /api/health
            startup:
              type: http
              path: /api/health
