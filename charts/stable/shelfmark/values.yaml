# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/calibrain/shelfmark
  pullPolicy: IfNotPresent
  tag: v1.7.2@sha256:c7d2e085e1828334653bee22fbcb2a8728bb2e2503a5c7d72601966c79510629

service:
  main:
    ports:
      main:
        port: 8084
        protocol: http
        targetPort: 8084

persistence:
  config:
    enabled: true
    mountPath: /config

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            LOG_ROOT: /var/logs
          probes:
            liveness:
              type: http
              path: /api/health
            readiness:
              type: http
              path: /api/health
            startup:
              type: http
              path: /api/health
