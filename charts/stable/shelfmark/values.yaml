# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/calibrain/shelfmark
  pullPolicy: IfNotPresent
  tag: v1.7.1@sha256:c5a0df5c859f5b2d8b77bcd13979c1d695599e8674c40c3cc1053e6133510fc5

service:
  main:
    ports:
      main:
        port: 8084
        protocol: http
        targetPort: 8084

persistence:
  config:
    enabled: true
    mountPath: /config

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            LOG_ROOT: /var/logs
          probes:
            liveness:
              type: http
              path: /api/health
            readiness:
              type: http
              path: /api/health
            startup:
              type: http
              path: /api/health
