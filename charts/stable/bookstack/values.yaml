# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/linuxserver/bookstack
  pullPolicy: IfNotPresent
  tag: 26.09.20260929@sha256:7a6779d345d4d678614aa1a0a8a4d8456aeb98de10dfae700b839c3140c89f39
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        port: 10112
        protocol: http
        targetPort: 80
bookstack:
  # Must be changed. Laravel key: "base64:" followed by base64 of 32 random bytes.
  appKey: "base64:UExBQ0VIT0xERVJBUFBLRVlDSEFOR0VNRTAwMDAwMDA="

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            DB_USERNAME: "{{ .Values.dependencies.mariadb.depconfig.mariadbUsername }}"
            DB_DATABASE: "{{ .Values.dependencies.mariadb.depconfig.mariadbDatabase }}"
            APP_URL: ""
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                key: plainhost
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "mariadbcreds" }}'
                key: mariadb-password
            APP_KEY:
              secretKeyRef:
                name: secrets
                key: APP_KEY
persistence:
  config:
    enabled: true
    mountPath: /config
dependencies:
  mariadb:
    enabled: true
    depconfig:
      mariadbUsername: bookstack
      mariadbDatabase: bookstack
