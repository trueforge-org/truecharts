# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/diygod/rsshub
  pullPolicy: IfNotPresent
  tag: latest@sha256:3a207d5a1eb1597c908f0858ca6d4794d9773605e2d259c736d160b784704797
browserlessImage:
  repository: docker.io/browserless/chrome
  tag: 1.61.1-chrome-stable@sha256:efac47cfff3830d9a50b27d29f8bbb61949058ae336c823fbe9bd3c0d1debcc8
service:
  main:
    ports:
      main:
        port: 10191
# Enabled redis
redis:
  enabled: true
  redisUsername: default
additionalContainers:
  browserless:
    name: browserless
    image: "{{ .Values.browserlessImage.repository }}:{{ .Values.browserlessImage.tag }}"
    ports:
      - containerPort: 3000
        name: main

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            NODE_ENV: production
            CACHE_TYPE: "redis"
            PUPPETEER_WS_ENDPOINT: "ws://localhost:3000"
            NODE_NAME: "{{ .Release.Name }}-{{ randAlphaNum 5 }}"
            # User  defined
            # ALLOW_ORIGIN: ""
            DISALLOW_ROBOT: false
            TITLE_LENGTH_LIMIT: 150
            REDIS_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "rediscreds" }}'
                key: url
            HTTP_BASIC_AUTH_NAME: ""
            HTTP_BASIC_AUTH_PASS:
              secretKeyRef:
                name: env-secrets
                key: HTTP_BASIC_AUTH_PASS
            BITBUCKET_USERNAME: ""
            BITBUCKET_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: BITBUCKET_PASSWORD
            GITHUB_ACCESS_TOKEN:
              secretKeyRef:
                name: env-secrets
                key: GITHUB_ACCESS_TOKEN
            GOOGLE_FONTS_API_KEY:
              secretKeyRef:
                name: env-secrets
                key: GOOGLE_FONTS_API_KEY
            YOUTUBE_KEY: ""
            TELEGRAM_TOKEN:
              secretKeyRef:
                name: env-secrets
                key: TELEGRAM_TOKEN
            LASTFM_API_KEY:
              secretKeyRef:
                name: env-secrets
                key: LASTFM_API_KEY
updated: true

secret:
  env-secrets:
    enabled: true
    data:
      HTTP_BASIC_AUTH_PASS: ''
      BITBUCKET_PASSWORD: ''
      GITHUB_ACCESS_TOKEN: ''
      GOOGLE_FONTS_API_KEY: ''
      TELEGRAM_TOKEN: ''
      LASTFM_API_KEY: ''
