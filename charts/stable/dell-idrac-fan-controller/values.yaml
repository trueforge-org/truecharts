# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/tigerblue77/dell_idrac_fan_controller
  pullPolicy: IfNotPresent
  tag: latest@sha256:c5826605d1dae111a9ef3aa4d76e2f038da8906026ee7dfb3bb0e1fbd237d276
service:
  main:
    enabled: false
    ports:
      main:
        enabled: false
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          env:
            IDRAC_HOST: ""
            IDRAC_USERNAME: ""
            IDRAC_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: IDRAC_PASSWORD
            FAN_SPEED: 5
            CPU_TEMPERATURE_THRESHOLD: 50
            CHECK_INTERVAL: 60
            DISABLE_THIRD_PARTY_PCIE_CARD_DELL_DEFAULT_COOLING_RESPONSE: false
secret:
  env-secrets:
    enabled: true
    data:
      IDRAC_PASSWORD: ""
