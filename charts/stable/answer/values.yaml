# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/answerdev/answer
  pullPolicy: IfNotPresent
  tag: 1.2.0@sha256:2e93c6a664632c63864fd4af4c25ea3f9de7f305f833f0bbbad53d1c914a71e9

service:
  main:
    ports:
      main:
        protocol: http
        port: 9080
        targetPort: 80

answer:
  app:
    language: en-US
    # DEBUG | INFO | WARN | ERROR
    log_level: DEBUG
  site:
    name: Answer
    url: http://localhost:9080
    contact_email: contact@example.com
  admin:
    name: admin
    password: super-secret-password
    email: admin@example.com

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: /healthz
            readiness:
              path: /healthz
            startup:
              type: tcp
          env:
            AUTO_INSTALL: true
            # Don't change this, its only used for the initial install
            # Does not alter the port the app listens on
            INSTALL_PORT: 80
            DB_TYPE: postgres
            DB_USERNAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            # Host + port
            DB_HOST: '{{ printf "%s:5432" (.Values.dependencies.postgresql.depconfig.creds.plainhost | trimAll "\"") }}'
            DB_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            # App
            LANGUAGE: "{{ .Values.answer.app.language }}"
            LOG_LEVEL: "{{ .Values.answer.app.log_level }}"
            # Site
            SITE_NAME: "{{ .Values.answer.site.name }}"
            SITE_URL: "{{ .Values.answer.site.url }}"
            CONTACT_EMAIL: "{{ .Values.answer.site.contact_email }}"
            # Admin
            ADMIN_NAME: "{{ .Values.answer.admin.name }}"
            ADMIN_PASSWORD:
              secretKeyRef:
                name: env-secrets
                key: ADMIN_PASSWORD
            ADMIN_EMAIL: "{{ .Values.answer.admin.email }}"

persistence:
  data:
    enabled: true
    mountPath: /data

dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: answer
      postgresqlDatabase: answer

operator:
  verify:
    enabled: false

secret:
  env-secrets:
    enabled: true
    data:
      ADMIN_PASSWORD: "{{ .Values.answer.admin.password }}"
