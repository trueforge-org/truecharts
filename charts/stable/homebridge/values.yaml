# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/homebridge/homebridge
  tag: 2026-11-13@sha256:da79d66cca485e54acfc76a1ea2f170b7c4f3592d4c75b359e4e88e36f4df88b
  pullPolicy: IfNotPresent

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            HOMEBRIDGE_CONFIG_UI: 1

service:
  main:
    ports:
      main:
        protocol: http
        port: 8581

persistence:
  config:
    enabled: true
    mountPath: /homebridge
