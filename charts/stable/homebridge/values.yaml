# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/homebridge/homebridge
  tag: 2026-08-28@sha256:f53e581ff4314f500ab71f5cfd73045785e617b05e2e699eb4e4a492ed26c46e
  pullPolicy: IfNotPresent

securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            HOMEBRIDGE_CONFIG_UI: 1

service:
  main:
    ports:
      main:
        protocol: http
        port: 8581

persistence:
  config:
    enabled: true
    mountPath: /homebridge
