# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/go-shiori/shiori
  pullPolicy: IfNotPresent
  tag: v1.8.0@sha256:d3bdfc1b68b8f267a04cf74d73b8a0e1d99ac71c3a9047375e97202f079eb1f6
service:
  main:
    ports:
      main:
        port: 10098
        targetPort: 8080
workload:
  main:
    podSpec:
      containers:
        main:
          env:
            SHIORI_DIR: "{{ .Values.persistence.data.mountPath }}"
            SHIORI_DBMS: "postgresql"
            SHIORI_PG_PORT: "5432"
            SHIORI_PG_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            SHIORI_PG_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            SHIORI_PG_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            SHIORI_PG_PASS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
persistence:
  data:
    enabled: true
    mountPath: /data
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: shiori
      password: shiori
