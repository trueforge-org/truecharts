# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/nocodb/nocodb
  tag: 0.301.5@sha256:d9516f0bf546fd6c78a382ab0657626c683fca7aaafdbbe53c66baf15df7fc0d
  pullPolicy: IfNotPresent
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/dashboard"
            readiness:
              path: "/dashboard"
            startup:
              path: "/dashboard"
          envFrom:
            - secretRef:
                name: configmap
          env:
            PORT: "{{ .Values.service.main.ports.main.port }}"
            # User Defined
            NC_PUBLIC_URL: "http://localhost:10226"
            NC_DISABLE_TELE: true
            DISABLE_SPLASH_SCREEN: false
            NC_JWT_EXPIRES_IN: "10h"
            NC_INVITE_ONLY_SIGNUP: false
            NC_DISABLE_CACHE: false
            NC_DISABLE_ERR_REPORT: true
            NC_REQUEST_BODY_SIZE: "1MB"
            NC_EXPORT_MAX_TIMEOUT: 5000
            NC_SENTRY_DSN: ""
            NC_REDIS_URL:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: url
            NC_AUTH_JWT_SECRET:
              secretKeyRef:
                name: secrets
                key: NC_AUTH_JWT_SECRET
            AWS_ACCESS_KEY_ID:
              secretKeyRef:
                name: env-secrets
                key: AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY:
              secretKeyRef:
                name: env-secrets
                key: AWS_SECRET_ACCESS_KEY
            AWS_BUCKET: ""
            AWS_BUCKET_PATH: ""
nocodb:
  # Must be changed. JWT signing secret, any long random string (32+ chars recommended).
  authJwtSecret: "PLACEHOLDERAUTHJWTSECRETCHANGEME"
service:
  main:
    ports:
      main:
        port: 10226
persistence:
  data:
    enabled: true
    mountPath: "/usr/app/data"
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: nocodb
      postgresqlDatabase: nocodb
  valkey:
    enabled: true
secret:
  env-secrets:
    enabled: true
    data:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
