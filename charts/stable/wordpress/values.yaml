# yaml-language-server: $schema=./values.schema.json
image:
  repository: docker.io/bitnamisecure/wordpress
  pullPolicy: IfNotPresent
  tag: latest@sha256:549b3984a7cb1edbadb3050b251368bd47948a00042cfa6a88f3a2d4dce1a2c4
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
            - configMapRef:
                name: env-config
            - secretRef:
                name: env-secret
          probes:
            liveness:
              enabled: true
              type: tcp
              port: "{{ .Values.service.main.ports.main.port }}"
            readiness:
              enabled: true
              type: tcp
              port: "{{ .Values.service.main.ports.main.port }}"
            startup:
              enabled: true
              type: tcp
              port: "{{ .Values.service.main.ports.main.port }}"
wordpress:
  user: user
  pass: bitnami
  email: user@example.com
  first_name: TrueCharts
  last_name: TrueCharts
  blog_name: Truecharts Blog
  enable_reverse_proxy_headers: true
  # -- Must be changed. Authentication keys and salts, use unique random strings.
  authKey: "PLACEHOLDERAUTHKEY00000000000000"
  secureAuthKey: "PLACEHOLDERSECUREAUTHKEY00000000"
  loggedInKey: "PLACEHOLDERLOGGEDINKEY0000000000"
  nonceKey: "PLACEHOLDERNONCEKEY0000000000000"
  authSalt: "PLACEHOLDERAUTHSALT0000000000000"
  secureAuthSalt: "PLACEHOLDERSECUREAUTHSALT0000000"
  loggedInSalt: "PLACEHOLDERLOGGEDINSALT000000000"
  nonceSalt: "PLACEHOLDERNONCESALT000000000000"
smtp:
  enabled: false
  host: ""
  port: 587
  user: ""
  pass: ""
php-config:
  PHP_ENABLE_OPCACHE: "yes"
  PHP_EXPOSE_PHP: ""
  PHP_MAX_EXECUTION_TIME: ""
  PHP_MAX_INPUT_TIME: ""
  PHP_MAX_INPUT_VARS: ""
  PHP_MEMORY_LIMIT: 512M
  PHP_POST_MAX_SIZE: ""
  PHP_UPLOAD_MAX_FILESIZE: ""
service:
  main:
    ports:
      main:
        protocol: http
        port: 10591
persistence:
  config:
    enabled: true
    mountPath: /bitnami/wordpress
dependencies:
  mariadb:
    enabled: true
    depconfig:
      mariadbUsername: wordpress
      mariadbDatabase: wordpress
