{{/* Make sure all variables are set properly */}}
{{ include "tc.v1.common.loader.init" . }}

{{- $_ := mustMergeOverwrite .Values (include "meshcentral.secret" $ | fromYaml) -}}

{{- define "meshcentral.probes" -}}
{{- $protocol := .Values.service.main.ports.main.protocol -}}
{{/* Kubelet fails to parse the self-signed cert MeshCentral generates (negative serial number), so use tcp for https */}}
probes:
  {{- range $probe := (list "liveness" "readiness" "startup") }}
  {{ $probe }}:
    {{- if eq $protocol "https" }}
    type: tcp
    {{- else }}
    type: {{ $protocol }}
    path: /health.ashx
    {{- end }}
  {{- end }}
{{- end -}}

{{- $_ := mergeOverwrite .Values.workload.main.podSpec.containers.main (include "meshcentral.probes" . | fromYaml) -}}

{{/* Render the templates */}}
{{ include "tc.v1.common.loader.apply" . }}
