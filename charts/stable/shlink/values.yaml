# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/shlinkio/shlink
  pullPolicy: IfNotPresent
  tag: 5.1.9@sha256:248d38c8d7fdba90d9e0c3c7ea9e73ef73ec9f54f7f46faf8f369153cc889aab
service:
  main:
    ports:
      main:
        port: 10153
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: shlink
      postgresqlDatabase: shlink
  valkey:
    enabled: true

securityContext:
  container:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: "/rest/health"
            readiness:
              path: "/rest/health"
            startup:
              path: "/rest/health"
          env:
            DEFAULT_DOMAIN: ""
            GEOLITE_LICENSE_KEY:
              secretKeyRef:
                name: env-secrets
                key: GEOLITE_LICENSE_KEY
            ANONYMIZE_REMOTE_ADDR: true
            ENABLE_PERIODIC_VISIT_LOCATE: true
            IS_HTTPS_ENABLED: true
            PORT: "{{ .Values.service.main.ports.main.port }}"
            DB_DRIVER: "postgres"
            DB_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            DB_NAME: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            DB_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            DB_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            REDIS_SERVERS:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "valkeycreds" }}'
                key: url

secret:
  env-secrets:
    enabled: true
    data:
      GEOLITE_LICENSE_KEY: ""
