# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/bookorbit/bookorbit
  pullPolicy: IfNotPresent
  tag: 3.10.0@sha256:39686c8937725ddaa7485fffaeead6bcd62589ff052df7785fcf8bd8d85c21f1

service:
  main:
    ports:
      main:
        port: 3000
        protocol: http

workload:
  main:
    podSpec:
      containers:
        main:
          probes:
            liveness:
              path: /api/v1/health
            readiness:
              path: /api/v1/health
            startup:
              path: /api/v1/health
          env:
            NODE_ENV: production
            PORT: "{{ .Values.service.main.ports.main.port }}"
            POSTGRES_HOST:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: plainhost
            POSTGRES_PORT: "5432"
            POSTGRES_USER: "{{ .Values.dependencies.postgresql.depconfig.postgresqlUsername }}"
            POSTGRES_PASSWORD:
              secretKeyRef:
                expandObjectName: false
                name: '{{ printf "%s-%s" .Release.Name "postgresqlcreds" }}'
                key: postgresql-password
            POSTGRES_DB: "{{ .Values.dependencies.postgresql.depconfig.postgresqlDatabase }}"
            APP_URL: http://localhost:3000
            CLIENT_URL: http://localhost:3000
            LIBRARY_BROWSE_ROOT: "{{ .Values.persistence.books.mountPath }}"
            BOOK_DOCK_PATH: "{{ .Values.persistence.bookdock.mountPath }}"
            JWT_SECRET:
              secretKeyRef:
                name: env-secrets
                key: JWT_SECRET
            SETUP_BOOTSTRAP_TOKEN:
              secretKeyRef:
                name: env-secrets
                key: SETUP_BOOTSTRAP_TOKEN
            NODE_MAX_OLD_SPACE_SIZE: "2048"

persistence:
  data:
    enabled: true
    mountPath: /data
  bookdock:
    enabled: true
    mountPath: /data/book-dock
  books:
    enabled: true
    mountPath: /books

# Bookorbit requires uuid-ossp, pg_trgm, unaccent, and vector (pgvector).
# The default CNPG postgres image ships these extensions.
dependencies:
  postgresql:
    enabled: true
    depconfig:
      postgresqlUsername: bookorbit
      postgresqlDatabase: bookorbit
    operator:
      cluster:
        initdb:
          postInitApplicationSQL:
            - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
            - CREATE EXTENSION IF NOT EXISTS pg_trgm;
            - CREATE EXTENSION IF NOT EXISTS unaccent;
            - CREATE EXTENSION IF NOT EXISTS vector;
secret:
  env-secrets:
    enabled: true
    data:
      JWT_SECRET: "changeme_changeme"
      SETUP_BOOTSTRAP_TOKEN: "changeme"
